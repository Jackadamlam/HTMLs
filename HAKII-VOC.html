<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="HAKII 户外可穿戴产品 VOC 证据、竞品洞察与验证工作台">
  <title>HAKII VOC 研究工作台</title>
  <style>:root {
  color-scheme: light;
  font-family: "Inter","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  color: #182523;
  background: #f1f4f0;
  --ink: #182523;
  --muted: #60706b;
  --line: #dde5df;
  --green: #27664f;
  --mint: #d9f4e5;
  --surface: #fff;
  --sidebar: #102420;
  --side-width: 228px;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: wait; }
a { color: var(--green); text-decoration: none; }
a:hover { text-decoration: underline; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #23976c; outline-offset: 3px; }
svg { width: 19px; height: 19px; display: inline-block; flex-shrink: 0; vertical-align: middle; }
h1,h2,h3,p { margin-top: 0; }
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--side-width); background: var(--sidebar); color: #b4c8be; display: flex; flex-direction: column; padding: 31px 17px 21px; z-index: 2; }
.brand { display: flex; gap: 11px; align-items: center; color: #fff; margin: 0 8px 39px; text-decoration: none!important; }
.brand strong { display: block; letter-spacing: .16em; line-height: 1.1; font-size: 23px; }
.brand small { display: block; margin-top: 6px; color: #a2bdb0; font-size: 11px; letter-spacing: .08em; }
.brand-icon { color: #153b2b; width: 39px; height: 39px; display: grid; place-items: center; border-radius: 11px; background: #a4edc6; }
.brand-icon svg { width: 26px; height: 26px; stroke-width: 1.9; }
nav { display: grid; gap: 5px; }
nav a { display: flex; align-items: center; gap: 12px; padding: 13px 12px; border-radius: 8px; color: #afc5bb; font-size: 13px; white-space: nowrap; }
nav a:hover { background: #1d3831; text-decoration: none; }
nav a[aria-current] { background: #24463a; color: #c8f6df; font-weight: 700; }
.sidebar-bottom { border-top: 1px solid #2c4039; padding: 18px 8px 2px; margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 11px; }
.private-dot { width: 7px; height: 7px; border-radius: 100%; background: #97e4b9; box-shadow: 0 0 0 3px #274e3d; }
.main { margin-left: var(--side-width); }
.topbar { min-height: 69px; border-bottom: 1px solid var(--line); padding: 11px 34px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 15px; }
.breadcrumb { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); }
.breadcrumb strong { color: var(--ink); }
.slash { color: #a7b2ac; }
.actions,.filtercontrols { display: flex; align-items: center; gap: 8px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 12px; min-height: 35px; border: 1px solid #d5e0d8; border-radius: 7px; background: var(--surface); color: var(--ink); font-size: 12px; font-weight: 650; vertical-align: middle; white-space: nowrap; }
.button:hover { background: #eef5f0; text-decoration: none; }
.button svg { width: 16px; height: 16px; }
.button.primary { color: #fff; background: #21624c; border-color: #21624c; }
.button.primary:hover { background: #174f3d; }
.button.small { min-height: 30px; padding: 5px 9px; font-size: 11px; }
.button.quiet { background: transparent; border-color: transparent; color: var(--green); }
.content { max-width: 1610px; padding: 32px 34px 54px; margin: auto; }
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 14px; margin: 0 0 23px; }
h1 { font-size: clamp(27px,3vw,39px); margin-bottom: 9px; letter-spacing: -.035em; line-height: 1.24; }
.page-head p { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.65; }
.today { flex-shrink: 0; border: 1px solid #d8e3da; padding: 7px 11px; border-radius: 6px; font-size: 11px; color: #52665c; background: #e9f0ea; }
.filterbox { display: grid; gap: 12px; margin-bottom: 18px; }
.filterline { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { align-items: center; color: #53665d; background: #f9fbf9; border: 1px solid #dce5de; padding: 7px 11px; border-radius: 7px; font-size: 12px; white-space: nowrap; }
.chip:hover { border-color: #87ae99; }
.chip.active { color: #184d38; background: #d9eee1; border-color: #b1d6c0; font-weight: 750; }
.filtergrid { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 10px; background: var(--surface); padding: 14px; border: 1px solid var(--line); border-radius: 11px; }
.select-filter { display: grid; gap: 4px; font-size: 11px; color: var(--muted); }
.select-filter.wide { grid-column: span 2; }
input, select, textarea { width: 100%; min-width: 0; border: 1px solid #cedbd2; border-radius: 6px; background: #fff; padding: 8px 9px; color: var(--ink); font-size: 13px; }
textarea { resize: vertical; }
.kpis { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 12px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 11px; min-height: 117px; padding: 15px 15px 13px; color: var(--ink); box-shadow: 0 2px 7px #1a3e2a06; }
.kpi:hover { text-decoration: none; border-color: #8ab49e; }
.kpi>div { display: flex; align-items: center; justify-content: space-between; gap: 7px; font-size: 12px; color: #4f6259; font-weight: 600; }
.kpi i,.product i { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 8px; background: #e4f3e9; color: #35775a; }
.kpi i svg,.product i svg { width: 17px; height: 17px; }
.kpi>strong { display: block; font-size: 31px; line-height: 1.16; margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
.kpi>small { color: var(--muted); font-size: 10px; }
.panel { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); margin-bottom: 16px; box-shadow: 0 2px 7px #1a3e2a06; min-width: 0; overflow: hidden; }
.panel-head { min-height: 54px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #edf1ed; }
.panel h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
.count-label { color: var(--muted); font-size: 11px; white-space: nowrap; }
.panel-link { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 11px; font-weight: 650; }
.panel-link svg { width: 14px; height: 14px; }
.products { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 9px; padding: 13px; }
.product { text-align: left; display: flex; flex-direction: column; align-items: start; gap: 7px; color: #224738; border: 1px solid #e0e9e2; background: linear-gradient(155deg,#edf6f0,#fafcf9 85%); min-width: 0; padding: 12px; border-radius: 8px; }
.product:nth-child(2) { background: linear-gradient(155deg,#eaf4f3,#fafcfb 85%); }
.product:nth-child(3) { background: linear-gradient(155deg,#ecf4e5,#fbfcfa 85%); }
.product:nth-child(4) { background: linear-gradient(155deg,#ebf1f7,#fafbfc 85%); }
.product:nth-child(5) { background: linear-gradient(155deg,#f2f1e8,#fdfcf9 85%); }
.product:hover { border-color: #8bb79f; }
.product i { background: #ffffffb8; }
.product strong { color: var(--ink); font-size: 13px; }
.product small { line-height: 1.4; color: #52665a; font-size: 10px; flex: 1; }
.product span { display: flex; width: 100%; justify-content: space-between; align-items: center; border-top: 1px solid #deebe2; padding-top: 7px; color: #38644e; font-size: 10px; }
.product span svg { width: 13px; height: 13px; }
.two { display: grid; grid-template-columns: 1fr .9fr; gap: 13px; }
.empty { padding: 24px 14px 23px; min-height: 145px; display: grid; place-items: center; align-content: center; gap: 7px; text-align: center; }
.empty-icon { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: #edf4ee; color: #58836e; margin-bottom: 2px; }
.empty strong { font-size: 13px; }
.empty p { margin: 0 0 2px; color: var(--muted); font-size: 11px; line-height: 1.6; }
.bars { padding: 10px 15px; }
.bar-row { display: grid; grid-template-columns: minmax(90px,1fr) 1.2fr 24px; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 0; border: 0; border-bottom: 1px solid #edf1ed; background: transparent; color: var(--ink); font-size: 12px; }
.bar-row:hover { color: var(--green); }
.bar-row small { display: block; color: var(--muted); font-size: 10px; }
.track { background: #eef3ef; border-radius: 5px; height: 8px; overflow: hidden; }
.track i { height: 100%; background: #3e906d; display: block; border-radius: 5px; }
.recent { display: grid; padding: 6px 15px; }
.recent>div { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #edf1ed; padding: 8px 0; }
.recent>div span { color: var(--muted); font-size: 10px; text-align: right; }
.task-chain { padding: 12px 15px; display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.task-chain>div { min-width: 0; display: grid; justify-items: center; text-align: center; gap: 7px; padding: 9px 4px; background: #f0f6f1; border-radius: 7px; font-size: 11px; color: #445b4f; }
.task-chain b { color: #255a43; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { color: var(--muted); font-weight: 650; background: #f7faf7; text-align: left; white-space: nowrap; }
td,th { padding: 12px 14px; border-bottom: 1px solid #ecf0ec; vertical-align: top; }
td { min-width: 75px; max-width: 300px; overflow-wrap: anywhere; }
tbody tr:hover { background: #fafcf9; }
td .button { margin-bottom: 3px; }
.tag { display: inline-block; border-radius: 5px; padding: 3px 6px; background: #edf2ef; color: #445950; font-size: 10px; white-space: nowrap; line-height: 1.3; }
.tag.mint { color: #245b3f; background: #daf0e2; }
.tag.rose { color: #8f3d43; background: #fae7e7; }
.tag.amber { color: #745516; background: #f8efda; }
.sub { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
.truncate { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.text-button { padding: 0; border: 0; background: transparent; color: var(--green); text-align: left; font-size: inherit; line-height: 1.45; font-weight: 650; overflow-wrap: anywhere; }
.text-button:hover { text-decoration: underline; }
.text-button small { font-size: 10px; color: var(--muted); white-space: nowrap; }
.load-more { padding: 12px; text-align: center; }
.loading { padding: 34px; font-size: 13px; color: var(--muted); }
dialog { border: 1px solid #c6dbcf; border-radius: 13px; color: var(--ink); width: min(700px,calc(100vw - 24px)); max-height: calc(100dvh - 36px); padding: 0; box-shadow: 0 24px 90px #071e1b50; }
dialog::backdrop { background: #0c211c77; }
.dialog-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: start; gap: 10px; padding: 17px 20px; background: #fff; border-bottom: 1px solid var(--line); }
.dialog-head h2 { margin: 0; font-size: 21px; overflow-wrap: anywhere; }
.dialog-head p { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
.close { display: grid; place-items: center; width: 33px; height: 33px; flex-shrink: 0; border-radius: 7px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
.close:hover { background: #f2f7f3; }
.dialog-body { padding: 18px 20px 20px; font-size: 13px; }
.dialog-actions { display: flex; justify-content: end; gap: 8px; padding-top: 14px; flex-wrap: wrap; }
.formgrid,.detail-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
.formgrid label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; }
.formgrid sup { color: #aa463d; }
.full { grid-column: 1 / -1; }
.form-error { color: #a23a38; margin-top: 10px; font-weight: 600; }
.detail-grid { margin-top: 0; }
.detail-grid>div { background: #f4f8f5; border-radius: 7px; padding: 9px 11px; min-width: 0; }
dt { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
blockquote { border-left: 2px solid #81b69b; margin: 0; padding-left: 10px; }
.dialog-body h3 { font-size: 14px; margin: 17px 0 8px; }
.timeline { display: grid; gap: 7px; }
.timeline>div { padding: 7px 10px; border-left: 2px solid #91bea5; background: #f7faf7; }
.timeline span { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
.timeline p { margin: 4px 0 0; white-space: pre-wrap; }
.reference-picker { min-width: 0; margin: 0; padding: 9px; max-height: 175px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; }
.reference-picker label { display: block; padding: 4px; overflow-wrap: anywhere; font-weight: 400; }
.reference-picker input { width: auto; vertical-align: middle; }
.help { color: var(--muted); line-height: 1.6; }
.file-box { display: grid; justify-items: center; gap: 8px; background: #f4f8f5; border: 1px dashed #8cae9b; border-radius: 8px; padding: 14px; margin-top: 12px; }
.file-box input { max-width: 400px; }
#toast { position: fixed; bottom: 20px; right: 20px; pointer-events: none; z-index: 5; border-radius: 7px; background: #153c30; color: white; font-size: 13px; padding: 10px 14px; max-width: calc(100vw - 40px); opacity: 0; transform: translateY(5px); transition: opacity .17s,transform .17s; }
#toast.visible { opacity: 1; transform: translateY(0); }
@media(max-width: 1100px) {
  :root { --side-width: 182px; }
  .topbar,.content { padding-left: 23px; padding-right: 23px; }
  .filtergrid { grid-template-columns: repeat(4,minmax(0,1fr)); }
}
@media(max-width: 780px) {
  :root { --side-width: 60px; }
  .sidebar { padding: 16px 8px; }
  .brand { margin: 0 auto 24px; }
  .brand>span:not(.brand-icon), nav a span, .sidebar-bottom span+span { display: none; }
  nav a { justify-content: center; padding: 11px 5px; }
  .sidebar-bottom { justify-content: center; }
  .content { padding: 23px 13px; }
  .topbar { padding: 9px 13px; }
  .products { grid-template-columns: repeat(3,1fr); }
  .task-chain { grid-template-columns: repeat(4,1fr); }
}
@media(max-width: 550px) {
  :root { --side-width: 0px; }
  .sidebar { position: static; width: auto; padding: 10px; }
  .brand { margin: 0 0 7px; }
  .brand-icon { width: 29px; height: 29px; }
  .brand-icon svg { width: 21px; height: 21px; }
  .brand>span:not(.brand-icon) { display: block; }
  .brand strong { font-size: 15px; }
  .brand small,.sidebar-bottom { display: none; }
  nav { display: flex; overflow-x: auto; }
  nav a { padding: 7px; gap: 5px; font-size: 10px; }
  nav a span { display: inline; }
  nav a svg { width: 13px; height: 13px; }
  .content { padding-top: 18px; }
  .topbar { min-height: 47px; }
  .breadcrumb>span { display: none; }
  .breadcrumb,.button { font-size: 11px; }
  .actions { gap: 4px; }
  .today { display: none; }
  .filterline { align-items: start; }
  .filtergrid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .chip { padding: 6px 8px; font-size: 11px; }
  .kpis { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
  .products,.two { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .two { grid-template-columns: 1fr; gap: 0; }
}
</style>
  
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview"><span class="brand-icon" id="brand-icon"></span><span><strong>HAKII</strong><small>VOC 研究工作台</small></span></a>
    <nav id="nav" aria-label="主导航"></nav>
    <div class="sidebar-bottom"><span class="private-dot"></span><span>数据保存在此浏览器</span></div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="breadcrumb"><span>研究工作台</span><span class="slash">/</span><strong id="crumb">VOC 洞察看板</strong></div><div class="actions"><button class="button" data-action="backup">备份数据</button><button class="button" data-action="restore">导入备份</button><div id="top-actions" class="actions"></div></div></header>
    <main id="content" class="content"><div class="loading" role="status">正在读取研究台账…</div></main>
  </div>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
<script>
const categories = [
  ['可穿戴对讲音箱','对讲音箱','徒步小队与户外协作','radio'],
  ['游泳骨传导耳机','游泳耳机','泳池训练与水下听音','waves'],
  ['开放式 / 骨传导运动耳机','运动耳机','夜跑、骑行与长时间佩戴','headphones'],
  ['智能骑行摄像眼镜','骑行眼镜','第一人称拍摄与骑行通话','glasses'],
  ['ECHO 多场景拾音与处理系统','ECHO 拾音','会议、访谈与移动录音','mic']
];
const platforms = ['Amazon','Reddit','YouTube','Discord','TikTok','Instagram','Facebook Groups','X','Threads','Quora','Strava','户外论坛','Kickstarter','Indiegogo','App Store','Google Play','品牌社区','哔哩哔哩','小红书','抖音','知乎','什么值得买','微博','贴吧','快手','日本平台','韩国平台','东南亚平台','其他平台'];
const regions = ['全球','中国大陆','中国港澳台','日本','韩国','东南亚','北美','墨西哥','拉美其他地区','欧洲','中东','澳新','其他地区','待确认'];
const issues = ['佩戴与舒适','音质与听感','通话与风噪','对讲与连接','水下听音','防水与耐久','续航与充电','拍摄与存储','拾音与转写','交互与软件','价格与渠道','售后与可靠性','其他'];
const tasks = ['选购与准备','佩戴与设置','开始使用','场景内使用','切换与排障','充电与维护','回看与分享'];
const strengths = ['线索','原始来源','交叉印证'];
const priorities = ['P0','P1','P2','P3'];
const statuses = ['待验证','验证中','已验证','未通过','暂缓'];
const severity = ['轻微','中等','严重','阻断'];
const group = categories.map(item => item[0]);
const field = (key,label,type='text',options,required=false) => ({key,label,type,options,required});
const fields = {
  evidence: [
    field('title','证据标题','text',null,true), field('category','产品线','select',group,true),
    field('model','竞品 / 产品型号','text',null,true), field('scenario','场景标签（逗号分隔）','text',null,true),
    field('platform','评论平台','select',platforms,true), field('region','地区','select',regions,true),
    field('source','评论来源 / 帖子标题'), field('url','原始来源链接','url',null,true),
    field('collected','采集时间','datetime-local',null,true), field('reference','佐证链接（每行一个）','area'),
    field('sentiment','反馈倾向','select',['负面','正面','混合','中性'],true), field('issue','问题类型','select',issues,true),
    field('task','用户任务环节','select',tasks), field('pain','标准化痛点'), 
    field('quote','典型原话','area',null,true), field('performance','功能表现','area'),
    field('reliability','可靠性问题','area'), field('frequency','原来源提及次数','number'),
    field('severity','严重程度','select',severity), field('strength','证据强度','select',strengths,true),
    field('priority','优先级','select',priorities,true), field('status','验证状态','select',statuses,true),
    field('price','价格 / 币种'), field('channel','渠道'),
    field('conclusion','分析结论','area'), field('hypothesis','待验证假设','area')
  ],
  competitor: [
    field('model','竞品型号','text',null,true), field('category','产品线','select',group,true),
    field('brand','品牌'), field('scenario','适用场景'), field('price','参考价格 / 币种'), field('channel','销售渠道'),
    field('region','地区','select',regions), field('url','产品资料链接','url'), field('collected','采集时间','datetime-local'),
    field('notes','定位 / 待核验信息','area')
  ],
  experiment: [
    field('title','验证事项','text',null,true), field('category','产品线','select',group,true),
    field('model','产品型号'), field('scenario','验证场景'), field('hypothesis','待验证假设','area',null,true),
    field('method','实验设计','area'), field('criteria','通过标准','area'),
    field('priority','优先级','select',priorities,true), field('status','验证状态','select',statuses,true),
    field('lead','负责人'), field('due','计划日期','date'), field('result','结果与决策','area'),
    field('refs','关联证据','refs')
  ],
  report: [
    field('title','报告名称','text',null,true), field('scope','研究范围'), field('markdown','报告正文','area',null,true),
    field('refs','关联证据','refs')
  ]
};
const catalog = [

function validLink(value) {

}
function normalize(kind, input) {
  if (!input || typeof input !== 'object' || Array.isArray(input)) throw new Error('记录格式无效。');
  const data = {};
  for (const {key,label,type,options,required} of fields[kind]) {
    if (type === 'refs') {
      const refs = input[key] ?? [];
      if (!Array.isArray(refs) || refs.length > 600 || refs.some(ref => !ref || !/^[\w-]{1,80}$/.test(ref.id) || !Number.isSafeInteger(ref.version) || ref.version < 1)) throw new Error('关联证据格式无效。');
      data[key] = refs.map(({id,version})=>({id,version}));
      continue;
    }
    const value = String(input[key] ?? '').trim();
    if (required && !value) throw new Error('请填写' + label + '。');
    if (value.length > (key==='markdown' ? 95000 : type==='area' ? 12000 : 1200)) throw new Error(label + '超出长度限制。');
    if (value && ((options && !options.includes(value)) || (type==='url' && !validLink(value)) || (type==='datetime-local' && (!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(value) || !Number.isFinite(Date.parse(value+'+08:00')))) || (type==='date' && !/^\d{4}-\d\d-\d\d$/.test(value)) || (type==='number' && !/^[1-9]\d{0,5}$/.test(value)))) throw new Error(label+'格式无效。');
    data[key] = value;
  }
  if (kind==='evidence' && data.reference && data.reference.split(/\s+/).some(url=>!validLink(url))) throw new Error('请填写有效的佐证链接。');
  if (kind==='evidence' && data.strength==='交叉印证' && !data.reference.split(/\s+/).some(url=>url && url !== data.url)) throw new Error('交叉印证需要另一条佐证链接。');
  return data;
}

const storageKey = 'hakii-voc-local-v1';
const readArchive = () => JSON.parse(localStorage.getItem(storageKey) || '[]');
const recordKey = row => [row.kind,row.id,row.version].join('@');
function saveArchive(rows) {
  localStorage.setItem(storageKey,JSON.stringify(rows));
}
async function call(path='', options={}) {
  const archive = readArchive();
  if (!path) {
    const latest = new Map();
    for (const row of archive) {
      const key = row.kind+'@'+row.id;
      if (!latest.has(key) || latest.get(key).version < row.version) latest.set(key,row);
    }
    return Array.from(latest.values()).sort((a,b)=>b.at.localeCompare(a.at));
  }
  const [,kind,id] = path.split('/');
  const history = archive.filter(row=>row.kind===kind && row.id===id).sort((a,b)=>b.version-a.version);
  if (!options.method) return history;
  const input = JSON.parse(options.body);
  const previous = history[0]?.version || 0;
  if (id && input.version !== previous) throw new Error('记录已更新，请重新打开。');
  const action = input.action || (id?'更新':'创建');
  const note = String(input.note||'').trim();
  if (action==='复核'&&!note) throw new Error('请填写复核意见。');
  const at = new Date().toISOString();
  const rows = (input.rows||[input.data]).map(value=>{
    const data = normalize(kind,value);
    if ((data.refs||[]).some(ref=>!archive.some(row=>row.kind==='evidence'&&row.id===ref.id&&row.version===ref.version))) {
      throw new Error('找不到关联证据的指定版本。');
    }
    return {kind,id:id||crypto.randomUUID(),version:previous+1,at,actor:'本地用户',action,note,data};
  });
  saveArchive([...archive,...rows]);
  return rows;
}

        const record={kind:row.kind,id:row.id,version:row.version,at:row.at,actor:String(row.actor),action:String(row.action),note:String(row.note),data:normalize(row.kind,row.data)};
        const key=recordKey(record);
        if (merged.has(key)&&JSON.stringify(merged.get(key))!==JSON.stringify(record)) throw new Error('发现冲突的证据版本，未导入备份。');
        merged.set(key,record);

      for (const record of merged.values()) {
        if ((record.data.refs||[]).some(ref=>!merged.has(recordKey({...ref,kind:'evidence'})))) throw new Error('备份缺少关联证据版本。');
      }

  });
}

async function load() {

function matches(row, filters=state.filters) {
  const data=row.data;
  return Object.entries(filters).every(([key,value])=>{
    if (!value) return true;
    if (key==='q') return Object.values(data).filter(v=>typeof v==='string').some(v=>v.toLowerCase().includes(value.toLowerCase()));
    if (key==='from') return data.collected?.slice(0,10) >= value;
    if (key==='to') return data.collected?.slice(0,10) <= value;
    if (key==='scenario') return data.scenario?.split(/[、，,;；]/).some(t=>t.trim()===value);
    return data[key] === value;
  });
}
const evidence = () => kinds('evidence').filter(row=>matches(row));

function dedupe(rows) {
  const seen = new Set();
  return rows.filter(row=>{
    const url = new URL(row.data.url);
    url.hash = '';
    for (const key of [...url.searchParams.keys()]) if (/^(utm_|fbclid|gclid|si$)/i.test(key)) url.searchParams.delete(key);
    url.searchParams.sort();
    const key = url.href+'|'+row.data.quote.toLowerCase().replace(/\s+/g,' ');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function insights(rows) {
  const map=new Map();
  for (const row of rows) {
    const d=row.data;
    if (!['负面','混合'].includes(d.sentiment)) continue;
    const title=d.pain||d.issue;
    const key=d.category+'|'+title.toLowerCase();
    if (!map.has(key)) map.set(key,{title,category:d.category,rows:[]});
    map.get(key).rows.push(row);
  }
  return [...map.values()].map(group=>{
    group.rows=dedupe(group.rows);
    group.count=group.rows.length;
    group.score=group.rows.reduce((sum,row)=>sum+severity.indexOf(row.data.severity)+1,0);
    group.priority=group.rows.map(row=>row.data.priority).sort()[0];
    const step=grouped(group.rows,'task')[0]?.[0];
    const scenario=grouped(group.rows,'scenario')[0]?.[0]?.split(/[、，,;；]/)[0]?.trim();
    group.opportunity=(scenario?'在「'+scenario+'」场景':'')+(step?'检查「'+step+'」环节的':'降低')+'「'+group.title+'」问题';
    return group;
  }).sort((a,b)=>b.count-a.count||b.score-a.score||a.title.localeCompare(b.title,'zh-CN'));
}
function grouped(rows,key) {
  const counts=new Map();
  for (const row of rows) {
    const value=row.data[key];
    if (value) counts.set(value,(counts.get(value)||0)+1);
  }
  return [...counts].sort((a,b)=>b[1]-a[1]);
}

function csv(text) {
  const rows=[];
  let row=[], value='', inside=false;
  for (let i=0;i<text.length;i++) {
    const ch=text[i];
    if (inside) {
      if (ch==='"' && text[i+1]==='"') { value+='"'; i++; }
      else if (ch==='"') inside=false;
      else value+=ch;
    } else if (ch==='"' && !value) inside=true;
    else if (ch===',') { row.push(value); value=''; }
    else if (ch==='\r'||ch==='\n') {
      if (ch==='\r'&&text[i+1]==='\n') i++;
      row.push(value); if (row.some(Boolean)) rows.push(row);
      row=[]; value='';
    } else value+=ch;
  }
  if (inside) throw new Error('CSV 含未闭合的引号。');
  row.push(value); if (row.some(Boolean)) rows.push(row);
  if (rows.length<2) throw new Error('CSV 至少需要一行字段名和一行数据。');
  const headers=rows.shift().map(s=>s.trim());
  const lookup=new Map(fields.evidence.flatMap(field=>[[field.key,field.key],[field.label,field.key]]));
  return rows.map(line=>Object.fromEntries(headers.flatMap((header,i)=>lookup.has(header)?[[lookup.get(header),line[i]||'']]:[])));
}

}

function generateReport() {
  const rows=evidence();
  if (!rows.length) { notify('当前筛选范围暂无证据。请录入证据或清除筛选后再生成。'); return; }
  const distinct=dedupe(rows), groups=insights(rows);
  const filterNames={category:'产品线',model:'型号',scenario:'场景',platform:'平台',region:'地区',issue:'问题类型',strength:'证据强度',priority:'优先级',status:'验证状态',from:'采集起日',to:'采集止日',q:'搜索'};
  const scope=Object.entries(state.filters).filter(([,v])=>v).map(([k,v])=>filterNames[k]+' '+v).join(' / ')||'全部产品线';
  const cite = row => '['+row.id.slice(0,8)+' v'+row.version+']';
  const lines=['# HAKII VOC 阶段研究报告','','- 生成时间 '+displayTime(nowLocal())+'（北京时间）','- 研究范围 '+scope,'- '+rows.length+' 条记录，'+distinct.length+' 条去重评论，'+new Set(rows.map(row=>row.data.platform)).size+' 个平台','- 频次按链接与原话去重。原来源提及次数单独记录。','','## 高频痛点与需求优先级',''];
  for (const g of groups) {
    lines.push('- '+g.priority+' · '+g.title+'（'+short(g.category)+'，'+g.count+' 条） '+g.rows.map(cite).join(' ')+' · '+g.opportunity);
  }
  lines.push('','## 竞品正负反馈','');
  for (const product of competitions()) {
    const items=related(product,distinct);
    if (!items.length) continue;
    lines.push('### '+nameOf(product));
    if (product.data.price||product.data.channel) lines.push('- 价格与渠道 '+[product.data.price,product.data.channel].filter(Boolean).join(' / '));
    for (const sentiment of ['正面','负面']) {
      const set=items.filter(row=>[sentiment,'混合'].includes(row.data.sentiment));
      for (const [issue,count] of grouped(set,'issue')) lines.push('- '+sentiment+' · '+issue+'（'+count+' 条） '+set.filter(row=>row.data.issue===issue).map(cite).join(' '));
    }
  }
  lines.push('','## 用户任务链','');
  for (const step of tasks) {
    const items=distinct.filter(row=>row.data.task===step);
    if (items.length) lines.push('- '+step+'（'+items.length+' 条） '+items.map(cite).join(' '));
  }
  lines.push('','## 产品机会与待验证假设','');
  for (const row of distinct.filter(row=>row.data.conclusion||row.data.hypothesis)) {
    const d=row.data;
    lines.push('- '+d.model+' · '+d.priority+' · '+d.status+' '+[d.conclusion,d.hypothesis&&'待验证：'+d.hypothesis].filter(Boolean).join('；')+' '+cite(row));
  }
  const ids=new Set(rows.map(row=>row.id+'@'+row.version));
  const experiments=kinds('experiment').filter(row=>row.data.refs.some(ref=>ids.has(ref.id+'@'+ref.version)));
  if (experiments.length) {
    lines.push('','## 关联验证实验','');
    for (const row of experiments) lines.push('- '+row.data.title+' · '+row.data.status+' '+row.data.refs.filter(ref=>ids.has(ref.id+'@'+ref.version)).map(cite).join(' '));
  }
  lines.push('','## 证据索引','');
  for (const row of rows) lines.push('- '+cite(row)+' '+nameOf(row)+' · '+row.data.platform+' · '+row.data.region+' · '+displayTime(row.data.collected)+' · <'+row.data.url+'>');
  const markdown=lines.join('\n');
  if (rows.length>600||markdown.length>95000) { notify('报告超过容量限制。请缩小产品线或其他筛选范围。'); return; }
  editor('report',null,{title:'HAKII VOC 阶段报告 '+nowLocal().slice(0,10),scope,markdown,refs:rows.map(ref)});
}

function act(value) {
  const [type,...args]=value.split(':');
  const arg=args.join(':');
  if (type==='filter') { const [field,...values]=args; state.filters[field]=values.join(':'); state.limit=30; render(); }
  if (type==='product') { state.filters={category:arg}; goto('evidence'); }
  if (type==='model') { state.filters.model=arg; state.advanced=true; goto('evidence'); }
  if (type==='clear') { state.filters={}; state.limit=30; render(); }
  if (type==='filters') { state.advanced=!state.advanced; render(); }
  if (type==='more') { state.limit+=30; render(); }
  if (type==='close') dialog.close();
  if (type==='reload') void load();
  if (type==='backup') download('HAKII-VOC-backup-'+nowLocal().slice(0,10)+'.json',JSON.stringify({format:storageKey,records:readArchive()},null,2),'application/json');
  if (type==='restore') restoreDialog();
  if (type==='new') editor(arg);
  if (type==='view') void view(...args);
  if (type==='import') importDialog();
  if (type==='template') {
    const example={title:'示例评论（请替换）',category:categories[1][0],model:'示例型号',scenario:'泳池训练',platform:'Reddit',region:'待确认',url:'https://example.com/review',collected:nowLocal(),sentiment:'负面',issue:'水下听音',task:'场景内使用',quote:'示例原话（请替换）',severity:'中等',strength:'原始来源',priority:'P2',status:'待验证'};
    const csvRow=values=>values.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(',');
    download('HAKII-VOC-导入模板.csv','\uFEFF'+csvRow(fields.evidence.map(field=>field.label))+'\r\n'+csvRow(fields.evidence.map(field=>example[field.key]))+'\r\n','text/csv;charset=utf-8');
  }
  if (type==='group'||type==='from-group') {
    const g=insights(evidence())[Number(arg)];
    if (!g) return;
    if (type==='group') modal(g.title,'<div class="recent">'+g.rows.map(row=>'<div>'+refLink(row)+'<span>'+esc(row.data.platform)+' · '+esc(displayTime(row.data.collected))+'</span></div>').join('')+'</div><div class="dialog-actions">'+btn('发起验证','from-group:'+arg,'flask','primary')+'</div>',short(g.category)+' · '+g.count+' 条去重评论');
    else editor('experiment',null,{title:'验证'+g.title,category:g.category,priority:g.priority,hypothesis:unique(g.rows.map(row=>row.data.hypothesis)).join('\n'),method:g.opportunity,refs:g.rows.slice(0,600).map(ref)});
  }
  if (type==='from-evidence') {
    const row=kinds('evidence').find(item=>item.id===arg);
    if (row) editor('experiment',null,{...row.data,title:'验证 · '+nameOf(row),status:'待验证',refs:[ref(row)]});
  }
  if (type==='generate') generateReport();
  if (type==='download') {
    const row=kinds('report').find(item=>item.id===arg);
    if (row) download(row.data.title.replace(/[<>:"/\\|?*]/g,'-')+'.md',row.data.markdown,'text/markdown;charset=utf-8');
  }
}
document.addEventListener('click',event=>{
  const element=event.target.closest('[data-action]');
  if (element) act(element.dataset.action);
});
document.addEventListener('change',event=>{
  if (!event.target.dataset.filter) return;
  state.filters[event.target.dataset.filter]=event.target.value.trim();
  state.limit=30; render();
});
document.addEventListener('keydown',event=>{
  if (event.target.id==='query'&&event.key==='Enter') {
    state.filters.q=event.target.value.trim(); state.limit=30; render(); $('query')?.focus();
  }
});
window.addEventListener('hashchange',route);
route();
void load();

</script>
</body>
</html>
