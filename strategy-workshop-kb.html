>先把洞察跑起来，不等年底战略会。</p></li>\n<li><b>7–8 月 · 滚动</b><p>按月慢慢滚动、逐版累积。</p></li>\n<li><b>季度会 · 呈现</b><p>带着当期版本上会校准。</p></li>\n</ol>\n<div class=\"principle\">持续的本质，就是<b class=\"hi\">每次进步一点点</b>；版本要一直更新，而不是攒到最后。</div>\n<figcaption>这套案例非满分，但有积累；讲者的建议回验成立，更新版本暂缺。</figcaption>\n</figure>\n</article>\n<article class=\"card\" id=\"s11b11\">\n<span class=\"m-kick\">08 · 实例</span>\n<h3 class=\"m-title\">实例看板：启动电源 · 女性市场</h3>\n<p class=\"m-lede\">一次季度会呈现的洞察——管道的目的非常明确：<b class=\"hi\">为型号与配色服务</b>。</p>\n<figure class=\"fig\" data-visual-id=\"insight-case-board\" data-visual-relation=\"目的明确为型号配色服务：查容量、关键词、画像、品类与个人风格；看打动点、色彩、安全易用与兜底细节；输出新旧方案对照及场景、产品定义、配色结论\" data-visual-source=\"启动电源女性市场容量平台搜索关键词…个人风格调查…他这个主要是为了型号配色…能打动他们…色彩…安全使用易用性…兜底细节…现有方案…更新后的方案…跨行看汽车和手机配色\" data-visual-title=\"实例看板：启动电源女性市场洞察\" data-visual-type=\"结构看板\">\n<div class=\"cb-grid\" data-grid=\"\">\n<div class=\"cb-col\">\n<div class=\"cb-h\">① 查什么</div>\n<ul>\n<li>启动电源 · 女性市场容量</li>\n<li>平台搜索关键词</li>\n<li>女性用户需求画像</li>\n<li>相关品类状况</li>\n<li>个人风格调查——共同点：黑色、贴纸玩偶、社群属性、动手意愿</li>\n</ul>\n</div>\n<div class=\"cb-ar\"><svg aria-hidden=\"true\" height=\"14\" viewbox=\"0 0 16 16\" width=\"14\"><path d=\"M2 8h11M9.2 3.8 13.4 8l-4.2 4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg></div>\n<div class=\"cb-col\">\n<div class=\"cb-h\">② 看什么打动点</div>\n<ul>\n<li>什么能打动她们——参照女博主高点击内容</li>\n<li>色彩</li>\n<li>安全 · 使用易用性</li>\n<li>最敏感的兜底细节</li>\n<li>解决什么价值 · 情感溢价</li>\n</ul>\n</div>\n<div class=\"cb-ar\"><svg aria-hidden=\"true\" height=\"14\" viewbox=\"0 0 16 16\" width=\"14\"><path d=\"M2 8h11M9.2 3.8 13.4 8l-4.2 4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg></div>\n<div class=\"cb-col cb-out\">\n<div class=\"cb-h\">③ 结论输出</div>\n<ul>\n<li>现有方案 → 更新后方案</li>\n<li>场景重点</li>\n<li>产品定义结论</li>\n<li>颜色 · 配色结论</li>\n</ul>\n</div>\n</div>\n<div class=\"cb-ref\">方法参照：跨行业看<b>汽车与手机</b>的配色原理和逻辑。</div>\n<figcaption>总结一定要输出——结论要落到“现有方案 vs 更新后方案”的对照上。</figcaption>\n</figure>\n</article>\n<aside class=\"takeaway\">\n<span class=\"tk-tag\">合起来看</span>\n<p>洞察 ＝ <b>带着目的的管道</b> ＋ <b>按主题排期的持续滚动</b>——不是年底一份大报告，而是每季度往前挪一点、结论持续更新的能力建设。</p>\n</aside>\n</section>\n<div class=\"sched\">\n<span class=\"ptag\">现场安排</span>\n<span>12:28 午休，13:30 继续；下午不再安排发表——讲者直接反馈，第一、二轮现场改稿。</span>\n</div>\n</div>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#f4f5f8\" height=\"512\" width=\"512\"></rect><rect fill=\"#dfe4f9\" height=\"80\" rx=\"12\" width=\"72\" x=\"90\" y=\"328\"></rect><rect fill=\"#c3cdf3\" height=\"120\" rx=\"12\" width=\"72\" x=\"180\" y=\"288\"></rect><rect fill=\"#93a4e8\" height=\"176\" rx=\"12\" width=\"72\" x=\"270\" y=\"232\"></rect><rect fill=\"#3f56d6\" height=\"248\" rx=\"12\" width=\"72\" x=\"360\" y=\"160\"></rect><path d=\"M118 320 362 190\" fill=\"none\" stroke=\"#1d2230\" stroke-linecap=\"round\" stroke-width=\"18\"></path><polygon fill=\"#1d2230\" points=\"404,166 376,216 346,164\"></polygon></svg></template>\n","blocks":[{"id":"s11b01","type":"part","heading":"PART 1 洞察怎么落地","text":"PART 1\n洞察怎么落地"},{"id":"s11b02","type":"mod","heading":"洞察是管道，不是漏斗","text":"01 · 理念\n洞察是管道，不是漏斗\n洞察的起点，是\n带着一个目的来\n——这一点在现场被特别强调。\n✕\n漏斗思维\n海量数据进来\n层层过滤\n漏出 1、2、3\n没有预设目的，漏出什么算什么\n✓\n管道思维\n① 先定目的\n如：改品\n② 按目的收数据\n功能 · 颜色\n③ 出对应结论\n产品改良方案\n若同时要支撑销售、品牌打法，要收的数据就不同\n以终为始：先问“要实现的目的是什么”，再定收什么数据、出什么结论。财务的 BI 与内外部数据分析，同理。"},{"id":"s11b03","type":"mod","heading":"写成举措：条件与主题都要落实","text":"02 · 写法\n写成举措：条件与主题都要落实\n在任务要素分解里，“洞察”落在关键成功因素／关键任务上。写成举措要同时讲清两件事：\n支撑条件\n，与\n今年聚焦的主题和节奏\n。\n举措「洞察」的两条写法\n第 1 条 · 条件齐备\n1\n分工逻辑\n和组织商量好洞察怎么分工\n2\n数据源\n搜研报，或向渠道定向购买；C 端平台相对易获取\n3\n洞察模板\n先定分析结构，再进数据\n4\n数据结构\n明确最终输出什么\n结构落点不止产品定义：\n产品定义 · 配色\n（配色因重要而单列），也可落在渠道打法、价格带、卖点、文案\n第 2 条 · 主题与排期\n维度\n按区域\n按客户\n按品类\n三种不一样，选定要明确\n主题\n单品\n竞品\n区域客户\n排期\n排进 4 个季度 / 12 个月\n✗ 反面示例：每月交一份报告，却说不清是什么报告\n四项条件可以合并写进同一条关键任务；主题与排期是要一并落实的第二条。\n主题聚焦时的声音来源\nVOC · 客户之声\nVOS · 卖家之声\n竞对分析\n相关品类分析\n市场之声\n分析整个市场的声音\n只听客户与卖家还不够——补上竞对与相关品类分析，才覆盖整个市场的声音。"},{"id":"s11b04","type":"part","heading":"PART 2 中台的价值分工","text":"PART 2\n中台的价值分工"},{"id":"s11b05","type":"mod","heading":"中台的两个铁三角","text":"03 · 结构\n中台的两个铁三角\n中台不是一个大部门，而是两条协同线：一条围绕\n产品输出\n，一条围绕\n产品表达\n。\n铁三角一 · 围绕产品输出\n产品\n研发\n供应链\n铁三角二 · 围绕产品表达\n品牌\n天\n市场\n空军飞机\n内容\n投弹\n两个输出的结果：魂 · 体 · 表（三者都重要）\n魂\n主要来自产品与供应链\n体\n主要来自产品与供应链\n表\n品牌牵头，需协同供应链\n比喻：市场是空军飞机，内容是投弹——表达这条线最终也要落回与供应链的协同。\n品牌这条线今天只点到为止，展开讲还需要另外半天。"},{"id":"s11b06","type":"mod","heading":"产品团队的四层境界","text":"04 · 产品\n产品团队的四层境界\n先讲通用、终局的版本：从选品起步，最终用产品驱动公司战略。\nL1\n选品开发\n起点形态：一两个人即可运转，关键是找对品。\nL2\n产品开发\n本质是\n开品效率\n：销售、运营提需求，产品高效满足——能满足就不错；范畴已扩到资源。\nL3\n规划 · 生命周期\n出现\n品类负责人\n与生命周期七步法；把立项决策放到前面：洞察 → 企划定义 → 指导实践；\n产品矩阵\n在此出现（L2 尚无）。\nL4\n产品创新战略\n用产品驱动公司核心竞争力，如与研发协同打造技术优势；本质是战略级取舍：\n做什么、不做什么\n。\nL3–L4 的追求\n：产品竞争力——爆品、排名绝对优势，好到“销售闭着眼睛卖”（类比：马斯克的飞行汽车）。\n所谓“技术路线”不能只交给研发：要回到“场景—产品—技术表达”整条链条。到 L4，看市场、看客户、看竞争所做的品类布局，已近乎公司战略。\n提示\n当“我要聚焦、做什么不做什么”还讲不清论据时，往往意味着需要更多数据与洞察来支撑——战略的清晰度背后是洞察储备。"},{"id":"s11b07","type":"mod","heading":"研发：技术壁垒三级递进","text":"05 · 研发\n研发：技术壁垒三级递进\n研发的价值是逐步实现技术：从追平，到领先，再到独有。\n自研能力一般到 L3 才介入；技术实现只能逐步推进。\n人有我有\n人有我优\n人无我有\n技术壁垒\n品牌\n市场\n产品表达（科学表达）"},{"id":"s11b08","type":"mod","heading":"供应链聚焦效率，采购分三段","text":"06 · 供应链\n供应链聚焦效率，采购分三段\n供应链围绕\n实现效率\n——时效、成本、质量等维度贯穿全程；采购天然属于供应链范畴。\n前台\n中台\n后台\n整条 ＝ 10 人（参考口径）\n前台 · 寻源支持\n2–3 人\n支持产品的开发与创新；\n第一客户是产品部\n——产品部下指令，即承接寻源。\n中台 · 保护\n6–7 人\n承担大量执行性工作，是人力主体。\n后台 · 建标准\n1–2 人\n流程、系统、建标准、供应商评价，帮采购／供应链负责人提升内部效率。\n一旦摆脱选品开发，选品就归供应链，供应商开发与管理也归供应链。"},{"id":"s11b09","type":"part","heading":"PART 3 实例与心法","text":"PART 3\n实例与心法\n合起来看\n洞察 ＝\n带着目的的管道\n＋\n按主题排期的持续滚动\n——不是年底一份大报告，而是每季度往前挪一点、结论持续更新的能力建设。"},{"id":"s11b10","type":"mod","heading":"洞察的本质是持续","text":"07 · 节奏\n洞察的本质是持续\n案例企业的洞察不是年底一次做完——按季度滚动，每次进步一点点。\n5–6 月 · 启动\n先把洞察跑起来，不等年底战略会。\n7–8 月 · 滚动\n按月慢慢滚动、逐版累积。\n季度会 · 呈现\n带着当期版本上会校准。\n持续的本质，就是\n每次进步一点点\n；版本要一直更新，而不是攒到最后。\n这套案例非满分，但有积累；讲者的建议回验成立，更新版本暂缺。"},{"id":"s11b11","type":"mod","heading":"实例看板：启动电源 · 女性市场","text":"08 · 实例\n实例看板：启动电源 · 女性市场\n一次季度会呈现的洞察——管道的目的非常明确：\n为型号与配色服务\n。\n① 查什么\n启动电源 · 女性市场容量\n平台搜索关键词\n女性用户需求画像\n相关品类状况\n个人风格调查——共同点：黑色、贴纸玩偶、社群属性、动手意愿\n② 看什么打动点\n什么能打动她们——参照女博主高点击内容\n色彩\n安全 · 使用易用性\n最敏感的兜底细节\n解决什么价值 · 情感溢价\n③ 结论输出\n现有方案 → 更新后方案\n场景重点\n产品定义结论\n颜色 · 配色结论\n方法参照：跨行业看\n汽车与手机\n的配色原理和逻辑。\n总结一定要输出——结论要落到“现有方案 vs 更新后方案”的对照上。"}]},{"num":12,"id":"s12","title":"一页纸战略：从战略地图到部门目标解码","date":"2026年11月11日","css":"*{box-sizing:border-box;margin:0;padding:0}\n#sv{\n  --page-bg:#f6f7fb;\n  --card:#ffffff;\n  --card-2:#f0f2f8;\n  --text:#1c2130;\n  --muted:#4a5165;\n  --faint:#6e7488;\n  --border:#e2e5f0;\n  --accent:#2f4bd8;\n  --accent-deep:#24399f;\n  --accent-soft:#e9edfb;\n  --accent-line:#c8d1f2;\n  --on-accent:#ffffff;\n  --red-tx:#b3261e; --red-dot:#d0483f; --red-bg:#fdecea; --red-line:#f0bab2;\n  --yel-tx:#7c5a10; --yel-dot:#dfa613; --yel-bg:#fdf4dc; --yel-line:#e9d496;\n  --blu-tx:#1d56b0; --blu-dot:#4a86d8; --blu-bg:#e9f1fd; --blu-line:#bcd0f0;\n  --lv1-bg:#e9edfb; --lv1-tx:#3c4a92; --lv2-bg:#c7d1f5; --lv2-tx:#2c3a86;\n  --lv3-bg:#7385e6; --lv3-tx:#ffffff; --lv4-bg:#2f4bd8; --lv4-tx:#ffffff;\n  --radius:14px;\n  --font:\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans SC\",\"Helvetica Neue\",Arial,sans-serif;\n  color-scheme:light dark;\n}\n@media (prefers-color-scheme: dark){\n#sv{\n    --page-bg:#14161f; --card:#1c1f2c; --card-2:#242837;\n    --text:#e8eaf2; --muted:#b6bccd; --faint:#99a0b3; --border:#2d3143;\n    --accent:#8ea2ff; --accent-deep:#b9c6ff; --accent-soft:#252c4e; --accent-line:#3a4577; --on-accent:#12152a;\n    --red-tx:#ff9d92; --red-dot:#e0685c; --red-bg:#3a2325; --red-line:#6b3a3c;\n    --yel-tx:#e5bd62; --yel-dot:#d3a03a; --yel-bg:#372d16; --yel-line:#5f5130;\n    --blu-tx:#a3c0f7; --blu-dot:#6f9bea; --blu-bg:#1f2a45; --blu-line:#3a5280;\n    --lv1-bg:#252c4e; --lv1-tx:#b9c6ff; --lv2-bg:#31396b; --lv2-tx:#ccd6ff;\n    --lv3-bg:#5b6cc9; --lv3-tx:#ffffff; --lv4-bg:#8ea2ff; --lv4-tx:#12152a;\n  }\n}\n#sv,#sv{background-color:var(--page-bg)}\n#sv{font-family:var(--font);color:var(--text);line-height:1.78;font-size:15.5px;-webkit-font-smoothing:antialiased}\n.wrap{max-width:820px;margin:0 auto;padding:0 18px}\n.hero{padding:46px 0 10px}\n.kicker{display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.14em;font-weight:600;color:var(--accent-deep)}\n.dots{display:inline-flex;gap:4px}\n.dots i{width:10px;height:10px;border-radius:3px;display:block}\n.d-r{background:var(--red-dot)}\n.d-y{background:var(--yel-dot)}\n.d-b{background:var(--blu-dot)}\nh1{font-size:clamp(25px,5.4vw,32px);line-height:1.32;margin-top:10px;letter-spacing:.01em}\n.lede{margin-top:10px;color:var(--muted);font-size:15px}\n.part{display:flex;gap:12px;align-items:flex-start;margin:42px 0 14px}\n.part-no{flex:none;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent-deep);background:var(--accent-soft);border:1px solid var(--accent-line);padding:4px 10px;border-radius:999px;margin-top:4px}\n.part h2{font-size:19px;line-height:1.4}\n.part-sub{font-size:13px;color:var(--muted);margin-top:3px}\n.mod{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px clamp(16px,3.4vw,24px) 18px;margin-bottom:16px}\n.mod>h3{font-size:17px;margin-bottom:10px;position:relative;padding-left:14px}\n.mod>h3::before{content:\"\";position:absolute;left:0;top:7px;width:5px;height:15px;border-radius:3px;background:var(--accent)}\n.mod p{margin:0 0 10px}\n.mod>:last-child{margin-bottom:0}\nstrong{font-weight:650;color:var(--accent-deep)}\nb{font-weight:650}\nul.kv{list-style:none;display:grid;gap:8px;margin:2px 0 12px}\nul.kv li{position:relative;padding-left:17px;font-size:14.6px;color:var(--muted)}\nul.kv li::before{content:\"\";position:absolute;left:2px;top:10px;width:7px;height:7px;border-radius:2px;background:var(--accent)}\n.quote{margin-top:12px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:14.3px;color:var(--text)}\n.insight{margin-top:12px;display:flex;gap:10px;align-items:baseline;background:var(--card-2);border:1px dashed var(--border);border-radius:10px;padding:10px 14px;font-size:13.6px;color:var(--muted)}\n.insight .tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent-deep)}\nfigure.fig{margin:14px 0;background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:16px}\nfigcaption{font-size:12.5px;color:var(--faint);line-height:1.6;margin-top:10px}\n.fgrid{display:grid;grid-template-columns:1fr;gap:6px}\n.fgrid .garr{justify-self:center;align-self:center;color:var(--faint);font-size:17px;transform:rotate(90deg)}\n.gn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:center;display:flex;flex-direction:column;gap:3px;justify-content:center}\n.gn b{font-size:13.8px}\n.gn span{font-size:12px;color:var(--muted);line-height:1.55}\n.gn-end{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}\n.gn-end span{color:inherit;opacity:.88}\n@media(min-width:680px){\n.fgrid{grid-template-columns:1fr 20px 1fr 20px 1fr 20px 1fr}\n.fgrid .garr{transform:none}\n}\n.chain{display:flex;gap:14px;align-items:stretch;max-width:460px;margin:0 auto}\n.chain-col{flex:1;display:flex;flex-direction:column}\n.clayer{border-radius:10px;padding:9px 12px;text-align:center;display:flex;flex-direction:column;gap:1px}\n.clayer b{font-size:15px}\n.clayer span{font-size:11.5px;opacity:.9}\n.l1{background:var(--lv1-bg);color:var(--lv1-tx);border:1px solid var(--accent-line)}\n.l2{background:var(--lv2-bg);color:var(--lv2-tx)}\n.l3{background:var(--lv3-bg);color:var(--lv3-tx)}\n.l4{background:var(--lv4-bg);color:var(--lv4-tx)}\n.cup{text-align:center;color:var(--accent);font-size:14px;line-height:1.5}\n.chain-side{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0}\n.cs-tag{font-size:11px;color:var(--faint);font-weight:600}\n.cs-line{flex:1;width:2px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-soft));position:relative}\n.cs-line::before{content:\"\";position:absolute;top:-2px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom:7px solid var(--accent)}\n.demo-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}\n.dbtn{font:inherit;font-size:13.5px;font-weight:600;padding:6px 13px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .18s}\n.dbtn:hover{border-color:var(--accent-line);color:var(--text)}\n.dbtn[aria-pressed=\"true\"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}\n.demo-hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}\n.drow{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}\n.drow-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}\n.drow-head>b{font-size:14px}\n.dcode{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);padding:2px 8px;border-radius:6px}\n.dabc{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--card-2);border:1px solid var(--border);color:var(--muted)}\n.ann-abc,.ann-num{display:none}\n.demo.s1 .ann-abc{display:inline-block}\n.demo.s2 .ann-num{display:inline-block}\n.drow-chips{display:flex;flex-wrap:wrap;gap:6px}\n.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.5;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .18s}\n.chip .dot{display:none;width:8px;height:8px;border-radius:50%}\n.chip .role{display:none;font-style:normal;font-size:11.5px;opacity:.85}\n.demo.s3 .chip .dot{display:inline-block}\n.demo.s3 .chip .role{display:inline}\n.demo.s3 .chip-red{background:var(--red-bg);border-color:var(--red-line);color:var(--red-tx)}\n.demo.s3 .chip-red .dot{background:var(--red-dot)}\n.demo.s3 .chip-yel{background:var(--yel-bg);border-color:var(--yel-line);color:var(--yel-tx)}\n.demo.s3 .chip-yel .dot{background:var(--yel-dot)}\n.demo.s3 .chip-blu{background:var(--blu-bg);border-color:var(--blu-line);color:var(--blu-tx)}\n.demo.s3 .chip-blu .dot{background:var(--blu-dot)}\n.demo-legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}\n.demo-legend .chip{cursor:default}\n.demo-legend .chip .dot{display:inline-block}\n.demo-legend .lg-r{background:var(--red-bg);border-color:var(--red-line);color:var(--red-tx)}\n.demo-legend .lg-r .dot{background:var(--red-dot)}\n.demo-legend .lg-y{background:var(--yel-bg);border-color:var(--yel-line);color:var(--yel-tx)}\n.demo-legend .lg-y .dot{background:var(--yel-dot)}\n.demo-legend .lg-b{background:var(--blu-bg);border-color:var(--blu-line);color:var(--blu-tx)}\n.demo-legend .lg-b .dot{background:var(--blu-dot)}\n.abc-key{font-size:12px;color:var(--muted)}\n.mix-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}\n.mix-l{flex:none;width:36px;font-size:12px;color:var(--faint);text-align:right}\n.mix-bar{flex:1;display:flex;gap:3px;height:30px}\n.seg{border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}\n.seg-r{background:var(--red-dot);color:#fff}\n.seg-y{background:var(--yel-dot);color:#4b3a08}\n.seg-self{border:1.5px dashed var(--faint);color:var(--muted)}\n.mix-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}\n.lg{display:inline-flex;align-items:center;gap:5px}\n.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}\n.pay-bar{display:flex;gap:3px;height:32px;margin-bottom:10px}\n.pay-fix{flex:8;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;display:flex;align-items radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}\n.cn-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.cn-pre{font-size:13.5px;font-weight:700}\n.cn-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);padding:2px 9px;border-radius:6px}\n.cn-note{font-size:12px;color:var(--faint)}\n/* Component-name-agnostic mobile safety net.\n   Structural guarantees are expressed against CSS Grid/Flex behaviour and\n   generic attribute hooks rather than a fixed class vocabulary,so generating\n   models may invent component names freely for any recording type. */\n*,*::before,*::after{ box-sizing: border-box; }\n#sv{ width: 100%; min-width: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n#sv{ width: 100%; min-width: 0; margin: 0; overflow-wrap: break-word; }\nmain,header,footer,nav,section,article,aside,figure,div,ul,ol,li,dl,dd,details{ min-width: 0; }\nimg,picture,video,canvas,svg{ display: block; max-width: 100%; height: auto; }\npre,code,kbd,samp{ max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }\nh1,h2,h3,h4,h5,h6,p,li,td,th,dt,dd,blockquote,figcaption{ overflow-wrap: anywhere; }\ninput,textarea,select,button{ max-width: 100%; font: inherit; }\n/* Any table gets a scroll container by intent or by generic hook. */\n.table-scroll,.table-wrap,.matrix-wrap,[data-table-scroll],[data-scroll-x]{\n  max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;\n}\n.table-scroll > table,.table-wrap > table,.matrix-wrap > table,[data-table-scroll] > table,[data-scroll-x] > table{ margin: 0; }\n/* Numbered step rows: keep #sv copy out of the counter track. */\n.step-item,[data-step-item]{ grid-template-columns: 32px minmax(0, 1fr) !important; }\n.step-item::before,[data-step-item]::before{ grid-column: 1 !important; grid-row: 1 !important; }\n.step-item > :empty,[data-step-item] > :empty{ display: none !important; }\n.step-item > *,[data-step-item] > *{ grid-column: 2 !important; min-width: 0 !important; }\n.data-value,.metric-value,[data-value]{ max-width: 100%; font-variant-numeric: tabular-nums; }\n/* A single surviving child of ANY grid spans the full row. Applied to every\n   element that declares a grid,so unknown component names are covered too. */\n[class*=\"grid\"] > :only-child,[class*=\"board\"] > :only-child,[class*=\"cluster\"] > :only-child,[class*=\"row\"] > :only-child,[class*=\"split\"] > :only-child,[class*=\"cols\"] > :only-child,[class*=\"columns\"] > :only-child,[class*=\"layout\"] > :only-child,[class*=\"panel\"] > :only-child,[data-grid] > :only-child,[data-cols] > :only-child{\n  grid-column: 1 / -1 !important;\n  width: 100% !important;\n}\n@media (max-width: 600px){\n#sv{ font-size: 14.5px !important; line-height: 1.62 !important; }\n:where(#sv > main,#sv > .report-shell,#sv > .report,#sv > .container,#sv > [data-shell]){\n    width: calc(100% - 40px) !important;\n    max-width: 100% !important;\n    margin-inline: auto !important;\n  }\nh1{ font-size: 29px !important; line-height: 1.22 !important; letter-spacing: 0 !important; }\nh2{ font-size: 22px !important; line-height: 1.3 !important; letter-spacing: 0 !important; }\nh3{ font-size: 16px !important; line-height: 1.42 !important; letter-spacing: 0 !important; }\n/* Generic collapse: every multi-column grid becomes single column unless it\n     explicitly opts into staying paired (data-keep-columns) or is a table. */\n  [class*=\"grid\"]:not([data-keep-columns]),[class*=\"board\"]:not([data-keep-columns]),[class*=\"split\"]:not([data-keep-columns]),[class*=\"cols\"]:not([data-keep-columns]),[class*=\"columns\"]:not([data-keep-columns]),[class*=\"layout\"]:not([data-keep-columns]),[data-grid]:not([data-keep-columns]){\n    grid-template-columns: minmax(0, 1fr) !important;\n  }\n/* Compact numeric clusters may stay two-up,but a trailing odd card must\n     span both columns so no empty half-row is left on narrow screens. */\n  [data-keep-columns]{ grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }\n[data-keep-columns] > :last-child:nth-child(odd){ grid-column: 1 / -1 !important; }\n[data-span-all],[data-value-kind=\"formula\"],[data-value-kind=\"range\"]{ grid-column: 1 / -1 !important; }\n/* Horizontal flows become vertical. */\n  [class*=\"flow\"],[class*=\"chain\"],[class*=\"timeline\"]{ flex-direction: column !important; }\n[class*=\"arrow\"]{ transform: rotate(90deg); min-height: 16px !important; }\ntable{ font-size: 12.5px; }\nth,td{ padding: 9px 8px !important; }\nnav{ max-width: 100%; }\nnav[data-scrollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}","body":"\n<header class=\"hero\">\n<div class=\"wrap\">\n<div class=\"kicker\"><span class=\"dots\"><i class=\"d-r\"></i><i class=\"d-y\"></i><i class=\"d-b\"></i></span>战略解码工作坊 · 讲解与演练整理</div>\n<h1>一页纸战略：从战略地图到部门目标解码</h1>\n<p class=\"lede\">一张图讲清战略，一张表解码部门目标，一场会把协同摆上台面。</p>\n</div>\n</header>\n<main>\n<div class=\"wrap\">\n<section>\n<div class=\"part\" id=\"s12b01\">\n<span class=\"part-no\">Part 1</span>\n<div>\n<h2>战略地图：一页纸战略</h2>\n<p class=\"part-sub\">价值、结构与标注方法</p>\n</div>\n</div>\n<div class=\"mod\" id=\"s12b02\">\n<h3>价值：先回答四个问题</h3>\n<p>这张图叫<strong>一页纸战略部署</strong>，攻坚项目用的也是它，只是形式略有不同；用 OGSM 承载或用战略地图承载都可以。这次三天工作坊更强调前期推导，前期思考的时间更长。</p>\n<figure class=\"fig\" data-visual-id=\"strategy-value-flow\" data-visual-relation=\"地图先回答干什么、怎么干、什么结果、谁来干，统一关键目标，衡量标准挂钩时间与客户后进程可追踪\" data-visual-source=\"知道这个重点行动……干到什么结果，谁来干；进程可以追踪其实要求衡量标准，要跟时间客户去挂钩\" data-visual-title=\"战略地图四问与目标追踪\" data-visual-type=\"流程示意\">\n<div class=\"fgrid\" data-grid=\"\">\n<div class=\"gn\"><b>回答四问</b><span>干什么 · 怎么干<br/>什么结果 · 谁来干</span></div>\n<div class=\"garr\">→</div>\n<div class=\"gn\"><b>统一关键目标</b><span>目标很多，业态内部要统一</span></div>\n<div class=\"garr\">→</div>\n<div class=\"gn\"><b>建立衡量标准</b><span>与时间、客户挂钩</span></div>\n<div class=\"garr\">→</div>\n<div class=\"gn gn-end\"><b>进程可追踪</b></div>\n</div>\n</figure>\n<p>讲师点名成员E作答，现场确认出三层价值：知道<strong>重点行动</strong>——干什么、怎么干、干到什么结果、谁来干；在业态内部<strong>统一关键目标</strong>（目标很多，但要统一）；<strong>进程可追踪</strong>——前提是建立衡量标准，并与时间、客户挂钩。</p>\n</div>\n<div class=\"mod\" id=\"s12b03\">\n<h3>因果逻辑：四力层层支持</h3>\n<p>一页纸战略的第一个特点是<strong>呈现因果逻辑</strong>：组织力支持产品力，产品力支持营销力，营销力支持经营力。它不是 10 个条目的并列关系，而是像楼房一样一层层在支持。</p>\n<figure class=\"fig\" data-visual-id=\"strategy-causal-chain\" data-visual-relation=\"组织力自下而上逐层支持产品力、营销力、经营力，从下到上、从右向左都是从因到果\" data-visual-source=\"组织力支持产品力，产品力支持营销力，营销力支持经营力……像楼房一样一层层在支持的关系\" data-visual-title=\"四力因果链：从因到果\" data-visual-type=\"层级图\">\n<div class=\"chain\">\n<div class=\"chain-col\">\n<div class=\"clayer l4\"><b>经营力</b><span>财务结果 · F</span></div>\n<div class=\"cup\">↑</div>\n<div class=\"clayer l3\"><b>营销力</b><span>客户 · C</span></div>\n<div class=\"cup\">↑</div>\n<div class=\"clayer l2\"><b>产品力</b><span>内部过程 · I</span></div>\n<div class=\"cup\">↑</div>\n<div class=\"clayer l1\"><b>组织力</b><span>学习成长 · L</span></div>\n</div>\n<div class=\"chain-side\">\n<span class=\"cs-tag\">果</span>\n<span class=\"cs-line\"></span>\n<span class=\"cs-tag\">因</span>\n</div>\n</div>\n<figcaption>示意图：实际一页纸战略中这条链自右向左展开；从下到上、从右向左，都是从因到果。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s12b04\">\n<h3>战役战备与力出一孔</h3>\n<p><strong>呈现战役战备。</strong>任务要分解，所以图里带着条件项，比如招人、营销费比。</p>\n<p><strong>引导力出一孔。</strong>协同不用 RACI，也不用三角形、五角星、圆，而是通过涂颜色，把主责和协同表达得更具象——力出一孔，才能协同。</p>\n<p>有位骨干员工说得直白：我不关心战略，我关心战略跟我有什么关系。对他来说，红与黄、收入都跟他有关系；图里还看不到收入，<strong>考核激励机制</strong>要靠后续动作跟进，把力引到一个孔里。</p>\n</div>\n<div class=\"mod\" id=\"s12b05\">\n<h3>标注三步：前字母、写编号、涂颜色</h3>\n<p>给地图加标注只有三个动作，\"像教幼儿园小朋友一样\"：</p>\n<ul class=\"kv\">\n<li><strong>前字母</strong>——A 是创新，从来没做过的；B 是改善，小步迈进、慢一步做；C 是效率，本来就在做，要做得更快更好。</li>\n<li><strong>写编号</strong>——经营力重在财务指标，取 finance 的 F；营销力面向客户，取 customer 的 C；产品力取 I；组织力重在学习成长，取 L；右侧再编 1.1、1.2、1.3。</li>\n<li><strong>涂颜色</strong>——红黄蓝把主责与协同涂出来，见下方演示。</li>\n</ul>\n<p>协同方法可以很复杂，但<strong>复杂留给自己，简单交给用图的人</strong>——用图的人拿到的应是手感好、体验极佳的产品。</p>\n<figure class=\"fig\" data-visual-id=\"map-annotation-demo\" data-visual-relation=\"前字母、写编号、涂颜色三步，逐步给战略地图加上ABC分类、FCIL编号与红黄蓝主责协同标注\" data-visual-source=\"前字母写编号涂颜色，像教幼儿园小朋友一样；C叫效率，B叫改善，A叫创新\" data-visual-title=\"一页纸战略标注三步演示\" data-visual-type=\"交互原型\">\n<div class=\"demo s1 s2 s3\" id=\"annotDemo\">\n<div class=\"demo-bar\">\n<button aria-pressed=\"false\" class=\"dbtn\" data-step=\"0\" type=\"button\">原始图</button>\n<button aria-pressed=\"false\" class=\"dbtn\" data-step=\"1\" type=\"button\">① 前字母</button>\n<button aria-pressed=\"false\" class=\"dbtn\" data-step=\"2\" type=\"button\">② 写编号</button>\n<button aria-pressed=\"true\" class=\"dbtn\" data-step=\"3\" type=\"button\">③ 涂颜色</button>\n</div>\n<p class=\"demo-hint\" id=\"demoHint\">第三步 · 涂颜色：红＝主责（格内不写字，每行仅一个红），橙/黄＝协同（必须写协同任务），蓝＝知会（不写字）——力出一孔，才能协同。</p>\n<div class=\"drow\">\n<div class=\"drow-head\"><span class=\"dcode ann-num\">F1.1</span><b>经营力 · 达成年度经营结果</b><span class=\"dabc ann-abc\">C 效率</span></div>\n<div class=\"drow-chips\">\n<span class=\"chip chip-red\"><i class=\"dot\"></i>业态运营<em class=\"role\">主责</em></span>\n<span class=\"chip chip-yel\"><i class=\"dot\"></i>财务<em class=\"role\">协同 · 经营分析</em></span>\n</div>\n</div>\n<div class=\"drow\">\n<div class=\"drow-head\"><span class=\"dcode ann-num\">C2.1</span><b>营销力 · 新品全渠道上架</b><span class=\"dabc ann-abc\">B 改善</span></div>\n<div class=\"drow-chips\">\n<span class=\"chip chip-red\"><i class=\"dot\"></i>营销<em class=\"role\">主责</em></span>\n<span class=\"chip chip-yel\"><i class=\"dot\"></i>产品<em class=\"role\">协同 · 一季度上市</em></span>\n<span class=\"chip chip-blu\"><i class=\"dot\"></i>采购<em class=\"role\">知会</em></span>\n</div>\n</div>\n<div class=\"drow\">\n<div class=\"drow-head\"><span class=\"dcode ann-num\">I3.1</span><b>产品力 · 大单品开发降本</b><span class=\"dabc ann-abc\">A 创新</span></div>\n<div class=\"drow-chips\">\n<span class=\"chip chip-red\"><i class=\"dot\"></i>产品<em class=\"role\">主责</em></span>\n<span class=\"chip chip-yel\"><i class=\"dot\"></i>采购<em class=\"role\">协同 · 大单品降本</em></span>\n<span class=\"chip chip-yel\"><i class=\"dot\"></i>人力<em class=\"role\">协同 · 关键岗位到岗</em></span>\n</div>\n</div>\n<div class=\"drow\">\n<div class=\"drow-head\"><span class=\"dcode ann-num\">L2.1</span><b>组织力 · 关键人才到岗</b><span class=\"dabc ann-abc\">B 改善</span></div>\n<div class=\"drow-chips\">\n<span class=\"chip chip-red\"><i class=\"dot\"></i>人力<em class=\"role\">主责</em></span>\n<span class=\"chip chip-blu\"><i class=\"dot\"></i>产品<em class=\"role\">知会</em></span>\n<span class=\"chip chip-blu\"><i class=\"dot\"></i>采购<em class=\"role\">知会</em></span>\n</div>\n</div>\n<div class=\"demo-legend\">\n<span class=\"chip lg-r\"><i class=\"dot\"></i>红 · 主责</span>\n<span class=\"chip lg-y\"><i class=\"dot\"></i>黄 · 协同</span>\n<span class=\"chip lg-b\"><i class=\"dot\"></i>蓝 · 知会</span>\n<span class=\"abc-key\">前字母：A 创新 · B 改善 · C 效率</span>\n</div>\n<figcaption>示例数据，仅演示标注方法；点击上方步骤回看三步过程。</figcaption>\n</div>\n</figure>\n</div>\n<div class=\"mod\" id=\"s12b06\">\n<h3>越精炼，越能执行</h3>\n<p><strong>战略越精炼，就越容易被彻底执行。</strong>凡几句话说不清楚的事，就永远说不清楚；好的战略一定符合常识。</p>\n<p>任何文字表达，写完要<strong>用嘴巴读一遍</strong>，不要只用眼睛看——文字逻辑和口舌逻辑是两套逻辑，口舌更容易传导、影响、被接受。</p>\n<p>金句同理：助理整理时\"锦上添花\"加了字，被要求一个字都不能加——<strong>多一个字、少一个字，就不成金句</strong>。为什么要共创、红蓝对抗？因为人要被触动、要感知，不能只靠听到。</p>\n<aside class=\"quote\">\"人不因知道而改变，人只因触动而改变。\"</aside>\n</div>\n</section>\n<section>\n<div class=\"part\" id=\"s12b07\">\n<span class=\"part-no\">Part 2</span>\n<div>\n<h2>部门目标：从红黄解码</h2>\n<p class=\"part-sub\">目标从哪来、表长什么样、怎么防自嗨</p>\n</div>\n</div>\n<div class=\"mod\" id=\"s12b08\">\n<h3>红加黄，加自身关键职责</h3>\n<p>\"部门目标从哪来？\"现场有人指几张表猜来源，都被否定——<strong>部门目标就是红加黄</strong>，再加自身。因为每个部门存在的唯一价值，是协同角色。来源只有三个：</p>\n<ul class=\"kv\">\n<li><strong>红</strong>——战略地图里本部门主责的事；</li>\n<li><strong>黄</strong>——战略地图里本部门任重要协同角色的事；</li>\n<li><strong>自身关键职责</strong>——自认为或公司要求最重要的事。</li>\n</ul>\n<p>假设部门目标共 5 条：<strong>红加黄占 3~4 条，自身占 1~2 条</strong>。</p>\n<figure class=\"fig\" data-visual-id=\"goal-source-mix\" data-visual-relation=\"部门目标5条中，红加黄合计占3~4条，自身关键职责占1~2条\" data-visual-source=\"红加黄得占4条，再不济也得占3条……自身的那个可能占1~2条\" data-visual-title=\"部门目标五条的来源构成\" data-visual-type=\"构成比例图\">\n<div class=\"mix-row\">\n<span class=\"mix-l\">通常</span>\n<div class=\"mix-bar\"><span class=\"seg seg-r\" style=\"flex:1\">红</span><span class=\"seg seg-y\" style=\"flex:1\">黄</span><span class=\"seg seg-y\" style=\"flex:1\">黄</span><span class=\"seg seg-y\" style=\"flex:1\">黄</span><span class=\"seg seg-self\" style=\"flex:1\">自</span></div>\n</div>\n<div class=\"mix-row\">\n<span class=\"mix-l\">底线</span>\n<div class=\"mix-bar\"><span class=\"seg seg-r\" style=\"flex:1\">红</span><span class=\"seg seg-y\" style=\"flex:1\">黄</span><span class=\"seg seg-y\" style=\"flex:1\">黄</span><span class=\"seg seg-self\" style=\"flex:1\">自</span><span class=\"seg seg-self\" style=\"flex:1\">自</span></div>\n</div>\n<div class=\"mix-legend\">\n<span class=\"lg\"><i style=\"background:var(--red-dot)\"></i>红＝主责条目</span>\n<span class=\"lg\"><i style=\"background:var(--yel-dot)\"></i>黄＝协同条目</span>\n<span class=\"lg\"><i style=\"border:1.5px dashed var(--faint)\"></i>自身关键职责</span>\n</div>\n<figcaption>以 5 条部门目标为例：上行为通常构成（红黄 4 条），下行为底线要求（红黄 3 条）。</figcaption>\n</figure>\n<p>5 条之外的事照样要干，靠薪酬分账兜底：<strong>固定工资发的是基本职责——武功</strong>；<strong>绩效奖金发的是重点目标——战功</strong>。</p>\n<figure class=\"fig\" data-visual-id=\"pay-structure\" data-visual-relation=\"固定工资对应基本职责（武功），绩效奖金对应重点目标（战功）\" data-visual-source=\"固定工资背后是武功，是基本职责……绩效奖金发的是重点目标，这叫战功\" data-visual-title=\"工资结构：武功与战功\" data-visual-type=\"构成示意\">\n<div class=\"pay-bar\"><span class=\"pay-fix\">固定工资 8000 · 基本职责</span><span class=\"pay-var\"></span></div>\n<div class=\"mix-legend\">\n<span class=\"lg\"><i style=\"background:var(--accent-soft);border:1px solid var(--accent-line)\"></i>固定工资 8000 → 武功</span>\n<span class=\"lg\"><i style=\"background:var(--yel-dot)\"></i>绩效奖金 2000 → 战功</span>\n</div>\n<figcaption>以月薪 1 万元（8000＋2000）为例，讲师举例。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s12b09\">\n<h3>解码：归纳成部门目标</h3>\n<figure class=\"fig\" data-visual-id=\"goal-decode-flow\" data-visual-relation=\"部门目标由多张战略地图的红黄呼唤归纳解码而成，编号用于溯源\" data-visual-source=\"产品部……需要整合5张战略地图，或者4张……去做自己的部门目标；编号目的是找到部门要干的事的来源\" data-visual-title=\"部门目标解码流程\" data-visual-type=\"流程示意\">\n<div class=\"fgrid\" data-grid=\"\">\n<div class=\"gn\"><b>4~5 张战略地图</b><span>本部门被各图以红、黄呼唤</span></div>\n<div class=\"garr\">→</div>\n<div class=\"gn\"><b>汇总呼唤条目</b><span>按编号溯源到原图</span></div>\n<div class=\"garr\">→</div>\n<div class=\"gn\"><b>归纳整合</b><span>与红黄并非一一对应</span></div>\n<div class=\"garr\">→</div>\n<div class=\"gn gn-end\"><b>部门年度目标与任务</b><span>目标 · 任务 · 衡量标准</span></div>\n</div>\n</figure>\n<p>一个部门常被多张地图呼唤。比如产品部，要把 <strong>4~5 张战略地图</strong>的红与黄整合起来，再写部门目标。</p>\n<p>床垫公司产品部的目标这样写：\"围绕用户价值布局，适配战略目标和全域渠道的产品体系，以数据和模块化研发为驱动力。\"讲师点评：<b>有点长，但意思到位</b>。其后的部门关键目标（这家公司叫\"关键硬仗\"）与红黄<strong>不是一一对应</strong>，要归纳——比如智能联动款和区域高端产品，可合并为一条\"中高端产品\"；有多张地图时整体归纳。</p>\n<p>这张表叫<strong>部门年度目标与任务</strong>，不是考核表——战略地图是年度的，它也是年度的，相当于部门的战略地图。目标、关键任务、衡量标准三列，与 OGSM 相通，分别约等于 O、S/KR、M；编号列溯源战略地图关键任务。</p>\n<p><strong>编号的作用是溯源</strong>：找到这条事在战略地图上的来源。两份表各管一头——<strong>目标与任务表靠编号强制\"上下对齐战略\"，指标表靠同口径\"左右拉通协同\"</strong>。</p>\n</div>\n<div class=\"mod\" id=\"s12b10\">\n<h3>自嗨式与配称式目标</h3>\n<figure class=\"fig\" data-visual-id=\"self-play-vs-fit\" data-visual-relation=\"自嗨式按职能罗列指标，配称式逐条写明支持哪个业态、哪类产品；检验标准是业态负责人能找到对自己的支持\" data-visual-source=\"客服正常客服部他的KPI是退货率转化率……这叫自嗨；后来改成了他要支持某一个业态或者某一个品类\" data-visual-title=\"自嗨式与配称式部门目标对照\" data-visual-type=\"对照图\">\n<div class=\"vs\" data-grid=\"\">\n<div class=\"vs-col vs-bad\">\n<div class=\"vs-head\">自嗨式 · 闭着眼睛写</div>\n<ul>\n<li><b>客服部</b>：转化率、退货率、DSR 评分、客户投诉——战略怎么变都这几个</li>\n<li><b>采购岗</b>：及时率、质量 SQE、降本、供应商开发评价与管理、采购流程优化</li>\n<li><b>产品部</b>：IPD、产品矩阵、商品管理（价格动销库存）、开品经验沉淀</li>\n<li><b>财务</b>：财务制度、经营分析、预算、数字化升级</li>\n</ul>\n<div class=\"vs-foot\">业态负责人：感受不到对我的帮助</div>\n</div>\n<div class=\"vs-col vs-good\">\n<div class=\"vs-head\">配称式 · 红与黄写明白</div>\n<ul>\n<li><b>客服部</b>：逐业态写明——支持 A 业态售前、支持 B 业态客户服务</li>\n<li><b>采购</b>：不做总体降本，做<b>大单品</b>降本</li>\n<li><b>人力资源</b>：不是整体补人，是<b>哪些关键岗位到岗</b></li>\n<li><b>产品部</b>：某品一季度前上市上架</li>\n</ul>\n<div class=\"vs-foot\">业态负责人：能当场找到对我的支持</div>\n</div>\n</div>\n</figure>\n<p>检验句只有一句，拉着业态负责人问：<strong>\"这有没有帮助你实现业绩目标？哪里能帮助？\"</strong>感受不到，写得再对也是自嗨。</p>\n<p>手推车公司的客服部原先闭着眼睛写转化率、退货率，讲师放话：下次还这么写，战略会就不用来了。改成逐业态写明支持什么之后，业态负责人坐在台下，就能直接找到客服对自己的支持。</p>\n<aside class=\"insight\"><span class=\"tag\">洞察</span>写目标的方向要反转：不是\"我该做什么\"，而是\"战略地图呼唤我做什么\"。</aside>\n</div>\n<div class=\"mod\" id=\"s12b11\">\n<h3>连蓝都没有的部门</h3>\n<p>如果几组战略地图都在互相呼唤，唯独某个部门<strong>连一个蓝都没有</strong>——连\"需要知道\"都排不上——说明它可能可以被整合了。审计部那种属特殊情况，仍要存在；政策法规部被呼唤很少，那位律师就逐个游说业态负责人\"你得呼唤我\"，主动把呼唤要回来——讲师认可：这种逻辑也 OK。</p>\n<p>所以战略地图做好之后，往往要<strong>调整组织架构</strong>，连\"洞察\"这类能力该由谁承载，也要等呼唤结果出来再定位。<strong>战略决定组织，不是组织决定战略。</strong>很多企业反过来：老板说几句，各部门就开始写作业，背后假定每个部门都该存在——结果人人找到存在感，目标加起来不是总目标，就会断裂。这正是按业态分组、在公司与部门之间设业务线的原因：<strong>几张战略地图，决定新的组织架构。</strong></p>\n</div>\n</section>\n<section>\n<div class=\"part\" id=\"s12b12\">\n<span class=\"part-no\">Part 3</span>\n<div>\n<h2>对齐与演练</h2>\n<p class=\"part-sub\">把协同摆上台面，再落到每张桌子</p>\n</div>\n</div>\n<div class=\"mod\" id=\"s12b13\">\n<h3>部门目标对齐会</h3>\n<figure class=\"fig\" data-visual-id=\"alignment-meeting-flow\" data-visual-relation=\"业态负责人发布战略地图后各部门逐条讲目标，被写到的部门必须当场回答能否支持，感受不到支持就现场讨论\" data-visual-source=\"几大业态负责人先发布一下……供应链部门负责人他讲我有四个1234……有没有支持你的OEM……写上的必须回答\" data-visual-title=\"部门目标对齐会流程\" data-visual-type=\"流程示意\">\n<ol class=\"meet\">\n<li><b>再次发布战略地图</b><span>各大业态负责人先发布</span></li>\n<li><b>部门逐条讲目标</b><span>如供应链负责人讲 4 条：一二三四要干什么</span></li>\n<li><b>台下当场发问</b><span>\"有没有支持你的 OEM？支持在哪里？\"</span></li>\n<li><b>写上的必须回答</b><span>生产、财务、法务、信息部……逐个确认能否支持</span></li>\n<li><b>感受不到就现场讨论</b><span>有技术条件问题的当场对齐</span></li>\n</ol>\n<figcaption>这个会在阿里巴巴叫\"部门目标通晒会\"。</figcaption>\n</figure>\n<p>规则很硬：<strong>只要写上的，必须当场回答能否支持</strong>；感受不到支持，写得再好也不行；有技术条件问题的，现场讨论。</p>\n<p><strong>中台的价值就是协同做强</strong>——对齐会把协同摆上台面，让\"左右拉通\"不停在纸面。</p>\n</div>\n<div class=\"mod\" id=\"s12b14\">\n<h3>部门价值定位：三句话说清</h3>\n<p>表里还有\"部门价值定位\"一栏。一般规律：<strong>战略大年要写，小年可不写</strong>；定位没有大变化也可以不写。放在今年，讲师建议都尝试写。</p>\n<p>要求很苛刻：<strong>用三句话概括这个部门到底是干什么的</strong>。\"30 句更说不清楚，三句话能说清楚。\"</p>\n</div>\n<div class=\"mod\" id=\"s12b15\">\n<h3>部门演练：多图红黄写初稿</h3>\n<p>忘掉五大组，<strong>以部门为单位</strong>，在共享文档的\"部门年度目标与任务\"表里写本部门初稿，约半小时；一个部门来了几个人，就商量着写一份——视觉部 4 位同事坐在一起写。</p>\n<p>视觉部要基于 <strong>4 张战略地图</strong>的红与黄写目标；编号加业态前缀，同一格可能引来两三条：</p>\n<figure class=\"fig\" data-visual-id=\"cross-map-numbering\" data-visual-relation=\"部门目标编号前加业态前缀（如品牌-I2.1、OEM-I2.2），逐条对照多张战略地图实现强制互锁\" data-visual-source=\"叫你们的中文叫什么品牌，品牌I2.1，这边呢OEM I2.2……这个逻辑就是为了力出一孔，强制部门不自嗨\" data-visual-title=\"跨图编号：业态前缀标注\" data-visual-type=\"标注示例\">\n<div class=\"cnum\" data-grid=\"\">\n<div class=\"cn-item\">\n<div class=\"cn-top\"><span class=\"cn-pre\">品牌</span><span class=\"cn-code\">I2.1</span></div>\n<span class=\"cn-note\">产品力条目 · 取自品牌业态图</span>\n</div>\n<div class=\"cn-item\">\n<div class=\"cn-top\"><span class=\"cn-pre\">OEM</span><span class=\"cn-code\">I2.2</span></div>\n<span class=\"cn-note\">产品力条目 · 取自 OEM 业态图</span>\n</div>\n</div>\n<figcaption>前缀＝业态，字母＝FCIL 之力，数字＝图内序号。</figcaption>\n</figure>\n<p>红黄规则：<strong>每行一个红、多个黄</strong>（确需多个部门主责的除外），小组内部再把标注核一遍。</p>\n<p>对照就是<strong>强制互锁、倒逼</strong>：一个部门可以定 20 个目标，但与战略高度一致的往往只有 5 个——<strong>把这 5 个找出来</strong>。</p>\n<p>心态上，战略地图现在还是<strong>\"毛坯房\"</strong>，没到精装修——先初步演练，不追求绝对精确，主要追求把逻辑学会。</p>\n</div>\n</section>\n</div>\n</main>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#f6f7fb\" height=\"512\" width=\"512\"></rect><rect fill=\"#ffffff\" height=\"340\" rx=\"26\" stroke=\"#dfe3ee\" stroke-width=\"2\" width=\"260\" x=\"126\" y=\"86\"></rect><line stroke=\"#2f4bd8\" stroke-linecap=\"round\" stroke-width=\"5\" x1=\"146\" x2=\"146\" y1=\"304\" y2=\"158\"></line><polygon fill=\"#2f4bd8\" points=\"146,134 132,160 160,160\"></polygon><rect fill=\"#2f4bd8\" height=\"30\" rx=\"9\" width=\"180\" x=\"166\" y=\"130\"></rect><rect fill=\"#7385e6\" height=\"30\" rx=\"9\" width=\"180\" x=\"166\" y=\"178\"></rect><rect fill=\"#c7d1f5\" height=\"30\" rx=\"9\" width=\"180\" x=\"166\" y=\"226\"></rect><rect fill=\"#e9edfb\" height=\"30\" rx=\"9\" stroke=\"#d5dcf5\" stroke-width=\"1.5\" width=\"180\" x=\"166\" y=\"274\"></rect><circle cx=\"186\" cy=\"372\" fill=\"#d0483f\" r=\"13\"></circle><circle cx=\"256\" cy=\"372\" fill=\"#dfa613\" r=\"13\"></circle><circle cx=\"326\" cy=\"372\" fill=\"#4a86d8\" r=\"13\"></circle></svg></template>\n<script>\n(function(){\n  var demo=document.getElementById('annotDemo');\n  if(!demo)return;\n  var btns=demo.querySelectorAll('.dbtn');\n  var hint=document.getElementById('demoHint');\n  var hints={\n    0:'原始地图：只有目标条目，未做任何标注。',\n    1:'第一步 · 前字母：A 创新（没做过）/ B 改善（小步迈进）/ C 效率（做得更快更好）。',\n    2:'第二步 · 写编号：F 财务 / C 客户 / I 产品 / L 组织，右侧再编 1.1、1.2、1.3。',\n    3:'第三步 · 涂颜色：红＝主责（格内不写字，每行仅一个红），橙/黄＝协同（必须写协同任务），蓝＝知会（不写字）——力出一孔，才能协同。'\n  };\n  function setStep(n){\n    demo.classList.remove('s1','s2','s3');\n    for(var i=1;i<=n;i++){demo.classList.add('s'+i);}\n    Array.prototype.forEach.call(btns,function(b){\n      b.setAttribute('aria-pressed', b.getAttribute('data-step')===String(n)?'true':'false');\n    });\n    hint.textContent=hints[n];\n  }\n  Array.prototype.forEach.call(btns,function(b){\n    b.addEventListener('click',function(){setStep(parseInt(b.getAttribute('data-step'),10));});\n  });\n  setStep(3);\n})();\n<\/script>\n","blocks":[{"id":"s12b01","type":"part","heading":"战略地图：一页纸战略","text":"Part 1\n战略地图：一页纸战略\n价值、结构与标注方法"},{"id":"s12b02","type":"mod","heading":"价值：先回答四个问题","text":"价值：先回答四个问题\n这张图叫\n一页纸战略部署\n，攻坚项目用的也是它，只是形式略有不同；用 OGSM 承载或用战略地图承载都可以。这次三天工作坊更强调前期推导，前期思考的时间更长。\n回答四问\n干什么 · 怎么干\n什么结果 · 谁来干\n→\n统一关键目标\n目标很多，业态内部要统一\n→\n建立衡量标准\n与时间、客户挂钩\n→\n进程可追踪\n讲师点名成员E作答，现场确认出三层价值：知道\n重点行动\n——干什么、怎么干、干到什么结果、谁来干；在业态内部\n统一关键目标\n（目标很多，但要统一）；\n进程可追踪\n——前提是建立衡量标准，并与时间、客户挂钩。"},{"id":"s12b03","type":"mod","heading":"因果逻辑：四力层层支持","text":"因果逻辑：四力层层支持\n一页纸战略的第一个特点是\n呈现因果逻辑\n：组织力支持产品力，产品力支持营销力，营销力支持经营力。它不是 10 个条目的并列关系，而是像楼房一样一层层在支持。\n经营力\n财务结果 · F\n↑\n营销力\n客户 · C\n↑\n产品力\n内部过程 · I\n↑\n组织力\n学习成长 · L\n果\n因\n示意图：实际一页纸战略中这条链自右向左展开；从下到上、从右向左，都是从因到果。"},{"id":"s12b04","type":"mod","heading":"战役战备与力出一孔","text":"战役战备与力出一孔\n呈现战役战备。\n任务要分解，所以图里带着条件项，比如招人、营销费比。\n引导力出一孔。\n协同不用 RACI，也不用三角形、五角星、圆，而是通过涂颜色，把主责和协同表达得更具象——力出一孔，才能协同。\n有位骨干员工说得直白：我不关心战略，我关心战略跟我有什么关系。对他来说，红与黄、收入都跟他有关系；图里还看不到收入，\n考核激励机制\n要靠后续动作跟进，把力引到一个孔里。"},{"id":"s12b05","type":"mod","heading":"标注三步：前字母、写编号、涂颜色","text":"标注三步：前字母、写编号、涂颜色\n给地图加标注只有三个动作，\"像教幼儿园小朋友一样\"：\n前字母\n——A 是创新，从来没做过的；B 是改善，小步迈进、慢一步做；C 是效率，本来就在做，要做得更快更好。\n写编号\n——经营力重在财务指标，取 finance 的 F；营销力面向客户，取 customer 的 C；产品力取 I；组织力重在学习成长，取 L；右侧再编 1.1、1.2、1.3。\n涂颜色\n——红黄蓝把主责与协同涂出来，见下方演示。\n协同方法可以很复杂，但\n复杂留给自己，简单交给用图的人\n——用图的人拿到的应是手感好、体验极佳的产品。\n原始图\n① 前字母\n② 写编号\n③ 涂颜色\n第三步 · 涂颜色：红＝主责（格内不写字，每行仅一个红），橙/黄＝协同（必须写协同任务），蓝＝知会（不写字）——力出一孔，才能协同。\nF1.1\n经营力 · 达成年度经营结果\nC 效率\n业态运营\n主责\n财务\n协同 · 经营分析\nC2.1\n营销力 · 新品全渠道上架\nB 改善\n营销\n主责\n产品\n协同 · 一季度上市\n采购\n知会\nI3.1\n产品力 · 大单品开发降本\nA 创新\n产品\n主责\n采购\n协同 · 大单品降本\n人力\n协同 · 关键岗位到岗\nL2.1\n组织力 · 关键人才到岗\nB 改善\n人力\n主责\n产品\n知会\n采购\n知会\n红 · 主责\n黄 · 协同\n蓝 · 知会\n前字母：A 创新 · B 改善 · C 效率\n示例数据，仅演示标注方法；点击上方步骤回看三步过程。"},{"id":"s12b06","type":"mod","heading":"越精炼，越能执行","text":"越精炼，越能执行\n战略越精炼，就越容易被彻底执行。\n凡几句话说不清楚的事，就永远说不清楚；好的战略一定符合常识。\n任何文字表达，写完要\n用嘴巴读一遍\n，不要只用眼睛看——文字逻辑和口舌逻辑是两套逻辑，口舌更容易传导、影响、被接受。\n金句同理：助理整理时\"锦上添花\"加了字，被要求一个字都不能加——\n多一个字、少一个字，就不成金句\n。为什么要共创、红蓝对抗？因为人要被触动、要感知，不能只靠听到。\n\"人不因知道而改变，人只因触动而改变。\""},{"id":"s12b07","type":"part","heading":"部门目标：从红黄解码","text":"Part 2\n部门目标：从红黄解码\n目标从哪来、表长什么样、怎么防自嗨"},{"id":"s12b08","type":"mod","heading":"红加黄，加自身关键职责","text":"红加黄，加自身关键职责\n\"部门目标从哪来？\"现场有人指几张表猜来源，都被否定——\n部门目标就是红加黄\n，再加自身。因为每个部门存在的唯一价值，是协同角色。来源只有三个：\n红\n——战略地图里本部门主责的事；\n黄\n——战略地图里本部门任重要协同角色的事；\n自身关键职责\n——自认为或公司要求最重要的事。\n假设部门目标共 5 条：\n红加黄占 3~4 条，自身占 1~2 条\n。\n通常\n红\n黄\n黄\n黄\n自\n底线\n红\n黄\n黄\n自\n自\n红＝主责条目\n黄＝协同条目\n自身关键职责\n以 5 条部门目标为例：上行为通常构成（红黄 4 条），下行为底线要求（红黄 3 条）。\n5 条之外的事照样要干，靠薪酬分账兜底：\n固定工资发的是基本职责——武功\n；\n绩效奖金发的是重点目标——战功\n。\n固定工资 8000 · 基本职责\n固定工资 8000 → 武功\n绩效奖金 2000 → 战功\n以月薪 1 万元（8000＋2000）为例，讲师举例。"},{"id":"s12b09","type":"mod","heading":"解码：归纳成部门目标","text":"解码：归纳成部门目标\n4~5 张战略地图\n本部门被各图以红、黄呼唤\n→\n汇总呼唤条目\n按编号溯源到原图\n→\n归纳整合\n与红黄并非一一对应\n→\n部门年度目标与任务\n目标 · 任务 · 衡量标准\n一个部门常被多张地图呼唤。比如产品部，要把\n4~5 张战略地图\n的红与黄整合起来，再写部门目标。\n床垫公司产品部的目标这样写：\"围绕用户价值布局，适配战略目标和全域渠道的产品体系，以数据和模块化研发为驱动力。\"讲师点评：\n有点长，但意思到位\n。其后的部门关键目标（这家公司叫\"关键硬仗\"）与红黄\n不是一一对应\n，要归纳——比如智能联动款和区域高端产品，可合并为一条\"中高端产品\"；有多张地图时整体归纳。\n这张表叫\n部门年度目标与任务\n，不是考核表——战略地图是年度的，它也是年度的，相当于部门的战略地图。目标、关键任务、衡量标准三列，与 OGSM 相通，分别约等于 O、S/KR、M；编号列溯源战略地图关键任务。\n编号的作用是溯源\n：找到这条事在战略地图上的来源。两份表各管一头——\n目标与任务表靠编号强制\"上下对齐战略\"，指标表靠同口径\"左右拉通协同\"\n。"},{"id":"s12b10","type":"mod","heading":"自嗨式与配称式目标","text":"自嗨式与配称式目标\n自嗨式 · 闭着眼睛写\n客服部\n：转化率、退货率、DSR 评分、客户投诉——战略怎么变都这几个\n采购岗\n：及时率、质量 SQE、降本、供应商开发评价与管理、采购流程优化\n产品部\n：IPD、产品矩阵、商品管理（价格动销库存）、开品经验沉淀\n财务\n：财务制度、经营分析、预算、数字化升级\n业态负责人：感受不到对我的帮助\n配称式 · 红与黄写明白\n客服部\n：逐业态写明——支持 A 业态售前、支持 B 业态客户服务\n采购\n：不做总体降本，做\n大单品\n降本\n人力资源\n：不是整体补人，是\n哪些关键岗位到岗\n产品部\n：某品一季度前上市上架\n业态负责人：能当场找到对我的支持\n检验句只有一句，拉着业态负责人问：\n\"这有没有帮助你实现业绩目标？哪里能帮助？\"\n感受不到，写得再对也是自嗨。\n手推车公司的客服部原先闭着眼睛写转化率、退货率，讲师放话：下次还这么写，战略会就不用来了。改成逐业态写明支持什么之后，业态负责人坐在台下，就能直接找到客服对自己的支持。\n洞察\n写目标的方向要反转：不是\"我该做什么\"，而是\"战略地图呼唤我做什么\"。"},{"id":"s12b11","type":"mod","heading":"连蓝都没有的部门","text":"连蓝都没有的部门\n如果几组战略地图都在互相呼唤，唯独某个部门\n连一个蓝都没有\n——连\"需要知道\"都排不上——说明它可能可以被整合了。审计部那种属特殊情况，仍要存在；政策法规部被呼唤很少，那位律师就逐个游说业态负责人\"你得呼唤我\"，主动把呼唤要回来——讲师认可：这种逻辑也 OK。\n所以战略地图做好之后，往往要\n调整组织架构\n，连\"洞察\"这类能力该由谁承载，也要等呼唤结果出来再定位。\n战略决定组织，不是组织决定战略。\n很多企业反过来：老板说几句，各部门就开始写作业，背后假定每个部门都该存在——结果人人找到存在感，目标加起来不是总目标，就会断裂。这正是按业态分组、在公司与部门之间设业务线的原因：\n几张战略地图，决定新的组织架构。"},{"id":"s12b12","type":"part","heading":"对齐与演练","text":"Part 3\n对齐与演练\n把协同摆上台面，再落到每张桌子"},{"id":"s12b13","type":"mod","heading":"部门目标对齐会","text":"部门目标对齐会\n再次发布战略地图\n各大业态负责人先发布\n部门逐条讲目标\n如供应链负责人讲 4 条：一二三四要干什么\n台下当场发问\n\"有没有支持你的 OEM？支持在哪里？\"\n写上的必须回答\n生产、财务、法务、信息部……逐个确认能否支持\n感受不到就现场讨论\n有技术条件问题的当场对齐\n这个会在阿里巴巴叫\"部门目标通晒会\"。\n规则很硬：\n只要写上的，必须当场回答能否支持\n；感受不到支持，写得再好也不行；有技术条件问题的，现场讨论。\n中台的价值就是协同做强\n——对齐会把协同摆上台面，让\"左右拉通\"不停在纸面。"},{"id":"s12b14","type":"mod","heading":"部门价值定位：三句话说清","text":"部门价值定位：三句话说清\n表里还有\"部门价值定位\"一栏。一般规律：\n战略大年要写，小年可不写\n；定位没有大变化也可以不写。放在今年，讲师建议都尝试写。\n要求很苛刻：\n用三句话概括这个部门到底是干什么的\n。\"30 句更说不清楚，三句话能说清楚。\""},{"id":"s12b15","type":"mod","heading":"部门演练：多图红黄写初稿","text":"部门演练：多图红黄写初稿\n忘掉五大组，\n以部门为单位\n，在共享文档的\"部门年度目标与任务\"表里写本部门初稿，约半小时；一个部门来了几个人，就商量着写一份——视觉部 4 位同事坐在一起写。\n视觉部要基于\n4 张战略地图\n的红与黄写目标；编号加业态前缀，同一格可能引来两三条：\n品牌\nI2.1\n产品力条目 · 取自品牌业态图\nOEM\nI2.2\n产品力条目 · 取自 OEM 业态图\n前缀＝业态，字母＝FCIL 之力，数字＝图内序号。\n红黄规则：\n每行一个红、多个黄\n（确需多个部门主责的除外），小组内部再把标注核一遍。\n对照就是\n强制互锁、倒逼\n：一个部门可以定 20 个目标，但与战略高度一致的往往只有 5 个——\n把这 5 个找出来\n。\n心态上，战略地图现在还是\n\"毛坯房\"\n，没到精装修——先初步演练，不追求绝对精确，主要追求把逻辑学会。"}]},{"num":13,"id":"s13","title":"战役七步法与绩效承接","date":"据实拍讲义补录","css":"*{box-sizing:border-box;margin:0;padding:0}\n#sv{\n  --page-bg:#f6f7fb;\n  --card:#ffffff;\n  --card-2:#f0f2f8;\n  --text:#1c2130;\n  --muted:#4a5165;\n  --faint:#6e7488;\n  --border:#e2e5f0;\n  --accent:#2f4bd8;\n  --accent-deep:#24399f;\n  --accent-soft:#e9edfb;\n  --accent-line:#c8d1f2;\n  --on-accent:#ffffff;\n  --red-tx:#b3261e; --red-dot:#d0483f; --red-bg:#fdecea; --red-line:#f0bab2;\n  --yel-tx:#7c5a10; --yel-dot:#dfa613; --yel-bg:#fdf4dc; --yel-line:#e9d496;\n  --blu-tx:#1d56b0; --blu-dot:#4a86d8; --blu-bg:#e9f1fd; --blu-line:#bcd0f0;\n  --lv1-bg:#e9edfb; --lv1-tx:#3c4a92; --lv2-bg:#c7d1f5; --lv2-tx:#2c3a86;\n  --lv3-bg:#7385e6; --lv3-tx:#ffffff; --lv4-bg:#2f4bd8; --lv4-tx:#ffffff;\n  --radius:14px;\n  --font:\"PingFang SC\",\"Microsoft YaHei\",\"Noto Sans SC\",\"Helvetica Neue\",Arial,sans-serif;\n  color-scheme:light dark;\n}\n@media (prefers-color-scheme: dark){\n#sv{\n    --page-bg:#14161f; --card:#1c1f2c; --card-2:#242837;\n    --text:#e8eaf2; --muted:#b6bccd; --faint:#99a0b3; --border:#2d3143;\n    --accent:#8ea2ff; --accent-deep:#b9c6ff; --accent-soft:#252c4e; --accent-line:#3a4577; --on-accent:#12152a;\n    --red-tx:#ff9d92; --red-dot:#e0685c; --red-bg:#3a2325; --red-line:#6b3a3c;\n    --yel-tx:#e5bd62; --yel-dot:#d3a03a; --yel-bg:#372d16; --yel-line:#5f5130;\n    --blu-tx:#a3c0f7; --blu-dot:#6f9bea; --blu-bg:#1f2a45; --blu-line:#3a5280;\n    --lv1-bg:#252c4e; --lv1-tx:#b9c6ff; --lv2-bg:#31396b; --lv2-tx:#ccd6ff;\n    --lv3-bg:#5b6cc9; --lv3-tx:#ffffff; --lv4-bg:#8ea2ff; --lv4-tx:#12152a;\n  }\n}\n#sv,#sv{background-color:var(--page-bg)}\n#sv{font-family:var(--font);color:var(--text);line-height:1.78;font-size:15.5px;-webkit-font-smoothing:antialiased}\n.wrap{max-width:820px;margin:0 auto;padding:0 18px}\n.hero{padding:46px 0 10px}\n.kicker{display:flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.14em;font-weight:600;color:var(--accent-deep)}\n.dots{display:inline-flex;gap:4px}\n.dots i{width:10px;height:10px;border-radius:3px;display:block}\n.d-r{background:var(--red-dot)}\n.d-y{background:var(--yel-dot)}\n.d-b{background:var(--blu-dot)}\nh1{font-size:clamp(25px,5.4vw,32px);line-height:1.32;margin-top:10px;letter-spacing:.01em}\n.lede{margin-top:10px;color:var(--muted);font-size:15px}\n.part{display:flex;gap:12px;align-items:flex-start;margin:42px 0 14px}\n.part-no{flex:none;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--accent-deep);background:var(--accent-soft);border:1px solid var(--accent-line);padding:4px 10px;border-radius:999px;margin-top:4px}\n.part h2{font-size:19px;line-height:1.4}\n.part-sub{font-size:13px;color:var(--muted);margin-top:3px}\n.mod{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px clamp(16px,3.4vw,24px) 18px;margin-bottom:16px}\n.mod>h3{font-size:17px;margin-bottom:10px;position:relative;padding-left:14px}\n.mod>h3::before{content:\"\";position:absolute;left:0;top:7px;width:5px;height:15px;border-radius:3px;background:var(--accent)}\n.mod p{margin:0 0 10px}\n.mod>:last-child{margin-bottom:0}\nstrong{font-weight:650;color:var(--accent-deep)}\nb{font-weight:650}\nul.kv{list-style:none;display:grid;gap:8px;margin:2px 0 12px}\nul.kv li{position:relative;padding-left:17px;font-size:14.6px;color:var(--muted)}\nul.kv li::before{content:\"\";position:absolute;left:2px;top:10px;width:7px;height:7px;border-radius:2px;background:var(--accent)}\n.quote{margin-top:12px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:14.3px;color:var(--text)}\n.insight{margin-top:12px;display:flex;gap:10px;align-items:baseline;background:var(--card-2);border:1px dashed var(--border);border-radius:10px;padding:10px 14px;font-size:13.6px;color:var(--muted)}\n.insight .tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent-deep)}\nfigure.fig{margin:14px 0;background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:16px}\nfigcaption{font-size:12.5px;color:var(--faint);line-height:1.6;margin-top:10px}\n.fgrid{display:grid;grid-template-columns:1fr;gap:6px}\n.fgrid .garr{justify-self:c n.dbtn[aria-pressed=\"true\"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}\n.demo-hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}\n.drow{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px}\n.drow-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}\n.drow-head>b{font-size:14px}\n.dcode{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);padding:2px 8px;border-radius:6px}\n.dabc{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--card-2);border:1px solid var(--border);color:var(--muted)}\n.ann-abc,.ann-num{display:none}\n.demo.s1 .ann-abc{display:inline-block}\n.demo.s2 .ann-num{display:inline-block}\n.drow-chips{display:flex;flex-wrap:wrap;gap:6px}\n.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.5;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .18s}\n.chip .dot{display:none;width:8px;height:8px;border-radius:50%}\n.chip .role{display:none;font-style:normal;font-size:11.5px;opacity:.85}\n.demo.s3 .chip .dot{display:inline-block}\n.demo.s3 .chip .role{display:inline}\n.demo.s3 .chip-red{background:var(--red-bg);border-color:var(--red-line);color:var(--red-tx)}\n.demo.s3 .chip-red .dot{background:var(--red-dot)}\n.demo.s3 .chip-yel{background:var(--yel-bg);border-color:var(--yel-line);color:var(--yel-tx)}\n.demo.s3 .chip-yel .dot{background:var(--yel-dot)}\n.demo.s3 .chip-blu{background:var(--blu-bg);border-color:var(--blu-line);color:var(--blu-tx)}\n.demo.s3 .chip-blu .dot{background:var(--blu-dot)}\n.demo-legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}\n.demo-legend .chip{cursor:default}\n.demo-legend .chip .dot{display:inline-block}\n.demo-legend .lg-r{background:var(--red-bg);border-color:var(--red-line);color:var(--red-tx)}\n.demo-legend .lg-r .dot{background:var(--red-dot)}\n.demo-legend .lg-y{background:var(--yel-bg);border-color:var(--yel-line);color:var(--yel-tx)}\n.demo-legend .lg-y .dot{background:var(--yel-dot)}\n.demo-legend .lg-b{background:var(--blu-bg);border-color:var(--blu-line);color:var(--blu-tx)}\n.demo-legend .lg-b .dot{background:var(--blu-dot)}\n.abc-key{font-size:12px;color:var(--muted)}\n.mix-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}\n.mix-l{flex:none;width:36px;font-size:12px;color:var(--faint);text-align:right}\n.mix-bar{flex:1;display:flex;gap:3px;height:30px}\n.seg{border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}\n.seg-r{background:var(--red-dot);color:#fff}\n.seg-y{background:var(--yel-dot);color:#4b3a08}\n.seg-self{border:1.5px dashed var(--faint);color:var(--muted)}\n.mix-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}\n.lg{display:inline-flex;align-items:center;gap:5px}\n.lg i{width:9px;height:9px;border-radius:3px;display:inline-block}\n.pay-bar{display:flex;gap:3px;height:32px;margin-bottom:10px}\n.pay-fix{flex:8;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:650;color:var(--accent-deep);padding:0 8px;white-space:nowrap;overflow:hidden}\n.pay-var{flex:2;background:var(--yel-dot);border-radius:8px}\n.vs{display:grid;gap:12px}\n@media(min-width:640px){\n.vs{grid-template-columns:1fr 1fr}\n}\n.vs-col{border-radius:12px;padding:14px;border:1px solid var(--border);background:var(--card)}\n.vs-good{background:var(--accent-soft);border-color:var(--accent-line)}\n.vs-head{font-size:13.5px;font-weight:700;margin-bottom:10px;color:var(--muted)}\n.vs-good .vs-head{color:var(--accent-deep)}\n.vs ul{list-style:none;display:grid;gap:9px;font-size:13.6px;color:var(--muted)}\n.vs li{position:relative;padding-left:13px}\n.vs li::before{content:\"\";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:2px;background:var(--faint)}\n.vs-good li::before{background:var(--accent)}\n.vs b{color:var(--text)}\n.vs-foot{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--faint)}\n.vs-good .vs-foot{color:var(--accent-deep);border-top-color:var(--accent-line)}\nol.meet{list-style:none;counter-reset:m;margin:4px 0 2px}\n.meet li{counter-increment:m;position:relative;padding:0 0 16px 40px}\n.meet li:last-child{padding-bottom:2px}\n.meet li::before{content:counter(m);position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-deep);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}\n.meet li::after{content:\"\";position:absolute;left:12.5px;top:30px;bottom:0;width:2px;background:var(--border)}\n.meet li:last-child::after{display:none}\n.meet b{display:block;font-size:14.3px}\n.meet span{display:block;font-size:13px;color:var(--muted)}\n.cnum{display:grid;gap:10px}\n@media(min-width:560px){\n.cnum{grid-template-columns:1fr 1fr}\n}\n.cn-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}\n.cn-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.cn-pre{font-size:13.5px;font-weight:700}\n.cn-code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);padding:2px 9px;border-radius:6px}\n.cn-note{font-size:12px;color:var(--faint)}\n/* Component-name-agnostic mobile safety net.\n   Structural guarantees are expressed against CSS Grid/Flex behaviour and\n   generic attribute hooks rather than a fixed class vocabulary,so generating\n   models may invent component names freely for any recording type. */\n*,*::before,*::after{ box-sizing: border-box; }\n#sv{ width: 100%; min-width: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n#sv{ width: 100%; min-width: 0; margin: 0; overflow-wrap: break-word; }\nmain,header,footer,nav,section,article,aside,figure,div,ul,ol,li,dl,dd,details{ min-width: 0; }\nimg,picture,video,canvas,svg{ display: block; max-width: 100%; height: auto; }\npre,code,kbd,samp{ max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }\nh1,h2,h3,h4,h5,h6,p,li,td,th,dt,dd,blockquote,figcaption{ overflow-wrap: anywhere; }\ninput,textarea,select,button{ max-width: 100%; font: inherit; }\n/* Any table gets a scroll container by intent or by generic hook. */\n.table-scroll,.table-wrap,.matrix-wrap,[data-table-scroll],[data-scroll-x]{\n  max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;\n}\n.table-scroll > table,.table-wrap > table,.matrix-wrap > table,[data-table-scroll] > table,[data-scroll-x] > table{ margin: 0; }\n/* Numbered step rows: keep #sv copy out of the counter track. */\n.step-item,[data-step-item]{ grid-template-columns: 32px minmax(0, 1fr) !important; }\n.step-item::before,[data-step-item]::before{ grid-column: 1 !important; grid-row: 1 !important; }\n.step-item > :empty,[data-step-item] > :empty{ display: none !important; }\n.step-item > *,[data-step-item] > *{ grid-column: 2 !important; min-width: 0 !important; }\n.data-value,.metric-value,[data-value]{ max-width: 100%; font-variant-numeric: tabular-nums; }\n/* A single surviving child of ANY grid spans the full row. Applied to every\n   element that declares a grid,so unknown component names are covered too. */\n[class*=\"grid\"] > :only-child,[class*=\"board\"] > :only-child,[class*=\"cluster\"] > :only-child,[class*=\"row\"] > :only-child,[class*=\"split\"] > :only-child,[class*=\"cols\"] > :only-child,[class*=\"columns\"] > :only-child,[class*=\"layout\"] > :only-child,[class*=\"panel\" crollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}","body":"<div class=\"wrap\"><header class=\"hero\"><div class=\"kick\">战略共创会 · 附录（据实拍讲义补录）</div><h1>战役七步法与绩效承接</h1><p class=\"sub\">补齐工作坊未展开的战役组织与绩效承接模块：七步法、战役负责人特质、战役小组/爆品工作室/特别行动队、授权控权、部门目标设计与OGSM对照。</p></header><section id=\"p1\"><div class=\"part-head\"><span class=\"pt\">PART 1 · 关键战役打赢「七步法」</span><i></i></div><div class=\"mod\" id=\"s13b01\"><h3>七步法：从选仗到管控</h3><p>关键战役打赢「七步法」（公司与业务战略侧）：</p><p>P1 选定战役：从战略到战役</p><p>P2 谋定后动：解码任务、路径</p><p>P3 排兵布阵：打造战役组织</p><p>P4 点兵点将：用对人、做对事</p><p>P5 兵马粮草：精准配称资源</p><p>P6 论功行赏：评价激励机制</p><p>P7 战时管控：动态跟踪机制</p><p>洞察</p><p>跃迁式增长取决于一场场关键战役能不能打赢。七步法把「选仗—解码—组织—用人—资源—激励—管控」串成闭环；P6 评价激励与 P7 战时管控正是绩效承接的落点。</p><p>注意</p><p>第08场「P1 我想／P2 他需／P3 我能」是三环解码框架的三步，与本七步法的 P1–P7 编号无关，两套编号勿混用。</p></div></section><section id=\"p2\"><div class=\"part-head\"><span class=\"pt\">PART 2 · 战役负责人的五大「硬核」特质</span><i></i></div><div class=\"mod\" id=\"s13b02\"><h3>选战役负责人：五条硬标准</h3><p>1. 懂生意，嗅觉灵敏：一眼能看到是机会是坑，知道仗值不值得打，能不能赚到钱。</p><p>2. 能带人，能打胜仗：能把一群人拧成一股绳，激发大家的斗志，关键时刻能带队冲上去。</p><p>3. 能落地，盯死结果：目标感强，能把大目标拆成任务和路径，想尽办法把事办成、拿到结果。</p><p>4. 会协调，整合资源：情商高，能搞定内部的扯皮和外部的合作，把需要的人、钱、资源都协调到位。</p><p>5. 能扛事，意志力强：心态要硬，压力再大、困难再多也不怂，能快速调整，带领团队从失败中爬起来继续干。</p></div></section><section id=\"p3\"><div class=\"part-head\"><span class=\"pt\">PART 3 · 战役组织三种形态</span><i></i></div><div class=\"mod\" id=\"s13b03\"><h3>战役小组／爆品工作室／特别行动队</h3><p>2.0阶段：建立战役小组组织——战役发起人（定方向、给资源、做裁决）＋战役总指挥（定打法、抓协调、拿结果）；市场推广、产品开发、研发技术、销售运营、供应链管理五条线各设主管；协同部门：人力资源部（协同招聘、人才与激励）、财务部门（资金资源与核算）；支持方负责工作评估、计划安排、资源协调、人员调配，专家顾问支持战役定义与分解、机制建立、关键人员教练辅导。</p><p>分布式：爆品工作室（Studio）内部作战模型——品类主理人（SPU）对品类 GMV 负责；运作核心是全链路闭环小团队；五大核心角色与职责；管理逻辑＝结果导向与激励。</p><p>并联做乘法：打造内容驱动的敏捷小组。</p><p>也可以直接成立独立「特别行动队」。</p></div></section><section id=\"p4\"><div class=\"part-head\"><span class=\"pt\">PART 4 · 授权与控权</span><i></i></div><div class=\"mod\" id=\"s13b04\"><h3>授权≠放权：三项核心权力</h3><p>简化授权与控权，梳理边界，提高效率。</p><p>有效控、放三项核心权力，消除决策卡点：</p><p>预算审批（按额度）</p><p>资源优先调用（硬件、供应链、设计等）</p><p>问题快速拍板（按决策事项层级）</p><p>授权≠放权。</p></div></section><section id=\"p5\"><div class=\"part-head\"><span class=\"pt\">PART 5 · 绩效承接：从战略&amp;业务需求到部门目标</span><i></i></div><div class=\"mod\" id=\"s13b05\"><h3>部门目标设计与 OGSM/OKR 对照</h3><p>完成战役战略的部门目标设计（讲义以供应链管理部为例）：部门定位＝支撑公司「产品力×成本效率×交付体验」核心竞争力，通过供应链数字化、精益化，保障产品从研发到交付的全链路高效、优质、低成本运转。</p><p>部门目标表六列：部门价值定位／部门目标（要打什么仗？）／关键成功因素·关键任务（怎么打？方法、路径、资源等）／衡量标准（怎样才算打赢？）／对应战略地图中关键任务编号／需要得到的协同或支持＋对应部门。</p><p>与 OKRs、OGSM 的对照：O＝部门目标；KR（S）＝关键成功因素/关键任务；M＝衡量标准；编号列溯源战略地图关键任务。</p><p>部门目标按专业视角／战略视角／配称视角三层拉通（产品、采购、财务、人力资源等部门示例）。</p><p>洞察</p><p>绩效承接是落地缺口：指标表同口径左右拉通＋战役小组授权＋评价激励，战略才真正落到绩效。</p></div></section></div>","blocks":[{"id":"s13b01","type":"mod","heading":"七步法：从选仗到管控","text":"七步法：从选仗到管控\n关键战役打赢「七步法」（公司与业务战略侧）：\nP1 选定战役：从战略到战役\nP2 谋定后动：解码任务、路径\nP3 排兵布阵：打造战役组织\nP4 点兵点将：用对人、做对事\nP5 兵马粮草：精准配称资源\nP6 论功行赏：评价激励机制\nP7 战时管控：动态跟踪机制\n洞察\n跃迁式增长取决于一场场关键战役能不能打赢。七步法把「选仗—解码—组织—用人—资源—激励—管控」串成闭环；P6 评价激励与 P7 战时管控正是绩效承接的落点。\n注意\n第08场「P1 我想／P2 他需／P3 我能」是三环解码框架的三步，与本七步法的 P1–P7 编号无关，两套编号勿混用。\n"},{"id":"s13b02","type":"mod","heading":"选战役负责人：五条硬标准","text":"选战役负责人：五条硬标准\n1. 懂生意，嗅觉灵敏：一眼能看到是机会是坑，知道仗值不值得打，能不能赚到钱。\n2. 能带人，能打胜仗：能把一群人拧成一股绳，激发大家的斗志，关键时刻能带队冲上去。\n3. 能落地，盯死结果：目标感强，能把大目标拆成任务和路径，想尽办法把事办成、拿到结果。\n4. 会协调，整合资源：情商高，能搞定内部的扯皮和外部的合作，把需要的人、钱、资源都协调到位。\n5. 能扛事，意志力强：心态要硬，压力再大、困难再多也不怂，能快速调整，带领团队从失败中爬起来继续干。\n"},{"id":"s13b03","type":"mod","heading":"战役小组／爆品工作室／特别行动队","text":"战役小组／爆品工作室／特别行动队\n2.0阶段：建立战役小组组织——战役发起人（定方向、给资源、做裁决）＋战役总指挥（定打法、抓协调、拿结果）；市场推广、产品开发、研发技术、销售运营、供应链管理五条线各设主管；协同部门：人力资源部（协同招聘、人才与激励）、财务部门（资金资源与核算）；支持方负责工作评估、计划安排、资源协调、人员调配，专家顾问支持战役定义与分解、机制建立、关键人员教练辅导。\n分布式：爆品工作室（Studio）内部作战模型——品类主理人（SPU）对品类 GMV 负责；运作核心是全链路闭环小团队；五大核心角色与职责；管理逻辑＝结果导向与激励。\n并联做乘法：打造内容驱动的敏捷小组。\n也可以直接成立独立「特别行动队」。\n"},{"id":"s13b04","type":"mod","heading":"授权≠放权：三项核心权力","text":"授权≠放权：三项核心权力\n简化授权与控权，梳理边界，提高效率。\n有效控、放三项核心权力，消除决策卡点：\n预算审批（按额度）\n资源优先调用（硬件、供应链、设计等）\n问题快速拍板（按决策事项层级）\n授权≠放权。\n"},{"id":"s13b05","type":"mod","heading":"部门目标设计与 OGSM/OKR 对照","text":"部门目标设计与 OGSM/OKR 对照\n完成战役战略的部门目标设计（讲义以供应链管理部为例）：部门定位＝支撑公司「产品力×成本效率×交付体验」核心竞争力，通过供应链数字化、精益化，保障产品从研发到交付的全链路高效、优质、低成本运转。\n部门目标表六列：部门价值定位／部门目标（要打什么仗？）／关键成功因素·关键任务（怎么打？方法、路径、资源等）／衡量标准（怎样才算打赢？）／对应战略地图中关键任务编号／需要得到的协同或支持＋对应部门。\n与 OKRs、OGSM 的对照：O＝部门目标；KR（S）＝关键成功因素/关键任务；M＝衡量标准；编号列溯源战略地图关键任务。\n部门目标按专业视角／战略视角／配称视角三层拉通（产品、采购、财务、人力资源等部门示例）。\n洞察\n绩效承接是落地缺口：指标表同口径左右拉通＋战役小组授权＋评价激励，战略才真正落到绩效。\n"}]}],"points":[{"name":"战略是艺术，管理是科学","category":"战略基本盘","session":1,"block":"s01b02","aliases":["战略本质","战略管理","选择与取舍","由外而内","艺术和科学"],"note":"战略由外而内做选择取舍；战略管理是有科学方法、可照着练的过程。","core":false,"tool":false},{"name":"明确表达 × 深度共识","category":"战略基本盘","session":1,"block":"s01b03","aliases":["第一原则","深度共识","60分战略","不在多而在精","字越少事越大"],"note":"60分战略＋深度共识≈80–90分；信息价值与数量成反比。","core":true,"tool":false},{"name":"人群靶心图","category":"定位与聚焦","session":1,"block":"s01b04","aliases":["靶心图","原点人群","圈层","向往人群","核心客群","灯塔客户"],"note":"从原点人群向外划圈，选一环重点击穿；不打球的叫向往人群。","core":true,"tool":true},{"name":"海洋至尊","category":"案例与标杆","session":1,"block":"s01b04","aliases":["男士护肤","郑州品牌","篮球圈层","20亿翻倍","靶心图案例"],"note":"先画人群靶心图再击穿篮球圈层，线下赛事＋线上游戏广告，10亿翻倍到20亿。","core":false,"tool":false},{"name":"表达的三层境界","category":"组织与共识","session":1,"block":"s01b05","aliases":["概念性表达","计划性表达","结论性表达","正确的废话","L3","写明对象"],"note":"概念性、计划性表达都是正确的废话；结论性表达写明对象才能执行。","core":true,"tool":false},{"name":"三促共识：共创、结构、机制","category":"组织与共识","session":1,"block":"s01b06","aliases":["以共创促共识","以结构促共识","以机制促共识","参与认同","利益绑定","表格统一"],"note":"共创解决参与，结构解决思考顺序，机制解决利益绑定。","core":false,"tool":true},{"name":"战略 ABC：在哪、去哪、怎么去","category":"战略基本盘","session":1,"block":"s01b08","aliases":["ABC框架","在哪","去哪","怎么去","最优解","知己排前头"],"note":"A在哪、B去哪、C怎么去；哪个最重要取决于企业自身状态。","core":false,"tool":true},{"name":"自我盘点：五组驱动力与短板","category":"组织与共识","session":1,"block":"s01b09","aliases":["自我盘点","驱动力","待提升","OEM品牌化","品牌A定位"],"note":"各组盘点驱动力与短板；品牌A要从追寻别人转向让别人追寻。","core":false,"tool":false},{"name":"向外求增长，向内求增效","category":"金句与心法","session":1,"block":"s01b10","aliases":["研发力强协同弱","向内求","向外求","利出一孔","主动清单","组织协同"],"note":"最强驱动力是研发与产品力，最需提升组织协同；协同本质是一致性、利出一孔。","core":false,"tool":false},{"name":"规划式与涌现式","category":"战略基本盘","session":1,"block":"s01b11","aliases":["自上而下","自下而上","明茨伯格","先胜而后求战","边打边调","涌现式战略"],"note":"好战略既是规划的又是涌现的；涌现的机会也要有机制接得住。","core":true,"tool":false},{"name":"袋鼠妈妈青少年线","category":"案例与标杆","session":1,"block":"s01b11","aliases":["袋鼠妈妈","青少年护肤","三次上桌面","月度洞察机制","小步尝试"],"note":"两次被战略视角否掉，半年会第三次小步尝试，连续三个月打爆后延伸。","core":false,"tool":false},{"name":"增长拐点＝（战役×战术）","category":"战略基本盘","session":1,"block":"s01b12","aliases":["杜国楹","小罐茶","关键战役","三大战役","跃迁式增长"],"note":"跃迁式增长取决于一场场关键战役能不能打赢；打赢才配谈战略。","core":false,"tool":false},{"name":"方向大致正确","category":"金句与心法","session":1,"block":"s01b12","aliases":["从模糊到大致正确","华为标准","工农红军阶段","中心聚焦","分布式生长"],"note":"30亿以内要平衡自上而下聚焦与自下而上生长；方向大致正确已是最好结果。","core":false,"tool":false},{"name":"三看洞察","category":"洞察与市场","session":1,"block":"s01b14","aliases":["三看","看行业看客户看竞争","战略洞察","市场洞察","洞察深度决定战略高度"],"note":"看行业选赛道、看客户定产品与销售、看竞争定渠道打法；三线各推再汇总。","core":true,"tool":true},{"name":"看行 <script>
'use strict';
const DATA = JSON.parse(document.getElementById('kb-data').textContent);
const S = DATA.sessions, KP = DATA.points, SM = DATA.sessionMeta, LINKS = DATA.links;
const view = document.getElementById('kb-view');
const sv = document.getElementById('sv');
const sessionCss = document.createElement('style'); sessionCss.id = 'session-css';
document.head.appendChild(sessionCss);
const qInput = document.getElementById('kb-q');

const IDX = [];
S.forEach(s => s.blocks.forEach(b => {
  if (b.type === 'mod' || (b.text && b.text.length > 80))
    IDX.push({s: s.num, b: b.id, h: b.heading || '', t: b.text || ''});
}));
const SMAP = {}; S.forEach(s => SMAP[s.num] = s);
const BMAP = {}; S.forEach(s => s.blocks.forEach(b => BMAP[b.id] = {s: s.num, b}));

function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hl(text, tokens){
  let out = esc(text);
  tokens.forEach(t => {
    if (!t) return;
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out;
}
function snippet(text, tokens, w){
  const low = text.toLowerCase();
  let pos = -1;
  for (const t of tokens){ const i = low.indexOf(t); if (i >= 0 && (pos < 0 || i < pos)) pos = i; }
  if (pos < 0) pos = 0;
  const start = Math.max(0, pos - 40);
  return (start > 0 ? '…' : '') + text.slice(start, start + (w || 150)) + (start + (w || 150) < text.length ? '…' : '');
}
function saveRead(s, b){ try{ localStorage.setItem('kb-last', JSON.stringify({s, b})); }catch(e){} }
function getLast(){ try{ return JSON.parse(localStorage.getItem('kb-last')); }catch(e){ return null; } }

/* ---------- views ---------- */
function setNav(which){
  document.getElementById('nav-home').classList.toggle('on', which === 'home');
  document.getElementById('nav-points').classList.toggle('on', which === 'points');
}
function showView(html){
  sv.style.display = 'none'; sv.innerHTML = ''; sessionCss.textContent = '';
  document.getElementById('kb-sessionbar').style.display = 'none';
  document.getElementById('kb-top').style.display = 'block';

}
function slabel(n){ return n === 13 ? '附录A' : '第' + n + '场'; }
function renderHome(){
  setNav('home');
  const nBlocks = S.reduce((a, s) => a + s.blocks.filter(b => b.type === 'mod').length, 0);
  let h = '<div class="kb-hero"><p class="kb-kicker">战略共创会 · 培训资料包</p>' +
    '<p class="kb-title">公司A × 品牌A<br>战略共创会知识库</p>' +
    '<p class="kb-sub">2026年11月9日–11日 · 顾问领讲 · 全场研讨与现场输出整理</p>' +
    '<div class="kb-stats"><span class="kb-stat"><b>12</b>场纪要＋附录A</span><span class="kb-stat"><b>3</b>天</span>' +
    '<span class="kb-stat"><b>' + nBlocks + '</b>张知识卡片</span><span class="kb-stat"><b>' + KP.length + '</b>个知识点</span></div>' +
    '<div class="kb-continue" id="kb-continue"></div></div>';
  const days = [['11月9日 · 第一天：定调与盘点', [1,2,3,4]], ['11月10日 · 第二天：洞察与打法', [5,6,7,8,9]], ['11月11日 · 第三天：地图与解码', [10,11,12]], ['附录 · 据实拍讲义补录', [13]]];
  days.forEach(([label, nums]) => {
    h += '<div class="kb-day">' + label + '</div>';
    nums.forEach(n => {
      const s = SMAP[n], m = SM[n] || {};
      h += '<div class="kb-card" onclick="location.hash=\'#/s/' + String(n).padStart(2,'0') + '\'">' +
        '<div class="kb-cardhead"><span class="kb-no">' + slabel(n) + '</span><span class="kb-cardtitle">' + esc(s.title) + '</span></div>' +
        '<p class="kb-cardsum">' + esc(m.summary || '') + '</p><div class="kb-chips">' +
        (m.highlights || []).slice(0, 4).map(x => '<span class="kb-chip">' + esc(x) + '</span>').join('') +
        '</div></div>';
    });
  });
  h += '<div class="kb-help"><b>使用说明</b>' +
    '<p>· <b>搜索</b>：顶部搜索框支持全文与知识点检索，多个词用空格分隔（同时满足）；点击结果直达对应卡片。</p>' +
    '<p>· <b>知识点</b>：按分类浏览全部知识点，「核心」为每场重点，「工具」为可直接复用的方法模板。</p>' +
    '<p>· <b>离线</b>：本文件无需联网，手机/电脑浏览器直接打开；脱敏更新版已移除录音回听入口。</p>' +
    '<p>· 配套文件：PDF 合集（保留图表排版）、Word 合集（可编辑批注）。</p>' +
    '</div>';
  showView(h);
  const last = getLast();
  if (last && SMAP[last.s]){
    const el = document.getElementById('kb-continue');
    el.style.display = 'block';
    el.innerHTML = '继续阅读：' + slabel(last.s) + ' · ' + esc(SMAP[last.s].title) + ' →';
    el.onclick = () => { location.hash = '#/s/' + String(last.s).padStart(2,'0') + (last.b ? '/' + last.b : ''); };
  }
}
let ptFilter = '全部';
function renderPoints(){
  setNav('points');
  const cats = ['全部','核心','工具', ...Array.from(new Set(KP.map(p => p.category)))];
  let list = KP;
  if (ptFilter === '核心') list = KP.filter(p => p.core);
  else if (ptFilter === '工具') list = KP.filter(p => p.tool);
  else if (ptFilter !== '全部') list = KP.filter(p => p.category === ptFilter);
  let h = '<p class="kb-section-h">知识点索引</p><div class="kb-filters">' +
    cats.map(c => '<span class="kb-fbtn' + (c === ptFilter ? ' on' : '') + '" onclick="setFilter(\'' + c + '\')">' + c + '</span>').join('') +
    '</div><p class="kb-count">共 ' + list.length + ' 个知识点 · 点击直达原文卡片</p>';
  list.forEach(p => {
    h += '<div class="kb-pt" onclick="gotoBlock(\'' + p.block + '\')">' +
      '<div class="kb-ptname">' + esc(p.name) +
      (p.core ? '<span class="kb-badge core">核心</span>' : '') +
      (p.tool ? '<span class="kb-badge tool">工具</span>' : '') + '</div>' +
      '<p class="kb-ptnote">' + esc(p.note || '') + '</p>' +
      '<div class="kb-ptmeta"><span class="kb-chip dim">' + slabel(p.session) + '</span> <span class="kb-chip dim">' + esc(p.category) + '</span></div></div>';
  });
  if (!list.length) h += '<div class="kb-empty">该分类下暂无知识点</div>';
  showView(h);
}
function setFilter(c){ ptFilter = c; renderPoints(); }
function renderSearch(q){
  setNav('');
  const tokens = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!tokens.length){ renderHome(); return; }
  const kpHits = KP.filter(p => tokens.every(t => (p.name + ' ' + (p.aliases || []).join(' ') + ' ' + (p.note || '')).toLowerCase().includes(t)));
  const textHits = IDX.filter(e => tokens.every(t => (e.h + ' ' + e.t).toLowerCase().includes(t)));
  let h = '<p class="kb-sr-head">「' + esc(q) + '」：知识点命中 ' + kpHits.length + ' 个 · 全文命中 ' + textHits.length + ' 处</p>';
  if (kpHits.length){
    h += '<p class="kb-section-h" style="margin-top:8px">知识点直达</p>';
    kpHits.slice(0, 30).forEach(p => {
      h += '<div class="kb-sr" onclick="gotoBlock(\'' + p.block + '\')">' +
        '<div class="kb-sr-title">' + hl(p.name, tokens) +
        (p.core ? ' <span class="kb-badge core">核心</span>' : '') + (p.tool ? ' <span class="kb-badge tool">工具</span>' : '') + '</div>' +
        '<div class="kb-sr-snippet">' + hl(p.note || '', tokens) + '</div>' +
        '<div class="kb-sr-meta">' + slabel(p.session) + ' · ' + esc(p.category) + '</div></div>';
    });
  }
  if (textHits.length){
    h += '<p class="kb-section-h">全文匹配</p>';
    textHits.slice(0, 80).forEach(e => {
      const s = SMAP[e.s];
      h += '<div class="kb-sr" onclick="gotoBlock(\'' + e.b + '\')">' +
        '<div class="kb-sr-title">' + hl(e.h || '(正文)', tokens) + '</div>' +
        '<div class="kb-sr-snippet">' + hl(snippet(e.t, tokens), tokens) + '</div>' +
        '<div class="kb-sr-meta">' + slabel(e.s) + ' · ' + esc(s.title) + '</div></div>';
    });
    if (textHits.length > 80) h += '<p class="kb-count">仅显示前 80 条，可加词缩小范围</p>';
  }
  if (!kpHits.length && !textHits.length) h += '<div class="kb-empty">没有找到匹配内容，换个关键词试试</div>';
  showView(h);
}
/* ---------- session ---------- */
let curSession = null;
function renderSession(num, blockId){
  const s = SMAP[num]; if (!s){ renderHome(); return; }
  curSession = num;
  setNav('');
  view.style.display = 'none'; view.innerHTML = '';
  document.getElementById('kb-top').style.display = 'none';
  const bar = document.getElementById('kb-sessionbar');
  bar.style.display = 'block';
  document.getElementById('kb-sbtitle').textContent = slabel(num) + ' · ' + s.date + ' · ' + s.title;
  var _lk = LINKS[num - 1], _le = document.getElementById('kb-sblink'); if (_lk) { _le.href = _lk; } else { _le.style.display = 'none'; }
  sessionCss.textContent = s.css;
  sv.style.display = 'block';
  sv.innerHTML = s.body;
  sv.querySelectorAll('script').forEach(old => {
    const n = document.createElement('script');
    n.textContent = old.textContent;
    old.replaceWith(n);
  });
  buildDrawer(s);
  saveRead(num, blockId || null);
  if (blockId){
    const el = document.getElementById(blockId);
    if (el){
      requestAnimationFrame(() => {
        el.scrollIntoView({block: 'start'});
        window.scrollBy(0, -70);
        el.classList.add('kb-flash');
        setTimeout(() => el.classList.remove('kb-flash'), 2200);
      });
    }
  } else window.scrollTo(0, 0);
}
function buildDrawer(s){
  let h = '';
  s.blocks.forEach(b => {
    if (b.type === 'part') h += '<div class="kb-dpart">' + esc(b.heading || 'PART') + '</div>';
    else h += '<div class="kb-ditem sub" onclick="jumpInSession(\'' + b.id + '\')">' + esc(b.heading || b.text.slice(0, 18)) + '</div>';
  });
  document.getElementById('kb-dlist').innerHTML = h;
}
function jumpInSession(bid){
  closeDrawer();
  const el = document.getElementById(bid);
  if (el){
    el.scrollIntoView({block: 'start'}); window.scrollBy(0, -70);
    el.classList.add('kb-flash');
    setTimeout(() => el.classList.remove('kb-flash'), 2200);
    saveRead(curSession, bid);
    history.replaceState(null, '', '#/s/' + String(curSession).padStart(2,'0') + '/' + bid);
  }
}
function gotoBlock(bid){
  const m = BMAP[bid]; if (!m) return;
  location.hash = '#/s/' + String(m.s).padStart(2,'0') + '/' + bid;
}
function openDrawer(){ document.getElementById('kb-drawer').classList.add('open'); document.getElementById('kb-mask').classList.add('open'); }
function closeDrawer(){ document.getElementById('kb-drawer').classList.remove('open'); document.getElementById('kb-mask').classList.remove('open'); }
document.getElementById('kb-sbtoc').onclick = openDrawer;
/* ---------- routing ---------- */
function route(){
  const h = location.hash || '#/';
  let m;
  if ((m = h.match(/^#\/s\/(\d{2})(?:\/([\w]+))?/))){
    renderSession(parseInt(m[1], 10), m[2]);
  } else if (h.startsWith('#/points')){
    renderPoints(); window.scrollTo(0, 0);
  } else if ((m = h.match(/^#\/q\/(.*)/))){
    const q = decodeURIComponent(m[1]);
    qInput.value = q; renderSearch(q); window.scrollTo(0, 0);
  } else {
    renderHome(); window.scrollTo(0, 0);
  }
}
window.addEventListener('hashchange', route);
let deb = null;
qInput.addEventListener('input', () => {
  clearTimeout(deb);
  deb = setTimeout(() => {
    const q = qInput.value.trim();
    if (q) location.hash = '#/q/' + encodeURIComponent(q);
    else if (location.hash.startsWith('#/q/')) location.hash = '#/';
  }, 300);
});
qInput.addEventListener('keydown', e => {
  if (e.key === 'Enter'){
    clearTimeout(deb);
    const q = qInput.value.trim();
    if (q) location.hash = '#/q/' + encodeURIComponent(q);
  }
});
route();
</script>
