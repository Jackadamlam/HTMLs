-radius:50%;display:grid;place-items:center;\n    font-weight:700;font-size:13px;background:var(--surface);\n    border:1.5px solid var(--border-strong);color:var(--ink-2);\n    font-variant-numeric:tabular-nums;\n  }\n.step.key .node{background:var(--warm);border-color:var(--warm);color:var(--warm-contrast)}\n.step.done .node{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}\n.step h3{margin:1px 0 2px;font-size:15px;line-height:1.5}\n.step p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}\n.ktag{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;color:var(--warm);background:var(--warm-soft);padding:2px 9px;border-radius:999px}\n.tailnote{\n    margin-top:16px;border:1.5px dashed var(--border-strong);border-radius:12px;\n    padding:12px 16px;display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2);\n  }\n.tdot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--warm)}\n@media (min-width:720px){\n.path{display:grid;grid-template-columns:1fr 20px 1fr 20px 1fr 20px 1fr 20px 1fr;gap:6px;align-items:start}\n.path-arrow{display:flex;align-items:center;justify-content:center;height:30px;color:var(--border-strong);font-size:22px;font-weight:700}\n.step{display:block;padding-bottom:0}\n.step::before{display:none}\n.node{margin-bottom:10px}\n}\n/* ---------- Chain figure ---------- */\n  .equation{\n    display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:6px 12px;\n    font-family:var(--font-serif);font-weight:700;font-size:clamp(18px,3vw,23px);\n    background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-bottom:16px;\n  }\n.eqs{color:var(--muted);font-size:.82em}\n.eqf{color:var(--accent)}\n.chain-frame{position:relative;border:1px dashed var(--border-strong);border-radius:14px;padding:18px 14px 14px}\n.frame-tag{\n    position:absolute;top:-10px;left:14px;background:var(--surface);padding:0 9px;\n    font-size:12px;font-weight:700;c ) > div:nth-child(2){color:#ffffff!important;}\n}\n@media (prefers-color-scheme:dark) and (width >= 720px) and (width < 767px){\n#sv > div:nth-child(1) > main:nth-child(2) > section:nth-child(2) > figure:nth-child(3) > div:nth-child(1) > div:nth-child(4){color:#ffffff!important;}\n}\n@media (prefers-color-scheme:dark) and (width >= 767px){\n#sv > div:nth-child(1) > main:nth-child(2) > section:nth-child(2) > figure:nth-child(3) > div:nth-child(1) > div:nth-child(4){color:#ffffff!important;}\n}\n@media (prefers-color-scheme:dark) and (width >= 720px) and (width < 767px){\n#sv > div:nth-child(1) > main:nth-child(2) > section:nth-child(2) > figure:nth-child(3) > div:nth-child(1) > div:nth-child(6){color:#ffffff!important;}\n}\n@media (prefers-color-scheme:dark) and (width >= 767px){\n#sv > div:nth-child(1) > main:nth-child(2) > section:nth-child(2) > figure:nth-child(3) > div:nth-child(1) > div:nth-child(6){color:#ffffff!important;}\n}\n@media (prefers-color-scheme:dark) and (width >= 720px) and (width < 767px){\n#sv > div:nth-child(1) > main:nth-child(2) > section:nth-child(2) > figure:nth-child(3) > div:nth-child(1) > div:nth-child(8){color:#ffffff!important;}\n}\n@media (prefers-color-scheme:dark) and (width >= 767px){\n#sv > div:nth-child(1) > main:nth-child(2) > section:nth-child(2) > figure:nth-child(3) > div:nth-child(1) > div:nth-child(8){color:#ffffff!important;}\n}","body":"\n<div class=\"wrap\">\n<header class=\"hero\">\n<svg aria-hidden=\"true\" class=\"hero-rings\" viewbox=\"0 0 200 200\">\n<circle cx=\"100\" cy=\"100\" fill=\"none\" r=\"96\" stroke=\"currentColor\" stroke-width=\"1\"></circle>\n<circle cx=\"100\" cy=\"100\" fill=\"none\" r=\"64\" stroke=\"currentColor\" stroke-width=\"1\"></circle>\n<circle cx=\"100\" cy=\"100\" fill=\"none\" r=\"32\" stroke=\"currentColor\" stroke-width=\"1\"></circle>\n<circle class=\"hdot\" cx=\"100\" cy=\"100\" r=\"7\"></circle>\n</svg>\n<div class=\"kicker\">战略共创会 · 上午收尾</div>\n<h1>先跑通 2027，再谈三年战略</h1>\n<div class=\"chips\">\n<a href=\"#m2027\">2027 验证</a>\n<a href=\"#mlogic\">生意逻辑</a>\n<a href=\"#mtarget\">靶心</a>\n<a href=\"#mpm\">下午安排</a>\n</div>\n</header>\n<main>\n<div class=\"part-head\">\n<span class=\"part-num\">PART 01</span>\n<span class=\"part-title\">2027 验证路径</span>\n<span class=\"part-rule\"></span>\n</div>\n<section class=\"module\" id=\"s07b01\">\n<div class=\"m-head\"><span class=\"m-index\">01</span><h2>准备 3，跑通 1：2027 的关键验证</h2></div>\n<p class=\"lead\">从 3 到 1 的验证，是 <span class=\"k\">2027 年的关键</span>；这一步跑通了，才有资格谈接下来的三年。</p>\n<figure class=\"fig\" data-visual-id=\"pathway-2027\" data-visual-relation=\"准备3 → 跑通1个大单品 → 击穿一类人群或产品 → 打造标杆渠道 → 品牌立住，二三年复制放大\" data-visual-source=\"准备3跑通1，打造一个大单品才能击穿一类人群或产品，打造一个标杆渠道，等于是立住，立住之后二三年就可以复制放大\" data-visual-title=\"2027 年大单品验证路径\" data-visual-type=\"流程示意图\">\n<div class=\"path\" data-grid=\"\" id=\"path-2027\">\n<div class=\"step\" data-grid=\"\"><span class=\"node\">1</span><div class=\"sbody\"><h3>准备 3</h3><p>为了「1」，先备好三个候选</p></div></div>\n<div class=\"path-arrow\">›</div>\n<div class=\"step key\" data-grid=\"\"><span class=\"node\">2</span><div class=\"sbody\"><h3>跑通 1</h3><p>大单品落地验证</p><span class=\"ktag\">2027 关键</span></div></div>\n<div class=\"path-arrow\">›</div>\n<div class=\"step\" data-grid=\"\"><span class=\"node\">3</span><div class=\"sbody\"><h3>击穿一类人群</h3><p>或击穿一类产品</p></div></div>\n<div class=\"path-arrow\">›</div>\n<div class=\"step\" data-grid=\"\"><span class=\"node\">4</span><div class=\"sbody\"><h3>标杆渠道</h3><p>2027 年争取打通 1 个</p></div></div>\n<div class=\"path-arrow\">›</div>\n<div class=\"step done tail\" data-grid=\"\"><span class=\"node\">5</span><div class=\"sbody\"><h3>立住</h3><p>品牌立住，才谈放大</p></div></div>\n</div>\n<div class=\"tailnote\" id=\"tail-scale\"><span class=\"tdot\"></span><span>跑通后 2–3 年：<b>复制放大</b>（2027 年底再谈怎么复制）</span></div>\n</figure>\n<div class=\"facts\">\n<div class=\"fact\"><span class=\"flabel\">方法承接</span><p>这个品牌适合昨天讲的「战略大单品七步」。</p></div>\n<div class=\"fact\"><span class=\"flabel\">聚焦三件事</span><p><b>一个人群、一个产品、一个渠道</b>——就做这三件事。</p></div>\n<div class=\"fact\"><span class=\"flabel\">涌现式</span><p>打法适合涌现式，但涌现式要有使命感，先立住。</p></div>\n</div>\n<div class=\"callout\">\n        「从战略视角看，这个品牌还『不配』谈三年——只配谈 2027。」\n        <div class=\"note\">「配」是玩笑话，别太当真；但条件是认真的——2027 跑通了，才谈接下来的三年战略。</div>\n</div>\n</section>\n<div class=\"part-head\">\n<span class=\"part-num\">PART 02</span>\n<span class=\"part-title\">生意逻辑与靶心</span>\n<span class=\"part-rule\"></span>\n</div>\n<section class=\"module\" id=\"s07b02\">\n<div class=\"m-head\"><span class=\"m-index\">02</span><h2>生意的逻辑：购买理由</h2></div>\n<p class=\"lead\">产品必须建构在<b>好的购买理由</b>之上，生意就围绕它来设计。</p>\n<figure class=\"fig\" data-visual-id=\"buying-reason-chain\" data-visual-relation=\"洞察 → 购买理由 → 产品 → 指向人群/场景，全程精准而统一\" data-visual-source=\"购买理由建构在洞察的基础上，要有产品实现这个购买理由指向某一类人群，过程精准而统一\" data-visual-title=\"购买理由的商业逻辑链\" data-visual-type=\"逻辑关系图\">\n<div class=\"equation\" id=\"eq-buying\">卖点 <span class=\"eqs\">＝</span> 买点 <span class=\"eqs\">＝</span> <span class=\"eqf\">购买理由</span></div>\n<div class=\"chain-frame\">\n<span class=\"frame-tag\">过程精准而统一，链条才成立</span>\n<div class=\"chain\" id=\"chain-flow\">\n<div class=\"cnode\"><b>洞察</b><span>理由从这里来</span></div>\n<span class=\"carrow\">→</span>\n<div class=\"cnode hot\"><b>购买理由</b><span>产品的基础</span></div>\n<span class=\"carrow\">→</span>\n<div class=\"cnode\"><b>产品</b><span>实现这个理由</span></div>\n<span class=\"carrow\">→</span>\n<div class=\"cnode\"><b>人群 / 场景</b><span>产品的指向</span></div>\n</div>\n</div>\n<figcaption>链条清晰了：销售、品牌、市场都顺着这条线走。</figcaption>\n</figure>\n</section>\n<section class=\"module\" id=\"s07b03\">\n<div class=\"m-head\"><span class=\"m-index\">03</span><h2>今天的靶心，不在销售出口</h2></div>\n<p class=\"lead\">靶子从 1 环到 10 环——先想清楚<span class=\"k\">自己的靶点</span>在哪里。</p>\n<figure class=\"fig fig-target\" data-visual-id=\"target-bullseye\" data-visual-relation=\"外环是各销售出口（OEM 等），今天的靶心是品牌支撑不同出口的实际收入转化\" data-visual-source=\"我们有不同的销售的出口，有OEM，品牌要支撑不同销售出口的它实际的收入转化\" data-visual-title=\"靶心：品牌支撑多出口转化\" data-visual-type=\"靶心对比图\">\n<svg aria-label=\"靶子示意：从一环到十环\" class=\"target-svg\" role=\"img\" viewbox=\"0 0 300 300\">\n<circle class=\"rg1\" cx=\"150\" cy=\"150\" r=\"140\"></circle>\n<circle class=\"rg2\" cx=\"150\" cy=\"150\" r=\"112\"></circle>\n<circle class=\"rg3\" cx=\"150\" cy=\"150\" r=\"84\"></circle>\n<circle class=\"rg4\" cx=\"150\" cy=\"150\" r=\"56\"></circle>\n<circle class=\"rg5\" cx=\"150\" cy=\"150\" r=\"28\"></circle>\n<circle class=\"tdotc\" cx=\"150\" cy=\"150\" r=\"6\"></circle>\n<text class=\"rn\" x=\"150\" y=\"30\">1</text>\n<text class=\"rn\" x=\"150\" y=\"58\">4</text>\n<text class=\"rn\" x=\"150\" y=\"86\">7</text>\n<text class=\"rn rn10\" x=\"150\" y=\"141\">10</text>\n</svg>\n<div class=\"tann\">\n<div class=\"ann now\">\n<span class=\"alabel\">今天的靶心</span>\n<p>品牌支撑不同销售出口（OEM 等）的<b>实际收入转化</b>。</p>\n</div>\n<div class=\"ann out\">\n<span class=\"alabel\">外围 · 销售出口</span>\n<p>OEM 等不同出口分布在环上——出口可以多，靶心只有一个。</p>\n</div>\n<div class=\"ann out\">\n<span class=\"alabel\">增量经济时代 · 参照</span>\n<p>营销能力强、绝对的价格与成本优势，中国供应链、外贸公司多这么起来，0→1 做一个亿「轻轻松松」——但那是外环的打法。</p>\n</div>\n</div>\n</figure>\n<div class=\"risk\">\n<span class=\"rmark\">!</span>\n<p>产品再烂，销售够强也能卖出去——但<b class=\"wt\">不具备可持续性</b>。</p>\n</div>\n<div class=\"insight\"><span class=\"itag\">提示</span>购买理由就是靶点——理由精准、链条统一，OEM 等各出口才指着同一颗靶心。</div>\n</section>\n<div class=\"part-head\">\n<span class=\"part-num\">PART 03</span>\n<span class=\"part-title\">下午安排</span>\n<span class=\"part-rule\"></span>\n</div>\n<section class=\"module\" id=\"s07b04\">\n<div class=\"m-head\"><span class=\"m-index\">04</span><h2>下午怎么落：客户价值与关键销场</h2></div>\n<div class=\"facts\">\n<div class=\"fact\"><span class=\"flabel\">微调</span><p>上午材料有修改建议就微调；大家写得已经很细，下午落地时围绕重点。</p></div>\n<div class=\"fact\"><span class=\"flabel\">主题</span><p><b>客户与客户价值</b>，以及<b>关键销场</b>。</p></div>\n<div class=\"fact\"><span class=\"flabel\">工具</span><p>围绕那几个关键点，会给大家提供工具。</p></div>\n<div class=\"fact\"><span class=\"flabel\">状态</span><p>增长的关键区域<b>已有初步结论</b>。</p></div>\n</div>\n<div class=\"eat\"><span><span class=\"edot\"></span>上午收尾 · 接下来干一件「大事」——吃饭。</span></div>\n</section>\n</main>\n</div>\n<template id=\"share-cover\">\n<svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#F4F5F7\" height=\"512\" width=\"512\"></rect>\n<circle cx=\"256\" cy=\"256\" fill=\"#E4E9F8\" r=\"176\"></circle>\n<circle cx=\"256\" cy=\"256\" fill=\"#C9D4F2\" r=\"132\"></circle>\n<circle cx=\"256\" cy=\"256\" fill=\"#93A9E6\" r=\"88\"></circle>\n<circle cx=\"256\" cy=\"256\" fill=\"#4B66C9\" r=\"46\"></circle>\n<circle cx=\"256\" cy=\"256\" fill=\"#D9482B\" r=\"16\"></circle>\n<line stroke=\"#1B2A5E\" stroke-linecap=\"round\" stroke-width=\"14\" x1=\"398\" x2=\"288\" y1=\"114\" y2=\"224\"></line>\n<polygon fill=\"#1B2A5E\" points=\"272,240 299,236 276,213\"></polygon>\n<line stroke=\"#1B2A5E\" stroke-linecap=\"round\" stroke-width=\"10\" x1=\"398\" x2=\"428\" y1=\"114\" y2=\"128\"></line>\n<line stroke=\"#1B2A5E\" stroke-linecap=\"round\" stroke-width=\"10\" x1=\"398\" x2=\"384\" y1=\"114\" y2=\"84\"></line>\n</svg>\n</template>\n","blocks":[{"id":"s07b01","type":"mod","heading":"准备 3，跑通 1：2027 的关键验证","text":"01\n准备 3，跑通 1：2027 的关键验证\n从 3 到 1 的验证，是\n2027 年的关键\n；这一步跑通了，才有资格谈接下来的三年。\n1\n准备 3\n为了「1」，先备好三个候选\n›\n2\n跑通 1\n大单品落地验证\n2027 关键\n›\n3\n击穿一类人群\n或击穿一类产品\n›\n4\n标杆渠道\n2027 年争取打通 1 个\n›\n5\n立住\n品牌立住，才谈放大\n跑通后 2–3 年：\n复制放大\n（2027 年底再谈怎么复制）\n方法承接\n这个品牌适合昨天讲的「战略大单品七步」。\n聚焦三件事\n一个人群、一个产品、一个渠道\n——就做这三件事。\n涌现式\n打法适合涌现式，但涌现式要有使命感，先立住。\n「从战略视角看，这个品牌还『不配』谈三年——只配谈 2027。」\n「配」是玩笑话，别太当真；但条件是认真的——2027 跑通了，才谈接下来的三年战略。"},{"id":"s07b02","type":"mod","heading":"生意的逻辑：购买理由","text":"02\n生意的逻辑：购买理由\n产品必须建构在\n好的购买理由\n之上，生意就围绕它来设计。\n卖点\n＝\n买点\n＝\n购买理由\n过程精准而统一，链条才成立\n洞察\n理由从这里来\n→\n购买理由\n产品的基础\n→\n产品\n实现这个理由\n→\n人群 / 场景\n产品的指向\n链条清晰了：销售、品牌、市场都顺着这条线走。"},{"id":"s07b03","type":"mod","heading":"今天的靶心，不在销售出口","text":"03\n今天的靶心，不在销售出口\n靶子从 1 环到 10 环——先想清楚\n自己的靶点\n在哪里。\n1\n4\n7\n10\n今天的靶心\n品牌支撑不同销售出口（OEM 等）的\n实际收入转化\n。\n外围 · 销售出口\nOEM 等不同出口分布在环上——出口可以多，靶心只有一个。\n增量经济时代 · 参照\n营销能力强、绝对的价格与成本优势，中国供应链、外贸公司多这么起来，0→1 做一个亿「轻轻松松」——但那是外环的打法。\n!\n产品再烂，销售够强也能卖出去——但\n不具备可持续性\n。\n提示\n购买理由就是靶点——理由精准、链条统一，OEM 等各出口才指着同一颗靶心。"},{"id":"s07b04","type":"mod","heading":"下午怎么落：客户价值与关键销场","text":"04\n下午怎么落：客户价值与关键销场\n微调\n上午材料有修改建议就微调；大家写得已经很细，下午落地时围绕重点。\n主题\n客户与客户价值\n，以及\n关键销场\n。\n工具\n围绕那几个关键点，会给大家提供工具。\n状态\n增长的关键区域\n已有初步结论\n。\n上午收尾 · 接下来干一件「大事」——吃饭。"}]},{"num":8,"id":"s08","title":"解码业务打法：业务六问与人货场","date":"2026年11月10日","css":"#sv{\n  color-scheme: light dark;\n  --page-bg:#eef1f6;\n  --surface:#ffffff;\n  --surface-2:#f6f8fc;\n  --ink:#1c2333;\n  --muted:#5b6478;\n  --border:#dfe4ee;\n  --accent:#3b5bdb;\n  --accent-2:#4c6ef5;\n  --accent-ink:#ffffff;\n  --accent-soft:#e9eefb;\n  --ok:#0ca678;\n  --ok-soft:#e2f5ee;\n  --warn:#d9480f;\n  --warn-soft:#fdeee2;\n  --radius:14px;\n  --font:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Segoe UI\",\"Microsoft YaHei\",sans-serif;\n  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){\n#sv{\n    --page-bg:#0f141d;\n    --surface:#161d2a;\n    --surface-2:#1c2433;\n    --ink:#e8ecf4;\n    --muted:#a3adc0;\n    --border:#2a3448;\n    --accent:#7d96f0;\n    --accent-2:#91a7ff;\n    --accent-ink:#10162a;\n    --accent-soft:#222c49;\n    --ok:#38d9a9;\n    --ok-soft:#173429;\n    --warn:#ffa94d;\n    --warn-soft:#38271a;\n  }\n}\n*{box-sizing:border-box;margin:0;padding:0}\n#sv{-webkit-text-size-adjust:100%}\n#sv,#sv{background-color:var(--page-bg)}\n#sv{font-family:var(--font);color:var(--ink);font-size:15.5px;line-height:1.75}\n.wrap{max-width:880px;margin:0 auto;padding:0 18px 72px}\nsvg{display:block;width:100%;height:auto}\nsvg text{font-family:var(--font)}\n/* header */\n.top{padding:44px 0 4px}\n.kicker{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--accent)}\n.kicker::before{content:\"\";width:22px;height:2px;background:var(--accent);border-radius:2px}\nh1{font-size:clamp(25px,5.4vw,33px);line-height:1.3;letter-spacing:.02em;margin-top:12px}\n.sub{margin-top:9px;color:var(--muted);font-size:14px}\n.lede{margin-top:18px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:12px;padding:13px 16px;font-size:15px}\n/* parts */\n.part{margin-top:46px}\n.ph{display:flex;align-items:baseline;gap:12px}\n.ph .num{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.08em}\n.ph h2{font-size:20px;font-weight:800;letter-spacing:.02em;white-space:nowrap}\n.ph::after{content:\"\";flex:1;height:1px;background:var(--border);transform:translateY(-4px)}\n/* modules */\n.mod{margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(18px,4.2vw,26px);box-shadow:0 1px 2px rgba(15,23,42,.05)}\n.mod h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;line-height:1.4}\n.mod h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}\n.mod p{margin-top:10px}\nstrong,b{font-weight:700}\n.hl{color:var(--accent);font-weight:600}\n.wr{color:var(--warn);font-weight:700}\n/* strips */\n.strip{margin-top:14px;padding:11px 14px;border-radius:10px;font-size:14px;line-height:1.7;display:flex;gap:10px;align-items:flex-start}\n.strip .stag{flex:none;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px;margin-top:3px;letter-spacing:.05em;white-space:nowrap}\n.s-info{background:var(--accent-soft)}\n.s-info .stag{background:var(--accent);color:var(--accent-ink)}\n.s-warn{background:var(--warn-soft)}\n.s-warn .stag{background:var(--warn);color:#fff}\n/* chips */\n.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}\n.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 13px;font-size:13.5px}\n.chip.hot{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}\n.chip.bad{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:600}\n.carrow{color:var(--muted);font-weight:700}\n/* figure */\nfigure{margin-top:16px}\nfigcaption{margin-top:10px;font-size:12.5px;color:var(--muted);line-height:1.6}\n/* pflow */\n.pflow{display:flex;flex-wrap:wrap;gap:10px}\n.pn{flex:1 1 158px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}\n.pn .pl{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--accent)}\n.pn b{display:block;font-size:15px;margin-top:3px}\n.pn em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.55}\n.pn .st{display:inline-block;margin-top:8px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--border);color:var(--muted)}\n.pn.now{background:var(--accent-soft);border-color:var(--accent)}\n.pn.now .st{background:var(--accent);color:var(--accent-ink)}\n.parr{align-self:center;color:var(--accent);font-weight:800;font-size:17px;padding:0 1px}\n.parr .vv{display:none}\n@media (max-width:620px){\n.pflow{flex-direction:column}\n.parr{align-self:center;padding:0}\n.parr .vh{display:none}\n.parr .vv{display:inline}\n}\n/* six-question chain */\n.qchain{list-style:none;margin-top:14px;display:flex;flex-direction:column}\n.qi{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px 14px}\n.qn{width:26px;height:26px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}\n.qi .qt{flex:1;min-width:200px}\n.qi .qt b{font-size:15px}\n.qi .qt em{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:2px;line-height:1.6}\n.qtag{flex:none;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-weight:600}\n.qtag.warn{color:var(--warn);background:var(--warn-soft)}\n.qarr{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;padding:5px 0 5px 36px}\n.qarr::before{content:\"↓\";color:var(--accent);font-weight:800;font-size:14px}\n.duo{display:grid;gap:10px;margin-top:10px}\n@media (min-width:620px){\n.duo{grid-template-columns:1fr 1fr}\n}\n/* key list */\n.klist{list-style:none;margin-top:12px;display:grid;gap:9px}\n.klist li{position:relative;padding-left:20px;font-size:14.5px;line-height:1.7}\n.klist li::before{content:\"\";position:absolute;left:4px;top:.72em;width:7px;height:7px;border-radius:2px;background:var(--accent)}\n/* moat / sample cards */\n.mrow{display:grid;gap:12px;margin-top:4px}\n@media (min-width:760px){\n.mrow{grid-template-columns:repeat(3,1fr)}\n}\n.mcard{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}\n.mcard header{padding:11px 14px;background:var(--accent-soft)}\n.mcard header b{font-size:15px}\n.mcard header em{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:2px}\n.mcard ul{list-style:none;padding:4px 14px 8px;flex:1}\n.mcard li{padding:7px 0;border-bottom:1px dashed var(--border);font-size:13.5px;line-height:1.65}\n.mcard li:last-child{border-bottom:0}\n.mcard li b{color:var(--accent)}\n.mfoot{padding:9px 14px 12px;font-size:12.5px;color:var(--muted);line-height:1.65;border-top:1px dashed var(--border)}\n/* selling-point pairs */\n.pairs{display:grid;gap:9px;margin-top:4px}\n.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 13px;font-size:13.5px}\n.pair .l{color:var(--muted)}\n.pair .a{color:var(--accent);font-weight:800}\n.pair .r{color:var(--accent);font-weight:600;text-align:right}\n/* dashcam rows */\n.drow{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}\n.drow:last-child{border-bottom:0}\n.dn{width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}\n.drow b{font-size:14.5px}\n.drow em{display:block;font-style:normal;color:var(--muted);font-size:13px;line-height:1.65;margin-top:1px}\n/* cross structure */\n.cross{display:grid;gap:10px;margin-top:4px}\n.cband{border-radius:12px;padding:11px 15px;font-size:13.5px;line-height:1.6}\n.cband b{font-size:14.5px}\n.cband em{display:block;font-style:normal;color:var(--muted);font-size:12.5px;margin-top:1px}\n.cband.ta{background:var(--accent-soft);border:1px solid var(--accent)}\n.cband.ta b{color:var(--accent)}\n.cross .row2{display:grid;gap:10px}\n@media (min-width:620px){\n.cross .row2{grid-template-columns:1.4fr 1fr}\n}\n.cband.qj{background:var(--surface-2);border:1px solid var(--border)}\n.cband.hub{background:var(--accent);border:none;display:flex;flex-direction:column;justify-content:center}\n.cband.hub b{color:var(--accent-ink);font-size:15.5px}\n.cband.hub em{color:var(--accent-ink);opacity:.85}\n/* structure vs conclusion */\n.scwrap{display:grid;gap:12px;margin-top:4px}\n@media (min-width:680px){\n.scwrap{grid-template-columns:1fr 1fr}\n}\n.sccard{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface-2)}\n.sccard.lft{border-top:3px solid var(--accent)}\n.sccard.rgt{border-top:3px solid var(--ok)}\n.sccard h4{font-size:15.5px}\n.sctags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}\n.tchip{font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-weight:600}\n.tchip.g{background:var(--ok-soft);color:var(--ok)}\n.sccard p{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.65}\n/* demo */\n.demo{margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:16px 16px 14px}\n.dhead{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--muted)}\n.dgrid{display:grid;gap:12px 22px;grid-template-columns:1fr;margin-top:10px}\n@media (min-width:640px){\n.dgrid{grid-template-columns:1fr 1fr}\n}\n.ditem label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);font-weight:600}\n.ditem label b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:13.5px}\ninput[type=range]{width:100%;accent-color:var(--accent);margin-top:6px}\n.dout{margin-top:14px;padding-top:12px;border-top:1px dashed var(--border);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}\n.dout .dlab{font-size:13px;color:var(--muted);font-weight:600}\n.dout .big{font-size:25px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}\n.dout .chain{font-size:12.5px;color:var(--muted)}\n.hint{margin-top:9px;font-size:12.5px;color:var(--muted);line-height:1.6}\n/* Component-name-agnostic mobile safety net.\n   Structural guarantees are expressed against CSS Grid/Flex behaviour and\n   generic attribute hooks rather than a fixed class vocabulary,so generating\n   models may invent component names freely for any recording type. */\n*,*::before,*::after{ box-sizing: border-box; }\n#sv{ width: 100%; min-width: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n#sv{ width: 100%; min-width: 0; margin: 0; overflow-wrap: break-word; }\nmain,header,footer,nav,section,article,aside,figure,div,ul,ol,li,dl,dd,details{ min-width: 0; }\nimg,picture,video,canvas,svg{ display: block; max-width: 100%; height: auto; }\npre,code,kbd,samp{ max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }\nh1,h2,h3,h4,h5,h6,p,li,td,th,dt,dd,blockquote,figcaption{ overflow-wrap: anywhere; }\ninput,textarea,select,button{ max-width: 100%; font: inherit; }\n/* Any table gets a scroll container by intent or by generic hook. */\n.table-scroll,.table-wrap,.matrix-wrap,[data-table-scroll],[data-scroll-x]{\n  max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;\n}\n.table-scroll > table,.table-wrap > table,.matrix-wrap > table,[data-table-scroll] > table,[data-scroll-x] > table{ margin: 0; }\n/* Numbered step rows: keep #sv copy out of the counter track. */\n.step-item,[data-step-item]{ grid-template-columns: 32px minmax(0, 1fr) !important; }\n.step-item::before,[data-step-item]::before{ grid-column: 1 !important; grid-row: 1 !important; }\n.step-item > :empty,[data-step-item] > :empty{ display: none !important; }\n.step-item > *,[data-step-item] > *{ grid-column: 2 !important; min-width: 0 !important; }\n.data-value,.metric-value,[data-value]{ max-width: 100%; font-variant-numeric: tabular-nums; }\n/* A single surviving child of ANY grid spans the full row. Applied to every\n   element that declares a grid,so unknown component names are covered too. */\n[class*=\"grid\"] > :only-child,[class*=\"board\"] > :only-child,[class*=\"cluster\"] > :only-child,[class*=\"row\"] > :only-child,[class*=\"split\"] > :only-child,[class*=\"cols\"] > :only-child,[class*=\"columns\"] > :only-child,[class*=\"layout\"] > :only-child,[class*=\"panel\"] > :only-child,[data-grid] > :only-child,[data-cols] > :only-child{\n  grid-column: 1 / -1 !important;\n  width: 100% !important;\n}\n@media (max-width: 600px){\n#sv{ font-size: 14.5px !important; line-height: 1.62 !important; }\n:where(#sv > main,#sv > .report-shell,#sv > .report,#sv > .container,#sv > [data-shell]){\n    width: calc(100% - 40px) !important;\n    max-width: 100% !important;\n    margin-inline: auto !important;\n  }\nh1{ font-size: 29px !important; line-height: 1.22 !important; letter-spacing: 0 !important; }\nh2{ font-size: 22px !important; line-height: 1.3 !important; letter-spacing: 0 !important; }\nh3{ font-size: 16px !important; line-height: 1.42 !important; letter-spacing: 0 !important; }\n/* Generic collapse: every multi-column grid becomes single column unless it\n     explicitly opts into staying paired (data-keep-columns) or is a table. */\n  [class*=\"grid\"]:not([data-keep-columns]),[class*=\"board\"]:not([data-keep-columns]),[class*=\"split\"]:not([data-keep-columns]),[class*=\"cols\"]:not([data-keep-columns]),[class*=\"columns\"]:not([data-keep-columns]),[class*=\"layout\"]:not([data-keep-columns]),[data-grid]:not([data-keep-columns]){\n    grid-template-columns: minmax(0, 1fr) !important;\n  }\n/* Compact numeric clusters may stay two-up,but a trailing odd card must\n     span both columns so no empty half-row is left on narrow screens. */\n  [data-keep-columns]{ grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }\n[data-keep-columns] > :last-child:nth-child(odd){ grid-column: 1 / -1 !important; }\n[data-span-all],[data-value-kind=\"formula\"],[data-value-kind=\"range\"]{ grid-column: 1 / -1 !important; }\n/* Horizontal flows become vertical. */\n  [class*=\"flow\"],[class*=\"chain\"],[class*=\"timeline\"]{ flex-direction: column !important; }\n[class*=\"arrow\"]{ transform: rotate(90deg); min-height: 16px !important; }\ntable{ font-size: 12.5px; }\nth,td{ padding: 9px 8px !important; }\nnav{ max-width: 100%; }\nnav[data-scrollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}\n@media (max-width:767px){\n#sv > div:nth-child(1) > section:nth-child(2) > div:nth-child(1) > h2:nth-child(2){white-space:normal!important;flex-shrink:1!important;min-width:0!important;overflow-wrap:anywhere!important}\n#sv > div:nth-child(1) > section:nth-child(2) > div:nth-child(1)::after{margin-left:-12px!important;clip-path:inset(0 0 0 12px)!important}\n}\n@media (max-width:767px){\n#sv > div:nth-child(1) > section:nth-child(3) > div:nth-child(1) > h2:nth-child(2){white-space:normal!important;flex-shrink:1!important;min-width:0!important;overflow-wrap:anywhere!important}\n#sv > div:nth-child(1) > section:nth-child(3) > div:nth-child(1)::after{margin-left:-12px!important;clip-path:inset(0 0 0 12px)!important}\n}\n@media (max-width:767px){\n#sv > div:nth-child(1) > section:nth-child(4) > div:nth-child(1) > h2:nth-child(2){white-space:normal!important;flex-shrink:1!important;min-width:0!important;overflow-wrap:anywhere!important}\n#sv > div:nth-child(1) > section:nth-child(4) > div:nth-child(1)::after{margin-left:-12px!important;clip-path:inset(0 0 0 12px)!important}\n}\n@media (max-width:767px){\n#sv > div:nth-child(1) > section:nth-child(5) > div:nth-child(1) > h2:nth-child(2){white-space:normal!important;flex-shrink:1!important;min-width:0!important;overflow-wrap:anywhere!important}\n#sv > div:nth-child(1) > section:nth-child(5) > div:nth-child(1)::after{margin-left:-12px!important;clip-path:inset(0 0 0 12px)!important}\n}\n@media (max-width:767px){\n#sv > div:nth-child(1) > section:nth-child(6) > div:nth-child(1) > h2:nth-child(2){white-space:normal!important;flex-shrink:1!important;min-width:0!important;overflow-wrap:anywhere!important}\n#sv > div:nth-child(1) > section:nth-child(6) > div:nth-child(1)::after{margin-left:-12px!important;clip-path:inset(0 0 0 12px)!important}\n}","body":"\n<div class=\"wrap\">\n<header class=\"top\">\n<span class=\"kicker\">战略共创会 · P2 阶段</span>\n<h1>解码业务打法：业务六问与人货场</h1>\n<p class=\"sub\">面向一年的落地动作 · 每组产出：业务六问 ＋ 业务破局增长 5 个点</p>\n<p class=\"lede\">战略方向已定，接下来把方向解码成打法——以下是 P2 环节的框架、工具与作业要求。</p>\n</header>\n<section class=\"part\" id=\"s08b01\">\n<div class=\"ph\"><span class=\"num\">01</span><h2>会议坐标：从方向到打法</h2></div>\n<div class=\"mod\" id=\"s08b02\">\n<h3><span class=\"dot\"></span>P2 的位置：三步解码</h3>\n<p>战略方向经过前几轮讨论已大体明确；部门 OGSM、年度目标、预算、产品规划要等解码之后再落笔。当前步骤：<span class=\"hl\">P2 解码业务打法</span>。</p>\n<figure data-visual-id=\"p-flow\" data-visual-relation=\"P1我想、P2解码业务打法（他需）、P3我能依次推进，汇总为各业态战略地图与部门目标，当前进行P2\" data-visual-source=\"下一步做的是P2解码业务打法……汇总三个方面……得到每个业态的战略地图和部门目标\" data-visual-title=\"解码三步：P1→P2→P3→汇总\" data-visual-type=\"流程图\">\n<div class=\"pflow\">\n<div class=\"pn\"><span class=\"pl\">P1</span><b>我 想</b><em>公司使命愿景 · 各业态大方向</em><span class=\"st\">已完成</span></div>\n<div class=\"parr\"><span class=\"vh\">→</span><span class=\"vv\">↓</span></div>\n<div class=\"pn now\"><span class=\"pl\">P2</span><b>解码业务打法</b><em>他需：客户与市场需求 → 销售打法</em><span class=\"st\">进行中</span></div>\n<div class=\"parr\"><span class=\"vh\">→</span><span class=\"vv\">↓</span></div>\n<div class=\"pn\"><span class=\"pl\">P3</span><b>我 能</b><em>自身资源与实现能力</em><span class=\"st\">待启动</span></div>\n<div class=\"parr\"><span class=\"vh\">→</span><span class=\"vv\">↓</span></div>\n<div class=\"pn\"><span class=\"pl\">汇总</span><b>战略地图＋部门目标</b><em>三环合一，每个业态一份</em><span class=\"st\">产出物</span></div>\n</div>\n<figcaption>P2 进行中：他需侧的业务打法解码；P1 已完成，P3 与汇总在后。（此处 P1/P2/P3 指「我想·他需·我能」三环解码，与附录A 战役七步法的 P1–P7 不是同一套编号。）（此处 P1/P2/P3 指「我想·他需·我能」三环解码，与附录A 战役七步法的 P1–P7 不是同一套编号。）</figcaption>\n</figure>\n<div class=\"strip s-info\"><span class=\"stag\">统一口径</span><span>从现在起整体<strong>面向一年</strong>：基于三年的大方向，想一年内可落地的动作——此前部分讨论面向三年、部分面向一年，就此拉齐。</span></div>\n</div>\n<div class=\"mod\" id=\"s08b03\">\n<h3><span class=\"dot\"></span>战略在平衡中决策</h3>\n<p>战略的难度与艺术性，在于<strong>平衡与取舍中做决策</strong>：我想是理想，他需与我能是现实；既有由外而内，也有由内而外——既要量力而为，又要围绕我想与他需刻意而为。</p>\n<figure data-visual-id=\"decode-framework\" data-visual-relation=\"三环交汇为最佳战略；只取我想是白日做梦，只取他需是苟且，只取我能是自嗨\" data-visual-source=\"只考虑我想叫白日做梦……只考虑客户需求叫苟且……只关注自身能力叫自嗨\" data-visual-title=\"我想·他需·我能三环与失衡警示\" data-visual-type=\"三环关系图\">\n<svg aria-label=\"我想、他需、我能三环关系图\" role=\"img\" viewbox=\"0 0 440 312\">\n<circle cx=\"160\" cy=\"118\" fill=\"var(--accent)\" fill-opacity=\"0.12\" r=\"86\" stroke=\"var(--accent)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"></circle>\n<circle cx=\"280\" cy=\"118\" fill=\"var(--accent-2)\" fill-opacity=\"0.12\" r=\"86\" stroke=\"var(--accent-2)\" stroke-opacity=\"0.5\" stroke-width=\"1.5\"></circle>\n<circle cx=\"220\" cy=\"200\" fill=\"var(--accent)\" fill-opacity=\"0.10\" r=\"86\" stroke=\"var(--accent)\" stroke-opacity=\"0.4\" stroke-width=\"1.5\"></circle>\n<text fill=\"var(--ink)\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" x=\"132\" y=\"86\">我 想</text>\n<text fill=\"var(--muted)\" font-size=\"11\" text-anchor=\"middle\" x=\"132\" y=\"105\">理想 · 大方向</text>\n<text fill=\"var(--ink)\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" x=\"308\" y=\"86\">他 需</text>\n<text fill=\"var(--muted)\" font-size=\"11\" text-anchor=\"middle\" x=\"308\" y=\"105\">客户 · 市场（偏区域）</text>\n<text fill=\"var(--ink)\" font-size=\"15\" font-weight=\"700\" text-anchor=\"middle\" x=\"220\" y=\"256\">我 能</text>\n<text fill=\"var(--muted)\" font-size=\"11\" text-anchor=\"middle\" x=\"220\" y=\"274\">资源与实现能力</text>\n<rect fill=\"var(--surface)\" height=\"26\" rx=\"13\" stroke=\"var(--accent)\" stroke-width=\"1.5\" width=\"88\" x=\"176\" y=\"139\"></rect>\n<text fill=\"var(--accent)\" font-size=\"13.5\" font-weight=\"700\" text-anchor=\"middle\" x=\"220\" y=\"157\">最佳战略</text>\n</svg>\n<div class=\"chips\">\n<span class=\"chip bad\">只取「我想」＝白日做梦</span>\n<span class=\"chip bad\">只取「他需」＝苟且</span>\n<span class=\"chip bad\">只取「我能」＝自嗨</span>\n</div>\n<figcaption>三环交汇处才是战略；失衡的三个词对应三种空想。</figcaption>\n</figure>\n<div class=\"strip s-info\"><span class=\"stag\">会场提醒</span><span>心有全局，想着终局；想着 100 分，做 50 分的事——这样才能<strong>心态好、情绪稳定</strong>。</span></div>\n</div>\n</section>\n<section class=\"part\" id=\"s08b04\">\n<div class=\"ph\"><span class=\"num\">02</span><h2>生意思维：先分清流量与生意</h2></div>\n<div class=\"mod\" id=\"s08b05\">\n<h3><span class=\"dot\"></span>什么叫做生意</h3>\n<p>会场回答逐层递进：</p>\n<div class=\"chips\">\n<span class=\"chip\">赚钱</span><span class=\"carrow\">→</span>\n<span class=\"chip\">持续赚钱</span><span class=\"carrow\">→</span>\n<span class=\"chip\">有买有卖（供需）</span><span class=\"carrow\">→</span>\n<span class=\"chip\">可复制的能力 × 可复制的市场</span><span class=\"carrow\">→</span>\n<span class=\"chip hot\">短期解掉，长期看好</span>\n</div>\n<p>收敛成一句：<span class=\"hl\">好的生意思维，是基于战略的生意思维</span>；不基于战略，就只剩赚钱本身。有学员转述其老板的话：「生意，就是生生不息的意义。」</p>\n<div class=\"strip s-info\"><span class=\"stag\">前提假设</span><span>战略已一定程度逼近真相；但战略只能<strong>逼近真相</strong>，没法彻底弄清——因为环境也在变。</span></div>\n</div>\n<div class=\"mod\" id=\"s08b06\">\n<h3><span class=\"dot\"></span>营收公式：流量思维的账</h3>\n<figure data-visual-id=\"revenue-formula\" data-visual-relation=\"营收=流量×转化率×客单价×复购率；本质是流量驱动、销售驱动，非生意本身，ToB对应获客渠道\" data-visual-source=\"销售营收等于……流量乘以转化率乘以客单价乘以复购率……严格意义上不是生意，这个逻辑是流量驱动\" data-visual-title=\"营收四要素公式与流量思维判定\" data-visual-type=\"公式要素图\">\n<div class=\"chips\" style=\"margin-top:2px\">\n<span class=\"chip hot\">营收</span><span class=\"carrow\">＝</span>\n<span class=\"chip\">流量</span><span class=\"carrow\">×</span>\n<span class=\"chip\">转化率</span><span class=\"carrow\">×</span>\n<span class=\"chip\">客单价</span><span class=\"carrow\">×</span>\n<span class=\"chip\">复购率</span>\n</div>\n<div class=\"strip s-warn\" style=\"margin-top:12px\"><span class=\"stag\">判定</span><span>严格说，这不是生意——是<strong>流量驱动、销售驱动</strong>，「上一个时代的表达」，基于平台规则。To B 同构：流量＝获客渠道与客户名单，漏斗开口越大、转化越多。</span></div>\n<figcaption>公式可倒推资源，但它是流量思维的账，不是生意的本质。</figcaption>\n</figure>\n<p>公式的用处是<strong>倒推资源</strong>：明年目标 1 亿还是 1.5 亿，倒着算就知道要买多少流量、营销费给多少——至少 C 端可直接倒推。</p>\n<figure data-visual-id=\"rev-calc-demo\" data-visual-relation=\"输入目标营收、客单价、转化率与复购率，按公式倒推所需流量人次\" data-visual-source=\"我明年目标如果是1个亿……倒推这个公式，我就能算出我准备买多少流量\" data-visual-title=\"目标营收倒推所需流量（示例）\" data-visual-type=\"交互推演\">\n<div class=\"demo\">\n<div class=\"dhead\">倒推示例 · 演示参数</div>\n<div class=\"dgrid\" data-grid=\"\">\n<div class=\"ditem\"><label>目标营收<b id=\"oT\">1.0 亿</b></label><input id=\"rT\" max=\"3\" min=\"0.2\" step=\"0.1\" type=\"range\" value=\"1\"/></div>\n<div class=\"ditem\"><label>客单价<b id=\"oP\">200 元</b></label><input id=\"rP\" max=\"1000\" min=\"50\" step=\"10\" type=\"range\" value=\"200\"/></div>\n<div class=\"ditem\"><label>转化率<b id=\"oC\">3 %</b></label><input id=\"rC\" max=\"10\" min=\"0.5\" step=\"0.5\" type=\"range\" value=\"3\"/></div>\n<div class=\"ditem\"><label>复购率<b id=\"oR\">1.2</b></label><input id=\"rR\" max=\"3\" min=\"1\" step=\"0.1\" type=\"range\" value=\"1.2\"/></div>\n</div>\n<div class=\"dout\">\n<span class=\"dlab\">所需流量</span>\n<span class=\"big\" id=\"flowOut\">≈ 1,389 万</span>\n<span class=\"chain\" id=\"chainOut\">3 % × 200 元 × 1.2 ＝ 7.2 元/人次</span>\n</div>\n<p class=\"hint\">示例参数仅演示倒推逻辑；提客单、提转化、提复购，任何一项提升都能省下流量。</p>\n</div>\n<figcaption>改动任一假设，所需流量随之变化；这是算资源的账。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s08b07\">\n<h3><span class=\"dot\"></span>从收割到利他</h3>\n<figure data-visual-id=\"seed-harvest-paths\" data-visual-relation=\"种收一起：内容页链接直接下单；种收分离：小红书种草后退出再到天猫购买\" data-visual-source=\"你看到这个视频下面有链接，这叫种收一起……退出小红书，再进天猫买，这叫种收分离\" data-visual-title=\"种收一起与种收分离\" data-visual-type=\"对比路径图\">\n<div class=\"pairs\">\n<div class=\"pair\" data-grid=\"\"><span class=\"l\"><b>种收一起</b> · 看到内容</span><span class=\"a\">→</span><span class=\"r\">视频下方链接，直接下单</span></div>\n<div class=\"pair\" data-grid=\"\"><span class=\"l\"><b>种收分离</b> · 小红书看到内容</span><span class=\"a\">→</span><span class=\"r\">退出 → 打开天猫 → 下单</span></div>\n</div>\n<figcaption>两种转化路径：种收分离把「收」的动作切到了另一处。</figcaption>\n</figure>\n<p><b>收割</b>是流量经济时代的词——种草为了收割，<span class=\"wr\">非常利己</span>；比它更难听的是「反复收割」。一头把「用户第一」写进价值观，一头讲收割，这是自相矛盾。</p>\n<p>好的生意思维强调<strong>利客户、利他</strong>——这正是下一节业务六问从「客户是谁」问起的原因。</p>\n</div>\n</section>\n<section class=\"part\" id=\"s08b08\">\n<div class=\"ph\"><span class=\"num\">03</span><h2>工具一：业务六问（To B 主用）</h2></div>\n<div class=\"mod\" id=\"s08b09\">\n<h3><span class=\"dot\"></span>业务六问：一条因果链</h3>\n<p>讲者称它是「全世界最好的业务逻辑梳理工具」，已被反复验证。组织只有两种逻辑：<b>向外求增长的业务逻辑</b>与<b>向内求增效的管理逻辑</b>——六问梳理的是前者。</p>\n<figure data-visual-id=\"biz-six-questions\" data-visual-relation=\"一至四问依次传导：洞察产出购买理由、再到产品与合作生态；五问赢得竞争，六问兜底风险\" data-visual-source=\"你不洞察到第一个，你就产出不了第二个……第五个叫赢得竞争……最后这个风险是兜底呀\" data-visual-title=\"业务六问与因果依赖链\" data-visual-type=\"问题链结构图\">\n<ol class=\"qchain\">\n<li class=\"qi\"><span class=\"qn\">1</span><div class=\"qt\"><b>客户选择</b><em>谁是我们的客户／用户？需求重点与期待是什么？（选一类细分，颗粒度比上一轮更细）</em></div><span class=\"qtag\">定位客户与需求</span></li>\n<li class=\"qarr\">不洞察①，产不出②</li>\n<li class=\"qi\"><span class=\"qn\">2</span><div class=\"qt\"><b>价值主张（购买理由）</b><em>客户为什么买我？——聚焦一个独特的优势价值</em></div><span class=\"qtag\">聚焦独特价值</span></li>\n<li class=\"qarr\">②不清，③做不好</li>\n<li class=\"qi\"><span class=\"qn\">3</span><div class=\"qt\"><b>价值获取</b><em>提供什么产品？如何获客？如何保证盈利毛利？</em></div><span class=\"qtag\">产品·获客·毛利</span></li>\n<li class=\"qarr\">③做不好，④难合作</li>\n<li class=\"qi\"><span class=\"qn\">4</span><div class=\"qt\"><b>活动范围</b><em>上下游有哪些合作方与渠道？——研发技术、IP 联名、人才租赁、代理商</em></div><span class=\"qtag\">构建合作生态</span></li>\n</ol>\n<div class=\"duo\" data-grid=\"\">\n<div class=\"qi\"><span class=\"qn\">5</span><div class=\"qt\"><b>护城河</b><em>跟竞争对手比有什么不同？如何拦住对手、更容易拿到订单？</em></div><span class=\"qtag\">赢得竞争</span></div>\n<div class=\"qi\"><span class=\"qn\">6</span><div class=\"qt\"><b>重大风险</b><em>业务甚至公司可能遇到什么生死问题？——C 端常因一个问题关店两三个月</em></div><span class=\"qtag warn\">兜底</span></div>\n</div>\n<figcaption>①–④因果传导；⑤的本质是赢得竞争，⑥兜底——一招不慎，全盘皆输。</figcaption>\n</figure>\n<div class=\"strip s-info\"><span class=\"stag\">会场提醒</span><span>「六问哪个最重要」多半是<strong>伪命题</strong>——先辨识问题真假，再作答。落到具体业态的当前阶段，它就成了真命题：OEM 现阶段重在价值主张，To C 现阶段重在购买理由（本质是赢得客户）。</span></div>\n<div class=\"strip s-info\"><span class=\"stag\">三天主线</span><span>战略的本质，就是围绕<strong>客户价值</strong>与<strong>竞争优势</strong>。</span></div>\n</div>\n<div class=\"mod\" id=\"s08b10\">\n<h3><span class=\"dot\"></span>填表口径：一列一市场</h3>\n<ul class=\"klist\">\n<li>六问可围绕一个业态、一个品类或一个国家提问，但<strong>不能打包回答</strong>——按市场或客户类型分列，一张表可能要 2–3 列，或选一个代表性区域／客户类型作答。</li>\n<li><strong>本轮先写一列</strong>（以 To B 为主），有时间再写第二列；OEM 按客户类型选一个。</li>\n<li>选样找<strong>有代表性</strong>的客户或区域：不要最新的，也不要完全没有活力的老存量。</li>\n<li>第一问不必从零写：基于 P1 已有回答向下延伸。</li>\n</ul>\n</div>\n<div class=\"mod\" id=\"s08b11\">\n<h3><span class=\"dot\"></span>价值主张五层三角</h3>\n<p>核心卖点是材质成分，还是功能？先想清楚主张落在三角形的哪一层。</p>\n<figure data-visual-id=\"value-prop-triangle\" data-visual-relation=\"核心卖点自下而上五层：功能功效→场景任务→目的→情绪情感→价值观，成长企业自下而上打\" data-visual-source=\"成长企业是自下往上打的……暂时还做不到用价值观打动\" data-visual-title=\"价值主张五层三角\" data-visual-type=\"分层三角图\">\n<svg aria-label=\"价值主张五层三角图\" role=\"img\" viewbox=\"0 0 470 306\">\n<defs>\n<marker id=\"arwVp\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"8\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0L10,5L0,10z\" fill=\"var(--accent)\"></path></marker>\n</defs>\n<line marker-end=\"url(#arwVp)\" stroke=\"var(--accent)\" stroke-width=\"2\" x1=\"40\" x2=\"40\" y1=\"272\" y2=\"64\"></line>\n<text fill=\"var(--muted)\" font-size=\"12\" text-anchor=\"middle\" transform=\"rotate(-90 24 170)\" x=\"24\" y=\"170\">自下而上打</text>\n<polygon fill=\"var(--accent)\" fill-opacity=\"0.10\" points=\"70,270 390,270 358,226 102,226\"></polygon>\n<polygon fill=\"var(--accent)\" fill-opacity=\"0.18\" points=\"102,226 358,226 326,182 134,182\"></polygon>\n<polygon fill=\"var(--accent)\" fill-opacity=\"0.28\" points=\"134,182 326,182 294,138 166,138\"></polygon>\n<polygon fill=\"var(--accent)\" fill-opacity=\"0.40\" points=\"166,138 294,138 262,94 198,94\"></polygon>\n<polygon fill=\"var(--accent)\" fill-opacity=\"0.52\" points=\"198,94 262,94 230,50\"></polygon>\n<text fill=\"var(--ink)\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"230\" y=\"247\">功能功效</text>\n<text fill=\"var(--muted)\" font-size=\"11\" text-anchor=\"middle\" x=\"230\" y=\"265\">材质 · 成分 · 功能</text>\n<text fill=\"var(--ink)\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"230\" y=\"203\">场景任务</text>\n<text fill=\"var(--muted)\" font-size=\"11\" text-anchor=\"middle\" x=\"230\" y=\"221\">帮客户完成的场景与任务</text>\n<text fill=\"var(--ink)\" font-size=\"14\" font-weight=\"700\" text-anchor=\"middle\" x=\"230\" y=\"159\">目的</text>\n<text fill=\"var(--muted)\" font-size=\"11\" text-anchor=\"middle\" x=\"230\" y=\"177\">客户要达成的目的</text>\n<line stroke=\"var(--muted)\" stroke-width=\"1\" x1=\"286\" x2=\"328\" y1=\"116\" y2=\"116\"></line>\n<text fill=\"var(--ink)\" font-size=\"13.5\" font-weight=\"700\" x=\"334\" y=\"121\">情绪情感</text>\n<line stroke=\"var(--muted)\" stroke-width=\"1\" x1=\"252\" x2=\"328\" y1=\"72\" y2=\"72\"></line>\n<text fill=\"var(--ink)\" font-size=\"13.5\" font-weight=\"700\" x=\"334\" y=\"77\">价值观追求</text>\n</svg>\n<figcaption>成长企业自下而上：先硬实力与场景，再往情绪与价值观走。</figcaption>\n</figure>\n<p>成长企业<strong>自下而上打</strong>：暂时做不了价值观品牌，先靠硬实力、产品特性，或深耕某类场景与人群来聚焦客户与价值。</p>\n</div>\n<div class=\"mod\" id=\"s08b12\">\n<h3><span class=\"dot\"></span>护城河：三类加一个底层</h3>\n<p>护城河是战略级思考，也叫<strong>战略制高点、战略控制点</strong>。三类都厉害，且不互斥。</p>\n<figure data-visual-id=\"moat-three-types\" data-visual-relation=\"资源优势（原料/关系/资质/牌照）、价值链优势（三选一）、组织与人才（水面下的底层优势）\" data-visual-source=\"企业的护城河有三大类……第一大类叫基于资源的资源优势……第三个是一个底层优势\" data-visual-title=\"护城河三大类与代表案例\" data-visual-type=\"分类案例卡\">\n<div class=\"mrow\" data-grid=\"\">\n<div class=\"mcard\">\n<header><b>① 资源优势</b><em>别人买不到的，你能买到</em></header>\n<ul>\n<li><b>原料级</b>：稀缺材质与零配件</li>\n<li><b>关系级</b>：政企等关系资源</li>\n<li><b>资质认证</b></li>\n<li><b>国家牌照</b>：最硬的一种</li>\n</ul>\n<div class=\"mfoot\">案例：奇瑞投资芯片公司获优先供给；海藻面膜原料独占缅甸一处沙滩（年产约 2 吨、自用约半吨）；中国烟草凭国家牌照年纳税约两万亿。</div>\n</div>\n<div class=\"mcard\">\n<header><b>② 价值链优势</b><em>链条某一环节上的优势</em></header>\n<ul>\n<li><b>客户亲密</b> —— 小米：米粉运营；华为早期产品不占优，先以服务补</li>\n<li><b>卓越运营</b> —— 华为：流程效率与成本优势</li>\n<li><b>产品领先</b> —— 苹果等高科技公司</li>\n</ul>\n<div class=\"mfoot\">波特「总成本领先／差异化／聚焦」是上一个时代的答案；成长型企业三选一，阶段性侧重。</div>\n</div>\n<div class=\"mcard\">\n<header><b>③ 组织与人才</b><em>藏在水面下的底层优势</em></header>\n<ul>\n<li><b>腾讯</b>：马化腾称最大的竞争力是组织进化</li>\n<li><b>理想汽车</b>：李想称核心竞争力不是产品力，是成长思维</li>\n<li><b>阿里</b>：愿景、使命、价值观驱动的组织</li>\n</ul>\n<div class=\"mfoot\">这一类不显山露水，却是长期差异的来源之一。</div>\n</div>\n</div>\n<figcaption>资源看「别人买不到」，价值链看「哪个环节强」，组织是水面下的底层优势。</figcaption>\n</figure>\n<p>对成长型企业：某些材料、零配件、技术资源或资质可能成为长期优势——<strong>外部整合或自研打造皆可</strong>。技术类优势早期多是<strong>相对护城河</strong>：持续主投、反复强调，就能形成相对差异，并证明你的专注。</p>\n</div>\n<div class=\"mod\" id=\"s08b13\">\n<h3><span class=\"dot\"></span>三份样例对齐颗粒度</h3>\n<p>讲者给出三份填写示范，把回答落到具体客户、具体主张与动作——<b>颗粒度到动作级</b>。</p>\n<figure data-visual-id=\"six-question-samples\" data-visual-relation=\"三份六问样例把回答落到具体客户、主张与动作，对齐填写颗粒度\" data-visual-source=\"某家企业按照客户类型KA……OEM的业务6问……安踏的鞋子，一个品类\" data-visual-title=\"家居KA、香氛OEM、安踏样例\" data-visual-type=\"案例对照卡\">\n<div class=\"mrow\" data-grid=\"\">\n<div class=\"mcard\">\n<header><b>家居 · KA 客户</b><em>按客户类型分列</em></header>\n<ul>\n<li><b>客户选择</b>：KA——墨西哥沃尔玛、美国山姆、折扣渠道；客户共性需求</li>\n<li><b>价值主张</b>：天然材质·竹木，同材质下成本更低</li>\n<li><b>价值获取</b>：产品／获客／毛利三问均覆盖（示范较简）</li>\n<li><b>活动范围</b>：上下游合作方</li>\n<li><b>护城河</b>：洞察能力、自动化复盘能力</li>\n<li><b>重大风险</b>：关乎生意的风险预判</li>\n</ul>\n</div>\n<div class=\"mcard\">\n<header><b>香氛 · OEM</b><em>按客户类型分列</em></header>\n<ul>\n<li><b>客户选择</b>：品牌商、中间商；香氛客户的共性需求</li>\n<li><b>价值主张</b>：新品共创——4+1+1+N 亚太研发团队</li>\n<li><b>价值获取</b>：以香氛为主，明年拓展面护类；获客方式明确</li>\n<li><b>活动范围</b>：研产销布局；上游关键供应商；自有品牌背书起价值作用</li>\n<li><b>护城河</b>：绿色制造（系列证据）；研发设备与资质；严苛客户认证（通过沃尔玛、迪士尼审核）——客户信任壁垒，并列「客户离开的理由」检验</li>\n<li><b>重大风险</b>：关乎生意的风险预判</li>\n</ul>\n</div>\n<div class=\"mcard\">\n<header><b>安踏 · 篮球鞋品类</b><em>按品类分列</em></header>\n<ul>\n<li><b>客户选择</b>：Z 世代潮流消费者、篮球运动爱好者</li>\n<li><b>价值主张</b>：国家队科技普惠化——高中生也穿得上国家队科技；主推 PG7 跑鞋、C2026 马拉松鞋</li>\n<li><b>价值获取</b>：直营门店＋即时零售（占比约 15%–20%）</li>\n<li><b>活动范围</b>：C 端销售平台伙伴；上游技术研发机构</li>\n<li><b>护城河</b>：资源技术为核心；早期属相对护城河，靠持续主投形成差异</li>\n<li><b>重大风险</b>：关乎生意的风险预判</li>\n</ul>\n</div>\n</div>\n<figcaption>三份示范均落到具体客户、主张与动作，可作填表对照。</figcaption>\n</figure>\n</div>\n</section>\n<section class=\"part\" id=\"s08b14\">\n<div class=\"ph\"><span class=\"num\">04</span><h2>工具二：人货场（To C 主用）</h2></div>\n<div class=\"mod\" id=\"s08b15\">\n<h3><span class=\"dot\"></span>人货场：六问的 C 端表达</h3>\n<figure data-visual-id=\"toc-matrix\" data-visual-relation=\"人对应客户与主张、货对应产品卖点、场对应渠道获客；业态×区域×品类立体交叉\" data-visual-source=\"人货场首先是人……它是个交叉矩阵……最终大概率靠的是产品，加上品牌力的放大\" data-visual-title=\"人货场与六问同构、三维交叉\" data-visual-type=\"对应关系图\">\n<div class=\"maprow\">\n<div class=\"chips\" style=\"margin-top:0\"><span class=\"chip\">问① 客户选择</span><span class=\"chip\">问② 价值主张</span></div>\n<div class=\"mletter\">人</div>\n<div class=\"mdesc\"><b>客户是谁、凭什么买</b><em>洞察七问、卖点在此打磨</em></div>\n</div>\n<div class=\"maprow\">\n<div class=\"chips\" style=\"margin-top:0\"><span class=\"chip\">问③ 价值获取</span></div>\n<div class=\"mletter\">货</div>\n<div class=\"mdesc\"><b>提供什么产品</b><em>卖点排序与产品迭代方向</em></div>\n</div>\n<div class=\"maprow\" style=\"border-bottom:0\">\n<div class=\"chips\" style=\"margin-top:0\"><span class=\"chip\">问④ 活动范围</span><span class=\"chip\">渠道打法</span></div>\n<div class=\"mletter\">场</div>\n<div class=\"mdesc\"><b>在哪儿卖、怎么获客</b><em>平台与渠道逐列拆解</em></div>\n</div>\n<div class=\"cband ta\" style=\"margin-top:14px\"><b>立体交叉</b><em>业态（To B / To C）× 国家·区域 × 品类，中间还藏着 C 端客群——哪根轴做到极致，哪根轴就是核心驱动力。</em></div>\n<figcaption>左右同构，立体交叉；终局看产品与品牌。</figcaption>\n</figure>\n<p>人货场与业务六问<strong>底层逻辑一模一样</strong>——换一张表，不换脑子。</p>\n<div class=\"strip s-info\"><span class=\"stag\">终局判断</span><span>公司最终大概率靠<strong>产品＋品牌力</strong>成长，而不是纯靠渠道或区域；眼下是过渡过程。欧莱雅全球一盘货、年销售额约 3000 亿（讲者举例口径）；对××亿人民币体量的企业，把 5–10 年的靶子定在 ××亿美金「不是梦」。</span></div>\n</div>\n<div class=\"mod\" id=\"s08b16\">\n<h3><span class=\"dot\"></span>卖点：特性打动选择</h3>\n<figure data-visual-id=\"selling-point-pairs\" data-visual-relation=\"共性满足刚需、讲标配基础、人人有；特性打动选择、讲稀缺差异、我独有\" data-visual-source=\"共性满足刚需嘛，特性打动选择……共性讲标配，特性讲稀缺……共性人人有，特性我独有\" data-visual-title=\"共性与特性的四组对照\" data-visual-type=\"对照词条\">\n<div class=\"pairs\">\n<div class=\"pair\" data-grid=\"\"><span class=\"l\">共性满足刚需</span><span class=\"a\">→</span><span class=\"r\">特性打动选择</span></div>\n<div class=\"pair\" data-grid=\"\"><span class=\"l\">共性讲标配</span><span class=\"a\">→</span><span class=\"r\">特性讲稀缺</span></div>\n<div class=\"pair\" data-grid=\"\"><span class=\"l\">共性讲基础</span><span class=\"a\">→</span><span class=\"r\">特性讲差异</span></div>\n<div class=\"pair\" data-grid=\"\"><span class=\"l\">共性人人有</span><span class=\"a\">→</span><span class=\"r\">特性我独有</span></div>\n</div>\n<figcaption>共性保底，特性赢选择。</figcaption>\n</figure>\n<p>卖点最好<strong>一句话</strong>，且要有独特性；写的时候做<strong>卖点排序</strong>。用户洞察七问（标签、痛点、场景需求……）可选择性回答，不必全答。</p>\n</div>\n<div class=\"mod\" id=\"s08b17\">\n<h3><span class=\"dot\"></span>行车记录仪：一个品打全链路</h3>\n<figure data-visual-id=\"dashcam-case\" data-visual-relation=\"从司机标签与暴力痛点，到5路摄像头卖点、迭代方向、分渠道打法与两类销售结构\" data-visual-source=\"第一标签……5路摄像头……价格段200美金到250美金之间……最下面一行叫做渠道销售结构，最右边叫做品类销售结构\" data-visual-title=\"行车记录仪：一个品的全链路\" data-visual-type=\"案例流程图\">\n<div>\n<div class=\"drow\"><span class=\"dn\">1</span><div><b>客户标签</b><em>网约车司机——洞察从标签、痛点、场景需求切入</em></div></div>\n<div class=\"drow\"><span class=\"dn\">2</span><div><b>痛点</b><em>暴力事件：车外拦截施暴、车内乘客施暴，责任难说清</em></div></div>\n<div class=\"drow\"><span class=\"dn\">3</span><div><b>卖点</b><em>5 路摄像头（常规最多 4 路）：车内外全方位拍摄，任一路画面一键导出给交警</em></div></div>\n<div class=\"drow\"><span class=\"dn\">4</span><div><b>产品迭代方向</b><em>便携操作、一键导出、方便拆卸</em></div></div>\n<div class=\"drow\"><span class=\"dn\">5</span><div><b>渠道分列</b><em>亚马逊｜独立站｜TK｜线下与垂类平台。亚马逊列细化：品类体量与增速、当前份额、站内/站外打法、促销活动、价格段 200–250 美金、复购策略（配件、提醒、推荐、打折券）、毛利率与业绩目标；独立站单列目标；TK 偏内部。</em></div></div>\n<div class=\"drow\"><span class=\"dn\">6</span><div><b>表格两端</b><em>最下行＝渠道销售结构；最右列＝品类销售结构</em></div></div>\n</div>\n<figcaption>从标签到销售结构，一个 SKU 的完整拆法。</figcaption>\n</figure>\n<p>同一套结构也用于智能床垫、睡眠耳机等品类；某三十多亿营收的收纳类跨境电商，「五句话」结论（如「一冲即净」）同样由人货场结构推出。</p>\n</div>\n<div class=\"mod\" id=\"s08b18\">\n<h3><span class=\"dot\"></span>品类 × 渠道：互相成就</h3>\n<figure data-visual-id=\"category-channel-cross\" data-visual-relation=\"品类结构利他、渠道结构利己，交点互相成就，因利他而利己\" data-visual-source=\"它是互相成就的关系……横向叫品类销售结构利他，纵向渠道销售结构利己，因为利他而利己\" data-visual-title=\"品类与渠道结构：互相成就\" data-visual-type=\"对照结构图\">\n<div class=\"cross\" data-grid=\"\">\n<div class=\"cband ta\"><b>品类销售结构 · 横轴</b><em>本能利他：围绕用户价值，必须经过产品定义与实现</em></div>\n<div class=\"row2\" data-grid=\"\">\n<div class=\"cband qj\"><b>渠道销售结构 · 纵轴</b><em>本能利己：做大目标，什么好卖卖什么</em></div>\n<div class=\"cband hub\"><b>互相成就</b><em>不是谁驱动谁</em></div>\n</div>\n</div>\n<figcaption>横轴利他、纵轴利己，交点互相成就。</figcaption>\n</figure>\n<p>两者像四驱车的两组轮子：<strong>都有驱动力，方向拧了就翻车</strong>——所以不是谁驱动谁。「利己还是利他」又是伪命题：<span class=\"hl\">因为利他，而利己</span>。</p>\n</div>\n</section>\n<section class=\"part\" id=\"s08b19\">\n<div class=\"ph\"><span class=\"num\">05</span><h2>产出要求：结构先行、结论说得出</h2></div>\n<div class=\"mod\" id=\"s08b20\">\n<h3><span class=\"dot\"></span>作业：左结构，右结论</h3>\n<figure data-visual-id=\"structure-conclusion\" data-visual-relation=\"左六问是结构、系统思考、钓鱼方法；右五点是结论、点状出击、5条鱼，两者都重要\" data-visual-source=\"左半部分是钓鱼的方法，右半部分是5条鱼……左半部分叫做系统思考，右半部分叫做点状出击\" data-visual-title=\"左结构·右结论的作业版式\" data-visual-type=\"对照结构图\">\n<div class=\"scwrap\" data-grid=\"\">\n<div class=\"sccard lft\">\n<h4>左 · 业务六问</h4>\n<div class=\"sctags\"><span class=\"tchip\">方法论工具</span><span class=\"tchip\">以结构促共识</span><span class=\"tchip\">系统思考</span><span class=\"tchip\">钓鱼的方法</span></div>\n<p>站在客户角度提问；「我想」在前面拉着，所以不是苟且。</p>\n</div>\n<div class=\"sccard rgt\">\n<h4>右 · 业务破局增长 5 个点</h4>\n<div class=\"sctags\"><span class=\"tchip g\">结论</span><span class=\"tchip g\">点状出击</span><span class=\"tchip g\">5 条鱼</span></div>\n<p>业务、尤其渠道营销端的关键点，与人群、品牌、市场、产品卖点、销售运营、流量获取、内容驱动相关。</p>\n</div>\n</div>\n<figcaption>共创会阶段先比结构；结论不超过 5 条。</figcaption>\n</figure>\n<p>「钓鱼方法还是鱼重要」也是伪命题：只靠运气钓到的鱼不可持续；方法再好，最终也得钓到鱼。掌握了结构，结论就更重要——<b>共创会阶段，先把结构比一遍</b>。</p>\n<div class=\"strip s-info\"><span class=\"stag\">分工记录</span><span>各组已分别按「国家」（选一国代表市场）或「客户类型」确定选样轴，组内再分做 T1、T2；B 端独立业务单独成列。</span></div>\n</div>\n<div class=\"mod\" id=\"s08b21\">\n<h3><span class=\"dot\"></span>电梯测试：三点说清</h3>\n<p>电梯里遇到公司领导，问「你们组的战略方向是什么？」——不能回答「等我打开电脑」，要能<strong>脱口说出最重要的三点</strong>。讲者公司共创当晚有敬酒环节，被问「你的战略是什么」答不出一、二、三——说明结论还不够凸显。</p>\n<div class=\"strip s-warn\"><span class=\"stag\">输出纪律</span><span>整张表充满噪音，OGSM 就退化成一份文档。<strong>字可以少，但要实</strong>——像好产品一样极致简单、拿来就用。</span></div>\n<p>用 AI 提效可以（已有小组在用），但<strong>主权握在自己手上</strong>：要有判断、多对话追问，不要一键生成照搬。</p>\n</div>\n</section>\n</div>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#f7f8fc\" height=\"512\" width=\"512\"></rect><circle cx=\"256\" cy=\"250\" fill=\"none\" r=\"192\" stroke=\"#dbe3f8\" stroke-width=\"2\"></circle><circle cx=\"205\" cy=\"212\" fill=\"#3b5bdb\" fill-opacity=\"0.16\" r=\"104\" stroke=\"#3b5bdb\" stroke-opacity=\"0.55\" stroke-width=\"3\"></circle><circle cx=\"307\" cy=\"212\" fill=\"#4c6ef5\" fill-opacity=\"0.16\" r=\"104\" stroke=\"#4c6ef5\" stroke-opacity=\"0.55\" stroke-width=\"3\"></circle><circle cx=\"256\" cy=\"296\" fill=\"#748ffc\" fill-opacity=\"0.16\" r=\"104\" stroke=\"#748ffc\" stroke-opacity=\"0.6\" stroke-width=\"3\"></circle><circle cx=\"256\" cy=\"240\" fill=\"#3b5bdb\" r=\"14\"></circle></svg></template>\n<script>\n(function(){\n  var T=document.getElementById('rT'),P=document.getElementById('rP'),C=document.getElementById('rC'),R=document.getElementById('rR');\n  var oT=document.getElementById('oT'),oP=document.getElementById('oP'),oC=document.getElementById('oC'),oR=document.getElementById('oR');\n  var flow=document.getElementById('flowOut'),chain=document.getElementById('chainOut');\n  function fmtFlow(n){\n    if(n>=1e8){var v=(n/1e8).toFixed(2).replace(/\\.?0+$/,'');return '≈ '+v+' 亿';}\n    if(n>=1e4){return '≈ '+Math.round(n/1e4).toLocaleString('zh-CN')+' 万';}\n    return '≈ '+Math.round(n).toLocaleString('zh-CN');\n  }\n  function calc(){\n    var t=+T.value,p=+P.value,c=+C.value,r=+R.value;\n    oT.textContent=t.toFixed(1)+' 亿';\n    oP.textContent=p+' 元';\n    oC.textContent=c+' %';\n    oR.textContent=r.toFixed(1);\n    var per=p*(c/100)*r;\n    flow.textContent=fmtFlow(t*1e8/per)+' 人次';\n    chain.textContent=c+' % × '+p+' 元 × '+r.toFixed(1)+' ＝ '+per.toFixed(1)+' 元/人次';\n  }\n  [T,P,C,R].forEach(function(el){el.addEventListener('input',calc);});\n  calc();\n})();\n<\/script>\n","blocks":[{"id":"s08b01","type":"part","heading":"会议坐标：从方向到打法","text":"01\n会议坐标：从方向到打法"},{"id":"s08b02","type":"mod","heading":"P2 的位置：三步解码","text":"P2 的位置：三步解码\n战略方向经过前几轮讨论已大体明确；部门 OGSM、年度目标、预算、产品规划要等解码之后再落笔。当前步骤：\nP2 解码业务打法\n。\nP1\n我 想\n公司使命愿景 · 各业态大方向\n已完成\n→\n↓\nP2\n解码业务打法\n他需：客户与市场需求 → 销售打法\n进行中\n→\n↓\nP3\n我 能\n自身资源与实现能力\n待启动\n→\n↓\n汇总\n战略地图＋部门目标\n三环合一，每个业态一份\n产出物\nP2 进行中：他需侧的业务打法解码；P1 已完成，P3 与汇总在后。（此处 P1/P2/P3 指「我想·他需·我能」三环解码，与附录A 战役七步法的 P1–P7 不是同一套编号。）（此处 P1/P2/P3 指「我想·他需·我能」三环解码，与附录A 战役七步法的 P1–P7 不是同一套编号。）\n统一口径\n从现在起整体\n面向一年\n：基于三年的大方向，想一年内可落地的动作——此前部分讨论面向三年、部分面向一年，就此拉齐。"},{"id":"s08b03","type":"mod","heading":"战略在平衡中决策","text":"战略在平衡中决策\n战略的难度与艺术性，在于\n平衡与取舍中做决策\n：我想是理想，他需与我能是现实；既有由外而内，也有由内而外——既要量力而为，又要围绕我想与他需刻意而为。\n我 想\n理想 · 大方向\n他 需\n客户 · 市场（偏区域）\n我 能\n资源与实现能力\n最佳战略\n只取「我想」＝白日做梦\n只取「他需」＝苟且\n只取「我能」＝自嗨\n三环交汇处才是战略；失衡的三个词对应三种空想。\n会场提醒\n心有全局，想着终局；想着 100 分，做 50 分的事——这样才能\n心态好、情绪稳定\n。"},{"id":"s08b04","type":"part","heading":"生意思维：先分清流量与生意","text":"02\n生意思维：先分清流量与生意"},{"id":"s08b05","type":"mod","heading":"什么叫做生意","text":"什么叫做生意\n会场回答逐层递进：\n赚钱\n→\n持续赚钱\n→\n有买有卖（供需）\n→\n可复制的能力 × 可复制的市场\n→\n短期解掉，长期看好\n收敛成一句：\n好的生意思维，是基于战略的生意思维\n；不基于战略，就只剩赚钱本身。有学员转述其老板的话：「生意，就是生生不息的意义。」\n前提假设\n战略已一定程度逼近真相；但战略只能\n逼近真相\n，没法彻底弄清——因为环境也在变。"},{"id":"s08b06","type":"mod","heading":"营收公式：流量思维的账","text":"营收公式：流量思维的账\n营收\n＝\n流量\n×\n转化率\n×\n客单价\n×\n复购率\n判定\n严格说，这不是生意——是\n流量驱动、销售驱动\n，「上一个时代的表达」，基于平台规则。To B 同构：流量＝获客渠道与客户名单，漏斗开口越大、转化越多。\n公式可倒推资源，但它是流量思维的账，不是生意的本质。\n公式的用处是\n倒推资源\n：明年目标 1 亿还是 1.5 亿，倒着算就知道要买多少流量、营销费给多少——至少 C 端可直接倒推。\n倒推示例 · 演示参数\n目标营收\n1.0 亿\n客单价\n200 元\n转化率\n3 %\n复购率\n1.2\n所需流量\n≈ 1,389 万\n3 % × 200 元 × 1.2 ＝ 7.2 元/人次\n示例参数仅演示倒推逻辑；提客单、提转化、提复购，任何一项提升都能省下流量。\n改动任一假设，所需流量随之变化；这是算资源的账。"},{"id":"s08b07","type":"mod","heading":"从收割到利他","text":"从收割到利他\n种收一起\n· 看到内容\n→\n视频下方链接，直接下单\n种收分离\n· 小红书看到内容\n→\n退出 → 打开天猫 → 下单\n两种转化路径：种收分离把「收」的动作切到了另一处。\n收割\n是流量经济时代的词——种草为了收割，\n非常利己\n；比它更难听的是「反复收割」。一头把「用户第一」写进价值观，一头讲收割，这是自相矛盾。\n好的生意思维强调\n利客户、利他\n——这正是下一节业务六问从「客户是谁」问起的原因。"},{"id":"s08b08","type":"part","heading":"工具一：业务六问（To B 主用）","text":"03\n工具一：业务六问（To B 主用）"},{"id":"s08b09","type":"mod","heading":"业务六问：一条因果链","text":"业务六问：一条因果链\n讲者称它是「全世界最好的业务逻辑梳理工具」，已被反复验证。组织只有两种逻辑：\n向外求增长的业务逻辑\n与\n向内求增效的管理逻辑\n——六问梳理的是前者。\n1\n客户选择\n谁是我们的客户／用户？需求重点与期待是什么？（选一类细分，颗粒度比上一轮更细）\n定位客户与需求\n不洞察①，产不出②\n2\n价值主张（购买理由）\n客户为什么买我？——聚焦一个独特的优势价值\n聚焦独特价值\n②不清，③做不好\n3\n价值获取\n提供什么产品？如何获客？如何保证盈利毛利？\n产品·获客·毛利\n③做不好，④难合作\n4\n活动范围\n上下游有哪些合作方与渠道？——研发技术、IP 联名、人才租赁、代理商\n构建合作生态\n5\n护城河\n跟竞争对手比有什么不同？如何拦住对手、更容易拿到订单？\n赢得竞争\n6\n重大风险\n业务甚至公司可能遇到什么生死问题？——C 端常因一个问题关店两三个月\n兜底\n①–④因果传导；⑤的本质是赢得竞争，⑥兜底——一招不慎，全盘皆输。\n会场提醒\n「六问哪个最重要」多半是\n伪命题\n——先辨识问题真假，再作答。落到具体业态的当前阶段，它就成了真命题：OEM 现阶段重在价值主张，To C 现阶段重在购买理由（本质是赢得客户）。\n三天主线\n战略的本质，就是围绕\n客户价值\n与\n竞争优势\n。"},{"id":"s08b10","type":"mod","heading":"填表口径：一列一市场","text":"填表口径：一列一市场\n六问可围绕一个业态、一个品类或一个国家提问，但\n不能打包回答\n——按市场或客户类型分列，一张表可能要 2–3 列，或选一个代表性区域／客户类型作答。\n本轮先写一列\n（以 To B 为主），有时间再写第二列；OEM 按客户类型选一个。\n选样找\n有代表性\n的客户或区域：不要最新的，也不要完全没有活力的老存量。\n第一问不必从零写：基于 P1 已有回答向下延伸。"},{"id":"s08b11","type":"mod","heading":"价值主张五层三角","text":"价值主张五层三角\n核心卖点是材质成分，还是功能？先想清楚主张落在三角形的哪一层。\n自下而上打\n功能功效\n材质 · 成分 · 功能\n场景任务\n帮客户完成的场景与任务\n目的\n客户要达成的目的\n情绪情感\n价值观追求\n成长企业自下而上：先硬实力与场景，再往情绪与价值观走。\n成长企业\n自下而上打\n：暂时做不了价值观品牌，先靠硬实力、产品特性，或深耕某类场景与人群来聚焦客户与价值。"},{"id":"s08b12","type":"mod","heading":"护城河：三类加一个底层","text":"护城河：三类加一个底层\n护城河是战略级思考，也叫\n战略制高点、战略控制点\n。三类都厉害，且不互斥。\n① 资源优势\n别人买不到的，你能买到\n原料级\n：稀缺材质与零配件\n关系级\n：政企等关系资源\n资质认证\n国家牌照\n：最硬的一种\n案例：奇瑞投资芯片公司获优先供给；海藻面膜原料独占缅甸一处沙滩（年产约 2 吨、自用约半吨）；中国烟草凭国家牌照年纳税约两万亿。\n② 价值链优势\n链条某一环节上的优势\n客户亲密\n—— 小米：米粉运营；华为早期产品不占优，先以服务补\n卓越运营\n—— 华为：流程效率与成本优势\n产品领先\n—— 苹果等高科技公司\n波特「总成本领先／差异化／聚焦」是上一个时代的答案；成长型企业三选一，阶段性侧重。\n③ 组织与人才\n藏在水面下的底层优势\n腾讯\n：马化腾称最大的竞争力是组织进化\n理想汽车\n：李想称核心竞争力不是产品力，是成长思维\n阿里\n：愿景、使命、价值观驱动的组织\n这一类不显山露水，却是长期差异的来源之一。\n资源看「别人买不到」，价值链看「哪个环节强」，组织是水面下的底层优势。\n对成长型企业：某些材料、零配件、技术资源或资质可能成为长期优势——\n外部整合或自研打造皆可\n。技术类优势早期多是\n相对护城河\n：持续主投、反复强调，就能形成相对差异，并证明你的专注。"},{"id":"s08b13","type":"mod","heading":"三份样例对齐颗粒度","text":"三份样例对齐颗粒度\n讲者给出三份填写示范，把回答落到具体客户、具体主张与动作——\n颗粒度到动作级\n。\n家居 · KA 客户\n按客户类型分列\n客户选择\n：KA——墨西哥沃尔玛、美国山姆、折扣渠道；客户共性需求\n价值主张\n：天然材质·竹木，同材质下成本更低\n价值获取\n：产品／获客／毛利三问均覆盖（示范较简）\n活动范围\n：上下游合作方\n护城河\n：洞察能力、自动化复盘能力\n重大风险\n：关乎生意的风险预判\n香氛 · OEM\n按客户类型分列\n客户选择\n：品牌商、中间商；香氛客户的共性需求\n价值主张\n：新品共创——4+1+1+N 亚太研发团队\n价值获取\n：以香氛为主，明年拓展面护类；获客方式明确\n活动范围\n：研产销布局；上游关键供应商；自有品牌背书起价值作用\n护城河\n：绿色制造（系列证据）；研发设备与资质；严苛客户认证（通过沃尔玛、迪士尼审核）——客户信任壁垒，并列「客户离开的理由」检验\n重大风险\n：关乎生意的风险预判\n安踏 · 篮球鞋品类\n按品类分列\n客户选择\n：Z 世代潮流消费者、篮球运动爱好者\n价值主张\n：国家队科技普惠化——高中生也穿得上国家队科技；主推 PG7 跑鞋、C2026 马拉松鞋\n价值获取\n：直营门店＋即时零售（占比约 15%–20%）\n活动范围\n：C 端销售平台伙伴；上游技术研发机构\n护城河\n：资源技术为核心；早期属相对护城河，靠持续主投形成差异\n重大风险\n：关乎生意的风险预判\n三份示范均落到具体客户、主张与动作，可作填表对照。"},{"id":"s08b14","type":"part","heading":"工具二：人货场（To C 主用）","text":"04\n工具二：人货场（To C 主用）"},{"id":"s08b15","type":"mod","heading":"人货场：六问的 C 端表达","text":"人货场：六问的 C 端表达\n问① 客户选择\n问② 价值主张\n人\n客户是谁、凭什么买\n洞察七问、卖点在此打磨\n问③ 价值获取\n货\n提供什么产品\n卖点排序与产品迭代方向\n问④ 活动范围\n渠道打法\n场\n在哪儿卖、怎么获客\n平台与渠道逐列拆解\n立体交叉\n业态（To B / To C）× 国家·区域 × 品类，中间还藏着 C 端客群——哪根轴做到极致，哪根轴就是核心驱动力。\n左右同构，立体交叉；终局看产品与品牌。\n人货场与业务六问\n底层逻辑一模一样\n——换一张表，不换脑子。\n终局判断\n公司最终大概率靠\n产品＋品牌力\n成长，而不是纯靠渠道或区域；眼下是过渡过程。欧莱雅全球一盘货、年销售额约 3000 亿（讲者举例口径）；对××亿人民币体量的企业，把 5–10 年的靶子定在 ××亿美金「不是梦」。"},{"id":"s08b16","type":"mod","heading":"卖点：特性打动选择","text":"卖点：特性打动选择\n共性满足刚需\n→\n特性打动选择\n共性讲标配\n→\n特性讲稀缺\n共性讲基础\n→\n特性讲差异\n共性人人有\n→\n特性我独有\n共性保底，特性赢选择。\n卖点最好\n一句话\n，且要有独特性；写的时候做\n卖点排序\n。用户洞察七问（标签、痛点、场景需求……）可选择性回答，不必全答。"},{"id":"s08b17","type":"mod","heading":"行车记录仪：一个品打全链路","text":"行车记录仪：一个品打全链路\n1\n客户标签\n网约车司机——洞察从标签、痛点、场景需求切入\n2\n痛点\n暴力事件：车外拦截施暴、车内乘客施暴，责任难说清\n3\n卖点\n5 路摄像头（常规最多 4 路）：车内外全方位拍摄，任一路画面一键导出给交警\n4\n产品迭代方向\n便携操作、一键导出、方便拆卸\n5\n渠道分列\n亚马逊｜独立站｜TK｜线下与垂类平台。亚马逊列细化：品类体量与增速、当前份额、站内/站外打法、促销活动、价格段 200–250 美金、复购策略（配件、提醒、推荐、打折券）、毛利率与业绩目标；独立站单列目标；TK 偏内部。\n6\n表格两端\n最下行＝渠道销售结构；最右列＝品类销售结构\n从标签到销售结构，一个 SKU 的完整拆法。\n同一套结构也用于智能床垫、睡眠耳机等品类；某三十多亿营收的收纳类跨境电商，「五句话」结论（如「一冲即净」）同样由人货场结构推出。"},{"id":"s08b18","type":"mod","heading":"品类 × 渠道：互相成就","text":"品类 × 渠道：互相成就\n品类销售结构 · 横轴\n本能利他：围绕用户价值，必须经过产品定义与实现\n渠道销售结构 · 纵轴\n本能利己：做大目标，什么好卖卖什么\n互相成就\n不是谁驱动谁\n横轴利他、纵轴利己，交点互相成就。\n两者像四驱车的两组轮子：\n都有驱动力，方向拧了就翻车\n——所以不是谁驱动谁。「利己还是利他」又是伪命题：\n因为利他，而利己\n。"},{"id":"s08b19","type":"part","heading":"产出要求：结构先行、结论说得出","text":"05\n产出要求：结构先行、结论说得出"},{"id":"s08b20","type":"mod","heading":"作业：左结构，右结论","text":"作业：左结构，右结论\n左 · 业务六问\n方法论工具\n以结构促共识\n系统思考\n钓鱼的方法\n站在客户角度提问；「我想」在前面拉着，所以不是苟且。\n右 · 业务破局增长 5 个点\n结论\n点状出击\n5 条鱼\n业务、尤其渠道营销端的关键点，与人群、品牌、市场、产品卖点、销售运营、流量获取、内容驱动相关。\n共创会阶段先比结构；结论不超过 5 条。\n「钓鱼方法还是鱼重要」也是伪命题：只靠运气钓到的鱼不可持续；方法再好，最终也得钓到鱼。掌握了结构，结论就更重要——\n共创会阶段，先把结构比一遍\n。\n分工记录\n各组已分别按「国家」（选一国代表市场）或「客户类型」确定选样轴，组内再分做 T1、T2；B 端独立业务单独成列。"},{"id":"s08b21","type":"mod","heading":"电梯测试：三点说清","text":"电梯测试：三点说清\n电梯里遇到公司领导，问「你们组的战略方向是什么？」——不能回答「等我打开电脑」，要能\n脱口说出最重要的三点\n。讲者公司共创当晚有敬酒环节，被问「你的战略是什么」答不出一、二、三——说明结论还不够凸显。\n输出纪律\n整张表充满噪音，OGSM 就退化成一份文档。\n字可以少，但要实\n——像好产品一样极致简单、拿来就用。\n用 AI 提效可以（已有小组在用），但\n主权握在自己手上\n：要有判断、多对话追问，不要一键生成照搬。"}]},{"num":9,"id":"s09","title":"围绕购买理由：击穿场景，连成一条路","date":"2026年11月10日","css":"@media(max-width:600px){\n#sv > main:nth-child(9){padding-left:0!important;padding-right:0!important}\n}\n*{box-sizing:border-box;margin:0;padding:0}\n#sv{\n  color-scheme:light dark;\n  --page-bg:#F4F6F9;\n  --surface:#FFFFFF;\n  --text:#1 pacing:.01em}\n.module p{margin-bottom:10px}\n.module p:last-of-type{margin-bottom:0}\nstrong{font-weight:650}\n.acc{color:var(--accent);font-weight:650}\n.note{font-size:13px;color:var(--muted);background:var(--note-bg);border-radius:9px;padding:10px 13px;margin-top:14px;line-height:1.65}\n.note b{color:var(--text)}\n.insight{display:flex;gap:10px;align-items:flex-start;background:var(--note-bg);border-radius:10px;padding:11px 14px;margin-top:16px;font-size:13.5px;color:var(--muted);line-height:1.65}\n.insight .tag{flex:none;color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.1em;padding-top:2px}\nfigure{margin:16px 0 0}\n.fig-scroll{overflow-x:auto;padding-bottom:4px}\n.viz svg{display:block;height:auto;margin:0 auto}\n.w380{width:100%;max-width:430px;min-width:380px}\n.w430{width:100%;max-width:560px;min-width:430px}\n.w480{width:100%;max-width:640px;min-width:480px}\nfigcaption{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.6}\n/* hub */\n.lnk{stroke:var(--figure);stroke-width:1.4}\n.sat rect{fill:var(--note-bg);stroke:var(--border)}\n.sat text{font-size:14px;fill:var(--text);text-anchor:middle;font-weight:500}\n.hub-c{fill:var(--accent-weak);stroke:var(--accent);stroke-width:1.6}\n.hub-t{font-size:18px;font-weight:700;fill:var(--text);text-anchor:middle}\n.hub-s{font-size:13px;font-weight:600;fill:var(--accent);text-anchor:middle}\n/* scene banner + steps */\n.scene-banner{display:flex;gap:10px;align-items:baseline;background:var(--accent-weak);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px;flex-wrap:wrap}\n.sb-tag{flex:none;background:var(--accent);color:var(--accent-contrast);font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;letter-spacing:.05em}\n.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}\n.step{border:1px solid var(--border);border-radius:10px;padding:13px 12px 11px}\n.step .n{display:inline-flex;width:22px;height:22px;border-radiu 4px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n</style>\n<style id=\"recording-agent-first-viewport-safety\">\nbody > :first-child { margin-top: 0 !important; }\n:where(body, body > main, [class*=\"shell\"], [class*=\"container\"]) > :where(\n  [class*=\"hero\"], [class*=\"cover\"], [data-hero]\n):first-child {\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px) {\n  :where(body, body > main, [class*=\"shell\"], [class*=\"container\"]) > :where(\n    [class*=\"hero\"], [class*=\"cover\"], [data-hero]\n  ):first-child { padding-top: 20px !important; }\n}\n</style>\n<main class=\"wrap\">\n<header class=\"page-head\">\n<p class=\"kicker\">营销策略研讨 · 纪要</p>\n<h1>围绕购买理由：击穿场景，连成一条路</h1>\n<p class=\"lede\">大窑怎么用一瓶汽水击穿聚餐场景，北冰洋为什么只是“好喝”，音频产品又该在哪条路线上出列——这场研讨给出一条主线：一切围绕购买理由。</p>\n</header>\n<div class=\"part-head\"><span class=\"part-tag\">Part 1</span><h2>方法主线</h2><span class=\"part-line\"></span></div>\n<article class=\"module\" id=\"s09b01\">\n<h3>一切围绕购买理由</h3>\n<p>品牌传播、内容创意、产品开发、产品包装，是<strong>同一件事</strong>：全部围绕<span class=\"acc\">购买理由</span>展开；购买理由指向目标人群。</p>\n<p>聚焦购买理由之后，才能与场景、产品形成联动——<span class=\"acc\">场景产品</span>的本质，是设计消费者的选择逻辑。</p>\n<figure class=\"viz\" data-visual-id=\"purchase-reason-hub\" data-visual-relation=\"品牌传播、内容创意、产品开发、产品包装均围绕购买理由，购买理由指向人群\" data-visual-source=\"所有品牌传播内容创意、产品开发、产品包装都是一件事，全部围绕购买理由，购买理由指向那个人群\" data-visual-title=\"一切围绕购买理由\" data-visual-type=\"关系示意图\">\n<div class=\"fig-scroll\">\n<svg aria-label=\"购买理由居中，四项工作围绕它，并指向人群\" class=\"w380\" role=\"img\" viewbox=\"0 0 380 300\">\n<line class=\"lnk\" x1=\"122\" x2=\"226\" y1=\"47\" y2=\"114\"></line>\n<line class=\"lnk\" x1=\"122\" x2=\"219\" y1=\"117\" y2=\"134\"></line>\n<line class=\"lnk\" x1=\"122\" x2=\"220\" y1=\"187\" y2=\"158\"></line>\n<line class=\"lnk\" x1=\"122\" x2=\"229\" y1=\"257\" y2=\"176\"></line>\n<g class=\"sat\">\n<rect height=\"34\" rx=\"17\" width=\"108\" x=\"14\" y=\"30\"></rect><text x=\"68\" y=\"52\">品牌传播</text>\n<rect height=\"34\" rx=\"17\" width=\"108\" x=\"14\" y=\"100\"></rect><text x=\"68\" y=\"122\">内容创意</text>\n<rect height=\"34\" rx=\"17\" width=\"108\" x=\"14\" y=\"170\"></rect><text x=\"68\" y=\"192\">产品开发</text>\n<rect height=\"34\" rx=\"17\" width=\"108\" x=\"14\" y=\"240\"></rect><text x=\"68\" y=\"262\">产品包装</text>\n</g>\n<circle class=\"hub-c\" cx=\"272\" cy=\"143\" r=\"54\"></circle>\n<text class=\"hub-t\" x=\"272\" y=\"139\">购买理由</text>\n<text class=\"hub-s\" x=\"272\" y=\"163\">指向人群</text>\n</svg>\n</div>\n</figure>\n</article>\n<div class=\"part-head\"><span class=\"part-tag\">Part 2</span><h2>大窑案例</h2><span class=\"part-line\"></span></div>\n<article class=\"module\" id=\"s09b02\">\n<h3>四步击穿聚餐欢愉场景</h3>\n<figure class=\"viz\" data-visual-id=\"dayao-scene-flow\" data-visual-relation=\"选场景→锚产品→抢渠道→绑传播，全部围绕聚餐欢愉场景展开\" data-visual-source=\"大窑主打聚餐欢愉场景，喝酒不开车开车喝大窑，660ml主流产品，地推占领烧烤摊市占目标百分百\" data-visual-title=\"大窑：四步击穿聚餐欢愉场景\" data-visual-type=\"流程图\">\n<div class=\"scene-banner\"><span class=\"sb-tag\">主攻场景</span><span>中国人的“聚餐欢愉”——烧烤摊最典型，小餐馆同样适用</span></div>\n<div class=\"steps\" data-grid=\"\" data-keep-columns=\"\">\n<div class=\"step\"><span class=\"n\">1</span><b>选场景</b><p>不打解渴解腻，不靠汽水带酒感，只打聚餐欢愉</p></div>\n<div class=\"step\"><span class=\"n\">2</span><b>锚产品</b><p>660ml 大瓶作主流产品，瓶型避开啤酒感</p></div>\n<div class=\"step\"><span class=\"n\">3</span><b>抢渠道</b><p>北方烧烤摊地推，市占目标 100%：占领所有烧烤摊</p></div>\n<div class=\"step\"><span class=\"n\">4</span><b>绑传播</b><p>“喝酒不开车，开车喝大窑”</p></div>\n</div>\n</figure>\n<p class=\"note\">现场核对：大窑在北方更常见，广东较少，主要在西安一带。</p>\n</article>\n<article class=\"module\" id=\"s09b03\">\n<h3>660ml：为倒圈共享而设计</h3>\n<p>容量与瓶型一起服务<strong>共享</strong>：<span class=\"acc\">660ml</span> 可供 5 人倒两圈、10 人倒一圈——这个节奏是现场实测过的。对照组北冰洋走小瓶单人逻辑：330/270ml 一小支，每人一个杯子倒着喝。</p>\n<p>瓶型两头都不靠：不像啤酒瓶，也不学北冰洋的小巧高端路线。价格口径：北冰洋“3 块多”是网购价，不是店里零售价。</p>\n<figure class=\"viz\" data-visual-id=\"bottle-capacity-bars\" data-visual-relation=\"大窑660ml大于500ml啤酒与北冰洋330ml，容量为聚餐共享倒杯设计\" data-visual-source=\"660ml比500ml啤酒更多，北冰洋330还是270ml 3块多一支，5个人倒两圈10个人倒一圈\" data-visual-title=\"瓶型容量对比\" data-visual-type=\"条形图\">\n<div class=\"bars\">\n<div class=\"bar-row\" data-grid=\"\"><span class=\"bar-label\">大窑汽水 · 主流</span><div class=\"bar acc\" style=\"width:100%\"><span>660ml</span></div></div>\n<div class=\"bar-row\" data-grid=\"\"><span class=\"bar-label\">啤酒（参照）</span><div class=\"bar\" style=\"width:75.8%\"><span>500ml</span></div></div>\n<div class=\"bar-row\" data-grid=\"\"><span class=\"bar-label\">北冰洋（小瓶）</span><div class=\"bar\" style=\"width:50%\"><span>330 / 270ml</span></div></div>\n</div>\n<figcaption>按容量等比绘制，条长与毫升数成正比。</figcaption>\n</figure>\n</article>\n<div class=\"part-head\"><span class=\"part-tag\">Part 3</span><h2>出列效应</h2><span class=\"part-line\"></span></div>\n<article class=\"module\" id=\"s09b04\">\n<h3>更好喝，只是兜底</h3>\n<p>现场公认：北冰洋比大窑好喝一点。但“更好、更便宜、更安全”属于<span class=\"acc\">兜底</span>——放到音频产品上，这只是“边界”，不构成胜负手。要追求的是差异性、特征化，主讲人称之为<span class=\"acc\">出列</span>：<strong>把特性做深做透</strong>。</p>\n<p>像阅兵方阵里先出列的三人：扛旗的居中、护旗手在侧，多迈一步——全世界的镜头只盯出列的地方。</p>\n<figure class=\"viz\" data-visual-id=\"step-out-parade\" data-visual-relation=\"同质方阵中先出列的三人吸引全部镜头，喻指把特性做深做透形成差异\" data-visual-source=\"天安门广场阅兵喊一声出列，方阵出三人，中间扛国旗旁两护旗手，全世界的眼光只盯着出列的地方\" data-visual-title=\"出列效应：阅兵方阵比喻\" data-visual-type=\"比喻示意图\">\n<div class=\"fig-scroll\">\n<svg aria-label=\"阅兵比喻：同质方阵中三人出列，镜头聚焦出列处\" class=\"w430\" role=\"img\" viewbox=\"0 0 430 260\">\n<defs>\n<g id=\"pw-soldier\"><circle cx=\"0\" cy=\"-13\" r=\"4.2\"></circle><rect height=\"21\" rx=\"4\" width=\"10\" x=\"-5\" y=\"-8\"></rect></g>\n</defs>\n<polygon class=\"cone\" points=\"394,142 228,98 228,192\"></polygon>\n<g class=\"rank\">\n<use href=\"#pw-soldier\" x=\"30\" y=\"66\"></use><use href=\"#pw-soldier\" x=\"62\" y=\"66\"></use><use href=\"#pw-soldier\" x=\"94\" y=\"66\"></use><use href=\"#pw-soldier\" x=\"126\" y=\"66\"></use><use href=\"#pw-soldier\" x=\"158\" y=\"66\"></use><use href=\"#pw-soldier\" x=\"190\" y=\"66\"></use>\n<use href=\"#pw-soldier\" x=\"30\" y=\"104\"></use><use href=\"#pw-soldier\" x=\"62\" y=\"104\"></use><use href=\"#pw-soldier\" x=\"94\" y=\"104\"></use><use href=\"#pw-soldier\" x=\"126\" y=\"104\"></use><use href=\"#pw-soldier\" x=\"158\" y=\"104\"></use><use href=\"#pw-soldier\" x=\"190\" y=\"104\"></use>\n<use href=\"#pw-soldier\" x=\"30\" y=\"142\"></use><use href=\"#pw-soldier\" x=\"62\" y=\"142\"></use><use href=\"#pw-soldier\" x=\"94\" y=\"142\"></use><use href=\"#pw-soldier\" x=\"126\" y=\"142\"></use><use href=\"#pw-soldier\" x=\"158\" y=\"142\"></use><use href=\"#pw-soldier\" x=\"190\" y=\"142\"></use>\n<use href=\"#pw-soldier\" x=\"30\" y=\"180\"></use><use href=\"#pw-soldier\" x=\"62\" y=\"180\"></use><use href=\"#pw-soldier\" x=\"94\" y=\"180\"></use><use href=\"#pw-soldier\" x=\"126\" y=\"180\"></use><use href=\"#pw-soldier\" x=\"158\" y=\"180\"></use><use href=\"#pw-soldier\" x=\"190\" y=\"180\"></use>\n<use href=\"#pw-soldier\" x=\"30\" y=\"218\"></use><use href=\"#pw-soldier\" x=\"62\" y=\"218\"></use><use href=\"#pw-soldier\" x=\"94\" y=\"218\"></use><use href=\"#pw-soldier\" x=\"126\" y=\"218\"></use><use href=\"#pw-soldier\" x=\"158\" y=\"218\"></use><use href=\"#pw-soldier\" x=\"190\" y=\"218\"></use>\n</g>\n<path class=\"chev\" d=\"M206 134 L215 142 L206 150\"></path>\n<path class=\"chev\" d=\"M213 132 L223 142 L213 152\"></path>\n<g class=\"trio\">\n<use href=\"#pw-soldier\" x=\"232\" y=\"104\"></use>\n<use href=\"#pw-soldier\" x=\"232\" y=\"142\"></use>\n<use href=\"#pw-soldier\" x=\"232\" y=\"180\"></use>\n</g>\n<line class=\"pole\" x1=\"238\" x2=\"238\" y1=\"132\" y2=\"88\"></line>\n<path class=\"flagp\" d=\"M238 88 L260 95 L238 102 Z\"></path>\n<g class=\"cam\">\n<rect height=\"8\" rx=\"2\" width=\"13\" x=\"400\" y=\"121\"></rect>\n<rect height=\"26\" rx=\"5\" width=\"30\" x=\"392\" y=\"128\"></rect>\n<circle class=\"lens\" cx=\"401\" cy=\"141\" r=\"5.5\"></circle>\n</g>\n<text class=\"lbl-svg\" x=\"110\" y=\"248\">同质方阵</text>\n<text class=\"trio-lbl\" x=\"245\" y=\"78\">出列的三人</text>\n<text class=\"lbl-svg\" x=\"407\" y=\"172\">镜头</text>\n</svg>\n</div>\n<figcaption>方阵喻同质化竞争；先出列、被镜头锁定的三人，喻指把特性做深做透——“全世界的眼光只盯着出列的地方”。</figcaption>\n</figure>\n<div class=\"insight\"><span class=\"tag\">洞察</span><span>口味更好的北冰洋没有赢下聚餐场景，赢的是把“聚餐欢愉”做深做透的大窑——兜底与出列，同一个案例给出对照。</span></div>\n</article>\n<div class=\"part-head\"><span class=\"part-tag\">Part 4</span><h2>路线与落地</h2><span class=\"part-line\"></span></div>\n<article class=\"module\" id=\"s09b05\">\n<h3>人群不够，叠加差异化</h3>\n<p>这组观点给到做音频产品的团队，对全公司也有代表性。“年轻的、潮流的、有态度的年轻人”是<strong>人群描述</strong>，但差异性不足。人群自身差异足够时，一个就够；不足时，要在人群内叠加新的差异化。现场给出两条路线。</p>\n<div class=\"routes\" data-grid=\"\">\n<div class=\"route\"><span class=\"rt\">路线一</span><b>技术自研</b><p>像此前提到的 多麦克风头戴耳机一样走自研，与某头部品牌同路线（转写待核）：技术领先，形成技术壁垒。</p></div>\n<div class=\"route\"><span class=\"rt\">路线二</span><b>面向场景的智能化</b><p>智能化时代是“面向某些场景的智能化”——人群 × 场景 × 技术路线的组合。</p></div>\n</div>\n<div class=\"note\"><b>类比与追问：</b>机械手表是纯自研的传统路线，Apple Watch 是智能化路线。智能化要反复迭代，老款怎么办？——智能化产品本就要迭代，人买的正是不断迭代，年轻人更是如此，不迭代才卖不动。</div>\n</article>\n<article class=\"module\" id=\"s09b06\">\n<h3>把分叉连成一条路</h3>\n<p>产品化创新多数时候不是没有思路，而是思路没有连成路线。<strong>客户聚焦、品牌、渠道与产品差异化布局</strong>——每个节点都有多个分叉；要做的是在分叉里各选定一个，连成一条清晰的路。</p>\n<figure class=\"viz\" data-visual-id=\"route-forks\" data-visual-relation=\"客户聚焦、品牌、渠道与产品差异化各有多个分叉，选定后连成一条清晰路线\" data-visual-source=\"每一个节点都有多个分叉，客户聚焦、品牌、渠道产品差异化布局都有多个分叉，找到一条路线连接起来变成一条路\" data-visual-title=\"分叉连路：把思路连成一条路线\" data-visual-type=\"分叉路线示意图\">\n<div class=\"fig-scroll\">\n<svg aria-label=\"三个决策节点各有多个分叉，一条示意路线把它们连起来\" class=\"w480\" role=\"img\" viewbox=\"0 0 480 290\">\n<path class=\"f-route\" d=\"M62 146 Q 146 48 230 152\"></path>\n<path class=\"f-route\" d=\"M230 152 Q 330 46 416 146\"></path>\n<text class=\"f-route-t\" x=\"239\" y=\"44\">连成一条路（示意）</text>\n<path class=\"f-lnk\" d=\"M62 178 L86 246\"></path>\n<path class=\"f-lnk\" d=\"M132 178 L100 246\"></path>\n<path class=\"f-lnk\" d=\"M172 178 L112 246\"></path>\n<path class=\"f-lnk\" d=\"M196 178 L214 246\"></path>\n<path class=\"f-lnk\" d=\"M230 178 L230 246\"></path>\n<path class=\"f-lnk\" d=\"M264 178 L246 246\"></path>\n<path class=\"f-lnk\" d=\"M319 178 L356 246\"></path>\n<path class=\"f-lnk\" d=\"M416 178 L394 246\"></path>\n<rect class=\"f-opt\" height=\"28\" rx=\"14\" width=\"56\" x=\"34\" y=\"150\"></rect><text class=\"f-chosen-t\" x=\"62\" y=\"169\">人群</text>\n<rect class=\"f-opt\" height=\"28\" rx=\"14\" width=\"56\" x=\"104\" y=\"150\"></rect><text class=\"f-opt-t\" x=\"132\" y=\"169\">场景</text>\n<circle class=\"f-dot\" cx=\"172\" cy=\"164\" r=\"5\"></circle>\n<circle class=\"f-dot\" cx=\"196\" cy=\"164\" r=\"5\"></circle>\n<circle class=\"f-dot-chosen\" cx=\"230\" cy=\"164\" r=\"6.5\"></circle>\n<circle class=\"f-dot\" cx=\"264\" cy=\"164\" r=\"5\"></circle>\n<text class=\"f-note-t\" x=\"230\" y=\"136\">多个分叉</text>\n<rect class=\"f-opt\" height=\"28\" rx=\"14\" width=\"72\" x=\"283\" y=\"150\"></rect><text class=\"f-opt-t\" x=\"319\" y=\"169\">技术自研</text>\n<rect class=\"f-chosen\" height=\"28\" rx=\"14\" width=\"98\" x=\"367\" y=\"150\"></rect><text class=\"f-chosen-t\" x=\"416\" y=\"169\">智能化×场景</text>\n<rect class=\"f-stn\" height=\"32\" rx=\"8\" width=\"96\" x=\"46\" y=\"246\"></rect><text class=\"f-stn-t\" x=\"94\" y=\"267\">客户聚焦</text>\n<rect class=\"f-stn\" height=\"32\" rx=\"8\" width=\"64\" x=\"198\" y=\"246\"></rect><text class=\"f-stn-t\" x=\"230\" y=\"267\">品牌</text>\n<rect class=\"f-stn\" height=\"32\" rx=\"8\" width=\"136\" x=\"308\" y=\"246\"></rect><text class=\"f-stn-t\" x=\"376\" y=\"267\">渠道与产品差异化</text>\n</svg>\n</div>\n<figcaption>连法为示意，非既定决策。</figcaption>\n</figure>\n</article>\n<article class=\"module\" id=\"s09b07\">\n<h3>一旦有 APP，估值是两个概念</h3>\n<p>场景化清单先落两类：年轻人的<strong>办公场景</strong>——办公里再分出<span class=\"acc\">会议场景</span>；以及<span class=\"acc\">睡眠场景</span>。这些场景由 APP 承接。</p>\n<figure class=\"viz\" data-visual-id=\"scene-app-valuation\" data-visual-relation=\"加上APP后定位从耳机变为基于人工智能的产品，估值逻辑随之改变\" data-visual-source=\"一旦有APP，对整个公司定位有很大的想象力；如果券商给你估值，基于人工智能的产品不只是耳机，完全两个概念\" data-visual-title=\"APP 带来的定位跃迁\" data-visual-type=\"关系示意图\">\n<div class=\"chain\">\n<div class=\"chain-node dim\"><b>做耳机</b><span>当前定位</span></div>\n<div class=\"chain-arrow\">→</div>\n<div class=\"chain-node\"><b>+ APP</b><span>承接场景</span></div>\n<div class=\"chain-arrow\">→</div>\n<div class=\"chain-node hot\"><b>基于人工智能的产品</b><span>不只是耳机 · 券商估值“完全两个概念”</span></div>\n</div>\n</figure>\n</article>\n<aside class=\"agenda\"><b>现场安排</b><span>7 点吃饭，晚间不会太晚；晚间活动：红蓝军对抗——留题：为什么不是“红白”？</span></aside>\n</main>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#F5F7FB\" height=\"512\" width=\"512\"></rect>\n<g fill=\"none\" stroke=\"#C6CFDC\" stroke-linecap=\"round\" stroke-width=\"10\">\n<path d=\"M64 138 C150 138 196 256 256 256\"></path>\n<path d=\"M64 202 C150 202 200 256 256 256\"></path>\n<path d=\"M64 310 C150 310 200 256 256 256\"></path>\n<path d=\"M64 374 C150 374 196 256 256 256\"></path>\n</g>\n<path d=\"M256 256 C334 256 384 256 448 256\" fill=\"none\" stroke=\"#1D6AE5\" stroke-linecap=\"round\" stroke-width=\"22\"></path>\n<circle cx=\"256\" cy=\"256\" fill=\"#F5F7FB\" r=\"30\" stroke=\"#1D6AE5\" stroke-width=\"9\"></circle>\n<circle cx=\"256\" cy=\"256\" fill=\"#1D6AE5\" r=\"11\"></circle>\n</svg></template>\n","blocks":[{"id":"s09b01","type":"mod","heading":"一切围绕购买理由","text":"一切围绕购买理由\n品牌传播、内容创意、产品开发、产品包装，是\n同一件事\n：全部围绕\n购买理由\n展开；购买理由指向目标人群。\n聚焦购买理由之后，才能与场景、产品形成联动——\n场景产品\n的本质，是设计消费者的选择逻辑。\n品牌传播\n内容创意\n产品开发\n产品包装\n购买理由\n指向人群"},{"id":"s09b02","type":"mod","heading":"四步击穿聚餐欢愉场景","text":"四步击穿聚餐欢愉场景\n主攻场景\n中国人的“聚餐欢愉”——烧烤摊最典型，小餐馆同样适用\n1\n选场景\n不打解渴解腻，不靠汽水带酒感，只打聚餐欢愉\n2\n锚产品\n660ml 大瓶作主流产品，瓶型避开啤酒感\n3\n抢渠道\n北方烧烤摊地推，市占目标 100%：占领所有烧烤摊\n4\n绑传播\n“喝酒不开车，开车喝大窑”\n现场核对：大窑在北方更常见，广东较少，主要在西安一带。"},{"id":"s09b03","type":"mod","heading":"660ml：为倒圈共享而设计","text":"660ml：为倒圈共享而设计\n容量与瓶型一起服务\n共享\n：\n660ml\n可供 5 人倒两圈、10 人倒一圈——这个节奏是现场实测过的。对照组北冰洋走小瓶单人逻辑：330/270ml 一小支，每人一个杯子倒着喝。\n瓶型两头都不靠：不像啤酒瓶，也不学北冰洋的小巧高端路线。价格口径：北冰洋“3 块多”是网购价，不是店里零售价。\n大窑汽水 · 主流\n660ml\n啤酒（参照）\n500ml\n北冰洋（小瓶）\n330 / 270ml\n按容量等比绘制，条长与毫升数成正比。"},{"id":"s09b04","type":"mod","heading":"更好喝，只是兜底","text":"更好喝，只是兜底\n现场公认：北冰洋比大窑好喝一点。但“更好、更便宜、更安全”属于\n兜底\n——放到音频产品上，这只是“边界”，不构成胜负手。要追求的是差异性、特征化，主讲人称之为\n出列\n：\n把特性做深做透\n。\n像阅兵方阵里先出列的三人：扛旗的居中、护旗手在侧，多迈一步——全世界的镜头只盯出列的地方。\n同质方阵\n出列的三人\n镜头\n方阵喻同质化竞争；先出列、被镜头锁定的三人，喻指把特性做深做透——“全世界的眼光只盯着出列的地方”。\n洞察\n口味更好的北冰洋没有赢下聚餐场景，赢的是把“聚餐欢愉”做深做透的大窑——兜底与出列，同一个案例给出对照。"},{"id":"s09b05","type":"mod","heading":"人群不够，叠加差异化","text":"人群不够，叠加差异化\n这组观点给到做音频产品的团队，对全公司也有代表性。“年轻的、潮流的、有态度的年轻人”是\n人群描述\n，但差异性不足。人群自身差异足够时，一个就够；不足时，要在人群内叠加新的差异化。现场给出两条路线。\n路线一\n技术自研\n像此前提到的 多麦克风头戴耳机一样走自研，与某头部品牌同路线（转写待核）：技术领先，形成技术壁垒。\n路线二\n面向场景的智能化\n智能化时代是“面向某些场景的智能化”——人群 × 场景 × 技术路线的组合。\n类比与追问：\n机械手表是纯自研的传统路线，Apple Watch 是智能化路线。智能化要反复迭代，老款怎么办？——智能化产品本就要迭代，人买的正是不断迭代，年轻人更是如此，不迭代才卖不动。"},{"id":"s09b06","type":"mod","heading":"把分叉连成一条路","text":"把分叉连成一条路\n产品化创新多数时候不是没有思路，而是思路没有连成路线。\n客户聚焦、品牌、渠道与产品差异化布局\n——每个节点都有多个分叉；要做的是在分叉里各选定一个，连成一条清晰的路。\n连成一条路（示意）\n人群\n场景\n多个分叉\n技术自研\n智能化×场景\n客户聚焦\n品牌\n渠道与产品差异化\n连法为示意，非既定决策。"},{"id":"s09b07","type":"mod","heading":"一旦有 APP，估值是两个概念","text":"一旦有 APP，估值是两个概念\n场景化清单先落两类：年轻人的\n办公场景\n——办公里再分出\n会议场景\n；以及\n睡眠场景\n。这些场景由 APP 承接。\n做耳机\n当前定位\n→\n+ APP\n承接场景\n→\n基于人工智能的产品\n不只是耳机 · 券商估值“完全两个概念”"}]},{"num":10,"id":"s10","title":"4×4战略地图：四力解码与关键任务写法","date":"2026年11月11日","css":"#sv{\n  --page-bg:#f4f6fb;\n  --surface:#ffffff;\n  --surface-2:#eef1f8;\n  --text:#1d2233;\n  --text-2:#5b6278;\n  --accent:#3b4fd8;\n  --accent-deep:#2c3ba8;\n  --accent-soft:#e7eafb;\n  --secondary:#0e8a7b;\n  --secondary-soft:#dff0
