ariant-numeric: tabular-nums; }\n/* A single surviving child of ANY grid spans the full row. Applied to every\n   element that declares a grid,so unknown component names are covered too. */\n[class*=\"grid\"] > :only-child,[class*=\"board\"] > :only-child,[class*=\"cluster\"] > :only-child,[class*=\"row\"] > :only-child,[class*=\"split\"] > :only-child,[class*=\"cols\"] > :only-child,[class*=\"columns\"] > :only-child,[class*=\"layout\"] > :only-child,[class*=\"panel\"] > :only-child,[data-grid] > :only-child,[data-cols] > :only-child{\n  grid-column: 1 / -1 !important;\n  width: 100% !important;\n}\n@media (max-width: 600px){\n#sv{ font-size: 14.5px !important; line-height: 1.62 !important; }\n:where(#sv > main,#sv > .report-shell,#sv > .report,#sv > .container,#sv > [data-shell]){\n    width: calc(100% - 40px) !important;\n    max-width: 100% !important;\n    margin-inline: auto !important;\n  }\nh1{ font-size: 29px !important; line-height: 1.22 !important; letter-spacing: 0 !important; }\nh2{ font-size: 22px !important; line-height: 1.3 !important; letter-spacing: 0 !important; }\nh3{ font-size: 16px !important; line-height: 1.42 !important; letter-spacing: 0 !important; }\n/* Generic collapse: every multi-column grid becomes single column unless it\n     explicitly opts into staying paired (data-keep-columns) or is a table. */\n  [class*=\"grid\"]:not([data-keep-columns]),[class*=\"board\"]:not([data-keep-columns]),[class*=\"split\"]:not([data-keep-columns]),[class*=\"cols\"]:not([data-keep-columns]),[class*=\"columns\"]:not([data-keep-columns]),[class*=\"layout\"]:not([data-keep-columns]),[data-grid]:not([data-keep-columns]){\n    grid-template-columns: minmax(0, 1fr) !important;\n  }\n/* Compact numeric clusters may stay two-up,but a trailing odd card must\n     span both columns so no empty half-row is left on narrow screens. */\n  [data-keep-columns]{ grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }\n[data-keep-columns] > :last-child:nth-child(odd){ grid-column: 1 / -1 !important; }\n[data-span-all],[data-value-kind=\"formula\"],[data-value-kind=\"range\"]{ grid-column: 1 / -1 !important; }\n/* Horizontal flows become vertical. */\n  [class*=\"flow\"],[class*=\"chain\"],[class*=\"timeline\"]{ flex-direction: column !important; }\n[class*=\"arrow\"]{ transform: rotate(90deg); min-height: 16px !important; }\ntable{ font-size: 12.5px; }\nth,td{ padding: 9px 8px !important; }\nnav{ max-width: 100%; }\nnav[data-scrollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}","body":"\n<div class=\"wrap\">\n<header class=\"hero\">\n<div class=\"kicker\">品牌战略工作坊 · 全程纪要</div>\n<h1>品牌战略工作坊纪要：聚焦与三组方案评审</h1>\n<p class=\"meta\">形式：讲师方法导入 → 分组作业 → 汇报与互评 ｜ 参与：讲师与按业态划分的业务小组（耳机品牌、PC 游戏外设、OEM/ODM 等，成员交叉）</p>\n<p class=\"intro\">开题两件事：什么是聚焦、钱在哪里。随后三组按「宏观—客户—竞争」框架输出战略总结，再按「点赞—问题—建议」互相评审，讲师逐组收口。</p>\n</header>\n<\u0021-- ============ PART 1 ============ -->\n<section class=\"part\" id=\"s02b01\">\n<div class=\"part-head\"><span class=\"part-no\">PART 1</span><h2 class=\"part-title\">方法导入：聚焦与「钱在哪里」</h2></div>\n<div class=\"mod\" id=\"s02b02\">\n<h3>聚焦不是做少，是选准口径</h3>\n<p>以 100 个品为例，分类要落到四个层级，资源向战略品集中：</p>\n<figure class=\"fig\" data-visual-id=\"sku-portfolio\" data-visual-relation=\"100个品分为战略20、生意50、长尾20、淘汰10，资源向战略品集中\" data-visual-source=\"这20个品是战略品，这50个品是生意品，还有20个品叫长尾品，还有10个品是要淘汰的\" data-visual-title=\"100个品的四级分类\" data-visual-type=\"占比结构条\">\n<div class=\"hbars\">\n<div class=\"hrow\"><span class=\"hlabel\">战略品</span><div class=\"htrack\"><i class=\"hf\" style=\"width:20%;background:var(--c1)\"></i></div><span class=\"hval\">20</span></div>\n<div class=\"hrow\"><span class=\"hlabel\">生意品</span><div class=\"htrack\"><i class=\"hf\" style=\"width:50%;background:var(--c2)\"></i></div><span class=\"hval\">50</span></div>\n<div class=\"hrow\"><span class=\"hlabel\">长尾品</span><div class=\"htrack\"><i class=\"hf\" style=\"width:20%;background:var(--c3)\"></i></div><span class=\"hval\">20</span></div>\n<div class=\"hrow\"><span class=\"hlabel\">淘汰品</span><div class=\"htrack\"><i class=\"hf\" style=\"width:10%;background:var(--c4)\"></i></div><span class=\"hval\">10</span></div>\n</div>\n<figcaption class=\"figcap\">共 100 个品；颜色越深越应集中资源。</figcaption>\n</figure>\n<p>聚焦有五个可选切入口径（见下图）。无论选哪个，标准一致：在某一点上<b>做穿做透、做出品牌力</b>，其余产品要敢砍。战略品是主动选择——聚焦某种特性或材质时，<span class=\"hl\">未必等于做少</span>。</p>\n<figure class=\"fig\" data-visual-id=\"focus-lens\" data-visual-relation=\"聚焦可从品类、场景、材质、特性、人群任一口径切入，不一定是做少\" data-visual-source=\"可以是产品类型、品类，可以是功能场景，也可以是材质……或者是某类人群，比如说女性\" data-visual-title=\"聚焦的五种切入口径\" data-visual-type=\"维度关系图\">\n<div class=\"lensrow\">\n<span class=\"lens\">品类</span><span class=\"lens\">功能场景</span><span class=\"lens\">材质</span><span class=\"lens\">特性</span><span class=\"lens\">人群</span>\n</div>\n<div class=\"lensnote\">任选一个口径下钻做穿——<b>聚焦不等于做少</b>；做出品牌力后，其余可有勇气砍掉。</div>\n<figcaption class=\"figcap\">例：只做女性的耳机＝人群口径；只做某一种肉源＝材质口径。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b03\">\n<h3>钱在哪里：宠物粮的完整下钻</h3>\n<p>讲师以上周走访的一家宠物粮公司做示范——先看钱在哪：宠物经济里<b>钱在猫身上</b>，猫的增速快；再顺三个趋势下钻到一款爆品。走完路径顺势推第二款<b>「荒野猎兔」</b>，名字自带高价值感联想（类似「深海金枪鱼」）；这家公司此后主打<b>肉源</b>路线。</p>\n<figure class=\"fig\" data-visual-id=\"spend-rank\" data-visual-relation=\"消费力顺序为女人＞孩子＞老人＞宠物＞男人，20年数据女人第一\" data-visual-source=\"排第一的是女人……第二呢叫做孩子……第四是宠物，第五是男人\" data-visual-title=\"消费力五档排序\" data-visual-type=\"定性排序图\">\n<div class=\"rankrow\">\n<div class=\"rankchip top\"><i>1</i>女人</div>\n<div class=\"rankchip\"><i>2</i>孩子</div>\n<div class=\"rankchip\"><i>3</i>老人</div>\n<div class=\"rankchip\"><i>4</i>宠物</div>\n<div class=\"rankchip\"><i>5</i>男人</div>\n</div>\n<figcaption class=\"figcap\">课上引用的长期消费力排序（约 20 年口径），非量化比例；原话：男人的消费力不如狗。女生过的节日一张 A4 纸写不完，男生只有一个生日。</figcaption>\n</figure>\n<figure class=\"fig\" data-visual-id=\"pet-case\" data-visual-relation=\"钱在猫，顺肉源、功效、老龄化三趋势做出命名、工艺、人群三决策，单品类一二十亿\" data-visual-source=\"钱在猫身上……钱在创新性的一些肉源……猫的老龄化很严重……这一个品类打了一二十个亿\" data-visual-title=\"宠物粮爆品下钻路径\" data-visual-type=\"趋势决策图\">\n<div class=\"drillhead\"><span class=\"pill\">钱在猫</span><span class=\"farr\">→</span><span class=\"pill gray\">猫增速快</span><span class=\"farr\">→</span><span class=\"pill gray\">顺趋势下钻</span></div>\n<div class=\"tri\" data-grid=\"\">\n<div class=\"tcard\"><span class=\"ttag\">趋势 ①</span><b>创新肉源</b><br/>肉的来源差异化，是钱所在</div>\n<div class=\"tcard\"><span class=\"ttag\">趋势 ②</span><b>功效型增速快</b><br/>美毛、肠胃类功效需求旺</div>\n<div class=\"tcard\"><span class=\"ttag\">趋势 ③</span><b>猫老龄化</b><br/>寿命约 15 年，8~15 岁占比大</div>\n</div>\n<div class=\"tri-mid\">↓ 一一对应的产品决策</div>\n<div class=\"tri\" data-grid=\"\">\n<div class=\"tcard\"><span class=\"ttag\">决策 ①</span><b>命名「猎鸟乳鸽」</b><br/>不叫鸽子，拉高价值感</div>\n<div class=\"tcard\"><span class=\"ttag\">决策 ②</span><b>工艺「鲜蒸粮」</b><br/>非膨化，更好吸收、护肠胃</div>\n<div class=\"tcard\"><span class=\"ttag\">决策 ③</span><b>人群＝老年猫</b><br/>直接做老年猫粮</div>\n</div>\n<div class=\"resline\">结果：这一个品类做到 <b class=\"num\">一二十亿</b></div>\n<figcaption class=\"figcap\">「钱在哪里」可在产品端、客户端、人群端找到机会。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b04\">\n<h3>命名拆解：名字自带生意逻辑</h3>\n<figure class=\"fig\" data-visual-id=\"naming-anatomy\" data-visual-relation=\"命名由高价值感成分词加功效与品类边界组成，避开平价直白词\" data-visual-source=\"羽衣甘蓝叫成分材质……纤体叫功效，茶叫品类边界……为什么不叫大白菜减肥茶\" data-visual-title=\"爆品命名拆解对照\" data-visual-type=\"命名拆解卡\">\n<div class=\"duo\" data-grid=\"\">\n<div class=\"ncard\">\n<div class=\"nhead\">猎鸟乳鸽 · 鲜蒸老年猫粮</div>\n<p class=\"nq\">为什么不叫「鸽子」？</p>\n<p>研发团队吃着乳鸽得来的启发——<b>乳鸽</b>比鸽子价值感高；「鲜蒸」对照膨化，把工艺差异直接写进名字。</p>\n</div>\n<div class=\"ncard\">\n<div class=\"nhead\">喜茶 · 羽衣甘蓝纤体茶</div>\n<div class=\"ntag3\"><span>羽衣甘蓝<i>成分材质</i></span><span>纤体<i>功效</i></span><span>茶<i>品类边界</i></span></div>\n<p>纤体是当下<b>最需要的功效</b>。反例：为什么不叫「大白菜减肥茶」——这套逻辑里蔬菜只能选羽衣甘蓝，换西兰花都不成立。</p>\n</div>\n</div>\n<figcaption class=\"figcap\">两个名字走的是同一条逻辑：高价值感的成分词＋最需要的功效＋品类边界。</figcaption>\n</figure>\n<p>这些都属于<b>品牌战略、产品战略维度</b>的思考；机会可以出现在产品端、客户端或人群端，用「钱在哪里」去洞察。</p>\n</div>\n</section>\n<\u0021-- ============ PART 2 ============ -->\n<section class=\"part\" id=\"s02b05\">\n<div class=\"part-head\"><span class=\"part-no\">PART 2</span><h2 class=\"part-title\">作业机制：先把表格的规矩说清</h2></div>\n<div class=\"mod\" id=\"s02b06\">\n<h3>总结表回答四个问题</h3>\n<figure class=\"fig\" data-visual-id=\"four-questions\" data-visual-relation=\"客户市场答卖给谁，品类产品答卖什么，渠道销售答怎么卖，核心能力答凭什么选我\" data-visual-source=\"客户与市场，你就直接写……卖给谁？卖什么？怎么卖？……为什么选我？凭什么\" data-visual-title=\"总结表四问框架\" data-visual-type=\"对应关系图\">\n<div class=\"qgrid\" data-grid=\"\">\n<div class=\"qcell\"><span class=\"qcol\">客户与市场</span><span class=\"qq\">卖给谁</span></div>\n<div class=\"qcell\"><span class=\"qcol\">品类产品</span><span class=\"qq\">卖什么</span></div>\n<div class=\"qcell\"><span class=\"qcol\">渠道销售</span><span class=\"qq\">怎么卖</span></div>\n<div class=\"qcell\"><span class=\"qcol\">核心能力</span><span class=\"qq\">凭什么选我</span></div>\n</div>\n<figcaption class=\"figcap\">总结表每一列都在回答一个问题；要落结论，常规动作不进表。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b07\">\n<h3>「客户」列写什么、不写什么</h3>\n<figure class=\"fig\" data-visual-id=\"customer-column\" data-visual-relation=\"客户列写聚焦场景与细分客户，具体动作任务属一页纸解码内容\" data-visual-source=\"我们聚焦的场景是什么，以及细分哪些客户……什么动作跟什么任务，那个是一页纸的事情\" data-visual-title=\"客户列的内容边界\" data-visual-type=\"写法对照卡\">\n<div class=\"cmp\" data-grid=\"\">\n<div class=\"cbox cdo\"><span class=\"chead ok\">✓ 写</span>基于已梳理的机会：<b>聚焦哪些场景、细分哪些客户</b>——落到区域、国家、客户类型。</div>\n<div class=\"cbox cdont\"><span class=\"chead no\">✕ 不写</span>针对客户要做什么动作——那是「怎么做」的<b>一页纸</b>解码内容。</div>\n</div>\n<figcaption class=\"figcap\">有的行写不出客户机会没关系；有的行一定能写出客户与营销端机会——先填，再精简。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b08\">\n<h3>场景聚焦的证据状态</h3>\n<p>场景不能凭感觉圈：当前讨论聚焦在游泳、户外露营、骑行，但取舍要靠数据说话。</p>\n<figure class=\"fig\" data-visual-id=\"scene-data-status\" data-visual-relation=\"游泳骑行证据足先做，露营待取舍，跑步证据不足，滑雪无装备支持删除\" data-visual-source=\"游泳跟骑行已经先露出来了……滑雪的那个产品没有专业的装备能支持……该删的要删掉\" data-visual-title=\"运动场景聚焦的证据状态\" data-visual-type=\"状态对照列表\">\n<div class=\"srow\"><span class=\"badge b-go\">先做</span><span><b>游泳</b>——水上运动在环太平洋国家增长趋势大。</span></div>\n<div class=\"srow\"><span class=\"badge b-go\">先做</span><span><b>骑行</b>——中东、拉美、东南亚增长率较高、价格敏感；已按市场写好产品矩阵。</span></div>\n<div class=\"srow\"><span class=\"badge b-hold\">待取舍</span><span><b>露营</b>——与游泳、骑行并列为三个增量场景，彼此独立、差异大；大口径数据分不出高下。</span></div>\n<div class=\"srow\"><span class=\"badge b-wait\">证据不足</span><span><b>跑步</b>——每个场景都在增长，但没有突出者，无法确定非做哪个。</span></div>\n<div class=\"srow\"><span class=\"badge b-cut\">删除</span><span><b>滑雪</b>——没有专业装备能支持这块产品。</span></div>\n<figcaption class=\"figcap\">大场景下的细分趋势还要再判断：细分是否足以支撑专门投入。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b09\">\n<h3>作业怎么推进</h3>\n<ul class=\"dots\">\n<li><b>时间</b>：各组报时 10~40 分钟，统一给 20 分钟（取上限），不够再延。方向<b>大致正确即可</b>——这张表没有标准答案、没有底；建议<b>每个季度都做一次洞察</b>，砍掉广铺无意义的部分。</li>\n<li><b>分工</b>：组长组织、书记执笔，别让一两个人从头写到尾；表格一行能落三个点已经很好，达不成机会的该删就删。</li>\n</ul>\n<figure class=\"fig\" data-visual-id=\"feedback-rules\" data-visual-relation=\"反馈分点赞、问题、建议三类，汇报方不反驳先吸收，合议是给分重点\" data-visual-source=\"第一个点赞……第二个叫做问题，我没听懂……第三是建议或者意见……不反驳……先吸收\" data-visual-title=\"组间反馈的三种类型\" data-visual-type=\"规则清单图\">\n<div class=\"fbrow\" data-grid=\"\">\n<div class=\"fb f1\"><b>① 点赞</b><br/>他们哪里做得好</div>\n<div class=\"fb f2\"><b>② 问题</b><br/>我没听懂的地方</div>\n<div class=\"fb f3\"><b>③ 建议</b><br/>没写到的，或不同意、认为另有方向</div>\n</div>\n<figcaption class=\"figcap\">汇报方不反驳、不解释，先记录吸收，之后统一修改；组间合议是给分重点，意见可记在讲义或电脑上。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b10\">\n<h3>To C 建心智，To B 收订单</h3>\n<p>「B2B 怎么赢」的导入：品牌方（含 OEM/ODM）的传递逻辑是 <span class=\"hl\">To C 建心智、To B 收订单</span>——这是战略层面的思考。</p>\n<figure class=\"fig\" data-visual-id=\"toc-tob-chain\" data-visual-relation=\"懂C端加懂品牌带来选品，To C建立心智、To B靠可信赖交付收订单\" data-visual-source=\"TOC建立心智，ToB收货订单这个逻辑……供货的数量、质量、交期……略微再一超出\" data-visual-title=\"To C建心智、To B收订单\" data-visual-type=\"能力流程图\">\n<div class=\"steps4\" data-grid=\"\">\n<div class=\"step\"><span class=\"sno\">1</span><b>懂 C 端＋懂品牌</b><small>ODM/OEM 的前提：有 C 端与差异化能力，客户选品开发才会选你。</small></div>\n<div class=\"step\"><span class=\"sno\">2</span><b>To C 建心智</b><small>用 C 端洞察与品牌动作，先建立终端认知。</small></div>\n<div class=\"step\"><span class=\"sno\">3</span><b>To B 收订单</b><small>渠道打法务必强调标杆客户的成功。</small></div>\n<div class=\"step\"><span class=\"sno\">4</span><b>交付可信赖</b><small>数量、质量、交期有保障；先共识目标，交付到位再略微超出。</small></div>\n</div>\n<figcaption class=\"figcap\">C 端买的是开箱惊喜，B 端不是：先帮客户完成当年 5%~10% 的利润目标；客户开发要证据先行——展会跑出的素材可直接供对方投广告。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b11\">\n<h3>汇报怎么讲：话不在多，在准</h3>\n<figure class=\"fig\" data-visual-id=\"testimony-pattern\" data-visual-relation=\"客户见证是一句话事实背书；汇报左半讲因果逻辑，右半落关键结论\" data-visual-source=\"贝斯也是我带他们做的战略……左半部分叫因果逻辑……再所以就是关键结论\" data-visual-title=\"客户见证与汇报结构\" data-visual-type=\"结构对照图\">\n<div class=\"tpwrap\" data-grid=\"\">\n<div class=\"tpbox\"><span class=\"tpk\">客户见证＝一句话事实</span><p>「贝斯的战略是我带他们做的。」「路特创新从 10 亿到 100 亿，是我带他们做的。」</p></div>\n<div class=\"tpbox\"><span class=\"tpk\">汇报结构＝左因果、右结论</span><p>左半部分讲因果逻辑；右半部分「因为—所以—再所以」，最终落在关键结论。</p></div>\n</div>\n<figcaption class=\"figcap\">产品表达同理：客户收到一堆卖点，还是 get 到重点？打动 B 端客户，话不在多而在精，把关键点讲准。</figcaption>\n</figure>\n</div>\n</section>\n<\u0021-- ============ PART 3 ============ -->\n<section class=\"part\" id=\"s02b12\">\n<div class=\"part-head\"><span class=\"part-no\">PART 3</span><h2 class=\"part-title\">三组方案与互评</h2></div>\n<p class=\"part-intro\">三组按统一框架汇报，其他组合议后给出点赞／问题／建议，讲师逐组收口。每组含方案要点与评审归并。</p>\n<\u0021-- 耳机品牌组 -->\n<div class=\"group\">\n<div class=\"gband\"><span class=\"gname\">耳机品牌组</span><span class=\"gmeta\">汇报人：王琦 ｜ 议题：OWS / TWS / 头戴</span></div>\n<div class=\"mod\" id=\"s02b13\">\n<h4>宏观机会与分品类节奏</h4>\n<p>三个可立即执行的动作：① 对代理商与消费者做<b>品类教育</b>；② 精选存量客户渠道，在 OWS 爆发区域为有认知、有能力的代理快速做规划；③ 以<b>合规产品</b>抢占市场洗牌机会——此前一直没做透的欧洲市场，因政策变化成为新机会。</p>\n<figure class=\"fig\" data-visual-id=\"earbud-opportunity-rhythm\" data-visual-relation=\"OWS翻倍增长先入门中端再旗舰，TWS抓睡眠，头戴借法规更新产品线\" data-visual-source=\"OWS它的一个需求是呈现翻倍增长的……头戴……抓住这个法规的一个机会……TWS……抓住我们睡眠场景\" data-visual-title=\"耳机品类机会与产品节奏\" data-visual-type=\"品类节奏图\">\n<div class=\"ecard\">\n<div class=\"ehead\"><span class=\"cat\">OWS</span><span class=\"sig\">需求翻倍增长 · 品类最热</span></div>\n<p><span class=\"lbl\">动作</span>先推入门与中端的可调产品，与竞品形成差异化；长期聚焦<b>通话＋翻译</b>场景，推出旗舰 OWS。</p>\n</div>\n<div class=\"ecard\">\n<div class=\"ehead\"><span class=\"cat\">TWS</span><span class=\"sig\">传统品类维稳 · 睡眠场景爆发</span></div>\n<p><span class=\"lbl\">动作</span>按 H2 节奏：抓住睡眠场景的快速增长，补齐多定位产品线。</p>\n</div>\n<div class=\"ecard\">\n<div class=\"ehead\"><span class=\"cat\">头戴</span><span class=\"sig\">传统品类维稳 · 电池法/包装法新规</span></div>\n<p><span class=\"lbl\">动作</span>第一阶段抓法规机会，更新整条头戴产品线。</p>\n</div>\n<figcaption class=\"figcap\">宏观信号（品类冷热＋新法规）逐行映射到分品类的产品动作。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b14\">\n<h4>五维结论与用户层补充</h4>\n<p>用户层两条主线：<b>现有用户的功能升级需求</b>，以及<b>决策链路变化</b>——从线下卖场、单一电商，转向内容种草与 AI 共同影响购买。产品侧两个抓手：OWS 天然带装饰属性，做外观升级与情绪化延伸；用技术下放把「能用」做成「好用」。</p>\n<figure class=\"fig\" data-visual-id=\"earbud-summary\" data-visual-relation=\"存量头部渠道抢欧美，旗舰建心智，抢OWS窗口期，持续洞察赋能To B\" data-visual-source=\"覆盖跟强化我们现有的这种存量头部的零售渠道，抢占欧美市场……抢占ows这个品类的一个心智窗口期\" data-visual-title=\"耳机组方案五维收口\" data-visual-type=\"五维结论表\">\n<div class=\"kv\" data-grid=\"\"><span class=\"k\">客户·市场</span><span class=\"v\">覆盖并强化<b>存量头部零售渠道</b>，抢占欧美市场；面向需要功能升级、需要「第二副耳机」的用户。</span></div>\n<div class=\"kv\" data-grid=\"\"><span class=\"k\">品类</span><span class=\"v\">加强旗舰产品建立品牌心智；<b>利润款做品牌营销，流量品抢市场份额</b>。</span></div>\n<div class=\"kv\" data-grid=\"\"><span class=\"k\">渠道打法</span><span class=\"v\">规范产品表达语言、适配当地消费者；协助优质代理强化存量优势渠道；抢占电商、社群、私域等新形态渠道。</span></div>\n<div class=\"kv\" data-grid=\"\"><span class=\"k\">营销</span><span class=\"v\">抢占 <b>OWS 品类心智窗口期</b>；高频场景内容＋技术背书打动用户；借 AI 搜索精准投流与线下体验促成转化。</span></div>\n<div class=\"kv\" data-grid=\"\"><span class=\"k\">核心能力</span><span class=\"v\">持续洞察，用大量 To C 分析赋能 To B；搭建 AI 体系与流程化；强化组织协同与共识。</span></div>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b15\">\n<h4>营销五路与竞争对象</h4>\n<figure class=\"fig\" data-visual-id=\"marketing-five\" data-visual-relation=\"社媒电商、种草渗透、GEO抢占AI入口、口碑反哺、线下体验五路并进\" data-visual-source=\"加大我们社媒电商营销的一个比重……布局AI导购与搜索问答……铺设终端这种场景化的测试体验\" data-visual-title=\"耳机组营销五大板块\" data-visual-type=\"板块清单图\">\n<div class=\"m5\">\n<div class=\"mcard\"><i>1</i><b>社媒电商</b><small>放大话题讨论与转化率</small></div>\n<div class=\"mcard\"><i>2</i><b>种草渗透</b><small>缩短痛点触达消费者决策的链路</small></div>\n<div class=\"mcard\"><i>3</i><b>GEO·AI 入口</b><small>布局 AI 导购与搜索问答信息源</small></div>\n<div class=\"mcard\"><i>4</i><b>用户口碑</b><small>评价与舆情监控反哺卖点迭代</small></div>\n<div class=\"mcard\"><i>5</i><b>线下体验</b><small>终端场景化试戴，强化体感与临门促销</small></div>\n</div>\n</figure>\n<figure class=\"fig\" data-visual-id=\"competition-watch\" data-visual-relation=\"盯贝斯OWS规模、安克技术平台、漫步者效率、手机外延，抢OWS心智空白\" data-visual-source=\"贝斯……通过大量的布局OWS……安克他的一个音频品类技术站……漫步者他对于整个供应链体系\" data-visual-title=\"竞争关注五对象\" data-visual-type=\"对象卡片组\">\n<div class=\"crow\"><span class=\"cname\">贝斯</span><span class=\"cnote\">大量布局 OWS 带动规模快速增长，单一品类进入 Top 5。</span></div>\n<div class=\"crow\"><span class=\"cname\">安克</span><span class=\"cnote\">关注其音频品类的技术栈与技术平台建设。</span></div>\n<div class=\"crow\"><span class=\"cname\">漫步者</span><span class=\"cnote\">供应链体系与组织效能，开发效率行业领先。</span></div>\n<div class=\"crow\"><span class=\"cname\">手机品牌</span><span class=\"cnote\">警惕其产品外延，避免正面竞争。</span></div>\n<div class=\"crow\"><span class=\"cname\">OWS 品类</span><span class=\"cnote\">品类心智尚未形成，是自己的突破口。</span></div>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b16\">\n<h4>组间评审归并</h4>\n<figure class=\"fig\" data-visual-id=\"earbud-review\" data-visual-relation=\"点赞聚焦与产品梯队；问题在国家渠道、场景容量、TWS质量与量化表达\" data-visual-source=\"背后的重点的国家和渠道，我们目前觉得是不够明确……TWS就整体的质量的问题，没有看到应对的对策\" data-visual-title=\"耳机组评审意见归并\" data-visual-type=\"点赞问题对照\">\n<div class=\"rev\" data-grid=\"\">\n<div class=\"rcol rgood\"><span class=\"rhead\">点赞</span><ul class=\"rlist\">\n<li>抓住 OWS 品类窗口期，单品系列聚焦</li>\n<li>旗舰／利润款／流量款的产品梯队清晰</li>\n<li>布局社媒与线下体验等新渠道</li>\n<li>用 To C 洞察反哺 To B，贴合品类增长</li>\n<li>有跨行业的竞争视角</li>\n</ul></div>\n<div class=\"rcol rbad\"><span class=\"rhead\">问题 · 建议</span><ul class=\"rlist\">\n<li>重点国家与渠道不明确——欧美要落到哪国、哪类客户</li>\n<li>OWS 场景差异化与市场容量缺数据，衍生场景过多需聚焦</li>\n<li>TWS 整体质量问题没有应对对策</li>\n<li>最关键要干的一件事没提炼出来</li>\n<li>存量头部渠道从老客户还是新客户开始，结论不清</li>\n<li>定性多、概念多——「翻倍」应写成如「增速 300%」；场景内容要括注初步结论</li>\n</ul></div>\n</div>\n</figure>\n<p><b>讲师收口</b>：方向大致正确即可；OWS 头部格局已定，难正面抢，要找自己的点。B 列定性偏多，但前期材料里有数据，归纳时别丢；「To C 建心智、To B 收订单」是战略层逻辑，能力项后续要变成具象动作。</p>\n</div>\n</div>\n<\u0021-- PC游戏外设组 -->\n<div class=\"group\">\n<div class=\"gband\"><span class=\"gname\">PC 游戏外设组</span><span class=\"gmeta\">议题：耳机 / 鼠标 / 键盘 / 手柄</span></div>\n<div class=\"mod\" id=\"s02b17\">\n<h4>外部与客户洞察</h4>\n<p>行业保持增长，但<b>以价换量会加剧，增长质量承压</b>；增量集中在耳机、鼠标、键盘、手柄四大品类，同时监测潜在品类。竞争已从参数转向体验、渠道与服务：耳机品类有中国新锐品牌进入，需守住中端优势；鼠标轻量化无线普及带来机会；其余品类成熟，要找细分突破。</p>\n<figure class=\"fig\" data-visual-id=\"pc-gaming-insights\" data-visual-relation=\"外设五年8–11%增长聚焦四大品类，质价比与女性玩家打开替代与溢价窗口\" data-visual-source=\"这个行业会持续保持8%~11%的一个增长……国际品牌的一个溢价已经缩水18%……女性玩家的占比过半\" data-visual-title=\"PC电竞组外部洞察矩阵\" data-visual-type=\"数据洞察卡组\">\n<div class=\"sgrid\" data-grid=\"\">\n<div class=\"scard\"><div class=\"snum\">8%~11%</div><div class=\"slab2\">全球游戏外设未来 5 年增速</div><p class=\"snote\">第三方数据口径；细分品类增速分化，以此圈定分析范围。</p></div>\n<div class=\"scard\"><div class=\"snum\">参数→体验</div><div class=\"slab2\">技术下放加速，竞争转向综合体验</div><p class=\"snote\">无线轻量化、磁轴快触发、霍尔/TMR 摇杆进入中间价位；单参数难有持续溢价。</p></div>\n<div class=\"scard\"><div class=\"snum\">≈50%</div><div class=\"slab2\">线下仍贡献约一半销售额</div><p class=\"snote\">线上增速更快，但仍需全渠道经营。</p></div>\n<div class=\"scard\"><div class=\"snum\">−18%</div><div class=\"slab2\">国际品牌溢价缩水</div><p class=\"snote\">中国品牌在部分品类、区域已反超，替代窗口打开；通病是售后短板。</p></div>\n<div class=\"scard\"><div class=\"snum\">翻倍</div><div class=\"slab2\">换机潮国家的增长弹性</div><p class=\"snote\">政策＋技术双拐点，催生存量换机红利窗口。</p></div>\n<div class=\"scard\"><div class=\"snum\">70%</div><div class=\"slab2\">线上化率走向</div><p class=\"snote\">多数消费按电商大促节奏规划，非大促期转化率不足 50%。</p></div>\n<div class=\"scard\"><div class=\"snum\">&gt;52%</div><div class=\"slab2\">多个市场女性玩家过半</div><p class=\"snote\">粉白配色可撬动 15%~20% 溢价。</p></div>\n</div>\n<figcaption class=\"figcap\">以上为该组汇报引用的数据口径。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b18\">\n<h4>市场梯队与能力链</h4>\n<figure class=\"fig\" data-visual-id=\"pc-market-tiers\" data-visual-relation=\"巴土俄越第一梯队抢全品类增量，二梯队高潜国家聚焦一两个品类深耕\" data-visual-source=\"巴西、土耳其、俄罗斯以及我们这次研究上来要加进来的越南……从卖货市场要转向共同经营重点市场\" data-visual-title=\"电竞市场梯队与品类分工\" data-visual-type=\"梯队关系图\">\n<div class=\"tier t1\">\n<span class=\"ttag2\">第一梯队 · 抢全品类增量</span>\n<p class=\"tchips\"><span>巴西</span><span>土耳其</span><span>俄罗斯</span><span>越南（本轮新增）</span></p>\n<p class=\"tnote\">至少覆盖耳机、鼠标、键盘、手柄四个品类的增量。</p>\n</div>\n<div class=\"tier t2\">\n<span class=\"ttag2 g\">第二梯队 · 高潜国家</span>\n<p class=\"tnote\">找出当地最重点的一两个品类，按用户需求调整产品、价格与销售方法；与 B 端客户共同经营，帮其把产品卖给终端用户。</p>\n</div>\n<div class=\"posture\">姿态：<span class=\"pill gray\">卖货市场</span><span class=\"farr\">→</span><span class=\"pill\">共同经营重点市场</span></div>\n<div class=\"roster\">品类分工：游戏耳机＝核心重点 ｜ 鼠标＝增长引擎 ｜ 键盘 · 手柄 · 麦克风 · 电竞椅＝小范围尝试。产品同时满足 B 端（质量稳定、交付可靠）与 C 端（功能、外观、实际体验）。</div>\n</figure>\n<figure class=\"fig\" data-visual-id=\"pc-capability-chain\" data-visual-relation=\"测评与达人内容吸引C端，电商门店代理完成销售，从供应商转向增长伙伴\" data-visual-source=\"用产品的体验测评和达人的内容来消费吸引C端……从供应商变成帮助客户增长的合作伙伴\" data-visual-title=\"电竞组渠道与能力链\" data-visual-type=\"流程关系图\">\n<div class=\"steps3\" data-grid=\"\">\n<div class=\"step\"><span class=\"sno\">1</span><b>吸引 C 端</b><small>产品体验测评＋达人内容</small></div>\n<div class=\"step\"><span class=\"sno\">2</span><b>完成 B 端销售</b><small>电商、线下门店、代理商</small></div>\n<div class=\"step\"><span class=\"sno\">3</span><b>反馈带动销售</b><small>用消费者反馈带动客户销售</small></div>\n</div>\n<div class=\"posture\">定位升级：<span class=\"pill gray\">供应商</span><span class=\"farr\">→</span><span class=\"pill\">帮客户增长的合作伙伴</span></div>\n<figcaption class=\"figcap\">能力要求：To C 洞察要有证据；与 B 端共创产品与营销；用质量、交付、售后、内容提升信任与稳定。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b19\">\n<h4>组间评审与讲师收口</h4>\n<figure class=\"fig\" data-visual-id=\"pc-review\" data-visual-relation=\"点赞数据渠道清晰；问题在跟随卖货、画像不精准、竞对不明、缺增速对比\" data-visual-source=\"我觉得还是从跟随着卖货的角度去做……客户画像没有一个精准的画像\" data-visual-title=\"电竞组评审：点赞与问题\" data-visual-type=\"点赞问题对照\">\n<div class=\"rev\" data-grid=\"\">\n<div class=\"rcol rgood\"><span class=\"rhead\">点赞</span><ul class=\"rlist\">\n<li>数据详实，与框架契合度高</li>\n<li>渠道与区域清晰</li>\n<li>高潜国家联动 B 端触达 C 端，把研发与真实消费者打通</li>\n<li>市场定位与产品定位明确</li>\n</ul></div>\n<div class=\"rcol rbad\"><span class=\"rhead\">问题 · 建议</span><ul class=\"rlist\">\n<li>整体是跟随卖货思路，以市场为角度而非产品角度，缺自研壁垒</li>\n<li>没有精准客户画像，女性用户缺数据支撑</li>\n<li>竞对不清晰——看不出对标哪家公司、哪个渠道</li>\n<li>缺与巴西、土耳其等新兴市场的增速对比</li>\n<li>女性结论没落到产品与结论区</li>\n<li>核心品类的旗舰与场景化产品布局缺位；游戏耳机为重点的依据、核心国家市占率未说明</li>\n</ul></div>\n</div>\n</figure>\n<p><b>讲师收口</b>：看竞争最好导出「向 A 学开品逻辑、向 B 学渠道打法、向 C 学品牌打法」。轻量化若属典型机会，要结论化到其他品类；女性若是重要结论，哪怕写「尝试」也要落进结论区——倒逼聚焦、给左列排序。写法上加 B:/C: 标注，新增「品牌与市场」打法；数据分静态体量与动态增速，可盯前 2% 的品类国家。</p>\n</div>\n</div>\n<\u0021-- OEM/ODM组 -->\n<div class=\"group\">\n<div class=\"gband\"><span class=\"gname\">OEM·ODM 组</span><span class=\"gmeta\">议题：音频代工的客户结构与转型</span></div>\n<div class=\"mod\" id=\"s02b20\">\n<h4>客户结构转型与产品节奏</h4>\n<p>接到命题后，组内先回答定位问题——OEM 走中高端还是低价？结合现状给出转型目标与节奏：</p>\n<figure class=\"fig\" data-visual-id=\"oem-strategy\" data-visual-relation=\"客户结构从低价6中高4转向中高6低价4，H1主攻OWS+自研拾音降噪模块通话痛点\" data-visual-source=\"以往呢是低价占60%……转型为中高端的占60%……ows带vpu的一个技术的一个开发\" data-visual-title=\"OEM客户结构与产品节奏\" data-visual-type=\"结构转变图\">\n<div class=\"shift\">\n<div class=\"scol\"><span class=\"slab\">现状</span>\n<div class=\"hrow\"><span class=\"hlabel\">低价</span><div class=\"htrack\"><i class=\"hf\" style=\"width:60%;background:var(--c4)\"></i></div><span class=\"hval\">60%</span></div>\n<div class=\"hrow\"><span class=\"hlabel\">中高端</span><div class=\"htrack\"><i class=\"hf\" style=\"width:40%;background:var(--c1)\"></i></div><span class=\"hval\">40%</span></div>\n</div>\n<div class=\"sarr\">→</div>\n<div class=\"scol\"><span class=\"slab\">目标（过渡阶段）</span>\n<div class=\"hrow\"><span class=\"hlabel\">中高端</span><div class=\"htrack\"><i class=\"hf\" style=\"width:60%;background:var(--c1)\"></i></div><span class=\"hval\">60%</span></div>\n<div class=\"hrow\"><span class=\"hlabel\">低价</span><div class=\"htrack\"><i class=\"hf\" style=\"width:40%;background:var(--c4)\"></i></div><span class=\"hval\">40%</span></div>\n</div>\n</div>\n<p class=\"tnote\" style=\"margin-bottom:10px\">过渡阶段，不舍弃原有低价渠道产品；对内数据显示，产品比例已在向中高端倾斜。</p>\n<div class=\"steps3\" data-grid=\"\">\n<div class=\"step\"><span class=\"sno\">H1</span><b>主攻</b><small>OWS＋自研通话降噪技术立项：源自欧美日韩「通话不清晰」痛点；优先验证 OWS 耳夹；TWS 聚焦换新、明确资源投放。</small></div>\n<div class=\"step\"><span class=\"sno\">H2</span><b>尝试</b><small>按办公→运动户外→家庭娱乐，验证性价比与品质升级款。</small></div>\n<div class=\"step\"><span class=\"sno\">观察</span><b>跟进</b><small>用自研拾音方案收集用户体验，跟进 OWS 细分机会。</small></div>\n</div>\n</figure>\n<ul class=\"dots\">\n<li><b>营销（本轮新增）</b>：OWS 中高端线单独立项，配专属团队与预算；独立项目组＋数据隔离，展会、官网做行业可视化传播；跟随主流核心卖点但不全盘跟风；不打低价战。</li>\n<li><b>渠道</b>：C 端亚马逊＋B 端专业零售与知名品牌客户，按渠道定制差异化合作；以保密合规的大客户案例提升信任。</li>\n<li><b>品类盘</b>：OWS 为流量基本盘；TWS/头戴/音箱分赛道；借欧盟电池合规构建 ODM 优势；储备 AI 音频与环保材料。</li>\n</ul>\n<div class=\"sev\"><span class=\"pill gray\">六大核心能力：</span><span class=\"lens\">市场洞察</span><span class=\"lens\">音频研发与测试</span><span class=\"lens\">渠道客户开发</span><span class=\"lens\">供应链交付</span><span class=\"lens\">差异化打造</span><span class=\"lens\">项目管理与合规</span></div>\n<p class=\"mutline\">竞对已先行推出同类产品——市场洞察要持续捕捉；六大能力对外支撑 ODM/OEM 音频产品解决方案。</p>\n</div>\n<div class=\"mod\" id=\"s02b21\">\n<h4>组间评审与讲师点评</h4>\n<figure class=\"fig\" data-visual-id=\"oem-review\" data-visual-relation=\"点赞向内组织能力与痛点方案；问题在向外不聚焦、人货场缺失、缺竞对\" data-visual-source=\"向内看的能力写得非常好……没有聚焦到底我们是做哪些国家……人货场是缺失的\" data-visual-title=\"OEM组评审：点赞与问题\" data-visual-type=\"点赞问题对照\">\n<div class=\"rev\" data-grid=\"\">\n<div class=\"rcol rgood\"><span class=\"rhead\">点赞</span><ul class=\"rlist\">\n<li>向内看（组织与能力）写得非常完整</li>\n<li>「通话不清晰」痛点抓得准，且给出了对应方案</li>\n</ul></div>\n<div class=\"rcol rbad\"><span class=\"rhead\">问题 · 建议</span><ul class=\"rlist\">\n<li>向外看不聚焦——已提炼的核心国家与客户没表达出来，人、货、场缺失</li>\n<li>自研拾音降噪方案在 OWS 与 TWS 上都有应用：先做谁、是否同步，没说清</li>\n<li>缺竞对分析</li>\n<li>要抓的中高端客户是谁、怎么抓，不明确</li>\n</ul></div>\n</div>\n</figure>\n<p><b>讲师点评</b>：回到四问——客户与市场＝<b>卖给谁</b>（哪些存量客户深耕、哪些潜力客户怎么拿下）；品类产品＝<b>卖什么</b>，写三个小点：什么产品、中高端与中低端的大致策略、卖点特性与技术优势怎么打造。</p>\n<p><b>中高端 ≠ 舍弃低端</b>：这是 4:6 到 6:4 的过渡；不同区域可以有不同托举——有的「创新待成熟」，有的「成熟待创新」。产品结构上，旗舰引领＋梯队产品＋<b>防守性产品</b>：防守单可以对竞品抢客户、短期不图赚钱，但全盘要能支撑。</p>\n<div class=\"casebox\">\n<span class=\"cbt\">防守案例（课上讲述）：篮球袜「有志者」对「维动」</span>\n<p>长沙品牌「有志者」做美国篮球袜（常见 299~399 元）的平替，129 / 99 元，冲到三四亿；被低价复制者「维动」（19.9~39.9 元）冲击后销量下滑，于是另立子品牌专打防守、不图赚钱。对手撑不住后主品牌缓过来，利润回升。</p>\n<p>要点：防守单单独看不赚不赔、不影响大盘，背后要有<b>高利润产品支撑</b>——战略性亏损是一种能力，要平衡短期与长期、这一单与下一单；有的防守单不赚钱，但「做了这个客户，另外的客户就来了」。</p>\n</div>\n</div>\n</div>\n</section>\n<\u0021-- ============ PART 4 ============ -->\n<section class=\"part\" id=\"s02b22\">\n<div class=\"part-head\"><span class=\"part-no\">PART 4</span><h2 class=\"part-title\">讲师工具箱：可复用的方法</h2></div>\n<p class=\"part-intro\">评审过程中讲师穿插的方法与案例，单独收在此处备查。</p>\n<div class=\"mod\" id=\"s02b23\">\n<h3>用户洞察七问</h3>\n<p>To C 洞察别停留在年龄段标签，按七问逐层下钻，选一两问做深即可；B 端同样适用。</p>\n<figure class=\"fig\" data-visual-id=\"insight-7q\" data-visual-relation=\"标签、需求排序、痛点、场景、动机、价格承受力、复购触发点，选一两问下钻\" data-visual-source=\"第一个叫标签……需求排序是重点……痛点……场景……理性动机和感性动机……复购触发点\" data-visual-title=\"用户洞察七问框架\" data-visual-type=\"结构清单图\">\n<div class=\"m5\">\n<div class=\"mcard\"><i>1</i><b>标签</b><small>年龄、城市、性别与职业占比</small></div>\n<div class=\"mcard\"><i>2</i><b>需求排序</b><small>共性内排序 123＋特性内排序 123</small></div>\n<div class=\"mcard\"><i>3</i><b>痛点</b><small>需求必有未被满足处（如玻璃瓶铁盖）</small></div>\n<div class=\"mcard\"><i>4</i><b>场景</b><small>排序：上学前 / 洗澡后 / 运动后</small></div>\n<div class=\"mcard\"><i>5</i><b>动机</b><small>理性 / 感性，分属不同角色</small></div>\n<div class=\"mcard\"><i>6</i><b>价格承受力</b><small>愿为哪一档买单</small></div>\n<div class=\"mcard\"><i>7</i><b>复购触发点</b><small>配件、提醒、券；消费者需要被引导</small></div>\n</div>\n<figcaption class=\"figcap\">双用户驱动：To B（经销商、CS、KA）与 To C（妈妈＋青少年）一起看，别只求一边。</figcaption>\n</figure>\n<div class=\"casebox\">\n<span class=\"cbt\">「袋鼠妈妈」青少年护肤示范</span>\n<p><b>场景</b>：用自家两个孩子还原「起床四件事」——洗漱场景时间赶、孩子偷懒做假动作，洞察结论＝<b>方便快捷</b>；包材决策：方不如圆、小口不如大口、圆不如泵、带盖泵不如免拧直按——<b>手脚会投票</b>。</p>\n<p><b>动机</b>：理性动机在妈妈（约 95% 的购买决策），感性动机在青少年——双代言：青少年找时代少年团，妈妈找昆凌；随产品送可交换的代言贴纸，强化下次复购时的询问。</p>\n</div>\n</div>\n<div class=\"mod\" id=\"s02b24\">\n<h3>洞察流程：VOC＋VOS</h3>\n<figure class=\"fig\" data-visual-id=\"voc-vos-flow\" data-visual-relation=\"VOC加VOS是洞察起点，经精准化差异化引领性按月输出，终点是产品定义\" data-visual-source=\"VOC+vos是洞察的起点……终点是产品定义……以每月为单位来去输出\" data-visual-title=\"用户洞察：起点到终点\" data-visual-type=\"流程关系图\">\n<div class=\"steps3\" data-grid=\"\">\n<div class=\"step\"><span class=\"sno\">1</span><b>起点</b><small>VOC（C 端客户之声）＋VOS（B 端卖家之声）</small></div>\n<div class=\"step\"><span class=\"sno\">2</span><b>过程</b><small>围绕精准化、差异化、引领性，按月输出洞察</small></div>\n<div class=\"step\"><span class=\"sno\">3</span><b>终点</b><small>产品定义——把需求写出来</small></div>\n</div>\n<figcaption class=\"figcap\">用户洞察是同类公司普遍关注的组织能力（与产品资源能力并列）。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b25\">\n<h3>把定性写成数据</h3>\n<div class=\"tip\">\n<p><b>表达</b>：「翻倍」是相对量化——写成「<span class=\"num\">增速 300%</span>」更好，后台有数据就直接写；也别文绉绉（如「细分场景的涌现」）。静态体量之外，更要看增速。</p>\n<p><b>从数据到结论，落点任选</b>：</p>\n<p>· 国家——贝斯不带电芯的移动充电器在 T1 国家增速最快 → 结论「重点打 T1 国家」；<br/>\n      · 场景——排第一的场景 → 明年新品迭代就打它；<br/>\n      · 人群——客户女性占比高 → 10 个品 7 个对女性、3 个对男性：<b>战略不是非黑即白</b>，主力打女性，男性照做（如客群示例：更年轻、更潮流、更精致的出行女性）。</p>\n<p><b>附</b>：那款「不带电芯」产品＝插头可调＋线可伸缩＋瓦数可调（67W/25W），把电源线、充电宝、设备三件事并成两件——产品形态本身就是卖点。</p>\n</div>\n</div>\n<div class=\"mod\" id=\"s02b26\">\n<h3>旗舰大单品的四个标准</h3>\n<figure class=\"fig\" data-visual-id=\"flagship-product\" data-visual-relation=\"旗舰＝代表品类心智＋技术壁垒＋原点人群背书＋一定规模但不求最大\" data-visual-source=\"它代表什么品类心智，第二叫有技术壁垒……原点人群意见领袖能为他背书……销售规模不追求最最大\" data-visual-title=\"旗舰大单品的判断标准\" data-visual-type=\"特征关系图\">\n<div class=\"m5\">\n<div class=\"mcard\"><i>1</i><b>代表品类心智</b><small>是品牌的代表作；未必是最高端——课上讨论：特斯拉的旗舰更可能是走量的 Model Y，而非最高端车型</small></div>\n<div class=\"mcard\"><i>2</i><b>有技术壁垒</b><small>别人短期做不出来</small></div>\n<div class=\"mcard\"><i>3</i><b>原点人群背书</b><small>足够多的意见领袖；达人、网吧这类原点场景是好的写法</small></div>\n<div class=\"mcard\"><i>4</i><b>有销售规模，不求最大</b><small>很多旗舰沦为摆设；要有一小群人真心在买、在用</small></div>\n</div>\n</figure>\n<p>旗舰之后<b>先纵向延伸，别急着横向</b>。产品抓手共三件：旗舰大单品、产品梯队战略牵引、特性卖点聚焦。</p>\n</div>\n<div class=\"mod\" id=\"s02b27\">\n<h3>增速与规模，取决于你是谁</h3>\n<figure class=\"fig\" data-visual-id=\"growth-vs-scale\" data-visual-relation=\"增速代表未来；能力强抢体量大增速快的市场，能力有限则差异化抢成长市场\" data-visual-source=\"增速和规模之间如何取舍取决于你是谁……抢成长市场的大的战略\" data-visual-title=\"增速与规模的取舍\" data-visual-type=\"决策分支图\">\n<div class=\"rev\" data-grid=\"\">\n<div class=\"rcol rgood\"><span class=\"rhead\">自身能力强</span><p style=\"font-size:13px;line-height:1.65\">抢<b>体量大且增速快</b>的市场：集团军作战，盯最肥的肉——贝斯重点打 T1 国家，抢得走的就是自己的。</p></div>\n<div class=\"rcol rbad\"><span class=\"rhead\">能力有限</span><p style=\"font-size:13px;line-height:1.65\">适当<b>差异化</b>，抢体量不是最大但增速快的成长市场——小熊电器做美的看不上的小家电：单身、租房、年轻女性；定位「萌」：好操作、好看、占地小，技术指标不重要。</p></div>\n</div>\n<figcaption class=\"figcap\">不因行业增速快就一定做，要结合竞争环境。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s02b28\">\n<h3>品牌叙事与圈层引爆</h3>\n<figure class=\"fig\" data-visual-id=\"brand-story-cases\" data-visual-relation=\"共性讲标配特性讲稀缺；情绪故事、客群改产品、圈层引爆共同打动选择\" data-visual-source=\"共性讲标配特性讲稀缺……要记得妈妈爱你胜过爱自己……他把网约车人群引爆之后C端也大量增长\" data-visual-title=\"品牌叙事与圈层引爆案例\" data-visual-type=\"案例卡片组\">\n<div class=\"sgrid\" data-grid=\"\">\n<div class=\"scard\" style=\"grid-column:1/-1\"><div class=\"snum\" style=\"font-size:15px\">核心原则</div><p class=\"snote\" style=\"font-size:13.5px\"><b>共性讲标配，特性讲稀缺</b>——共性满足刚需，特性打动选择。当材质人人都在讲（A 类棉、新疆棉、长绒棉、母婴级……），材质已成标配，要绕开材质讲特性与情绪。</p></div>\n<div class=\"scard\"><div class=\"snum\" style=\"font-size:15px\">情绪吊牌 · 童装「贝西南」</div><p class=\"snote\">吊牌正面不印含棉量指标，印一句——「有一天你兴冲冲地出门，不再是为了奇趣蛋或是棒棒糖，而是无论车水马龙还是天南海北，要记得妈妈爱你胜过爱自己」。买的人是妈妈，传播的是情绪；品牌专业度渗透到包装与内容，反哺 To B 与 To C。</p></div>\n<div class=\"scard\"><div class=\"snum\" style=\"font-size:15px\">故事 logo · 欧美音箱品牌</div><p class=\"snote\">狗对着唱机喇叭的 logo，源自兄弟与狗的故事——一个好故事让 logo 被记住十多年。</p></div>\n<div class=\"scard\"><div class=\"snum\" style=\"font-size:15px\">起源故事 · 李锦记</div><p class=\"snote\">「蚝油发明者」——1888 年渔民熬蚝汁熬干了成糊；起源即差异。</p></div>\n<div class=\"scard\"><div class=\"snum\" style=\"font-size:15px\">按客群改产品 · 龙哥小火锅</div><p class=\"snote\">客群是年轻小姐姐（59.9 元随便吃、回转式自涮），汉堡做成粉色——大人觉得不健康，客群觉得可爱，成了大爆款。</p></div>\n<div class=\"scard\"><div class=\"snum\" style=\"font-size:15px\">圈层引爆 · 唐联科技</div><p class=\"snote\">杭州行车记录仪品牌，约 30 多亿规模：先与 Uber 合作引爆网约车人群，C 端随之大量增长——圈层打穿，泛人群自来。</p></div>\n<div class=\"scard\"><div class=\"snum\" style=\"font-size:15px\">围绕卖点的品牌动作 · 贝斯</div><p class=\"snote\">「一个就够」：子维度＝场景适配、便捷、体积、释放双手、握持吸力；内容与视觉围绕更新。要实打实的品牌赋能，不要虚的品牌姿态。</p></div>\n<div class=\"scard\" style=\"grid-column:1/-1\"><div class=\"snum\" style=\"font-size:15px\">场景化 × 情绪</div><p class=\"snote\" style=\"font-size:13.5px\">游戏与音频是高情绪化的品类：床头音箱该长什么样？场景要同时调节情绪体验。</p></div>\n</div>\n</figure>\n</div>\n</section>\n<\u0021-- ============ PART 5 ============ -->\n<section class=\"part\" id=\"s02b29\">\n<div class=\"part-head\"><span class=\"part-no\">PART 5</span><h2 class=\"part-title\">收尾对齐：先验证跑通再放大</h2></div>\n<div class=\"mod\" id=\"s02b30\">\n<h3>散场前的复盘：转化断点不在资源</h3>\n<p>汇报结束后的小范围对齐，留下三个判断：</p>\n<ul class=\"dots\">\n<li>现阶段目标不是打造品牌标杆与品牌认知，而是<b>打通可持续复制的基础</b>。</li>\n<li>不必全品类都打：精力与资源有限，市场也对应有限；不同市场可以<b>有托举</b>——有的要「创新待成熟」，有的要「成熟待创新」，先小范围验证，跑通再放大。</li>\n<li>韩国、印尼市场的反馈：渠道种草与社群客户都不差，但转化只有<b class=\"num\">约 5%</b>——问题不在 SKU、品类或资源，而在<b>内容种草到转化收获的路径没有对接、动作行为不统一</b>；韩国已有约一年的内容建设积累，正卡在向收获转段。</li>\n</ul>\n<p class=\"mutline\">对话共识：表象与国内做 C 端的问题相似，本质不同——「精准触达产品人群」的能力，仍是当前最大的缺口。</p>\n</div>\n</section>\n</div>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#f3f5f7\" height=\"512\" width=\"512\"></rect><g fill=\"none\" stroke=\"#1b2530\"><circle cx=\"256\" cy=\"256\" r=\"192\" stroke-opacity=\"0.12\" stroke-width=\"10\"></circle><circle cx=\"256\" cy=\"256\" r=\"136\" stroke-opacity=\"0.2\" stroke-width=\"12\"></circle></g><path d=\"M256 64 A192 192 0 0 1 391.76 120.24\" fill=\"none\" stroke=\"#0d7a6f\" stroke-linecap=\"round\" stroke-width=\"26\"></path><circle cx=\"256\" cy=\"256\" fill=\"#0d7a6f\" r=\"56\"></circle><circle cx=\"256\" cy=\"256\" fill=\"#f3f5f7\" r=\"20\"></circle></svg></template>\n","blocks":[{"id":"s02b01","type":"part","heading":"方法导入：聚焦与「钱在哪里」","text":"PART 1\n方法导入：聚焦与「钱在哪里」"},{"id":"s02b02","type":"mod","heading":"聚焦不是做少，是选准口径","text":"聚焦不是做少，是选准口径\n以 100 个品为例，分类要落到四个层级，资源向战略品集中：\n战略品\n20\n生意品\n50\n长尾品\n20\n淘汰品\n10\n共 100 个品；颜色越深越应集中资源。\n聚焦有五个可选切入口径（见下图）。无论选哪个，标准一致：在某一点上\n做穿做透、做出品牌力\n，其余产品要敢砍。战略品是主动选择——聚焦某种特性或材质时，\n未必等于做少\n。\n品类\n功能场景\n材质\n特性\n人群\n任选一个口径下钻做穿——\n聚焦不等于做少\n；做出品牌力后，其余可有勇气砍掉。\n例：只做女性的耳机＝人群口径；只做某一种肉源＝材质口径。"},{"id":"s02b03","type":"mod","heading":"钱在哪里：宠物粮的完整下钻","text":"钱在哪里：宠物粮的完整下钻\n讲师以上周走访的一家宠物粮公司做示范——先看钱在哪：宠物经济里\n钱在猫身上\n，猫的增速快；再顺三个趋势下钻到一款爆品。走完路径顺势推第二款\n「荒野猎兔」\n，名字自带高价值感联想（类似「深海金枪鱼」）；这家公司此后主打\n肉源\n路线。\n1\n女人\n2\n孩子\n3\n老人\n4\n宠物\n5\n男人\n课上引用的长期消费力排序（约 20 年口径），非量化比例；原话：男人的消费力不如狗。女生过的节日一张 A4 纸写不完，男生只有一个生日。\n钱在猫\n→\n猫增速快\n→\n顺趋势下钻\n趋势 ①\n创新肉源\n肉的来源差异化，是钱所在\n趋势 ②\n功效型增速快\n美毛、肠胃类功效需求旺\n趋势 ③\n猫老龄化\n寿命约 15 年，8~15 岁占比大\n↓ 一一对应的产品决策\n决策 ①\n命名「猎鸟乳鸽」\n不叫鸽子，拉高价值感\n决策 ②\n工艺「鲜蒸粮」\n非膨化，更好吸收、护肠胃\n决策 ③\n人群＝老年猫\n直接做老年猫粮\n结果：这一个品类做到\n一二十亿\n「钱在哪里」可在产品端、客户端、人群端找到机会。"},{"id":"s02b04","type":"mod","heading":"命名拆解：名字自带生意逻辑","text":"命名拆解：名字自带生意逻辑\n猎鸟乳鸽 · 鲜蒸老年猫粮\n为什么不叫「鸽子」？\n研发团队吃着乳鸽得来的启发——\n乳鸽\n比鸽子价值感高；「鲜蒸」对照膨化，把工艺差异直接写进名字。\n喜茶 · 羽衣甘蓝纤体茶\n羽衣甘蓝\n成分材质\n纤体\n功效\n茶\n品类边界\n纤体是当下\n最需要的功效\n。反例：为什么不叫「大白菜减肥茶」——这套逻辑里蔬菜只能选羽衣甘蓝，换西兰花都不成立。\n两个名字走的是同一条逻辑：高价值感的成分词＋最需要的功效＋品类边界。\n这些都属于\n品牌战略、产品战略维度\n的思考；机会可以出现在产品端、客户端或人群端，用「钱在哪里」去洞察。"},{"id":"s02b05","type":"part","heading":"作业机制：先把表格的规矩说清","text":"PART 2\n作业机制：先把表格的规矩说清"},{"id":"s02b06","type":"mod","heading":"总结表回答四个问题","text":"总结表回答四个问题\n客户与市场\n卖给谁\n品类产品\n卖什么\n渠道销售\n怎么卖\n核心能力\n凭什么选我\n总结表每一列都在回答一个问题；要落结论，常规动作不进表。"},{"id":"s02b07","type":"mod","heading":"「客户」列写什么、不写什么","text":"「客户」列写什么、不写什么\n✓ 写\n基于已梳理的机会：\n聚焦哪些场景、细分哪些客户\n——落到区域、国家、客户类型。\n✕ 不写\n针对客户要做什么动作——那是「怎么做」的\n一页纸\n解码内容。\n有的行写不出客户机会没关系；有的行一定能写出客户与营销端机会——先填，再精简。"},{"id":"s02b08","type":"mod","heading":"场景聚焦的证据状态","text":"场景聚焦的证据状态\n场景不能凭感觉圈：当前讨论聚焦在游泳、户外露营、骑行，但取舍要靠数据说话。\n先做\n游泳\n——水上运动在环太平洋国家增长趋势大。\n先做\n骑行\n——中东、拉美、东南亚增长率较高、价格敏感；已按市场写好产品矩阵。\n待取舍\n露营\n——与游泳、骑行并列为三个增量场景，彼此独立、差异大；大口径数据分不出高下。\n证据不足\n跑步\n——每个场景都在增长，但没有突出者，无法确定非做哪个。\n删除\n滑雪\n——没有专业装备能支持这块产品。\n大场景下的细分趋势还要再判断：细分是否足以支撑专门投入。"},{"id":"s02b09","type":"mod","heading":"作业怎么推进","text":"作业怎么推进\n时间\n：各组报时 10~40 分钟，统一给 20 分钟（取上限），不够再延。方向\n大致正确即可\n——这张表没有标准答案、没有底；建议\n每个季度都做一次洞察\n，砍掉广铺无意义的部分。\n分工\n：组长组织、书记执笔，别让一两个人从头写到尾；表格一行能落三个点已经很好，达不成机会的该删就删。\n① 点赞\n他们哪里做得好\n② 问题\n我没听懂的地方\n③ 建议\n没写到的，或不同意、认为另有方向\n汇报方不反驳、不解释，先记录吸收，之后统一修改；组间合议是给分重点，意见可记在讲义或电脑上。"},{"id":"s02b10","type":"mod","heading":"To C 建心智，To B 收订单","text":"To C 建心智，To B 收订单\n「B2B 怎么赢」的导入：品牌方（含 OEM/ODM）的传递逻辑是\nTo C 建心智、To B 收订单\n——这是战略层面的思考。\n1\n懂 C 端＋懂品牌\nODM/OEM 的前提：有 C 端与差异化能力，客户选品开发才会选你。\n2\nTo C 建心智\n用 C 端洞察与品牌动作，先建立终端认知。\n3\nTo B 收订单\n渠道打法务必强调标杆客户的成功。\n4\n交付可信赖\n数量、质量、交期有保障；先共识目标，交付到位再略微超出。\nC 端买的是开箱惊喜，B 端不是：先帮客户完成当年 5%~10% 的利润目标；客户开发要证据先行——展会跑出的素材可直接供对方投广告。"},{"id":"s02b11","type":"mod","heading":"汇报怎么讲：话不在多，在准","text":"汇报怎么讲：话不在多，在准\n客户见证＝一句话事实\n「贝斯的战略是我带他们做的。」「路特创新从 10 亿到 100 亿，是我带他们做的。」\n汇报结构＝左因果、右结论\n左半部分讲因果逻辑；右半部分「因为—所以—再所以」，最终落在关键结论。\n产品表达同理：客户收到一堆卖点，还是 get 到重点？打动 B 端客户，话不在多而在精，把关键点讲准。"},{"id":"s02b12","type":"part","heading":"三组方案与互评","text":"PART 3\n三组方案与互评\n三组按统一框架汇报，其他组合议后给出点赞／问题／建议，讲师逐组收口。每组含方案要点与评审归并。\n耳机品牌组\n耳机品牌组\n汇报人：王琦 ｜ 议题：OWS / TWS / 头戴\nPC游戏外设组\nPC 游戏外设组\n议题：耳机 / 鼠标 / 键盘 / 手柄\nOEM/ODM组\nOEM·ODM 组\n议题：音频代工的客户结构与转型"},{"id":"s02b13","type":"mod","heading":"宏观机会与分品类节奏","text":"宏观机会与分品类节奏\n三个可立即执行的动作：① 对代理商与消费者做\n品类教育\n；② 精选存量客户渠道，在 OWS 爆发区域为有认知、有能力的代理快速做规划；③ 以\n合规产品\n抢占市场洗牌机会——此前一直没做透的欧洲市场，因政策变化成为新机会。\nOWS\n需求翻倍增长 · 品类最热\n动作\n先推入门与中端的可调产品，与竞品形成差异化；长期聚焦\n通话＋翻译\n场景，推出旗舰 OWS。\nTWS\n传统品类维稳 · 睡眠场景爆发\n动作\n按 H2 节奏：抓住睡眠场景的快速增长，补齐多定位产品线。\n头戴\n传统品类维稳 · 电池法/包装法新规\n动作\n第一阶段抓法规机会，更新整条头戴产品线。\n宏观信号（品类冷热＋新法规）逐行映射到分品类的产品动作。"},{"id":"s02b14","type":"mod","heading":"五维结论与用户层补充","text":"五维结论与用户层补充\n用户层两条主线：\n现有用户的功能升级需求\n，以及\n决策链路变化\n——从线下卖场、单一电商，转向内容种草与 AI 共同影响购买。产品侧两个抓手：OWS 天然带装饰属性，做外观升级与情绪化延伸；用技术下放把「能用」做成「好用」。\n客户·市场\n覆盖并强化\n存量头部零售渠道\n，抢占欧美市场；面向需要功能升级、需要「第二副耳机」的用户。\n品类\n加强旗舰产品建立品牌心智；\n利润款做品牌营销，流量品抢市场份额\n。\n渠道打法\n规范产品表达语言、适配当地消费者；协助优质代理强化存量优势渠道；抢占电商、社群、私域等新形态渠道。\n营销\n抢占\nOWS 品类心智窗口期\n；高频场景内容＋技术背书打动用户；借 AI 搜索精准投流与线下体验促成转化。\n核心能力\n持续洞察，用大量 To C 分析赋能 To B；搭建 AI 体系与流程化；强化组织协同与共识。"},{"id":"s02b15","type":"mod","heading":"营销五路与竞争对象","text":"营销五路与竞争对象\n1\n社媒电商\n放大话题讨论与转化率\n2\n种草渗透\n缩短痛点触达消费者决策的链路\n3\nGEO·AI 入口\n布局 AI 导购与搜索问答信息源\n4\n用户口碑\n评价与舆情监控反哺卖点迭代\n5\n线下体验\n终端场景化试戴，强化体感与临门促销\n贝斯\n大量布局 OWS 带动规模快速增长，单一品类进入 Top 5。\n安克\n关注其音频品类的技术栈与技术平台建设。\n漫步者\n供应链体系与组织效能，开发效率行业领先。\n手机品牌\n警惕其产品外延，避免正面竞争。\nOWS 品类\n品类心智尚未形成，是自己的突破口。"},{"id":"s02b16","type":"mod","heading":"组间评审归并","text":"组间评审归并\n点赞\n抓住 OWS 品类窗口期，单品系列聚焦\n旗舰／利润款／流量款的产品梯队清晰\n布局社媒与线下体验等新渠道\n用 To C 洞察反哺 To B，贴合品类增长\n有跨行业的竞争视角\n问题 · 建议\n重点国家与渠道不明确——欧美要落到哪国、哪类客户\nOWS 场景差异化与市场容量缺数据，衍生场景过多需聚焦\nTWS 整体质量问题没有应对对策\n最关键要干的一件事没提炼出来\n存量头部渠道从老客户还是新客户开始，结论不清\n定性多、概念多——「翻倍」应写成如「增速 300%」；场景内容要括注初步结论\n讲师收口\n：方向大致正确即可；OWS 头部格局已定，难正面抢，要找自己的点。B 列定性偏多，但前期材料里有数据，归纳时别丢；「To C 建心智、To B 收订单」是战略层逻辑，能力项后续要变成具象动作。"},{"id":"s02b17","type":"mod","heading":"外部与客户洞察","text":"外部与客户洞察\n行业保持增长，但\n以价换量会加剧，增长质量承压\n；增量集中在耳机、鼠标、键盘、手柄四大品类，同时监测潜在品类。竞争已从参数转向体验、渠道与服务：耳机品类有中国新锐品牌进入，需守住中端优势；鼠标轻量化无线普及带来机会；其余品类成熟，要找细分突破。\n8%~11%\n全球游戏外设未来 5 年增速\n第三方数据口径；细分品类增速分化，以此圈定分析范围。\n参数→体验\n技术下放加速，竞争转向综合体验\n无线轻量化、磁轴快触发、霍尔/TMR 摇杆进入中间价位；单参数难有持续溢价。\n≈50%\n线下仍贡献约一半销售额\n线上增速更快，但仍需全渠道经营。\n−18%\n国际品牌溢价缩水\n中国品牌在部分品类、区域已反超，替代窗口打开；通病是售后短板。\n翻倍\n换机潮国家的增长弹性\n政策＋技术双拐点，催生存量换机红利窗口。\n70%\n线上化率走向\n多数消费按电商大促节奏规划，非大促期转化率不足 50%。\n>52%\n多个市场女性玩家过半\n粉白配色可撬动 15%~20% 溢价。\n以上为该组汇报引用的数据口径。"},{"id":"s02b18","type":"mod","heading":"市场梯队与能力链","text":"市场梯队与能力链\n第一梯队 · 抢全品类增量\n巴西\n土耳其\n俄罗斯\n越南（本轮新增）\n至少覆盖耳机、鼠标、键盘、手柄四个品类的增量。\n第二梯队 · 高潜国家\n找出当地最重点的一两个品类，按用户需求调整产品、价格与销售方法；与 B 端客户共同经营，帮其把产品卖给终端用户。\n姿态：\n卖货市场\n→\n共同经营重点市场\n品类分工：游戏耳机＝核心重点 ｜ 鼠标＝增长引擎 ｜ 键盘 · 手柄 · 麦克风 · 电竞椅＝小范围尝试。产品同时满足 B 端（质量稳定、交付可靠）与 C 端（功能、外观、实际体验）。\n1\n吸引 C 端\n产品体验测评＋达人内容\n2\n完成 B 端销售\n电商、线下门店、代理商\n3\n反馈带动销售\n用消费者反馈带动客户销售\n定位升级：\n供应商\n→\n帮客户增长的合作伙伴\n能力要求：To C 洞察要有证据；与 B 端共创产品与营销；用质量、交付、售后、内容提升信任与稳定。"},{"id":"s02b19","type":"mod","heading":"组间评审与讲师收口","text":"组间评审与讲师收口\n点赞\n数据详实，与框架契合度高\n渠道与区域清晰\n高潜国家联动 B 端触达 C 端，把研发与真实消费者打通\n市场定位与产品定位明确\n问题 · 建议\n整体是跟随卖货思路，以市场为角度而非产品角度，缺自研壁垒\n没有精准客户画像，女性用户缺数据支撑\n竞对不清晰——看不出对标哪家公司、哪个渠道\n缺与巴西、土耳其等新兴市场的增速对比\n女性结论没落到产品与结论区\n核心品类的旗舰与场景化产品布局缺位；游戏耳机为重点的依据、核心国家市占率未说明\n讲师收口\n：看竞争最好导出「向 A 学开品逻辑、向 B 学渠道打法、向 C 学品牌打法」。轻量化若属典型机会，要结论化到其他品类；女性若是重要结论，哪怕写「尝试」也要落进结论区——倒逼聚焦、给左列排序。写法上加 B:/C: 标注，新增「品牌与市场」打法；数据分静态体量与动态增速，可盯前 2% 的品类国家。"},{"id":"s02b20","type":"mod","heading":"客户结构转型与产品节奏","text":"客户结构转型与产品节奏\n接到命题后，组内先回答定位问题——OEM 走中高端还是低价？结合现状给出转型目标与节奏：\n现状\n低价\n60%\n中高端\n40%\n→\n目标（过渡阶段）\n中高端\n60%\n低价\n40%\n过渡阶段，不舍弃原有低价渠道产品；对内数据显示，产品比例已在向中高端倾斜。\nH1\n主攻\nOWS＋自研通话降噪技术立项：源自欧美日韩「通话不清晰」痛点；优先验证 OWS 耳夹；TWS 聚焦换新、明确资源投放。\nH2\n尝试\n按办公→运动户外→家庭娱乐，验证性价比与品质升级款。\n观察\n跟进\n用自研拾音方案收集用户体验，跟进 OWS 细分机会。\n营销（本轮新增）\n：OWS 中高端线单独立项，配专属团队与预算；独立项目组＋数据隔离，展会、官网做行业可视化传播；跟随主流核心卖点但不全盘跟风；不打低价战。\n渠道\n：C 端亚马逊＋B 端专业零售与知名品牌客户，按渠道定制差异化合作；以保密合规的大客户案例提升信任。\n品类盘\n：OWS 为流量基本盘；TWS/头戴/音箱分赛道；借欧盟电池合规构建 ODM 优势；储备 AI 音频与环保材料。\n六大核心能力：\n市场洞察\n音频研发与测试\n渠道客户开发\n供应链交付\n差异化打造\n项目管理与合规\n竞对已先行推出同类产品——市场洞察要持续捕捉；六大能力对外支撑 ODM/OEM 音频产品解决方案。"},{"id":"s02b21","type":"mod","heading":"组间评审与讲师点评","text":"组间评审与讲师点评\n点赞\n向内看（组织与能力）写得非常完整\n「通话不清晰」痛点抓得准，且给出了对应方案\n问题 · 建议\n向外看不聚焦——已提炼的核心国家与客户没表达出来，人、货、场缺失\n自研拾音降噪方案在 OWS 与 TWS 上都有应用：先做谁、是否同步，没说清\n缺竞对分析\n要抓的中高端客户是谁、怎么抓，不明确\n讲师点评\n：回到四问——客户与市场＝\n卖给谁\n（哪些存量客户深耕、哪些潜力客户怎么拿下）；品类产品＝\n卖什么\n，写三个小点：什么产品、中高端与中低端的大致策略、卖点特性与技术优势怎么打造。\n中高端 ≠ 舍弃低端\n：这是 4:6 到 6:4 的过渡；不同区域可以有不同托举——有的「创新待成熟」，有的「成熟待创新」。产品结构上，旗舰引领＋梯队产品＋\n防守性产品\n：防守单可以对竞品抢客户、短期不图赚钱，但全盘要能支撑。\n防守案例（课上讲述）：篮球袜「有志者」对「维动」\n长沙品牌「有志者」做美国篮球袜（常见 299~399 元）的平替，129 / 99 元，冲到三四亿；被低价复制者「维动」（19.9~39.9 元）冲击后销量下滑，于是另立子品牌专打防守、不图赚钱。对手撑不住后主品牌缓过来，利润回升。\n要点：防守单单独看不赚不赔、不影响大盘，背后要有\n高利润产品支撑\n——战略性亏损是一种能力，要平衡短期与长期、这一单与下一单；有的防守单不赚钱，但「做了这个客户，另外的客户就来了」。"},{"id":"s02b22","type":"part","heading":"讲师工具箱：可复用的方法","text":"PART 4\n讲师工具箱：可复用的方法\n评审过程中讲师穿插的方法与案例，单独收在此处备查。"},{"id":"s02b23","type":"mod","heading":"用户洞察七问","text":"用户洞察七问\nTo C 洞察别停留在年龄段标签，按七问逐层下钻，选一两问做深即可；B 端同样适用。\n1\n标签\n年龄、城市、性别与职业占比\n2\n需求排序\n共性内排序 123＋特性内排序 123\n3\n痛点\n需求必有未被满足处（如玻璃瓶铁盖）\n4\n场景\n排序：上学前 / 洗澡后 / 运动后\n5\n动机\n理性 / 感性，分属不同角色\n6\n价格承受力\n愿为哪一档买单\n7\n复购触发点\n配件、提醒、券；消费者需要被引导\n双用户驱动：To B（经销商、CS、KA）与 To C（妈妈＋青少年）一起看，别只求一边。\n「袋鼠妈妈」青少年护肤示范\n场景\n：用自家两个孩子还原「起床四件事」——洗漱场景时间赶、孩子偷懒做假动作，洞察结论＝\n方便快捷\n；包材决策：方不如圆、小口不如大口、圆不如泵、带盖泵不如免拧直按——\n手脚会投票\n。\n动机\n：理性动机在妈妈（约 95% 的购买决策），感性动机在青少年——双代言：青少年找时代少年团，妈妈找昆凌；随产品送可交换的代言贴纸，强化下次复购时的询问。"},{"id":"s02b24","type":"mod","heading":"洞察流程：VOC＋VOS","text":"洞察流程：VOC＋VOS\n1\n起点\nVOC（C 端客户之声）＋VOS（B 端卖家之声）\n2\n过程\n围绕精准化、差异化、引领性，按月输出洞察\n3\n终点\n产品定义——把需求写出来\n用户洞察是同类公司普遍关注的组织能力（与产品资源能力并列）。"},{"id":"s02b25","type":"mod","heading":"把定性写成数据","text":"把定性写成数据\n表达\n：「翻倍」是相对量化——写成「\n增速 300%\n」更好，后台有数据就直接写；也别文绉绉（如「细分场景的涌现」）。静态体量之外，更要看增速。\n从数据到结论，落点任选\n：\n· 国家——贝斯不带电芯的移动充电器在 T1 国家增速最快 → 结论「重点打 T1 国家」；\n· 场景——排第一的场景 → 明年新品迭代就打它；\n· 人群——客户女性占比高 → 10 个品 7 个对女性、3 个对男性：\n战略不是非黑即白\n，主力打女性，男性照做（如客群示例：更年轻、更潮流、更精致的出行女性）。\n附\n：那款「不带电芯」产品＝插头可调＋线可伸缩＋瓦数可调（67W/25W），把电源线、充电宝、设备三件事并成两件——产品形态本身就是卖点。"},{"id":"s02b26","type":"mod","heading":"旗舰大单品的四个标准","text":"旗舰大单品的四个标准\n1\n代表品类心智\n是品牌的代表作；未必是最高端——课上讨论：特斯拉的旗舰更可能是走量的 Model Y，而非最高端车型\n2\n有技术壁垒\n别人短期做不出来\n3\n原点人群背书\n足够多的意见领袖；达人、网吧这类原点场景是好的写法\n4\n有销售规模，不求最大\n很多旗舰沦为摆设；要有一小群人真心在买、在用\n旗舰之后\n先纵向延伸，别急着横向\n。产品抓手共三件：旗舰大单品、产品梯队战略牵引、特性卖点聚焦。"},{"id":"s02b27","type":"mod","heading":"增速与规模，取决于你是谁","text":"增速与规模，取决于你是谁\n自身能力强\n抢\n体量大且增速快\n的市场：集团军作战，盯最肥的肉——贝斯重点打 T1 国家，抢得走的就是自己的。\n能力有限\n适当\n差异化\n，抢体量不是最大但增速快的成长市场——小熊电器做美的看不上的小家电：单身、租房、年轻女性；定位「萌」：好操作、好看、占地小，技术指标不重要。\n不因行业增速快就一定做，要结合竞争环境。"},{"id":"s02b28","type":"mod","heading":"品牌叙事与圈层引爆","text":"品牌叙事与圈层引爆\n核心原则\n共性讲标配，特性讲稀缺\n——共性满足刚需，特性打动选择。当材质人人都在讲（A 类棉、新疆棉、长绒棉、母婴级……），材质已成标配，要绕开材质讲特性与情绪。\n情绪吊牌 · 童装「贝西南」\n吊牌正面不印含棉量指标，印一句——「有一天你兴冲冲地出门，不再是为了奇趣蛋或是棒棒糖，而是无论车水马龙还是天南海北，要记得妈妈爱你胜过爱自己」。买的人是妈妈，传播的是情绪；品牌专业度渗透到包装与内容，反哺 To B 与 To C。\n故事 logo · 欧美音箱品牌\n狗对着唱机喇叭的 logo，源自兄弟与狗的故事——一个好故事让 logo 被记住十多年。\n起源故事 · 李锦记\n「蚝油发明者」——1888 年渔民熬蚝汁熬干了成糊；起源即差异。\n按客群改产品 · 龙哥小火锅\n客群是年轻小姐姐（59.9 元随便吃、回转式自涮），汉堡做成粉色——大人觉得不健康，客群觉得可爱，成了大爆款。\n圈层引爆 · 唐联科技\n杭州行车记录仪品牌，约 30 多亿规模：先与 Uber 合作引爆网约车人群，C 端随之大量增长——圈层打穿，泛人群自来。\n围绕卖点的品牌动作 · 贝斯\n「一个就够」：子维度＝场景适配、便捷、体积、释放双手、握持吸力；内容与视觉围绕更新。要实打实的品牌赋能，不要虚的品牌姿态。\n场景化 × 情绪\n游戏与音频是高情绪化的品类：床头音箱该长什么样？场景要同时调节情绪体验。"},{"id":"s02b29","type":"part","heading":"收尾对齐：先验证跑通再放大","text":"PART 5\n收尾对齐：先验证跑通再放大"},{"id":"s02b30","type":"mod","heading":"散场前的复盘：转化断点不在资源","text":"散场前的复盘：转化断点不在资源\n汇报结束后的小范围对齐，留下三个判断：\n现阶段目标不是打造品牌标杆与品牌认知，而是\n打通可持续复制的基础\n。\n不必全品类都打：精力与资源有限，市场也对应有限；不同市场可以\n有托举\n——有的要「创新待成熟」，有的要「成熟待创新」，先小范围验证，跑通再放大。\n韩国、印尼市场的反馈：渠道种草与社群客户都不差，但转化只有\n约 5%\n——问题不在 SKU、品类或资源，而在\n内容种草到转化收获的路径没有对接、动作行为不统一\n；韩国已有约一年的内容建设积累，正卡在向收获转段。\n对话共识：表象与国内做 C 端的问题相似，本质不同——「精准触达产品人群」的能力，仍是当前最大的缺口。"}]},{"num":3,"id":"s03","title":"先验证，再引爆：运动耳机战略共创会","date":"2026年11月9日","css":"#sv{\n  --page-bg:#f4f6fa;\n  --surface:#ffffff;\n  --surface-2:#edf1f8;\n  --text:#1a2233;\n  --text-2:#5b6579;\n  --accent:#3556d8;\n  --accent-deep:#2743b0;\n  --accent-soft:#e7ecfb;\n  --accent-border:#b7c6f4;\n  --border:#dfe4ee;\n  --border-strong:#c3cbdc;\n  --good:#177a4b;\n  --good-soft:#e3f2e9;\n  --warn:#a3540e;\n  --warn-soft:#faeddd;\n  --radius:14px;\n  --radius-s:10px;\n  color-scheme:light dark;\n}\n@media (prefers-color-scheme: dark){\n#sv{\n    --page-bg:#0e1320;\n    --surface:#151b2b;\n    --surface-2:#1b2337;\n    --text:#e8ecf5;\n    --text-2:#96a1bb;\n    --accent:#7d97f0;\n    --accent-deep:#a9b9f8;\n    --accent-soft:#202c50;\n    --accent-border:#3d5089;\n    --border:#29334e;\n    --border-strong:#3b4869;\n    --good:#6fc79a;\n    --good-soft:#16301f;\n    --warn:#e0a25f;\n    --warn-soft:#33260f;\n  }\n}\n*{margin:0;padding:0;box-sizing:border-box}\n#sv,#sv{background-color:var(--page-bg)}\n#sv{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",\"Segoe UI\",sans-serif;font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased}\n::selection{background:var(--accent-soft)}\n.topline{height:3px;background:var(--accent)}\n.wrap{max-width:880px;margin:0 auto;padding:0 18px 72px}\nb,strong{font-weight:700}\n.hl{color:var(--accent-deep);font-weight:700}\n.hero{padding:48px 2px 4px}\n.kicker{font-size:12px;font-weight:700;letter-spacing:3px;color:var(--accent-deep)}\n.hero h1{margin-top:12px;font-size:clamp(27px,5.6vw,40px);line-height:1.28;font-weight:800;letter-spacing:-0.5px}\n.lead{margin-top:14px;max-width:680px;color:var(--text-2)}\n.lead b{color:var(--text)}\n.part{margin-top:48px}\n.part-head{border-top:1px solid var(--border-strong);padding ont-size:12.4px;color:var(--text-2)}\n.case-panel{margin-top:12px;padding:13px 15px;border:1px dashed var(--border-strong);border-radius:var(--radius-s);font-size:13.2px}\n.case-panel .case-k{margin-bottom:5px}\n/* Component-name-agnostic mobile safety net.\n   Structural guarantees are expressed against CSS Grid/Flex behaviour and\n   generic attribute hooks rather than a fixed class vocabulary,so generating\n   models may invent component names freely for any recording type. */\n*,*::before,*::after{ box-sizing: border-box; }\n#sv{ width: 100%; min-width: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n#sv{ width: 100%; min-width: 0; margin: 0; overflow-wrap: break-word; }\nmain,header,footer,nav,section,article,aside,figure,div,ul,ol,li,dl,dd,details{ min-width: 0; }\nimg,picture,video,canvas,svg{ display: block; max-width: 100%; height: auto; }\npre,code,kbd,samp{ max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }\nh1,h2,h3,h4,h5,h6,p,li,td,th,dt,dd,blockquote,figcaption{ overflow-wrap: anywhere; }\ninput,textarea,select,button{ max-width: 100%; font: inherit; }\n/* Any table gets a scroll container by intent or by generic hook. */\n.table-scroll,.table-wrap,.matrix-wrap,[data-table-scroll],[data-scroll-x]{\n  max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;\n}\n.table-scroll > table,.table-wrap > table,.matrix-wrap > table,[data-table-scroll] > table,[data-scroll-x] > table{ margin: 0; }\n/* Numbered step rows: keep #sv copy out of the counter track. */\n.step-item,[data-step-item]{ grid-template-columns: 32px minmax(0, 1fr) !important; }\n.step-item::before,[data-step-item]::before{ grid-column: 1 !important; grid-row: 1 !important; }\n.step-item > :empty,[data-step-item] > :empty{ display: none !important; }\n.step-item > *,[data-step-item] > *{ grid-column: 2 !important; min-width: 0 !important; }\n.data-value,.metric-value,[data-value]{ max-width: 100%; font-variant-numeric: tabular-nums; }\n/* A single su span-all],[data-value-kind=\"formula\"],[data-value-kind=\"range\"]{ grid-column: 1 / -1 !important; }\n/* Horizontal flows become vertical. */\n  [class*=\"flow\"],[class*=\"chain\"],[class*=\"timeline\"]{ flex-direction: column !important; }\n[class*=\"arrow\"]{ transform: rotate(90deg); min-height: 16px !important; }\ntable{ font-size: 12.5px; }\nth,td{ padding: 9px 8px !important; }\nnav{ max-width: 100%; }\nnav[data-scrollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}","body":"\n<div class=\"topline\"></div>\n<div class=\"wrap\">\n<header class=\"hero\">\n<p class=\"kicker\">战略共创会 · 汇报与点评纪要</p>\n<h1>先验证，再引爆：运动耳机战略共创会</h1>\n<p class=\"lead\">品牌A组汇报开放式运动耳机的三年战略设想，随后各组互评、引导者总结方法。核心判断：<b>这个阶段不比谁写得全，而是尽快验证出引爆点。</b></p>\n</header>\n<section class=\"part\" id=\"s03b01\">\n<div class=\"part-head\">\n<p class=\"part-eyebrow\">PART 01 · 战略汇报</p>\n<h2 class=\"part-title\">品牌A组方案：运动垂类三年设想</h2>\n<p class=\"part-desc\">品牌A组按当天发布的新模板细化调整后汇报；方案覆盖趋势、用户、竞争与打法，全面但尚待聚焦。</p>\n</div>\n<article class=\"mod\" id=\"s03b02\">\n<div class=\"mod-head\"><span class=\"mod-idx\">1.1</span><h3>行业趋势：四个方向的信号</h3></div>\n<p>战略输入来自四个方向，其中<b>耳夹式形态</b>与<b>水上运动场景</b>被点名为增长相对更快的两处。</p>\n<figure class=\"fig\" data-visual-id=\"hack-team-trend-map\" data-visual-relation=\"品类、政策、新兴市场与垂类赛道四个方向的已知趋势，构成战略输入\" data-visual-source=\"开放式耳机品类增长……小包免税通道逐步关闭……中东拉美东南亚爆发……环太平洋水上娱乐场景增长突出\" data-visual-title=\"宏观与行业四点趋势\" data-visual-type=\"趋势板块图\">\n<div class=\"trend-grid\" data-grid=\"\">\n<div class=\"tcard hot\">\n<p class=\"tcard-k\">品类增长</p>\n<p class=\"tcard-t\">开放式耳机整体向上，<b>耳夹式形态的增速相对更高</b>。</p>\n</div>\n<div class=\"tcard\">\n<p class=\"tcard-k\">政策环境</p>\n<p class=\"tcard-t\">欧美小包免税通道逐步关闭，欧洲关税门槛抬高；电池法、包装法等合规要求趋严。</p>\n</div>\n<div class=\"tcard\">\n<p class=\"tcard-k\">新兴市场</p>\n<p class=\"tcard-t\">中东、拉美、东南亚爆发式增长；中低收入市场对价格敏感，需有应对。</p>\n</div>\n<div class=\"tcard hot\">\n<p class=\"tcard-k\">垂类增量</p>\n<p class=\"tcard-t\">游泳场景：<b>环太平洋区域的水上娱乐增长突出</b>，跑赢大盘。</p>\n</div>\n</div>\n</figure>\n</article>\n<article class=\"mod\" id=\"s03b03\">\n<div class=\"mod-head\"><span class=\"mod-idx\">1.2</span><h3>用户与客群：痛点升级，标签分化</h3></div>\n<p>运动专业度越高，对基础可靠性的要求越苛刻——旧痛点被放大成新机会。</p>\n<figure class=\"fig\" data-visual-id=\"hack-user-pain-chain\" data-visual-relation=\"运动专业度提升带动极限场景可靠性需求，防风防汗等基础痛点市面未满足，构成产品机会\" data-visual-source=\"极限的使用场景的可靠性需求是逐步去提高的……防风罩跟防汗石这一类型的痛点是市面产品还没有完全满足好的\" data-visual-title=\"运动垂类痛点升级链\" data-visual-type=\"链路示意图\">\n<div class=\"chain\">\n<div class=\"chain-node\">运动专业度提升</div>\n<span class=\"chain-arr\">→</span>\n<div class=\"chain-node\">极限场景可靠性要求提高</div>\n<span class=\"chain-arr\">→</span>\n<div class=\"chain-node warn\">防风罩、防汗等基础痛点，市面产品尚未满足</div>\n<span class=\"chain-arr\">→</span>\n<div class=\"chain-node gain\">产品机会</div>\n</div>\n</figure>\n<div class=\"duo\" data-grid=\"\">\n<div class=\"subblock\">\n<p class=\"sub-t\">客群标签的新增长</p>\n<p>运动户外场景中，<b>女性化</b>与<b>银发族群</b>趋势明显，可能形成独立的消费机会。</p>\n</div>\n<div class=\"subblock\">\n<p class=\"sub-t\">渠道行为在变</p>\n<p>从广铺货架式铺SKU，转向线下体验店＋线上内容＋垂类平台的整合营销；种草内容从参数讲述转向<b>情绪驱动</b>。</p>\n</div>\n</div>\n</article>\n<article class=\"mod\" id=\"s03b04\">\n<div class=\"mod-head\"><span class=\"mod-idx\">1.3</span><h3>竞争格局：三层玩家与两个空隙</h3></div>\n<p>大牌正借耳夹式切入运动垂类，高端位只有两家自研，大众市场被OEM白牌同质化淹没；此外还有两个值得注意的信号。</p>\n<figure class=\"fig\" data-visual-id=\"hack-competition-landscape\" data-visual-relation=\"大牌借耳夹式入局运动垂类，高端仅两家自研，大众白牌OEM同质化，配套App低评分构成体验缺口\" data-visual-source=\"大牌玩家通过耳夹式入局运动垂类……骨导或后挂式只有shokz跟墨觉做品牌自研……初创配套APP评分普遍非常低\" data-visual-title=\"运动耳机竞争格局分层\" data-visual-type=\"格局示意图\">\n<div class=\"tiers\">\n<div class=\"tier\"><p class=\"tier-k\">大牌入局</p><p class=\"tier-t\">Bose、漫步者借耳夹式这一增长形态切入运动垂类，专门策划运动SKU。</p></div>\n<div class=\"tier\"><p class=\"tier-k\">高端自研</p><p class=\"tier-t\">骨导 / 后挂式仅<b>韶音（Shokz）</b>、<b>墨觉</b>做品牌自研。</p></div>\n<div class=\"tier\"><p class=\"tier-k\">大众白牌</p><p class=\"tier-t\">工厂OEM导入，同质化严重。</p></div>\n</div>\n<div class=\"gapchips\" data-grid=\"\">\n<div class=\"gchip gap\">\n<p class=\"gchip-k\">体验空隙</p>\n<p>中小初创品牌的配套App评分普遍很低（索尼、三星等除外），远达不到用户预期。</p>\n</div>\n<div class=\"gchip drift\">\n<p class=\"gchip-k\">龙头动向</p>\n<p>韶音从总部统一运营，转向由各细分市场的区域代理做本土化运营，稳步随动增长。</p>\n</div>\n</div>\n</figure>\n</article>\n<article class=\"mod\" id=\"s03b05\">\n<div class=\"mod-head\"><span class=\"mod-idx\">1.4</span><h3>应对策略：从增量到能力建设</h3></div>\n<figure class=\"fig\" data-visual-id=\"hack-response-strategy\" data-visual-relation=\"增量在场景与区域两头，驱动三条技术主线与产品重组，渠道区分化运作，能力建设支撑品牌资产滚动积累\" data-visual-source=\"增量在场景跟具体的区域市场两头……主攻三条技术主线……内部会澄清清楚品类的边界……能力去做提升\" data-visual-title=\"应对策略总览：两端增量到能力建设\" data-visual-type=\"策略流程图\">\n<div class=\"flow\">\n<div class=\"fstep\"><p class=\"fstep-k\">① 增量判断</p><p>增量在<b>场景</b>与<b>区域市场</b>两头：游泳等水上娱乐场景；欧美稳步增长，拉美、东南亚、中东的跑骑运动爆发。对增量场景做产品细分的本土化洞察。</p></div>\n<div class=\"farr\">↓</div>\n<div class=\"fstep\"><p class=\"fstep-k\">② 传播与区域动销</p><p>打开三个洞察窗口：社交化运动、运动生活方式穿搭、细分客群标签；不同区域采取不同的动销与营销整合方式。</p></div>\n<div class=\"farr\">↓</div>\n<div class=\"fstep\"><p class=\"fstep-k\">③ 产品与品类</p><p>三条技术主线：<b>可靠性、抗风噪、高价值场景×产品形态绑定</b>。按场景价值与价位段重组产品：音箱改为可夹挂的组网对讲单元，眼镜主打跑骑；为女性、银发客群配称CMF、新品形态与周边配件。</p></div>\n<div class=\"farr\">↓</div>\n<div class=\"fstep\"><p class=\"fstep-k\">④ 渠道与销售</p><p>对直营平台、大分销商、垂直渠道、品牌运营商区分化运作。前置动作：<b>澄清品类边界</b>，避免同品类同形态在同一渠道打架。</p></div>\n<div class=\"farr\">↓</div>\n<div class=\"fstep\"><p class=\"fstep-k\">⑤ 能力建设</p><p>一手数据与产品洞察、快速供应链与市场验证、自研与品质管理、结构与材料创新、固件算法软件、VOC与售后闭环。</p></div>\n<div class=\"farr\">↓</div>\n<div class=\"fstep final\"><p class=\"fstep-k\">⑥ 品牌资产滚动积累</p><p>在运动客群、私域与种子用户中生根渗透，让用户帮品牌传播；分渠道提升运营管理能力，打造<b>标杆市场与标杆渠道</b>，再把可复制的增长路径推广到其他品类与国家。</p></div>\n</div>\n</figure>\n</article>\n</section>\n<section class=\"part\" id=\"s03b06\">\n<div class=\"part-head\">\n<p class=\"part-eyebrow\">PART 02 · 评审意见</p>\n<h2 class=\"part-title\">集体反馈：全而不聚焦</h2>\n<p class=\"part-desc\">对品牌A方案的意见高度一致：洞察全面、场景清晰，但缺锚点、缺定位、缺章法。</p>\n</div>\n<article class=\"mod\" id=\"s03b07\">\n<div class=\"mod-head\"><span class=\"mod-idx\">2.1</span><h3>第一轮点评：两个亮点，三个待解</h3></div>\n<figure class=\"fig\" data-visual-id=\"hackii-review-feedback\" data-visual-relation=\"方案场景化强且渠道边界前置，但客单价矛盾、经营模式与场景广度三点待解\" data-visual-source=\"场景化很强，直观差异化很强……高客单价和低知名度的矛盾……我建议还是B2C……我们的产品对口能不能撑得住\" data-visual-title=\"第一轮点评：亮点与待解问题对照\" data-visual-type=\"对照矩阵图\">\n<div class=\"twocol\" data-grid=\"\">\n<div class=\"col good\">\n<p class=\"col-k\">亮点</p>\n<ul>\n<li><b>场景化强、差异化直观</b>——典型“第一眼经济”，已被提炼为方法。</li>\n<li><b>渠道边界感前置</b>——先澄清品类边界，避免内部拉扯打架。</li>\n</ul>\n</div>\n<div class=\"col warn\">\n<p class=\"col-k\">待解</p>\n<ul>\n<li><b>高客单价×低知名度</b>的矛盾——靠价格带卡位、品牌定价替代，还是争取“第二选择”？</li>\n<li><b>经营模式</b>——目标渠道很多，但按当前形态，建议坚定打B2C。</li>\n<li><b>场景跨度</b>——跑步、骑行、户外都要，产品对口能否撑得住？</li>\n</ul>\n</div>\n</div>\n</figure>\n</article>\n<article class=\"mod\" id=\"s03b08\">\n<div class=\"mod-head\"><span class=\"mod-idx\">2.2</span><h3>小组互评：三类问题指向同一处</h3></div>\n<p class=\"muted\">先说认可：洞察清晰全面、场景定位精准（游泳、跑步等需求拆解到位）、渠道打法较完善。问题集中在三件事：</p>\n<figure class=\"fig\" data-visual-id=\"peer-group-feedback\" data-visual-relation=\"二、三、四组分别指出缺核心锚点、缺统一叙事、数据缺乏联系三类共同问题\" data-visual-source=\"没有找到核心的锚点……品牌统一叙事体系不够完整……数据之间是缺乏联系的\" data-visual-title=\"小组互评：聚焦、定位与叙事三类意见\" data-visual-type=\"对照矩阵图\">\n<div class=\"fb-rows\">\n<div class=\"fb-row\">\n<div class=\"fb-tags\"><span class=\"gtag\">二组</span><span class=\"gtag\">三组</span></div>\n<div><p class=\"fb-k\">缺核心锚点与优先级</p><p class=\"fb-t\">资源有限却什么渠道、什么人群都要做——“看似有策略的策略”；垂类市场的目标占比也没有定数。</p></div>\n</div>\n<div class=\"fb-row\">\n<div class=\"fb-tags\"><span class=\"gtag\">二组</span><span class=\"gtag\">四组</span></div>\n<div><p class=\"fb-k\">定位与真竞品不明</p><p class=\"fb-t\">看到的都是头部动作——自己的定位在哪里？Bose与漫步者不在同一价位线，品牌A卡哪个价位段、真正要打的竞品是谁？核心产品也不明确：产品线列了很多，最想打的是哪一个？</p></div>\n</div>\n<div class=\"fb-row\">\n<div class=\"fb-tags\"><span class=\"gtag\">二组</span><span class=\"gtag\">三组</span><span class=\"gtag\">四组</span></div>\n<div><p class=\"fb-k\">打法与叙事缺章法</p><p class=\"fb-t\">渠道是标配套餐、撒网式布局：DTC、小批量测试、经销商、线下体验、社群、内容电商，各自担任验证还是放量？短期结果与衡量标准是什么？品牌统一叙事不完整，没有指明主打哪个运动场景；市场、产品、场景、人群的数据之间缺联系，场景与品类技术主线割裂。</p></div>\n</div>\n</div>\n</figure>\n<aside class=\"insight\">各组反馈共同指向：全面性已经够用，缺的是排在前面的“那一个点”，以及它的衡量标准。</aside>\n</article>\n<article class=\"mod\" id=\"s03b09\">\n<div class=\"mod-head\"><span class=\"mod-idx\">2.3</span><h3>内部复盘：三年为何没跑出路径</h3></div>\n<figure class=\"fig\" data-visual-id=\"three-year-reflection-timeline\" data-visual-relation=\"2022年授课时交付优异，两三年后仍未验证出路径，现在回望反推没做对的事\" data-visual-source=\"2022年开始请外部顾问来给我们讲课……依然没验证出一条路径……把没做对的那些事情多做一点点\" data-visual-title=\"三年路径未验证的反思时间线\" data-visual-type=\"时间线图\">\n<div class=\"tline\">\n<div class=\"tl-item\"><p class=\"tl-y\">2022</p><p class=\"tl-t\">请外部顾问授课，当时小组交付表现优异，明显优于其他组。</p></div>\n<div class=\"tl-item\"><p class=\"tl-y\">此后两三年</p><p class=\"tl-t\">依然没验证出一条路径。当年渠道与销售通路相对清晰；反思点之一是<b>渠道选品</b>。</p></div>\n<div class=\"tl-item\"><p class=\"tl-y\">2026 · 战略会</p><p class=\"tl-t\">把“为什么三年没拿到结果”写出来——<b>把没做对的事情多做一点点，就会好很多</b>。</p></div>\n</div>\n</figure>\n<p>引导者的提醒：不是没得决策——现有三条产品线完全可以想清楚；规划很丰满，取舍要看后面的计划怎么拆。会上举例：“兰斯顿”初期同样从运动场景做起，最终拿到了结果。</p>\n</article>\n</section>\n<section class=\"part\" id=\"s03b10\">\n<div class=\"part-head\">\n<p class=\"part-eyebrow\">PART 03 · 方法工具箱</p>\n<h2 class=\"part-title\">方法工具箱：把战略写准</h2>\n<p class=\"part-desc\">引导者先点评了一份聚焦三防品类与户外场景的战略稿，再给出可直接复用的检验与表达方法。</p>\n</div>\n<article class=\"mod\" id=\"s03b11\">\n<div class=\"mod-head\"><span class=\"mod-idx\">3.1</span><h3>好战略四问：过一遍再定稿</h3></div>\n<p>任何战略结论都要同时回答四个问题；答不上来，说明还没想透。</p>\n<figure class=\"fig\" data-visual-id=\"strategy-four-tests\" data-visual-relation=\"一项战略提案需同时通过对用户、对手、老板、员工四个视角的检验\" data-visual-source=\"对手恨不恨……老板投不投……员工干不干，这个就是好战略的4个判断标准\" data-visual-title=\"好战略四问检验图\" data-visual-type=\"检验矩阵图\">\n<div class=\"four-grid\" data-grid=\"\">\n<div class=\"fq\"><p class=\"fq-k\">① 用户认不认</p><p class=\"fq-t\">哪一类用户认？他为什么会认？</p></div>\n<div class=\"fq\"><p class=\"fq-k\">② 对手恨不恨</p><p class=\"fq-t\">对手马上抄走，你能否应对？</p></div>\n<div class=\"fq\"><p class=\"fq-k\">③ 老板投不投</p><p class=\"fq-t\">公司资金有限——看得到更大回报，才会多投。</p></div>\n<div class=\"fq\"><p class=\"fq-k\">④ 员工干不干</p><p class=\"fq-t\">员工一看就觉得“可以做到”，才落得下去。</p></div>\n</div>\n</figure>\n<div class=\"struct-note\">\n<p class=\"sn-k\">配套结构建议</p>\n<p>把<b>人群与场景</b>拉到战略最前端——整个战略结论围绕用户与用户价值展开。这份稿件已有素材：靶心人群为三防越野、露营、睡眠，匹配户外露营、徒步等场景并打入三防品类；市场路径“聚焦核心用户 → 逐步拓展墨西哥、加拿大、澳洲、西欧”本身清晰。</p>\n</div>\n</article>\n<article class=\"mod\" id=\"s03b12\">\n<div class=\"mod-head\"><span class=\"mod-idx\">3.2</span><h3>槽点反攻：把差评变成卖点</h3></div>\n<p>稿件的产品切入法：先找<b>价格真空段</b>，再聚焦痛点——这就是<span class=\"hl\">槽点反攻</span>，一种卖点叠加态。</p>\n<figure class=\"fig\" data-visual-id=\"toilet-slot-effect\" data-visual-relation=\"痛点被反复放大后成为购买时的首要检查项，用槽点做反攻即卖点叠加\" data-visual-source=\"槽点反攻也叫马桶效应……推门进去第一件事是什么？先看看马桶怎么样\" data-visual-title=\"槽点反攻与马桶效应\" data-visual-type=\"比喻流程图\">\n<div class=\"lanes\">\n<div class=\"lane\">\n<p class=\"lane-k\">比喻 · 马桶效应</p>\n<div class=\"lane-flow\"><span>租房马桶老坏</span><i>→</i><span>修了又坏，忍无可忍</span><i>→</i><span class=\"hot\">换房推门第一件事：先看马桶</span></div>\n</div>\n<div class=\"lane\">\n<p class=\"lane-k\">打法 · 槽点反攻</p>\n<div class=\"lane-flow\"><span>锁定卖得最好的竞品</span><i>→</i><span>收集差评里的槽点</span><i>→</i><span class=\"hot\">把自己的强项叠加到槽点上</span></div>\n</div>\n</div>\n<p class=\"fig-note\">痛点被反复放大后，会变成用户决策时的<b>第一检查项</b>——这正是反攻的入口。</p>\n</figure>\n</article>\n<article class=\"mod\" id=\"s03b13\">\n<div class=\"mod-head\"><span class=\"mod-idx\">3.3</span><h3>现阶段第一能力：渠道运营</h3></div>\n<figure class=\"fig\" data-visual-id=\"capability-priority\" data-visual-relation=\"现阶段渠道运营能力为第一优先，其余能力依托已有产品与品质基础\" data-visual-source=\"现在这个阶段排第一的能力还是渠道运营能力……产品有基础……品质有基础\" data-visual-title=\"能力优先级：渠道运营排第一\" data-visual-type=\"优先级标注图\">\n<div class=\"prio\">\n<div class=\"prio-first\">\n<p class=\"prio-rank\">现阶段第一优先</p>\n<p class=\"prio-name\">渠道运营能力</p>\n<p class=\"prio-sub\">测品测渠道 · 扩品扩渠道 · 先把增长做起来</p>\n</div>\n<div class=\"prio-rest\" data-grid=\"\">\n<div class=\"prio-chip\"><p>产品基础</p><span>已有依托</span></div>\n<div class=\"prio-chip\"><p>品质基础</p><span>已有依托</span></div>\n<div class=\"prio-chip\"><p>团队基础</p><span>已有依托</span></div>\n<div class=\"prio-chip\"><p>品牌视觉、AI 等</p><span>稿中已列</span></div>\n</div>\n</div>\n</figure>\n<ul class=\"plain\">\n<li><b>能力体现</b>：把“偏科”的产品打出去；打高客单价，不一味靠性价比、质价比；站内获取流量、站外放大；先验证。</li>\n<li><b>渠道动作</b>：站内打法＋站外品牌市场与红人内容营销，并补入美客多、TK等渠道。</li>\n<li><b>背景判断</b>：业务背后有产品、品质与团队基础——“富二代创业”，不是穷小子创业。</li>\n</ul>\n<div class=\"struct-note\">\n<p class=\"sn-k\">水准校准</p>\n<p>三年方向OK，但成稿是“××亿团队”的水准——<b>写得有点太好了，不要飘</b>；能力清单放到××亿规模没毛病，现阶段先补渠道运营。</p>\n</div>\n</article>\n<article class=\"mod\" id=\"s03b14\">\n<div class=\"mod-head\"><span class=\"mod-idx\">3.4</span><h3>线上产品表达：证据链与信任状</h3></div>\n<p>产品部分先定结构：聚焦品类偏场景化，按战略品 / 生意品布局高中低端。落到线上——卖的是图片和视频，<b>表达方法比功能罗列更重要</b>。</p>\n<figure class=\"fig\" data-visual-id=\"evidence-vs-endorsement\" data-visual-relation=\"证据链靠自己陈述卖点实证，信任状靠第三方背书，二者共同支撑线上产品表达\" data-visual-source=\"证据链是什么？你说它好，我有六大证据……信任状是第三方权威背书专利等等\" data-visual-title=\"证据链与信任状对照\" data-visual-type=\"对照矩阵图\">\n<div class=\"twocol\" data-grid=\"\">\n<div class=\"col\">\n<p class=\"col-k\" style=\"color:var(--accent-deep)\">证据链 · 自己说</p>\n<p style=\"font-size:13.4px\">“你说它好，我有六大证据、有与竞品的对比图”——用实证材料摆出来。</p>\n</div>\n<div class=\"col\">\n<p class=\"col-k\" style=\"color:var(--accent-deep)\">信任状 · 第三方说</p>\n<p style=\"font-size:13.4px\">权威背书、专利等外部证明，替用户先卸掉怀疑。</p>\n</div>\n</div>\n<div class=\"sci-band\">\n<p class=\"col-k\">统一方法 · 科学传播（科传）</p>\n<p>近一年线上经济最热的专业：<b>一手科学、一手传播</b>，把真正的产品卖点与进入壁垒传播出去；国内外电商通用，需与渠道端、产品端有效协同——不只是文案问题。</p>\n</div>\n</figure>\n</article>\n</section>\n<section class=\"part\" id=\"s03b15\">\n<div class=\"part-head\">\n<p class=\"part-eyebrow\">PART 04 · 核心结论</p>\n<h2 class=\"part-title\">核心结论：验证出引爆点</h2>\n<p class=\"part-desc\">写得散在这个阶段不算错——先跑通验证小闭环，2027年找到引爆点，再谈放大与品牌。</p>\n</div>\n<article class=\"mod\" id=\"s03b16\">\n<div class=\"mod-head\"><span class=\"mod-idx\">4.1</span><h3>从验证到引爆点的路径</h3></div>\n<p>会上确认<b>2026年目标约××万人民币</b>。引导者判断：写得散不算错——这个阶段还不配谈重点；<span class=\"hl\">验证是过程，找到引爆点才是结果</span>。</p>\n<figure class=\"fig\" data-visual-id=\"tipping-point-path\" data-visual-relation=\"26年约××万起步，27年目标找到引爆点；品牌弱定价高时引爆点靠产品力，落在更细分场景\" data-visual-source=\"26年做多少？××万人民币……27年争取就是找到引爆点……引爆点是产品力……更细分的一个场景下把它引爆\" data-visual-title=\"验证到引爆点的路径\" data-visual-type=\"流程示意图\">\n<div class=\"hpath\">\n<div class=\"hp-node\">\n<p class=\"hp-y\">2026</p>\n<p class=\"hp-k\">验证之年</p>\n<p class=\"hp-t\">写下的打法都算验证动作，尽快跑出第一个小闭环。</p>\n</div>\n<span class=\"hp-arr\">→</span>\n<div class=\"hp-node hot\">\n<p class=\"hp-y\">2027</p>\n<p class=\"hp-k\">找到引爆点</p>\n<p class=\"hp-t\">例如单点约××万的爆品；品牌力弱＋定价高，引爆点靠<b>产品力</b>，落在<b>更细分的场景</b>。</p>\n</div>\n<span class=\"hp-arr\">→</span>\n<div class=\"hp-node\">\n<p class=\"hp-y\">之后</p>\n<p class=\"hp-k\">放大</p>\n<p class=\"hp-t\">用细分场景里的原点人群——红人、意见领袖——带动放大。</p>\n</div>\n</div>\n</figure>\n<p>引导者同时肯定：写到这个程度，基础与逻辑理解不错，接下来要想清楚的是关键路径。</p>\n</article>\n<article class=\"mod\" id=\"s03b17\">\n<div class=\"mod-head\"><span class=\"mod-idx\">4.2</span><h3>两个引爆案例：单点打穿</h3></div>\n<p>引爆点公式：<span class=\"hl\">某个更细分的场景 × 一个站得住的产品 × 原点人群放大</span>。两个案例讲的是同一件事。</p>\n<figure class=\"fig\" data-visual-id=\"desanto-tipping-case\" data-visual-relation=\"濒危滑雪品牌靠单点动作引爆：长春形象店击穿全国滑雪人群，打出品牌调性与产品\" data-visual-source=\"迪桑特当初就快死掉了……他的引爆点就是我在长春东北开第一家形象店，击穿那个滑雪的人群\" data-visual-title=\"迪桑特引爆案例\" data-visual-type=\"案例流程图\">\n<div class=\"case\">\n<p class=\"case-k\">迪桑特 · 靠一家店引爆</p>\n<div class=\"case-flow\">\n<span>滑雪品牌一度濒危</span><i>→</i><span>安踏收购，老板之子亲自管</span><i>→</i><span class=\"hot\">在长春开第一家形象店</span><i>→</i><span>击穿来自全国的滑雪人群，把品牌调性与产品打出去</span>\n</div>\n</div>\n</figure>\n<figure class=\"fig\" data-visual-id=\"mirror-niche-crowd-case\" data-visual-relation=\"每年只打一个人群并重投资源：先找红人协会圈子，再用内容放大\" data-visual-source=\"网约车人群是他前年打的，去年打的是越野车人群……第一件事情就是先找红人，找协会……第二件事情叫内容放大TK\" data-visual-title=\"后视镜企业：一年只打一个人群\" data-visual-type=\"案例流程图\">\n<div class=\"case\">\n<p class=\"case-k\">汽车后视镜企业 · 一年只打一个人群</p>\n<p class=\"case-t\">前年打网约车人群，去年打越野车人群——两类后视镜并不相同；规模已做大，2026年的战略核心是打旗舰大单品。</p>\n<div class=\"case-flow\">\n<span>第一步：找红人、协会、圈子</span><i>→</i><span class=\"hot\">第二步：内容放大（TK）</span><i>→</i><span>打穿一个人群，再换下一个</span>\n</div>\n</div>\n</figure>\n</article>\n<article class=\"mod\" id=\"s03b18\">\n<div class=\"mod-head\"><span class=\"mod-idx\">4.3</span><h3>战略大单品七步法</h3></div>\n<p>后视镜企业2026年的核心正是“战略大单品”。七步是完整顺序——品牌动作要等到第6步才开始。</p>\n<figure class=\"fig\" data-visual-id=\"hero-product-seven-steps\" data-visual-relation=\"品类破局到品类延伸的七步顺序，从单点引爆走向品牌心智与品类扩张\" data-visual-source=\"战略大单品七步法，第一步叫品类破局……第七步叫品类延伸……三顿半……这一款产品卖三十几个亿\" data-visual-title=\"战略大单品七步法\" data-visual-type=\"七步流程图\">\n<ol class=\"steps\">\n<li class=\"step\"><span class=\"s-no\">1</span><div><p class=\"s-k\">品类破局</p><p class=\"s-t\">从品类里挑值得重点打的，四个标准：<b>市场足够大、用户足够痛、竞争有缺口、内部能实现</b>。</p></div></li>\n<li class=\"step\"><span class=\"s-no\">2</span><div><p class=\"s-k\">产品重构</p><p class=\"s-t\">偏科生：先减法后加法——用户不关注的配置做基础兜底，最关注的做到顶尖。<span class=\"eg\">例：小米SU7后备箱液压杆，少有人关注的部位用一根，体验重点做到极致。</span></p></div></li>\n<li class=\"step\"><span class=\"s-no\">3</span><div><p class=\"s-k\">构建壁垒</p><p class=\"s-t\">专利、参与标准制定、自造概念并证明它。方太“母婴级净水器”开发完成后，用半年建壁垒才上市；有的壁垒要长期建，有的提出特性即可。</p></div></li>\n<li class=\"step\"><span class=\"s-no\">4</span><div><p class=\"s-k\">价值定价</p><p class=\"s-t\">不按成本定价，按技术壁垒与品牌心智定价；还没有心智时，找稀缺或技术优势带来的差异化定价点。</p></div></li>\n<li class=\"step\"><span class=\"s-no\">5</span><div><p class=\"s-k\">全域击穿</p><p class=\"s-t\">各渠道先测，找到适配的渠道再放大——从测试验证走向放量。</p></div></li>\n<li class=\"step\"><span class=\"s-no\">6</span><div><p class=\"s-k\">巩固心智</p><p class=\"s-t\">营收改善后才开始品牌动作，用品牌小事件巩固心智。</p></div></li>\n<li class=\"step\"><span class=\"s-no\">7</span><div><p class=\"s-k\">品类延伸</p><p class=\"s-t\">纵向做高中低端梯队，以高带低；横向做场景与人群延伸。</p></div></li>\n</ol>\n<div class=\"case-panel\">\n<p class=\"case-k\">三顿半 · 七步走通的样本</p>\n<p>咖啡OEM十余年、掌握冻干技术——内部能实现；“精品口味＋极致便携”是空缺——竞争有缺口（高端要等半小时，低价味道一般，挂耳太麻烦）。产品减到极致：小桶单手抠开，编号1–7代表烘焙度；定价5元，正好卡在袋装速溶（1–2元）与瑞幸、库迪（约10元）之间的价格带空白。从抖音、天猫的内容测试起量，再巩固心智、品类延伸——会上称这款单品已卖出三十几亿。</p>\n</div>\n</figure>\n</article>\n<article class=\"mod\" id=\"s03b19\">\n<div class=\"mod-head\"><span class=\"mod-idx\">4.4</span><h3>今晚的修订任务</h3></div>\n<p>这是被称作“一年最重要的一场会”的收尾安排：</p>\n<ul class=\"plain\">\n<li>组长带组吸收全部意见（含从其他组借鉴的点），更新方案——<b>特别是最后的结论部分</b>。</li>\n<li>“人货场”框架允许定制：可在“场”的部分增加一条<b>品牌与市场</b>；或把“渠道打法销售”改为<b>大营销</b>——branding、marketing、sales合并运作。</li>\n</ul>\n</article>\n</section>\n</div>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#f4f6fa\" height=\"512\" width=\"512\"></rect><line stroke=\"#d9dfec\" stroke-linecap=\"round\" stroke-width=\"5\" x1=\"84\" x2=\"428\" y1=\"438\" y2=\"438\"></line><circle cx=\"262\" cy=\"300\" fill=\"#e7ecfb\" r=\"58\"></circle><polyline fill=\"none\" points=\"90,398 196,352 262,300 330,206 424,114\" stroke=\"#3556d8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"16\"></polyline><g stroke=\"#3556d8\" stroke-linecap=\"round\" stroke-width=\"9\"><line x1=\"296\" x2=\"318\" y1=\"300\" y2=\"300\"></line><line x1=\"262\" x2=\"262\" y1=\"266\" y2=\"244\"></line><line x1=\"228\" x2=\"206\" y1=\"300\" y2=\"300\"></line><line x1=\"262\" x2=\"262\" y1=\"334\" y2=\"356\"></line><line x1=\"238\" x2=\"224\" y1=\"276\" y2=\"262\"></line><line x1=\"286\" x2=\"300\" y1=\"324\" y2=\"338\"></line></g><circle cx=\"262\" cy=\"300\" fill=\"#ffffff\" r=\"21\" stroke=\"#3556d8\" stroke-width=\"9\"></circle><circle cx=\"90\" cy=\"398\" fill=\"#b9c6ee\" r=\"10\"></circle><circle cx=\"196\" cy=\"352\" fill=\"#b9c6ee\" r=\"10\"></circle><circle cx=\"424\" cy=\"114\" fill=\"#3556d8\" r=\"15\"></circle></svg></template>\n","blocks":[{"id":"s03b01","type":"part","heading":"品牌A组方案：运动垂类三年设想","text":"PART 01 · 战略汇报\n品牌A组方案：运动垂类三年设想\n品牌A组按当天发布的新模板细化调整后汇报；方案覆盖趋势、用户、竞争与打法，全面但尚待聚焦。"},{"id":"s03b02","type":"mod","heading":"行业趋势：四个方向的信号","text":"1.1\n行业趋势：四个方向的信号\n战略输入来自四个方向，其中\n耳夹式形态\n与\n水上运动场景\n被点名为增长相对更快的两处。\n品类增长\n开放式耳机整体向上，\n耳夹式形态的增速相对更高\n。\n政策环境\n欧美小包免税通道逐步关闭，欧洲关税门槛抬高；电池法、包装法等合规要求趋严。\n新兴市场\n中东、拉美、东南亚爆发式增长；中低收入市场对价格敏感，需有应对。\n垂类增量\n游泳场景：\n环太平洋区域的水上娱乐增长突出\n，跑赢大盘。"},{"id":"s03b03","type":"mod","heading":"用户与客群：痛点升级，标签分化","text":"1.2\n用户与客群：痛点升级，标签分化\n运动专业度越高，对基础可靠性的要求越苛刻——旧痛点被放大成新机会。\n运动专业度提升\n→\n极限场景可靠性要求提高\n→\n防风罩、防汗等基础痛点，市面产品尚未满足\n→\n产品机会\n客群标签的新增长\n运动户外场景中，\n女性化\n与\n银发族群\n趋势明显，可能形成独立的消费机会。\n渠道行为在变\n从广铺货架式铺SKU，转向线下体验店＋线上内容＋垂类平台的整合营销；种草内容从参数讲述转向\n情绪驱动\n。"},{"id":"s03b04","type":"mod","heading":"竞争格局：三层玩家与两个空隙","text":"1.3\n竞争格局：三层玩家与两个空隙\n大牌正借耳夹式切入运动垂类，高端位只有两家自研，大众市场被OEM白牌同质化淹没；此外还有两个值得注意的信号。\n大牌入局\nBose、漫步者借耳夹式这一增长形态切入运动垂类，专门策划运动SKU。\n高端自研\n骨导 / 后挂式仅\n韶音（Shokz）\n、\n墨觉\n做品牌自研。\n大众白牌\n工厂OEM导入，同质化严重。\n体验空隙\n中小初创品牌的配套App评分普遍很低（索尼、三星等除外），远达不到用户预期。\n龙头动向\n韶音从总部统一运营，转向由各细分市场的区域代理做本土化运营，稳步随动增长。"},{"id":"s03b05","type":"mod","heading":"应对策略：从增量到能力建设","text":"1.4\n应对策略：从增量到能力建设\n① 增量判断\n增量在\n场景\n与\n区域市场\n两头：游泳等水上娱乐场景；欧美稳步增长，拉美、东南亚、中东的跑骑运动爆发。对增量场景做产品细分的本土化洞察。\n↓\n② 传播与区域动销\n打开三个洞察窗口：社交化运动、运动生活方式穿搭、细分客群标签；不同区域采取不同的动销与营销整合方式。\n↓\n③ 产品与品类\n三条技术主线：\n可靠性、抗风噪、高价值场景×产品形态绑定\n。按场景价值与价位段重组产品：音箱改为可夹挂的组网对讲单元，眼镜主打跑骑；为女性、银发客群配称CMF、新品形态与周边配件。\n↓\n④ 渠道与销售\n对直营平台、大分销商、垂直渠道、品牌运营商区分化运作。前置动作：\n澄清品类边界\n，避免同品类同形态在同一渠道打架。\n↓\n⑤ 能力建设\n一手数据与产品洞察、快速供应链与市场验证、自研与品质管理、结构与材料创新、固件算法软件、VOC与售后闭环。\n↓\n⑥ 品牌资产滚动积累\n在运动客群、私域与种子用户中生根渗透，让用户帮品牌传播；分渠道提升运营管理能力，打造\n标杆市场与标杆渠道\n，再把可复制的增长路径推广到其他品类与国家。"},{"id":"s03b06","type":"part","heading":"集体反馈：全而不聚焦","text":"PART 02 · 评审意见\n集体反馈：全而不聚焦\n对品牌A方案的意见高度一致：洞察全面、场景清晰，但缺锚点、缺定位、缺章法。"},{"id":"s03b07","type":"mod","heading":"第一轮点评：两个亮点，三个待解","text":"2.1\n第一轮点评：两个亮点，三个待解\n亮点\n场景化强、差异化直观\n——典型“第一眼经济”，已被提炼为方法。\n渠道边界感前置\n——先澄清品类边界，避免内部拉扯打架。\n待解\n高客单价×低知名度\n的矛盾——靠价格带卡位、品牌定价替代，还是争取“第二选择”？\n经营模式\n——目标渠道很多，但按当前形态，建议坚定打B2C。\n场景跨度\n——跑步、骑行、户外都要，产品对口能否撑得住？"},{"id":"s03b08","type":"mod","heading":"小组互评：三类问题指向同一处","text":"2.2\n小组互评：三类问题指向同一处\n先说认可：洞察清晰全面、场景定位精准（游泳、跑步等需求拆解到位）、渠道打法较完善。问题集中在三件事：\n二组\n三组\n缺核心锚点与优先级\n资源有限却什么渠道、什么人群都要做——“看似有策略的策略”；垂类市场的目标占比也没有定数。\n二组\n四组\n定位与真竞品不明\n看到的都是头部动作——自己的定位在哪里？Bose与漫步者不在同一价位线，品牌A卡哪个价位段、真正要打的竞品是谁？核心产品也不明确：产品线列了很多，最想打的是哪一个？\n二组\n三组\n四组\n打法与叙事缺章法\n渠道是标配套餐、撒网式布局：DTC、小批量测试、经销商、线下体验、社群、内容电商，各自担任验证还是放量？短期结果与衡量标准是什么？品牌统一叙事不完整，没有指明主打哪个运动场景；市场、产品、场景、人群的数据之间缺联系，场景与品类技术主线割裂。\n各组反馈共同指向：全面性已经够用，缺的是排在前面的“那一个点”，以及它的衡量标准。"},{"id":"s03b09","type":"mod","heading":"内部复盘：三年为何没跑出路径","text":"2.3\n内部复盘：三年为何没跑出路径\n2022\n请外部顾问授课，当时小组交付表现优异，明显优于其他组。\n此后两三年\n依然没验证出一条路径。当年渠道与销售通路相对清晰；反思点之一是\n渠道选品\n。\n2026 · 战略会\n把“为什么三年没拿到结果”写出来——\n把没做对的事情多做一点点，就会好很多\n。\n引导者的提醒：不是没得决策——现有三条产品线完全可以想清楚；规划很丰满，取舍要看后面的计划怎么拆。会上举例：“兰斯顿”初期同样从运动场景做起，最终拿到了结果。"},{"id":"s03b10","type":"part","heading":"方法工具箱：把战略写准","text":"PART 03 · 方法工具箱\n方法工具箱：把战略写准\n引导者先点评了一份聚焦三防品类与户外场景的战略稿，再给出可直接复用的检验与表达方法。"},{"id":"s03b11","type":"mod","heading":"好战略四问：过一遍再定稿","text":"3.1\n好战略四问：过一遍再定稿\n任何战略结论都要同时回答四个问题；答不上来，说明还没想透。\n① 用户认不认\n哪一类用户认？他为什么会认？\n② 对手恨不恨\n对手马上抄走，你能否应对？\n③ 老板投不投\n公司资金有限——看得到更大回报，才会多投。\n④ 员工干不干\n员工一看就觉得“可以做到”，才落得下去。\n配套结构建议\n把\n人群与场景\n拉到战略最前端——整个战略结论围绕用户与用户价值展开。这份稿件已有素材：靶心人群为三防越野、露营、睡眠，匹配户外露营、徒步等场景并打入三防品类；市场路径“聚焦核心用户 → 逐步拓展墨西哥、加拿大、澳洲、西欧”本身清晰。"},{"id":"s03b12","type":"mod","heading":"槽点反攻：把差评变成卖点","text":"3.2\n槽点反攻：把差评变成卖点\n稿件的产品切入法：先找\n价格真空段\n，再聚焦痛点——这就是\n槽点反攻\n，一种卖点叠加态。\n比喻 · 马桶效应\n租房马桶老坏\n→\n修了又坏，忍无可忍\n→\n换房推门第一件事：先看马桶\n打法 · 槽点反攻\n锁定卖得最好的竞品\n→\n收集差评里的槽点\n→\n把自己的强项叠加到槽点上\n痛点被反复放大后，会变成用户决策时的\n第一检查项\n——这正是反攻的入口。"},{"id":"s03b13","type":"mod","heading":"现阶段第一能力：渠道运营","text":"3.3\n现阶段第一能力：渠道运营\n现阶段第一优先\n渠道运营能力\n测品测渠道 · 扩品扩渠道 · 先把增长做起来\n产品基础\n已有依托\n品质基础\n已有依托\n团队基础\n已有依托\n品牌视觉、AI 等\n稿中已列\n能力体现\n：把“偏科”的产品打出去；打高客单价，不一味靠性价比、质价比；站内获取流量、站外放大；先验证。\n渠道动作\n：站内打法＋站外品牌市场与红人内容营销，并补入美客多、TK等渠道。\n背景判断\n：业务背后有产品、品质与团队基础——“富二代创业”，不是穷小子创业。\n水准校准\n三年方向OK，但成稿是“××亿团队”的水准——\n写得有点太好了，不要飘\n；能力清单放到××亿规模没毛病，现阶段先补渠道运营。"},{"id":"s03b14","type":"mod","heading":"线上产品表达：证据链与信任状","text":"3.4\n线上产品表达：证据链与信任状\n产品部分先定结构：聚焦品类偏场景化，按战略品 / 生意品布局高中低端。落到线上——卖的是图片和视频，\n表达方法比功能罗列更重要\n。\n证据链 · 自己说\n“你说它好，我有六大证据、有与竞品的对比图”——用实证材料摆出来。\n信任状 · 第三方说\n权威背书、专利等外部证明，替用户先卸掉怀疑。\n统一方法 · 科学传播（科传）\n近一年线上经济最热的专业：\n一手科学、一手传播\n，把真正的产品卖点与进入壁垒传播出去；国内外电商通用，需与渠道端、产品端有效协同——不只是文案问题。"},{"id":"s03b15","type":"part","heading":"核心结论：验证出引爆点","text":"PART 04 · 核心结论\n核心结论：验证出引爆点\n写得散在这个阶段不算错——先跑通验证小闭环，2027年找到引爆点，再谈放大与品牌。"},{"id":"s03b16","type":"mod","heading":"从验证到引爆点的路径","text":"4.1\n从验证到引爆点的路径\n会上确认\n2026年目标约××万人民币\n。引导者判断：写得散不算错——这个阶段还不配谈重点；\n验证是过程，找到引爆点才是结果\n。\n2026\n验证之年\n写下的打法都算验证动作，尽快跑出第一个小闭环。\n→\n2027\n找到引爆点\n例如单点约××万的爆品；品牌力弱＋定价高，引爆点靠\n产品力\n，落在\n更细分的场景\n。\n→\n之后\n放大\n用细分场景里的原点人群——红人、意见领袖——带动放大。\n引导者同时肯定：写到这个程度，基础与逻辑理解不错，接下来要想清楚的是关键路径。"},{"id":"s03b17","type":"mod","heading":"两个引爆案例：单点打穿","text":"4.2\n两个引爆案例：单点打穿\n引爆点公式：\n某个更细分的场景 × 一个站得住的产品 × 原点人群放大\n。两个案例讲的是同一件事。\n迪桑特 · 靠一家店引爆\n滑雪品牌一度濒危\n→\n安踏收购，老板之子亲自管\n→\n在长春开第一家形象店\n→\n击穿来自全国的滑雪人群，把品牌调性与产品打出去\n汽车后视镜企业 · 一年只打一个人群\n前年打网约车人群，去年打越野车人群——两类后视镜并不相同；规模已做大，2026年的战略核心是打旗舰大单品。\n第一步：找红人、协会、圈子\n→\n第二步：内容放大（TK）\n→\n打穿一个人群，再换下一个"},{"id":"s03b18","type":"mod","heading":"战略大单品七步法","text":"4.3\n战略大单品七步法\n后视镜企业2026年的核心正是“战略大单品”。七步是完整顺序——品牌动作要等到第6步才开始。\n1\n品类破局\n从品类里挑值得重点打的，四个标准：\n市场足够大、用户足够痛、竞争有缺口、内部能实现\n。\n2\n产品重构\n偏科生：先减法后加法——用户不关注的配置做基础兜底，最关注的做到顶尖。\n例：小米SU7后备箱液压杆，少有人关注的部位用一根，体验重点做到极致。\n3\n构建壁垒\n专利、参与标准制定、自造概念并证明它。方太“母婴级净水器”开发完成后，用半年建壁垒才上市；有的壁垒要长期建，有的提出特性即可。\n4\n价值定价\n不按成本定价，按技术壁垒与品牌心智定价；还没有心智时，找稀缺或技术优势带来的差异化定价点。\n5\n全域击穿\n各渠道先测，找到适配的渠道再放大——从测试验证走向放量。\n6\n巩固心智\n营收改善后才开始品牌动作，用品牌小事件巩固心智。\n7\n品类延伸\n纵向做高中低端梯队，以高带低；横向做场景与人群延伸。\n三顿半 · 七步走通的样本\n咖啡OEM十余年、掌握冻干技术——内部能实现；“精品口味＋极致便携”是空缺——竞争有缺口（高端要等半小时，低价味道一般，挂耳太麻烦）。产品减到极致：小桶单手抠开，编号1–7代表烘焙度；定价5元，正好卡在袋装速溶（1–2元）与瑞幸、库迪（约10元）之间的价格带空白。从抖音、天猫的内容测试起量，再巩固心智、品类延伸——会上称这款单品已卖出三十几亿。"},{"id":"s03b19","type":"mod","heading":"今晚的修订任务","text":"4.4\n今晚的修订任务\n这是被称作“一年最重要的一场会”的收尾安排：\n组长带组吸收全部意见（含从其他组借鉴的点），更新方案——\n特别是最后的结论部分\n。\n“人货场”框架允许定制：可在“场”的部分增加一条\n品牌与市场\n；或把“渠道打法销售”改为\n大营销\n——branding、marketing、sales合并运作。"}]},{"num":4,"id":"s04","title":"聚焦式定位：单品突破与便利创新","date":"2026年11月9日","css":"#sv{\n  --page-bg:#f2f5f8;\n  --surface:#ffffff;\n  --surface-2:#f7fafb;\n  --text:#1c2433;\n  --muted:#5b6575;\n  --faint:#8b95a5;\n  --accent:#0f766e;\n  --accent-strong:#0b5d57;\n  --accent-soft:#e3f1ef;\n  --warn:#b45309;\n  --warn-soft:#fbf0e1;\n  --border:#e2e6ec;\n  --border-strong:#c9d2dc;\n  --on-accent:#ffffff;\n  --radius:16px;\n  --font:\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",\"Noto Sans SC\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme: dark){\n#sv{\n    --page-bg:#10151c;\n    --surface:#191f29;\n    --surface-2:#151b24;\n    --text:#e7ebf1;\n    --muted:#98a3b2;\n    --faint:#7d8898;\n    --accent:#43b8ac;\n    --accent-strong:#6fd0c5;\n    --accent-soft:#183030;\n    --warn:#e5a55c;\n    --warn-soft:#332a1d;\n    --border:#2a3341;\n    --border-strong:#3d4756;\n    --on-accent:#0c1a18;\n  }\n}\n*{box-sizing:border-box}\n#sv{color-scheme:light dark;-webkit-text-size-adjust:100%}\n#sv,#sv{background-color:var(--page-bg)}\n#sv{margin:0;color:var(--text);font-family:var(--font);font-size:15px;line-height:1.78}\n.wrap{max-width:780px;margin:0 auto;padding:0 16px 72px}\n.topnav{position:sti
