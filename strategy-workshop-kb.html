html,body{margin:0;padding:0}

.kb-main{max-width:900px;margin:0 auto;padding:18px 14px 80px}
.kb-hero{padding:26px 0 8px}

.kb-sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.kb-stats{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}

.kb-continue{margin:14px 0 0;background:var(--accent-soft);border:1px solid var(--border);border-radius:12px;

.kb-day{margin:26px 0 10px;font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--accent);

.kb-card:hover{border-color:var(--accent)}
.kb-cardhead{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}

mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.kb-empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}

.kb-sbrow{display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto}
.kb-sbbtn{padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;background:var(--surface2);

.kb-sbtitle{flex:1;min-width:0;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sv{display:none}
#sv .wrap{padding-top:24px}
.kb-flash{animation:kbflash 2s ease-out}
@keyframes kbflash{0%{outline:3px solid var(--accent);outline-offset:4px}100%{outline:3px solid transparent;outline-offset:4px}}

#kb-drawer{position:fixed;top:0;right:-320px;width:300px;max-width:85vw;height:100vh;z-index:80;

#kb-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:none}

.kb-dh{font-weight:800;font-size:14px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}

  .kb-title{font-size:22px}

m}\n.formula sup{font-size:11px;color:var(--accent-ink)}\n.three{display:grid;gap:8px}\n@media(min-width:640px){\n.three{grid-template-columns:1fr 1fr 1fr}\n}\n.tcol{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}\n.tn{font-size:11px;font-weight:800;color:var(--accent-ink);letter-spacing:.18em}\n.tcol b{display:block;font-size:14px;margin:2px 0}\n.tcol p{margin:0;font-size:12.3px;color:var(--muted)}\n.mini{display:grid;grid-template-columns:46px 1fr 26px;gap:8px;align-items:center;margin:5px 0;font-size:11.5px;color:var(--muted)}\n.mt{background:var(--surface-2);border:1px solid var(--border);border-radius:5px;height:17px;overflow:hidden}\n.mb{height:100%;border-radius:4px}\n.mb.g{background:var(--bar-2)}\n.mb.a{background:var(--accent)}\n.mini em{font-style:normal;font-size:11.5px;color:var(--muted);text-align:right;font-weight:700}\n.mini em.zv{color:var(--warn)}\n.case{margin:12px 0;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px 14px}\n.case h4{margin:0 0 6px;font-size:13.5px;font-weight:800}\n.case p{margin:6px 0;font-size:13.1px;line-height:1.68}\n.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}\n.bst{border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:12.6px;min-width:520px}\n.bh,.br1{display:grid;grid-template-columns:1fr 1.3fr 1fr}\n.bh span{background:var(--accent-soft);color:var(--accent-ink);font-weight:700;padding:8px 10px;font-size:12px;line-height:1.5}\n.br1 span{padding:8px 10px;background:var(--surface);line-height:1.6}\n.bh span+span,.br1 span+span{border-left:1px solid var(--border)}\n.br1 span+span{border-top:1px solid var(--border)}\n.bh span+span{border-color:var(--border)}\n.four{display:grid;gap:8px}\n@media(min-width:640px){\n.four{grid-template-columns:1fr 1fr}\n}\n.fcell{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}\n.fchip{flex:0 0 30px;height:30px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}\n.fcell b{font-size:13.5px;display:block;line-height:1.5}\n.fcell p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.62}\n/* Component-name-agnostic mobile safety net.\n   Structural guarantees are expressed against CSS Grid/Flex behaviour and\n   generic attribute hooks rather than a fixed class vocabulary,so generating\n   models may invent component names freely for any recording type. */\n*,*::before,*::after{ box-sizing: border-box; }\n#sv{ width: 100%; min-width: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n#sv{ width: 100%; min-width: 0; margin: 0; overflow-wrap: break-word; }\nmain,header,footer,nav,section,article,aside,figure,div,ul,ol,li,dl,dd,details{ min-width: 0; }\nimg,picture,video,canvas,svg{ display: block; max-width: 100%; height: auto; }\npre,code,kbd,samp{ max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }\nh1,h2,h3,h4,h5,h6,p,li,td,th,dt,dd,blockquote,figcaption{ overflow-wrap: anywhere; }\ninput,textarea,select,button{ max-width: 100%; font: inherit; }\n/* Any table gets a scroll container by intent or by generic hook. */\n.table-scroll,.table-wrap,.matrix-wrap,[data-table-scroll],[data-scroll-x]{\n  max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;\n}\n.table-scroll > table,.table-wrap > table,.matrix-wrap > table,[data-table-scroll] > table,[data-scroll-x] > table{ margin: 0; }\n/* Numbered step rows: keep #sv copy out of the counter track. */\n.step-item,[data-step-item]{ grid-template-columns: 32px minmax(0, 1fr) !important; }\n.step-item::before,[data-step-item]::before{ grid-column: 1 !important; grid-row: 1 !important; }\n.step-item > :empty,[data-step-item] > :empty{ display: none !important; }\n.step-item > *,[data-step-item] > *{ grid-column: 2 !important; min-width: 0 !important; }\n.data-value,.metric-value,[data-value]{ max-width: 100%; font-variant-numeric: tabular-nums; }\n/* A single surviving child of ANY grid spans the full row. Applied to every\n   element that declares a grid,so unknown component names are covered too. */\n[class*=\"grid\"] > :only-child,[class*=\"board\"] > :only-child,[class*=\"cluster\"] > :only-child,[class*=\"row\"] > :only-child,[class*=\"split\"] > :only-child,[class*=\"cols\"] > :only-child,[class*=\"columns\"] > :only-child,[class*=\"layout\"] > :only-child,[class*=\"panel\"] > :only-child,[data-grid] > :only-child,[data-cols] > :only-child{\n  grid-column: 1 / -1 !important;\n  width: 100% !important;\n}\n@media (max-width: 600px){\n#sv{ font-size: 14.5px !important; line-height: 1.62 !important; }\n:where(#sv > main,#sv > .report-shell,#sv > .report,#sv > .container,#sv > [data-shell]){\n    width: calc(100% - 40px) !important;\n    max-width: 100% !important;\n    margin-inline: auto !important;\n  }\nh1{ font-size: 29px !important; line-height: 1.22 !important; letter-spacing: 0 !important; }\nh2{ font-size: 22px !important; line-height: 1.3 !important; letter-spacing: 0 !important; }\nh3{ font-size: 16px !important; line-height: 1.42 !important; letter-spacing: 0 !important; }\n/* Generic collapse: every multi-column grid becomes single column unless it\n     explicitly opts into staying paired (data-keep-columns) or is a table. */\n  [class*=\"grid\"]:not([data-keep-columns]),[class*=\"board\"]:not([data-keep-columns]),[class*=\"split\"]:not([data-keep-columns]),[class*=\"cols\"]:not([data-keep-columns]),[class*=\"columns\"]:not([data-keep-columns]),[class*=\"layout\"]:not([data-keep-columns]),[data-grid]:not([data-keep-columns]){\n    grid-template-columns: minmax(0, 1fr) !important;\n  }\n/* Compact numeric clusters may stay two-up,but a trailing odd card must\n     span both columns so no empty half-row is left on narrow screens. */\n  [data-keep-columns]{ grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }\n[data-keep-columns] > :last-child:nth-child(odd){ grid-column: 1 / -1 !important; }\n[data-span-all],[data-value-kind=\"formula\"],[data-value-kind=\"range\"]{ grid-column: 1 / -1 !important; }\n/* Horizontal flows become vertical. */\n  [class*=\"flow\"],[class*=\"chain\"],[class*=\"timeline\"]{ flex-direction: column !important; }\n[class*=\"arrow\"]{ transform: rotate(90deg); min-height: 16px !important; }\ntable{ font-size: 12.5px; }\nth,td{ padding: 9px 8px !important; }\nnav{ max-width: 100%; }\nnav[data-scrollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}","body":"\n<div class=\"wrap\">\n<header>\n<p class=\"kicker\">战略共创会 · 会议纪要</p>\n<h1>公司A × 品牌A 战略共创会纪要</h1>\n<p class=\"meta\">顾问领讲 · 首次共创 · 全场研讨与现场输出整理</p>\n<p class=\"intro\">这是公司A与品牌A的首次战略共创会。全场先立规矩——战略是艺术、战略管理是科学；再沿「明确表达 × 深度共识」完成自我盘点，用「三看洞察」向外找机会，最后收敛成今天的输出表。</p>\n</header>\n<div class=\"part\" id=\"s01b01\"><span class=\"pno\">PART 01</span><h2>定调：什么是好战略</h2></div>\n<section class=\"mod\" id=\"s01b02\">\n<h3>战略是艺术，管理是科学</h3>\n<figure class=\"v\" data-visual-id=\"art-vs-science\" data-visual-relation=\"战略重由外而内的选择取舍、无标准答案；战略管理是有科学方法的完整过程，本质是管理能力\" data-visual-source=\"战略是一门艺术，由外而内、选择与取舍的艺术；但战略管理是一门科学，有科学方法的\" data-visual-title=\"战略是艺术，战略管理是科学\" data-visual-type=\"对照图\">\n<div class=\"duo\" data-grid=\"\">\n<div class=\"panel-art\"><h4>战略 · 一门艺术</h4><p>由外而内，做选择与取舍；<br/>没有非黑即白的答案，所以有难度。</p></div>\n<div class=\"panel-sci\"><h4>战略管理 · 一门科学</h4><p>有科学方法的完整过程，<br/>可以照着做、照着练。</p></div>\n</div>\n<figcaption>战略的本质不是输出本身，而是战略管理能力。</figcaption>\n</figure>\n</section>\n<section class=\"mod\" id=\"s01b03\">\n<h3>第一原则：明确表达 × 深度共识</h3>\n<p>战略的最终结果，取决于团队<b>怎么理解、怎么执行</b>，而不是文档本身多少分。</p>\n<figure class=\"v\" data-visual-id=\"consensus-outcome\" data-visual-relation=\"60分战略深度共识可得八九十分结果；100分战略不共识只剩60分结果\" data-visual-source=\"一个只有60分的战略……大家深度的共识了……能拿到一个八九十分的结果，而一个100分的战略……有可能只能达到一个60分的结果\" data-visual-title=\"战略分数与最终结果对比\" data-visual-type=\"条形对比图\">\n<div class=\"bars\">\n<div class=\"brow\" data-grid=\"\">\n<div class=\"blabel\">60分战略<br/>＋深度共识</div>\n<div class=\"btrack\"><div class=\"bar b1\" style=\"width:85%\"><span>结果 ≈80–90 分</span></div></div>\n</div>\n<div class=\"brow\" data-grid=\"\">\n<div class=\"blabel\">100分战略<br/>＋内部不共识</div>\n<div class=\"btrack\"><div class=\"bar b2\" style=\"width:60%\"><span>结果 ≈60 分</span></div></div>\n</div>\n<div class=\"baxis\" data-grid=\"\"><span></span><div class=\"ax\"><span>0</span><span>50</span><span>100</span></div></div>\n</div>\n<figcaption>战略不仅仅是一个结论——大家怎么看待它、理解它、执行它，决定了最终结果。</figcaption>\n</figure>\n<p>所以战略管理的第一原则是<b>明确的表达</b>：写清楚，<span class=\"k\">不在多而在精</span>。信息的价值与密度，跟数量成反比；字越少，事儿越大。字一多，真正最有价值的事就被稀释掉了。</p>\n</section>\n<section class=\"mod\" id=\"s01b04\">\n<h3><span class=\"tag\">案例</span>取舍：把最有价值的事拎出来</h3>\n<p>周末只有两天：陪孩子、跟爱人约会、看父母、练瑜伽、读本书——单拎出来每件都有意义。每件都做，就没有几件能做好。放进<b>备选清单</b>可以，落地必须<span class=\"k\">拎出几件做深做透</span>。</p>\n<p>郑州男士护肤品牌<b>海洋至尊</b>：去年不到 <span class=\"k\">10 亿</span>，今年约 <span class=\"k\">20 亿</span>、翻倍。最关键的动作，是先画一张人群靶心图——像打靶一样，从靶心向外一圈圈划人群。</p>\n<figure class=\"v\" data-visual-id=\"bullseye-layers\" data-visual-relation=\"原点人群向外延伸出圈层、主打、大众人群；案例选定篮球圈层重点击穿\" data-visual-source=\"中间这个点叫原点人群……圈层人群……主打人群外面叫大众人群……26年线下篮球赛事与线上篮球游戏都能看到他们家广告\" data-visual-title=\"圈层人群靶心图\" data-visual-type=\"同心圆分层图\">\n<div class=\"bull\">\n<div aria-hidden=\"true\" class=\"bx\">\n<span class=\"ring r1\"></span><span class=\"ring r2\"></span><span class=\"ring r3\"></span><span class=\"ring r4\">原点</span>\n</div>\n<ul class=\"blegend\">\n<li><i class=\"dot d4\"></i><b>原点人群</b>——核心客群（B端叫客户、种子客户、灯塔级客户）</li>\n<li class=\"hl\"><i class=\"dot d3\"></i><b>圈层人群</b>——选定<b>篮球圈层</b>重点击穿：线下篮球赛事＋线上篮球游戏全面露出广告</li>\n<li><i class=\"dot d2\"></i><b>主打人群</b></li>\n<li><i class=\"dot d1\"></i><b>大众人群</b>——人群由内向外自然延伸</li>\n</ul>\n</div>\n<figcaption>无论 B 端还是 C 端，都先画这张靶——再选一环重点击穿。</figcaption>\n</figure>\n<p class=\"small\">圈层怎么掰：爱运动的男生里还有打篮球、踢足球、打乒乓球、羽毛球的；小镇青年也算一圈。掰开之后，才挑得出要击穿的那一环。为什么选篮球不选足球？中国足球不给力。不打球的人也不会被落下——那叫<b>向往人群</b>：向往球场上的状态、羡慕那副身体，也会买。苹果的广告，永远只拍年轻人。</p>\n<div class=\"insight\"><span class=\"ilabel\">洞察</span>字多带来分散、记不住——「明年到底要抓住什么？」要能一句话答出来；答不出，说明还没做取舍。</div>\n</section>\n<section class=\"mod\" id=\"s01b05\">\n<h3>表达的三层境界</h3>\n<figure class=\"v\" data-visual-id=\"expression-ladder\" data-visual-relation=\"概念性表达只配老板讲，计划性表达仍不知何物，结论性表达写明对象才可执行\" data-visual-source=\"概念性表达只配老板讲……计划性表达……到底是什么产品还是不知道……结论性表达，明确写上到底是什么\" data-visual-title=\"表达的三层境界\" data-visual-type=\"三层阶梯图\">\n<div class=\"ladder\">\n<div class=\"step\"><span class=\"lv\">L1</span><div><b>概念性表达</b><p>「提高产品力」「提高品牌力」——对，但抠不出错；只是大导向，<b>只配老板讲</b>。</p></div></div>\n<div class=\"step\"><span class=\"lv\">L2</span><div><b>计划性表达</b><p>「搭建产品矩阵，2月底前完成」——有计划，但到底做什么产品，仍不知道：<b>正确的废话</b>。</p></div></div>\n<div class=\"step up\"><span class=\"lv\">L3</span><div><b>结论性表达</b><p>「明年战略品是××系列××型号」「品牌要做的几个小事件是××」——<b>写明对象</b>，才能执行。</p></div></div>\n</div>\n<figcaption>组长、副组长、书记的汇总，要落在第三层。</figcaption>\n</figure>\n</section>\n<section class=\"mod\" id=\"s01b06\">\n<h3>三促共识：共创、结构、机制</h3>\n<figure class=\"v\" data-visual-id=\"consensus-three\" data-visual-relation=\"共创解决参与认同，结构用统一表格倒逼客户思维，机制用利益绑定协同\" data-visual-source=\"以共创促共识……唯有认同才有执行；以结构促共识，表格统一……第三个如何什么产品和如何获客；以机制促共识，钱会改变一个人的立场\" data-visual-title=\"三促共识\" data-visual-type=\"三路径汇聚图\">\n<div class=\"c3\" data-grid=\"\">\n<div class=\"cbox\"><h4>以共创促共识</h4><p>唯有参与才有认同，唯有认同才有执行。不同观点就要吵出来——一定会吵，还可能吵得很凶。</p></div>\n<div class=\"cbox\"><h4>以结构促共识</h4><p>表格统一、工具统一。表头第一格「客户是谁」，第二格「客户价值」，第三格「产品与获客」——倒逼先想客户，再想卖货。</p></div>\n<div class=\"cbox\"><h4>以机制促共识</h4><p>协同机制、项目管理、战役小组、分钱与激励。平时不说话的两个人，给一个共同任务加 10 万块——钱会改变立场。</p></div>\n</div>\n<div aria-hidden=\"true\" class=\"carrow\">▼</div>\n<div class=\"cres\">深度共识 → 心往一处使</div>\n<figcaption>共创解决「参与」，结构解决「思考顺序」，机制解决「利益绑定」。</figcaption>\n</figure>\n</section>\n<div class=\"part\" id=\"s01b07\"><span class=\"pno\">PART 02</span><h2>在哪：战略 ABC 与自我盘点</h2></div>\n<section class=\"mod\" id=\"s01b08\">\n<h3>战略 ABC：在哪、去哪、怎么去</h3>\n<p>「什么是战略？」现场回答拼出了原材料——让大家朝一个方向发力、在有优势的领域决定做什么、先定位再布局。归纳起来就是三个字母：</p>\n<figure class=\"v\" data-visual-id=\"strategy-abc\" data-visual-relation=\"A当下位置与优劣势，B能建立长期优势的方向，C关键路径的最优解\" data-visual-source=\"战略就是ABC，A叫在哪，B叫去哪，C叫怎么去……路径是关键的路径最优解\" data-visual-title=\"战略 ABC：在哪、去哪、怎么去\" data-visual-type=\"三步路径图\">\n<div class=\"abc\">\n<div class=\"ab\"><span class=\"aL\">A</span><b>在哪</b><p>当下在哪：自己的优劣势</p></div>\n<div aria-hidden=\"true\" class=\"ar\">→</div>\n<div class=\"ab\"><span class=\"aL\">B</span><b>去哪</b><p>能建立长期优势的方向</p></div>\n<div aria-hidden=\"true\" class=\"ar\">→</div>\n<div class=\"ab\"><span class=\"aL\">C</span><b>怎么去</b><p>关键路径的最优解</p></div>\n</div>\n<figcaption>字节跳动的内部口头禅，正是 C 里的「最优解」——做任何事都有价值，关键是如何选。</figcaption>\n</figure>\n<p>A 是起点：战略更强调看外部，但起点是<b>快速看自己</b>——第一轮研讨，就从这个 A 开始。</p>\n<figure class=\"v\" data-visual-id=\"abc-priority\" data-visual-relation=\"三个答案各有理由；讲师指出无前提的比较是伪命题，答案取决于企业自身状态\" data-visual-source=\"A最重要，因为知己知彼首先是知己……这个问题没有前提，全是伪命题，取决于每个人自身的情况\" data-visual-title=\"A/B/C 哪个最重要：现场问答\" data-visual-type=\"可交互问答\">\n<div aria-label=\"A/B/C 哪个最重要\" class=\"tabs\" role=\"tablist\">\n<button aria-pressed=\"true\" class=\"tab\" data-target=\"a\" type=\"button\">A · 在哪</button>\n<button aria-pressed=\"false\" class=\"tab\" data-target=\"b\" type=\"button\">B · 去哪</button>\n<button aria-pressed=\"false\" class=\"tab\" data-target=\"c\" type=\"button\">C · 怎么去</button>\n</div>\n<div class=\"qa-panel\" id=\"qa-a\">\n<p><b>成员A：A 最重要。</b>首先要知道自己的优势和各方面的处境，先了解自己。</p>\n<p class=\"note\">讲师点评：有点意外——一般大家会在 B、C 之间选。但知己知彼、百战不殆，<b>知己排在前头</b>，「在哪」确实重要。</p>\n</div>\n<div class=\"qa-panel\" hidden=\"\" id=\"qa-b\">\n<p><b>B 最重要。</b>先知道去北京还是去海南，方向定了，后面才有意义。</p>\n</div>\n<div class=\"qa-panel\" hidden=\"\" id=\"qa-c\">\n<p><b>C 最重要。</b>怎么去影响成本——坐火车还是别的，路径决定代价。</p>\n</div>\n<p class=\"note final\">现场三种答案吵了起来。讲师收束：这是一道<b>伪命题</b>——没有前提。身体重要还是挣钱重要？健康的人说挣钱，病房里的人说身体；分五个组讨论，答案会各不相同。它取决于<b>企业自身的状态</b>。</p>\n</figure>\n</section>\n<section class=\"mod\" id=\"s01b09\">\n<h3><span class=\"tag\">研讨</span>自我盘点：五组驱动力与短板</h3>\n<p>第一轮只回答「在哪」：走到今天，最重要的驱动力是什么？哪些方面需要提升？人人先想、组内快讲，组长与书记带队汇总。</p>\n<figure class=\"v\" data-visual-id=\"group-inventory-board\" data-visual-relation=\"各组驱动力与短板；协同不足、聚焦不足、品牌叙事薄弱在多组重复出现\" data-visual-source=\"组织的协同能力比较弱……品牌产品渠道三力协同不足……多渠道多客户的需求带来了产品跟资源的分散\" data-visual-title=\"五组盘点汇总板\" data-visual-type=\"分组对照看板\">\n<div class=\"grp\">\n<div class=\"gh\"><b>一组</b><span>复盘视角</span></div>\n<div class=\"duo\" data-grid=\"\">\n<div class=\"pane good\"><h4>做得好</h4><ul>\n<li>每年洞察差距，有策略地持续进步</li>\n<li>强化核心品类与聚焦，其他品类持续探索</li></ul></div>\n<div class=\"pane warn\"><h4>待提升</h4><ul>\n<li>战略自下而上，缺自上而下的倒推</li>\n<li>核心产品竞争深度不够（产品、客户、营销）</li>\n<li>组织协同弱，共同目标感弱</li></ul></div>\n</div>\n</div>\n<div class=\"grp\">\n<div class=\"gh\"><b>二组</b><span>转型视角</span></div>\n<div class=\"duo\" data-grid=\"\">\n<div class=\"pane good\"><h4>做得好</h4><ul>\n<li>从 OEM 向品牌化转型，专注品牌</li>\n<li>坚持产品自研</li>\n<li>标杆市场做客户分层，沉淀可复制方法论；紧跟渠道变化</li></ul></div>\n<div class=\"pane warn\"><h4>待提升</h4><ul>\n<li>品牌、产品、渠道三力协同不足，缺发力焦点</li>\n<li>外部洞察与节奏把控不够</li>\n<li>产品本土化表达不到位，溢价不足；品牌思维偏短视卖货</li>\n<li>代理开拓与品牌共创配合被动</li></ul></div>\n</div>\n</div>\n<div class=\"grp\">\n<div class=\"gh\"><b>三组</b><span>OEM</span></div>\n<div class=\"duo\" data-grid=\"\">\n<div class=\"pane good\"><h4>驱动力「五有」＋渠道</h4><ul>\n<li>有资历：二十余年的行业经验与沉淀</li>\n<li>有研发、有工厂、有想法（自有工业设计）、有资金</li>\n<li>渠道客户资源丰富，可触达各大区域</li>\n<li>赋能体系标准化、服务产品化可复制</li>\n<li>研发＋工业设计＋供应链＋资金的整体整合</li>\n<li>全球渠道与头部客户关系，转化为稳定订单</li></ul></div>\n<div class=\"pane warn\"><h4>待提升</h4><ul>\n<li>产品开发周期长——目标缩至 <span class=\"k\">3 个月</span></li>\n<li>品质管控未与公司规模对齐</li>\n<li>赋能服务价值不够高</li>\n<li>订单导向、缺终端用户需求导向；单品投入不聚焦</li></ul></div>\n</div>\n</div>\n<div class=\"grp\">\n<div class=\"gh\"><b>四组</b><span>ToC</span></div>\n<div class=\"duo\" data-grid=\"\">\n<div class=\"pane good\"><h4>做得好（过去驱动）</h4><ul>\n<li>工贸一体的成本与供应链优势</li>\n<li>多国家多渠道布局、产品供给丰富</li>\n<li>客户响应灵活，支撑了基础增长</li></ul></div>\n<div class=\"pane warn\"><h4>当前瓶颈</h4><ul>\n<li>多渠道多客户带来产品与资源分散</li>\n<li>用户洞察与产品定义前置不足，缺有记忆点的旗舰产品</li>\n<li>品牌倍数与内容资产积累不足，溢价待提升，ToC 规模有限</li></ul></div>\n</div>\n<p class=\"gnote\">未来方向：以用户需求为起点、核心产品为抓手、品牌价值为突破、经营效率为保障——从成本驱动升级为可持续的 ToC 品牌经营。<br/>讲师点评：表达多停在概念层；ToC 自 25 年起步，正呼唤聚焦与资源。</p>\n</div>\n<div class=\"grp\">\n<div class=\"gh\"><b>品牌A组</b><span>新品牌</span></div>\n<div class=\"duo\" data-grid=\"\">\n<div class=\"pane good\"><h4>做得好</h4><ul>\n<li>运动穿戴音频赛道：产品规划、人群与定位清晰</li>\n<li>运动场景功能差异化、有竞争力</li>\n<li>设计潮流前卫，有记忆点与尝试欲</li></ul></div>\n<div class=\"pane warn\"><h4>待提升</h4><ul>\n<li>品牌叙事能力与延续性不足——「让别人追逐」尚无沉淀</li>\n<li>产品品质与稳定性欠缺</li>\n<li>供应链资源受限</li>\n<li>技术复用与沉淀的路径不明确</li></ul></div>\n</div>\n<p class=\"gnote\">一句话定位差异：公司A做了长时间的「追寻别人」，品牌A要开始「让别人追寻」——这条路径还没摸通，甚至「在哪」都还没定清。</p>\n</div>\n</figure>\n</section>\n<section class=\"mod\" id=\"s01b10\">\n<h3><span class=\"tag\">收敛</span>全场收敛：研发力强，协同弱</h3>\n<p class=\"small\">各组讲的维度相同、角度不同——爱吃辣的人嫌「不够辣」，不爱吃辣的人嫌「太辣」，都是因为辣。同一维度上，有做得好的，也有做得不好的。</p>\n<figure class=\"v\" data-visual-id=\"drv-strengths-gaps\" data-visual-relation=\"研发坚持投入与业务敏锐度是最强驱动力；组织协同缺失导致各自为战、资源分散\" data-visual-source=\"我们是有一个坚持的投入……研发的成本占比较高……我觉得是一个研发力的优势／我们的组织协同能力是缺乏的……资源跟力气都是分散的\" data-visual-title=\"全场收敛：最强驱动力与最需提升\" data-visual-type=\"对照看板\">\n<div class=\"duo\" data-grid=\"\">\n<div class=\"pane good\"><h4>最强驱动力</h4><ul>\n<li><b>研发力</b>——坚持投入、研发成本占比较高</li>\n<li><b>产品力</b>——支撑今天的规模与持续增长</li>\n<li><b>业务敏锐度</b>——××亿以内、外贸为主的公司，业务不强走不到今天；不少同行停在两三个亿就不再增长</li></ul></div>\n<div class=\"pane warn\"><h4>最需提升</h4><ul>\n<li><b>组织协同</b>——部门能力在同行中不差，但各自为战、目标不一致，资源与力气分散</li>\n<li>协同的本质是<b>一致性、利出一孔</b>：观点在较大范围取得共识后，向团队目标倾斜</li></ul></div>\n</div>\n<figcaption>向外求（因客户做产品、营销端的努力）已经不错；向内求（内部一致性、品牌力、供应链品质与效率）是下一程。企业只有两种追求：<b>向外求增长，向内求增效</b>。</figcaption>\n</figure>\n<div class=\"insight\"><span class=\"ilabel\">提示</span>脑子里先装「主动清单」：主动做什么品、重点做哪些国家；被动的事照做、但可以取舍。当主动带来的利润与壁垒越来越大，被动的占比自然越来越小——那时才具备选择权，才有勇气做战略选择。过去那么努力，不就是为了今天有得选吗？</div>\n</section>\n<section class=\"mod\" id=\"s01b11\">\n<h3>规划式与涌现式</h3>\n<p>「战略要不要自上而下？」先打一个问号——先看两个流派。</p>\n<figure class=\"v\" data-visual-id=\"planned-vs-emergent\" data-visual-relation=\"规划式强调自上而下谋定后动，涌现式强调边打边调、因环境而变\" data-visual-source=\"规划式战略强调的是自上而下……先胜而后求战；涌现式战略强调边打边调，因市场环境而变，活下去\" data-visual-title=\"规划式战略与涌现式战略\" data-visual-type=\"对照图\">\n<div class=\"duo\" data-grid=\"\">\n<div class=\"pane\"><h4 class=\"pk\">规划式战略</h4><ul>\n<li>自上而下，谋定后动</li>\n<li>先胜而后求战</li>\n<li>「成功是一场精心的预谋」</li></ul></div>\n<div class=\"pane\"><h4 class=\"pk\">涌现式战略</h4><ul>\n<li>边打边调</li>\n<li>因市场环境、客户需求而变</li>\n<li>先活下去</li></ul></div>\n</div>\n<figcaption>明茨伯格（战略管理排名第一的大师）：战略的两大形式。马化腾补了一句——传奇战略故事多是事后添油加醋的结果，当时其实就是「试一试」。</figcaption>\n</figure>\n<p>涌现不是碰运气：袋鼠妈妈的青少年线，三次被推上桌面才落地。</p>\n<figure class=\"v\" data-visual-id=\"kangaroo-teen-timeline\" data-visual-relation=\"两次被否后靠月度洞察推回桌面，小步尝试三个月打爆，再决定延伸\" data-visual-source=\"四五月份就有舆论洞察……从战略视角不要做……到半年会他又提出来了……第一个月第二个月第三个月直接打爆……决定延伸开始做涌现式的\" data-visual-title=\"袋鼠妈妈青少年线：涌现式落地时间线\" data-visual-type=\"时间线\">\n<div class=\"tl\">\n<div class=\"it\"><b>4–5 月</b>　月度洞察发现青少年线机会；顾问从战略视角否掉——怕伤孕产品牌心智。</div>\n<div class=\"it\"><b>6 月</b>　洞察同事再提：体量大、增速快、竞争小；再被否——「战略视角不做，品牌视角不一定」。</div>\n<div class=\"it\"><b>半年会</b>　第三次提出，举兔头妈妈等例证；抖音团队提议小步尝试，管理层同意。</div>\n<div class=\"it\"><b>尝试上线</b>　第一到第三个月连续打爆；随即决定延伸，转入涌现式推进。</div>\n</div>\n<figcaption>月度洞察机制把机会一次次推回桌面——涌现，也要有机制接得住。</figcaption>\n</figure>\n<div class=\"insight\"><span class=\"ilabel\">洞察</span>好的战略既是规划出来的，又是涌现的；既是自上而下的，又是自下而上的。</div>\n</section>\n<section class=\"mod\" id=\"s01b12\">\n<h3>当下阶段：从模糊到大致正确</h3>\n<p>小罐茶创始人<b>杜国楹</b>几乎不用「战略」这个词，他给了一个公式：</p>\n<div class=\"formula\">增长拐点 ＝（战役 × 战术）<sup>战略</sup></div>\n<p>跃迁式增长，取决于一场场<b>关键战役</b>能不能打赢——打赢，才配谈战略。辽沈、平津、淮海「三大战役」是打完后总结出来的：打辽沈时，没人知道后面还有什么仗。<b>「我们现在还在『工农红军』阶段。」</b></p>\n<ul class=\"list\">\n<li><b>自上而下</b>＝中心聚焦：像天安门一环到六环，给指导、赋能与大体边界。</li>\n<li><b>自下而上</b>＝分布式：公司给土壤与平台，各单元野蛮生长、先跑起来。</li>\n<li>30亿以内：竞争力是不同业态与区域组合的「生态化营销端」，很难单点打到极致——当前阶段，<b>两者要平衡</b>。</li>\n</ul>\n<p>现在处在「从模糊到大致正确」的中间地带。华为的标准——<span class=\"k\">方向大致正确</span>，已经是最好的结果。</p>\n<div class=\"insight\"><span class=\"ilabel\">提示</span>真正的战略一旦定死，6 个品可能只剩 2 个、三组并成一组——取舍必然有代价。共识阶段，先在中间找平衡。</div>\n</section>\n<div class=\"part\" id=\"s01b13\"><span class=\"pno\">PART 03</span><h2>向外看：三看洞察</h2></div>\n<section class=\"mod\" id=\"s01b14\">\n<h3>向外看：战略洞察三看</h3>\n<p>向外看看机会，回答三个问题；三条线各推各的结论，最后汇总。洞察不求完美，但求持续迭代——每年、每季、每月。<span class=\"k\">洞察的深度决定战略的高度</span>，洞察能力的平均分，决定战略输出的平均分。</p>\n<figure class=\"v\" data-visual-id=\"insight-three-looks\" data-visual-relation=\"看行业解决选赛道，看客户决定产品与销售方式，看竞争决定渠道打法\" data-visual-source=\"看宏观与行业的目的是选赛道……用户洞察在很大程度上决定产品和销售方式……竞争分析决定渠道打法\" data-visual-title=\"战略洞察三看\" data-visual-type=\"三看总览图\">\n<div class=\"three\" data-grid=\"\">\n<div class=\"tcol\"><span class=\"tn\">01</span><b>看宏观与行业</b><p>目的：选赛道</p></div>\n<div class=\"tcol\"><span class=\"tn\">02</span><b>看客户</b><p>决定产品与销售方式</p></div>\n<div class=\"tcol\"><span class=\"tn\">03</span><b>看竞争</b><p>决定渠道打法</p></div>\n</div>\n<figcaption>市场洞察决定品类规划，用户洞察决定爆品策划，竞争分析决定渠道打法。</figcaption>\n</figure>\n</section>\n<section class=\"mod\" id=\"s01b15\">\n<h3>看行业：先找到钱在哪里</h3>\n<p>看宏观与行业，目的是<b>选赛道</b>。三个抓手：</p>\n<ul class=\"list\">\n<li><b>钱在哪里</b>：哪些品类、哪些国家、哪些客户（含 C 端人群与 KA 客户）、哪些销售平台与渠道。口径：看体量大<b>或</b>增速快——体量小但增速快的，两三年后可能变大。</li>\n<li><b>技术趋势</b>：赛道内与场景化的技术——例：带同声翻译的无线耳机，戴上看剧、出行即戴即译，OPPO 等已在做且卖得很好。</li>\n<li><b>政策趋势</b>：要么不影响，要么影响致命——所有优势在大趋势面前可能一文不值。孕产类资质全国尚无一家通过；谁先通过，谁先拿先发优势。</li>\n</ul>\n<div class=\"case\">\n<h4>案例 · 时光学：从「重点」里看出「增量」</h4>\n<p>江西南昌的教辅企业时光学（月山科技），做到约 <span class=\"k\">40 亿</span>：一本「课堂笔记」，别人标重点、它标考点，19.9 元一杯咖啡钱，家长闭眼下单；跨境电商益智玩具一两年做到几个亿。</p>\n<p>行业判断：小学体量大、增速放缓——出生人口降到约 <span class=\"k\">700 万</span>，幼儿园关停并转，12–18 岁人群在变多。结论：<b>钱在初高中</b>，品类向初高中、考研与四六级教辅延伸。</p>\n</div>\n</section>\n<section class=\"mod\" id=\"s01b16\">\n<h3>看客户：圈层做深做透</h3>\n<p>用户洞察在很大程度上决定产品与销售方式，落到三个问题：</p>\n<ul class=\"list\">\n<li><b>类型与结构</b>：哪些区域、哪些类型的客户在增长——例如非洲需求上升；C 端的年龄、职业只是标签，关键看类型。</li>\n<li><b>需求、痛点、期待与场景</b>：正在发生什么变化。</li>\n<li><b>消费水平、渠道与合作方式</b>：B 端看生意与合作模式怎么变——三点共同影响价格段、产品梯队与营销方法。</li>\n</ul>\n<div class=\"insight\"><span class=\"ilabel\">洞察</span>当前最好的产品与营销模式，是「某一类客户很狂热，其余的看不懂」——把圈层人群做深做透。泡泡玛特的拉布布：很多人看不懂，有些人很上头。</div>\n</section>\n<section class=\"mod\" id=\"s01b17\">\n<h3>看竞争：找准对手再打</h3>\n<p>看竞争决定渠道打法，回答三点：</p>\n<ul class=\"list\">\n<li><b>对手是谁</b>：找「合适的对手」——不必只盯同规模同行；盯大牌的产品创新理念，也盯快速成长新锐的打法（松鲜鲜、林小生们），差异化地盯。</li>\n<li><b>对手的优劣势</b>：哪些可以借鉴。</li>\n<li><b>跨行学习</b>：同行学习能进步，跨行学习能革命——营销打法、产品创新、自研与内部协同，都可拆开分析。</li>\n</ul>\n<figure class=\"v\" data-visual-id=\"specialist-vs-generalist\" data-visual-relation=\"海天各维度均衡约90分；高增长新锐在细分维度110–120分、部分维度0分\" data-visual-source=\"我在这二三十个指标里面得分都比较高……那些增长快的品牌，在细分场景某些方面可以得110分120分，某些方面甚至0分\" data-visual-title=\"全科生与偏科生：25指标打分规律\" data-visual-type=\"打分对比图\">\n<div class=\"duo\" data-grid=\"\">\n<div class=\"pane\">\n<h4 class=\"pk\">全科生 · 海天蚝油</h4>\n<div class=\"mini\" data-grid=\"\"><span>维度一</span><div class=\"mt\"><div class=\"mb g\" style=\"width:75%\"></div></div><em>90</em></div>\n<div class=\"mini\" data-grid=\"\"><span>维度二</span><div class=\"mt\"><div class=\"mb g\" style=\"width:75%\"></div></div><em>90</em></div>\n<div class=\"mini\" data-grid=\"\"><span>维度三</span><div class=\"mt\"><div class=\"mb g\" style=\"width:75%\"></div></div><em>90</em></div>\n<div class=\"mini\" data-grid=\"\"><span>维度四</span><div class=\"mt\"><div class=\"mb g\" style=\"width:73%\"></div></div><em>88</em></div>\n<div class=\"mini\" data-grid=\"\"><span>维度五</span><div class=\"mt\"><div class=\"mb g\" style=\"width:77%\"></div></div><em>92</em></div>\n</div>\n<div class=\"pane\">\n<h4 class=\"pk\">偏科生 · 高增长新锐</h4>\n<div class=\"mini\" data-grid=\"\"><span>维度一</span><div class=\"mt\"><div class=\"mb a\" style=\"width:98%\"></div></div><em>118</em></div>\n<div class=\"mini\" data-grid=\"\"><span>维度二</span><div class=\"mt\"><div class=\"mb\" style=\"width:0\"></div></div><em class=\"zv\">0</em></div>\n<div class=\"mini\" data-grid=\"\"><span>维度三</span><div class=\"mt\"><div class=\"mb a\" style=\"width:93%\"></div></div><em>112</em></div>\n<div class=\"mini\" data-grid=\"\"><span>维度四</span><div class=\"mt\"><div class=\"mb\" style=\"width:0\"></div></div><em class=\"zv\">0</em></div>\n<div class=\"mini\" data-grid=\"\"><span>维度五</span><div class=\"mt\"><div class=\"mb a\" style=\"width:88%\"></div></div><em>105</em></div>\n</div>\n</div>\n<figcaption>示意：25 个指标（口味、鲜度、颜值……）打分后的规律——均衡的「全科生」赢得体面，有锐度的「偏科生」赢得增长：细分场景 110–120 分、无关处敢打 0 分；渠道同样偏科。</figcaption>\n</figure>\n<p>三看要一条推一条、最后汇总。时光学就是例证：行业与客户都说——大学英语教辅体量大、增速快，值得做；再看竞争——头部几家已占八九成，红海进不去。<b>结论：不做大学，做初高中。</b></p>\n</section>\n<section class=\"mod\" id=\"s01b18\">\n<h3><span class=\"tag\">案例</span>海天蚝油的真对手</h3>\n<p>海天酱油做到 <span class=\"k\">200 多亿</span>、中国第一；蚝油市场长期被李锦记们垄断，海天用两三年做到约 <span class=\"k\">40 亿</span>。</p>\n<div class=\"duo\" data-grid=\"\">\n<div class=\"pane\"><h4 class=\"pk\">关键一招：挤挤瓶</h4><ul>\n<li>胖墩墩的瓶身、腰细好握；单手就能抠开</li>\n<li>挤压定量，瓶口还能回吸倒净</li>\n<li>一个包材改善，借原有渠道网络直接放量</li>\n<li>这一波走完，正找下一波增长（即将召开蚝油品类战略会）</li></ul></div>\n<div class=\"pane\"><h4 class=\"pk\">真对手：糖和味精</h4><ul>\n<li>客户买蚝油，是为了完成「提鲜」这个任务</li>\n<li>糖和味精也能提鲜——所以蚝油的对标不止李锦记</li>\n<li>焦糖布丁理论：<b>客户买的不是产品，是要完成的任务</b></li></ul></div>\n</div>\n<p>打法随之而来：围绕<b>「真蚝鲜熬、一招定鲜」</b>做消费者教育（赞助脱口秀《一饭封神》）。背后是消费心态从「慕强」转向<b>「慕真」</b>——零添加、真材实料、真实表达：千禾靠零添加起势；董宇辉一句「百分百椰子水、配料表干净」，你连牌子都不看就下单。</p>\n<div class=\"insight\"><span class=\"ilabel\">洞察</span>对手未必在同类——客户要完成的任务，划定了真正的竞争边界。</div>\n</section>\n<div class=\"part\" id=\"s01b19\"><span class=\"pno\">PART 04</span><h2>向前一步：今天的输出</h2></div>\n<section class=\"mod\" id=\"s01b20\">\n<h3><span class=\"tag\">输出</span>输出：因为 → 所以的机会表</h3>\n<p>今天的核心输出，是一张「因为 → 所以」的机会表：三看各推一条，最后汇总成结论。</p>\n<figure class=\"v\" data-visual-id=\"because-so-table\" data-visual-relation=\"因为列写变化不写总结，所以列承接机会与风险，末列总结倒逼一句话聚焦\" data-visual-source=\"因为叫变化，一定要写变化，不是总结……所以我们要抓住什么样的机会，要规避什么风险……最右边加一列总结……最厉害的是一句话\" data-visual-title=\"输出表：因为→所以\" data-visual-type=\"表结构示意\">\n<div class=\"scroll\">\n<div class=\"bst\">\n<div class=\"bh\" data-grid=\"\"><span>因为 · 发生了什么变化</span><span>所以 · 抓住什么机会 / 规避什么风险</span><span>总结 · 一句话方向</span></div>\n<div class=\"br1\" data-grid=\"\"><span>职场与办公场景需求双升（示例）</span><span>强化该场景的品牌与市场投入；完善产品体验开发创新</span><span>（各组自行收敛）</span></div>\n</div>\n</div>\n<figcaption>「因为」列只写变化，不写总结；「所以」列承接机会与风险。</figcaption>\n</figure>\n<figure class=\"v\" data-visual-id=\"opportunity-four-types\" data-visual-relation=\"机会集中于客户、产品、销售打法、核心能力四类；制度完善属向内求不算机会\" data-visual-source=\"第一类机会叫客户用户……第二类是产品……第三类销售渠道打法……第四类叫核心的能力……这四个叫做人货场地（力）\" data-visual-title=\"机会四类：人货场力\" data-visual-type=\"四象限图\">\n<div class=\"four\" data-grid=\"\">\n<div class=\"fcell\"><span class=\"fchip\">人</span><div><b>客户 / 用户机会</b><p>某类客户要重视——如非洲、东南亚或某区域市场；B 端客户类型、C 端人群。</p></div></div>\n<div class=\"fcell\"><span class=\"fchip\">货</span><div><b>产品机会</b><p>某品类、技术、功能或场景要发力——如场景化的翻译耳机。</p></div></div>\n<div class=\"fcell\"><span class=\"fchip\">场</span><div><b>销售打法机会</b><p>渠道、平台与获客：增速快的平台还没进就补上；C 端现阶段——选好品、扩渠道，把一个平台扩成两个。</p></div></div>\n<div class=\"fcell\"><span class=\"fchip\">力</span><div><b>核心能力机会</b><p>品牌与市场：空军先炸一波，让销售少做从 0 到 1 的信任建设；再加持续洞察与 AI 能力。</p></div></div>\n</div>\n<figcaption>机会只落在这四类（人、货、场＋力）。</figcaption>\n</figure>\n<p>输出纪律：</p>\n<ul class=\"list\">\n<li><b>短句</b>：一句一个意思，中间不堆逗号。</li>\n<li>禁大词与职场黑话——「全链路闭环」「颗粒度对齐」「找到关键问题」一律不用；是真矩阵才写矩阵，否则就写产品组合或分类。</li>\n<li>最右「总结」列倒逼聚焦，最好收敛成<b>一句话方向</b>——参考白云那家卖十几亿的洗发水，一句话卖点：「没有科技狠活的天然材料＋溶油科技」。</li>\n<li>讨论方式：把作业当靶子，对着说哪些写得好、哪些要调整，人人快说、当场汇总。</li>\n<li>「完善制度」等向内求事项不算机会，留到明天讨论。</li>\n</ul>\n</section>\n</div>\n<script>\n(function(){\n  var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));\n  var panels={a:document.getElementById('qa-a'),b:document.getElementById('qa-b'),c:document.getElementById('qa-c')};\n  tabs.forEach(function(t){\n    t.addEventListener('click',function(){\n      tabs.forEach(function(x){x.setAttribute('aria-pressed',x===t?'true':'false')});\n      Object.keys(panels).forEach(function(k){panels[k].hidden=(k!==t.getAttribute('data-target'))});\n    });\n  });\n})();\n<\/script>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#f5f6fa\" height=\"512\" width=\"512\"></rect><circle cx=\"256\" cy=\"256\" fill=\"#e3e6ef\" r=\"188\"></circle><circle cx=\"256\" cy=\"256\" fill=\"#cdd4f2\" r=\"138\"></circle><circle cx=\"256\" cy=\"256\" fill=\"#93a5ea\" r=\"90\"></circle><circle cx=\"256\" cy=\"256\" fill=\"#3a4fd0\" r=\"44\"></circle><line stroke=\"#1c2030\" stroke-linecap=\"round\" stroke-width=\"13\" x1=\"400\" x2=\"273\" y1=\"84\" y2=\"236\"></line><polygon fill=\"#1c2030\" points=\"260,251 284,240 267,226\"></polygon></svg></template>\n","blocks":[{"id":"s01b01","type":"part","heading":"定调：什么是好战略","text":"PART 01\n定调：什么是好战略"},{"id":"s01b02","type":"mod","heading":"战略是艺术，管理是科学","text":"战略是艺术，管理是科学\n战略 · 一门艺术\n由外而内，做选择与取舍；\n没有非黑即白的答案，所以有难度。\n战略管理 · 一门科学\n有科学方法的完整过程，\n可以照着做、照着练。\n战略的本质不是输出本身，而是战略管理能力。"},{"id":"s01b03","type":"mod","heading":"第一原则：明确表达 × 深度共识","text":"第一原则：明确表达 × 深度共识\n战略的最终结果，取决于团队\n怎么理解、怎么执行\n，而不是文档本身多少分。\n60分战略\n＋深度共识\n结果 ≈80–90 分\n100分战略\n＋内部不共识\n结果 ≈60 分\n0\n50\n100\n战略不仅仅是一个结论——大家怎么看待它、理解它、执行它，决定了最终结果。\n所以战略管理的第一原则是\n明确的表达\n：写清楚，\n不在多而在精\n。信息的价值与密度，跟数量成反比；字越少，事儿越大。字一多，真正最有价值的事就被稀释掉了。"},{"id":"s01b04","type":"mod","heading":"案例 取舍：把最有价值的事拎出来","text":"案例\n取舍：把最有价值的事拎出来\n周末只有两天：陪孩子、跟爱人约会、看父母、练瑜伽、读本书——单拎出来每件都有意义。每件都做，就没有几件能做好。放进\n备选清单\n可以，落地必须\n拎出几件做深做透\n。\n郑州男士护肤品牌\n海洋至尊\n：去年不到\n10 亿\n，今年约\n20 亿\n、翻倍。最关键的动作，是先画一张人群靶心图——像打靶一样，从靶心向外一圈圈划人群。\n原点\n原点人群\n——核心客群（B端叫客户、种子客户、灯塔级客户）\n圈层人群\n——选定\n篮球圈层\n重点击穿：线下篮球赛事＋线上篮球游戏全面露出广告\n主打人群\n大众人群\n——人群由内向外自然延伸\n无论 B 端还是 C 端，都先画这张靶——再选一环重点击穿。\n圈层怎么掰：爱运动的男生里还有打篮球、踢足球、打乒乓球、羽毛球的；小镇青年也算一圈。掰开之后，才挑得出要击穿的那一环。为什么选篮球不选足球？中国足球不给力。不打球的人也不会被落下——那叫\n向往人群\n：向往球场上的状态、羡慕那副身体，也会买。苹果的广告，永远只拍年轻人。\n洞察\n字多带来分散、记不住——「明年到底要抓住什么？」要能一句话答出来；答不出，说明还没做取舍。"},{"id":"s01b05","type":"mod","heading":"表达的三层境界","text":"表达的三层境界\nL1\n概念性表达\n「提高产品力」「提高品牌力」——对，但抠不出错；只是大导向，\n只配老板讲\n。\nL2\n计划性表达\n「搭建产品矩阵，2月底前完成」——有计划，但到底做什么产品，仍不知道：\n正确的废话\n。\nL3\n结论性表达\n「明年战略品是××系列××型号」「品牌要做的几个小事件是××」——\n写明对象\n，才能执行。\n组长、副组长、书记的汇总，要落在第三层。"},{"id":"s01b06","type":"mod","heading":"三促共识：共创、结构、机制","text":"三促共识：共创、结构、机制\n以共创促共识\n唯有参与才有认同，唯有认同才有执行。不同观点就要吵出来——一定会吵，还可能吵得很凶。\n以结构促共识\n表格统一、工具统一。表头第一格「客户是谁」，第二格「客户价值」，第三格「产品与获客」——倒逼先想客户，再想卖货。\n以机制促共识\n协同机制、项目管理、战役小组、分钱与激励。平时不说话的两个人，给一个共同任务加 10 万块——钱会改变立场。\n▼\n深度共识 → 心往一处使\n共创解决「参与」，结构解决「思考顺序」，机制解决「利益绑定」。"},{"id":"s01b07","type":"part","heading":"在哪：战略 ABC 与自我盘点","text":"PART 02\n在哪：战略 ABC 与自我盘点"},{"id":"s01b08","type":"mod","heading":"战略 ABC：在哪、去哪、怎么去","text":"战略 ABC：在哪、去哪、怎么去\n「什么是战略？」现场回答拼出了原材料——让大家朝一个方向发力、在有优势的领域决定做什么、先定位再布局。归纳起来就是三个字母：\nA\n在哪\n当下在哪：自己的优劣势\n→\nB\n去哪\n能建立长期优势的方向\n→\nC\n怎么去\n关键路径的最优解\n字节跳动的内部口头禅，正是 C 里的「最优解」——做任何事都有价值，关键是如何选。\nA 是起点：战略更强调看外部，但起点是\n快速看自己\n——第一轮研讨，就从这个 A 开始。\nA · 在哪\nB · 去哪\nC · 怎么去\n成员A：A 最重要。\n首先要知道自己的优势和各方面的处境，先了解自己。\n讲师点评：有点意外——一般大家会在 B、C 之间选。但知己知彼、百战不殆，\n知己排在前头\n，「在哪」确实重要。\nB 最重要。\n先知道去北京还是去海南，方向定了，后面才有意义。\nC 最重要。\n怎么去影响成本——坐火车还是别的，路径决定代价。\n现场三种答案吵了起来。讲师收束：这是一道\n伪命题\n——没有前提。身体重要还是挣钱重要？健康的人说挣钱，病房里的人说身体；分五个组讨论，答案会各不相同。它取决于\n企业自身的状态\n。"},{"id":"s01b09","type":"mod","heading":"研讨 自我盘点：五组驱动力与短板","text":"研讨\n自我盘点：五组驱动力与短板\n第一轮只回答「在哪」：走到今天，最重要的驱动力是什么？哪些方面需要提升？人人先想、组内快讲，组长与书记带队汇总。\n一组\n复盘视角\n做得好\n每年洞察差距，有策略地持续进步\n强化核心品类与聚焦，其他品类持续探索\n待提升\n战略自下而上，缺自上而下的倒推\n核心产品竞争深度不够（产品、客户、营销）\n组织协同弱，共同目标感弱\n二组\n转型视角\n做得好\n从 OEM 向品牌化转型，专注品牌\n坚持产品自研\n标杆市场做客户分层，沉淀可复制方法论；紧跟渠道变化\n待提升\n品牌、产品、渠道三力协同不足，缺发力焦点\n外部洞察与节奏把控不够\n产品本土化表达不到位，溢价不足；品牌思维偏短视卖货\n代理开拓与品牌共创配合被动\n三组\nOEM\n驱动力「五有」＋渠道\n有资历：二十余年的行业经验与沉淀\n有研发、有工厂、有想法（自有工业设计）、有资金\n渠道客户资源丰富，可触达各大区域\n赋能体系标准化、服务产品化可复制\n研发＋工业设计＋供应链＋资金的整体整合\n全球渠道与头部客户关系，转化为稳定订单\n待提升\n产品开发周期长——目标缩至\n3 个月\n品质管控未与公司规模对齐\n赋能服务价值不够高\n订单导向、缺终端用户需求导向；单品投入不聚焦\n四组\nToC\n做得好（过去驱动）\n工贸一体的成本与供应链优势\n多国家多渠道布局、产品供给丰富\n客户响应灵活，支撑了基础增长\n当前瓶颈\n多渠道多客户带来产品与资源分散\n用户洞察与产品定义前置不足，缺有记忆点的旗舰产品\n品牌倍数与内容资产积累不足，溢价待提升，ToC 规模有限\n未来方向：以用户需求为起点、核心产品为抓手、品牌价值为突破、经营效率为保障——从成本驱动升级为可持续的 ToC 品牌经营。\n讲师点评：表达多停在概念层；ToC 自 25 年起步，正呼唤聚焦与资源。\n品牌A组\n新品牌\n做得好\n运动穿戴音频赛道：产品规划、人群与定位清晰\n运动场景功能差异化、有竞争力\n设计潮流前卫，有记忆点与尝试欲\n待提升\n品牌叙事能力与延续性不足——「让别人追逐」尚无沉淀\n产品品质与稳定性欠缺\n供应链资源受限\n技术复用与沉淀的路径不明确\n一句话定位差异：公司A做了长时间的「追寻别人」，品牌A要开始「让别人追寻」——这条路径还没摸通，甚至「在哪」都还没定清。"},{"id":"s01b10","type":"mod","heading":"收敛 全场收敛：研发力强，协同弱","text":"收敛\n全场收敛：研发力强，协同弱\n各组讲的维度相同、角度不同——爱吃辣的人嫌「不够辣」，不爱吃辣的人嫌「太辣」，都是因为辣。同一维度上，有做得好的，也有做得不好的。\n最强驱动力\n研发力\n——坚持投入、研发成本占比较高\n产品力\n——支撑今天的规模与持续增长\n业务敏锐度\n——××亿以内、外贸为主的公司，业务不强走不到今天；不少同行停在两三个亿就不再增长\n最需提升\n组织协同\n——部门能力在同行中不差，但各自为战、目标不一致，资源与力气分散\n协同的本质是\n一致性、利出一孔\n：观点在较大范围取得共识后，向团队目标倾斜\n向外求（因客户做产品、营销端的努力）已经不错；向内求（内部一致性、品牌力、供应链品质与效率）是下一程。企业只有两种追求：\n向外求增长，向内求增效\n。\n提示\n脑子里先装「主动清单」：主动做什么品、重点做哪些国家；被动的事照做、但可以取舍。当主动带来的利润与壁垒越来越大，被动的占比自然越来越小——那时才具备选择权，才有勇气做战略选择。过去那么努力，不就是为了今天有得选吗？"},{"id":"s01b11","type":"mod","heading":"规划式与涌现式","text":"规划式与涌现式\n「战略要不要自上而下？」先打一个问号——先看两个流派。\n规划式战略\n自上而下，谋定后动\n先胜而后求战\n「成功是一场精心的预谋」\n涌现式战略\n边打边调\n因市场环境、客户需求而变\n先活下去\n明茨伯格（战略管理排名第一的大师）：战略的两大形式。马化腾补了一句——传奇战略故事多是事后添油加醋的结果，当时其实就是「试一试」。\n涌现不是碰运气：袋鼠妈妈的青少年线，三次被推上桌面才落地。\n4–5 月\n月度洞察发现青少年线机会；顾问从战略视角否掉——怕伤孕产品牌心智。\n6 月\n洞察同事再提：体量大、增速快、竞争小；再被否——「战略视角不做，品牌视角不一定」。\n半年会\n第三次提出，举兔头妈妈等例证；抖音团队提议小步尝试，管理层同意。\n尝试上线\n第一到第三个月连续打爆；随即决定延伸，转入涌现式推进。\n月度洞察机制把机会一次次推回桌面——涌现，也要有机制接得住。\n洞察\n好的战略既是规划出来的，又是涌现的；既是自上而下的，又是自下而上的。"},{"id":"s01b12","type":"mod","heading":"当下阶段：从模糊到大致正确","text":"当下阶段：从模糊到大致正确\n小罐茶创始人\n杜国楹\n几乎不用「战略」这个词，他给了一个公式：\n增长拐点 ＝（战役 × 战术）\n战略\n跃迁式增长，取决于一场场\n关键战役\n能不能打赢——打赢，才配谈战略。辽沈、平津、淮海「三大战役」是打完后总结出来的：打辽沈时，没人知道后面还有什么仗。\n「我们现在还在『工农红军』阶段。」\n自上而下\n＝中心聚焦：像天安门一环到六环，给指导、赋能与大体边界。\n自下而上\n＝分布式：公司给土壤与平台，各单元野蛮生长、先跑起来。\n30亿以内：竞争力是不同业态与区域组合的「生态化营销端」，很难单点打到极致——当前阶段，\n两者要平衡\n。\n现在处在「从模糊到大致正确」的中间地带。华为的标准——\n方向大致正确\n，已经是最好的结果。\n提示\n真正的战略一旦定死，6 个品可能只剩 2 个、三组并成一组——取舍必然有代价。共识阶段，先在中间找平衡。"},{"id":"s01b13","type":"part","heading":"向外看：三看洞察","text":"PART 03\n向外看：三看洞察"},{"id":"s01b14","type":"mod","heading":"向外看：战略洞察三看","text":"向外看：战略洞察三看\n向外看看机会，回答三个问题；三条线各推各的结论，最后汇总。洞察不求完美，但求持续迭代——每年、每季、每月。\n洞察的深度决定战略的高度\n，洞察能力的平均分，决定战略输出的平均分。\n01\n看宏观与行业\n目的：选赛道\n02\n看客户\n决定产品与销售方式\n03\n看竞争\n决定渠道打法\n市场洞察决定品类规划，用户洞察决定爆品策划，竞争分析决定渠道打法。"},{"id":"s01b15","type":"mod","heading":"看行业：先找到钱在哪里","text":"看行业：先找到钱在哪里\n看宏观与行业，目的是\n选赛道\n。三个抓手：\n钱在哪里\n：哪些品类、哪些国家、哪些客户（含 C 端人群与 KA 客户）、哪些销售平台与渠道。口径：看体量大\n或\n增速快——体量小但增速快的，两三年后可能变大。\n技术趋势\n：赛道内与场景化的技术——例：带同声翻译的无线耳机，戴上看剧、出行即戴即译，OPPO 等已在做且卖得很好。\n政策趋势\n：要么不影响，要么影响致命——所有优势在大趋势面前可能一文不值。孕产类资质全国尚无一家通过；谁先通过，谁先拿先发优势。\n案例 · 时光学：从「重点」里看出「增量」\n江西南昌的教辅企业时光学（月山科技），做到约\n40 亿\n：一本「课堂笔记」，别人标重点、它标考点，19.9 元一杯咖啡钱，家长闭眼下单；跨境电商益智玩具一两年做到几个亿。\n行业判断：小学体量大、增速放缓——出生人口降到约\n700 万\n，幼儿园关停并转，12–18 岁人群在变多。结论：\n钱在初高中\n，品类向初高中、考研与四六级教辅延伸。"},{"id":"s01b16","type":"mod","heading":"看客户：圈层做深做透","text":"看客户：圈层做深做透\n用户洞察在很大程度上决定产品与销售方式，落到三个问题：\n类型与结构\n：哪些区域、哪些类型的客户在增长——例如非洲需求上升；C 端的年龄、职业只是标签，关键看类型。\n需求、痛点、期待与场景\n：正在发生什么变化。\n消费水平、渠道与合作方式\n：B 端看生意与合作模式怎么变——三点共同影响价格段、产品梯队与营销方法。\n洞察\n当前最好的产品与营销模式，是「某一类客户很狂热，其余的看不懂」——把圈层人群做深做透。泡泡玛特的拉布布：很多人看不懂，有些人很上头。"},{"id":"s01b17","type":"mod","heading":"看竞争：找准对手再打","text":"看竞争：找准对手再打\n看竞争决定渠道打法，回答三点：\n对手是谁\n：找「合适的对手」——不必只盯同规模同行；盯大牌的产品创新理念，也盯快速成长新锐的打法（松鲜鲜、林小生们），差异化地盯。\n对手的优劣势\n：哪些可以借鉴。\n跨行学习\n：同行学习能进步，跨行学习能革命——营销打法、产品创新、自研与内部协同，都可拆开分析。\n全科生 · 海天蚝油\n维度一\n90\n维度二\n90\n维度三\n90\n维度四\n88\n维度五\n92\n偏科生 · 高增长新锐\n维度一\n118\n维度二\n0\n维度三\n112\n维度四\n0\n维度五\n105\n示意：25 个指标（口味、鲜度、颜值……）打分后的规律——均衡的「全科生」赢得体面，有锐度的「偏科生」赢得增长：细分场景 110–120 分、无关处敢打 0 分；渠道同样偏科。\n三看要一条推一条、最后汇总。时光学就是例证：行业与客户都说——大学英语教辅体量大、增速快，值得做；再看竞争——头部几家已占八九成，红海进不去。\n结论：不做大学，做初高中。"},{"id":"s01b18","type":"mod","heading":"案例 海天蚝油的真对手","text":"案例\n海天蚝油的真对手\n海天酱油做到\n200 多亿\n、中国第一；蚝油市场长期被李锦记们垄断，海天用两三年做到约\n40 亿\n。\n关键一招：挤挤瓶\n胖墩墩的瓶身、腰细好握；单手就能抠开\n挤压定量，瓶口还能回吸倒净\n一个包材改善，借原有渠道网络直接放量\n这一波走完，正找下一波增长（即将召开蚝油品类战略会）\n真对手：糖和味精\n客户买蚝油，是为了完成「提鲜」这个任务\n糖和味精也能提鲜——所以蚝油的对标不止李锦记\n焦糖布丁理论：\n客户买的不是产品，是要完成的任务\n打法随之而来：围绕\n「真蚝鲜熬、一招定鲜」\n做消费者教育（赞助脱口秀《一饭封神》）。背后是消费心态从「慕强」转向\n「慕真」\n——零添加、真材实料、真实表达：千禾靠零添加起势；董宇辉一句「百分百椰子水、配料表干净」，你连牌子都不看就下单。\n洞察\n对手未必在同类——客户要完成的任务，划定了真正的竞争边界。"},{"id":"s01b19","type":"part","heading":"向前一步：今天的输出","text":"PART 04\n向前一步：今天的输出"},{"id":"s01b20","type":"mod","heading":"输出 输出：因为 → 所以的机会表","text":"输出\n输出：因为 → 所以的机会表\n今天的核心输出，是一张「因为 → 所以」的机会表：三看各推一条，最后汇总成结论。\n因为 · 发生了什么变化\n所以 · 抓住什么机会 / 规避什么风险\n总结 · 一句话方向\n职场与办公场景需求双升（示例）\n强化该场景的品牌与市场投入；完善产品体验开发创新\n（各组自行收敛）\n「因为」列只写变化，不写总结；「所以」列承接机会与风险。\n人\n客户 / 用户机会\n某类客户要重视——如非洲、东南亚或某区域市场；B 端客户类型、C 端人群。\n货\n产品机会\n某品类、技术、功能或场景要发力——如场景化的翻译耳机。\n场\n销售打法机会\n渠道、平台与获客：增速快的平台还没进就补上；C 端现阶段——选好品、扩渠道，把一个平台扩成两个。\n力\n核心能力机会\n品牌与市场：空军先炸一波，让销售少做从 0 到 1 的信任建设；再加持续洞察与 AI 能力。\n机会只落在这四类（人、货、场＋力）。\n输出纪律：\n短句\n：一句一个意思，中间不堆逗号。\n禁大词与职场黑话——「全链路闭环」「颗粒度对齐」「找到关键问题」一律不用；是真矩阵才写矩阵，否则就写产品组合或分类。\n最右「总结」列倒逼聚焦，最好收敛成\n一句话方向\n——参考白云那家卖十几亿的洗发水，一句话卖点：「没有科技狠活的天然材料＋溶油科技」。\n讨论方式：把作业当靶子，对着说哪些写得好、哪些要调整，人人快说、当场汇总。\n「完善制度」等向内求事项不算机会，留到明天讨论。"}]},{"num":2,"id":"s02","title":"品牌战略工作坊纪要：聚焦与三组方案评审","date":"2026年11月9日","css":"#sv{\n  --page-bg:#f3f5f7; --surface:#ffffff; --text:#1b2530; --muted:#5c6b7a;\n  --accent:#0d7a6f; --accent-soft:#e2f0ee; --border:#e2e7ec; --fig-bg:#f8fafb;\n  --warn:#a5541c; --warn-soft:#f7ede2; --track:#edf1f4;\n  --c1:#0d7a6f; --c1t:#ffffff; --c2:#3d9c90; --c2t:#ffffff;\n  --c3:#a9d3cc; --c3t:#155a51; --c4:#c9d2da; --c4t:#4a5560;\n  --radius:14px;\n
