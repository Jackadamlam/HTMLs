nt; }\ntable{ font-size: 12.5px; }\nth,td{ padding: 9px 8px !important; }\nnav{ max-width: 100%; }\nnav[data-scrollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}\nrepair-arrow-glyph{display:contents}\n@media(max-width:600px){\n[data-repair-arrow-label=\"al-0\"]{transform:none!important;min-width:0!important;max-width:100%!important;box-sizing:border-box!important}\n}\n@media(max-width:600px){\n[data-repair-arrow-label=\"al-0\"] [data-repair-arrow-glyph=\"al-0\"]{display:inline-block!important;transform:rotate(90deg)!important}\n}\n@media(max-width:600px){\n[data-repair-arrow-label=\"al-0\"] repair-arrow-glyph{display:inline-block!important;transform:rotate(90deg)!important}\n}\n@media (max-width:767px){\n#sv > div:nth-child(1) > section:nth-child(6) > div:nth-child(1) > span:nth-child(1){white-space:normal!important;flex-shrink:1!important;min-width:0!important;overflow-wrap:anywhere!important}\n#sv > div:nth-child(1) > section:nth-child(6) > div:nth-child(1) > i:nth-child(2){margin-left:-12px!important;clip-path:inset(0 0 0 12px)!important}\n}","body":"\n<div class=\"wrap\">\n<nav aria-label=\"章节导航\" class=\"topnav\">\n<a href=\"#p1\">定位阶梯</a>\n<a href=\"#p2\">单品突破</a>\n<a href=\"#p3\">品牌与KA</a>\n<a href=\"#p4\">案例拆解</a>\n<a href=\"#p5\">便利创新</a>\n</nav>\n<header class=\"hero\">\n<div class=\"kick\">产品战略共创会 · 纪要</div>\n<h1>聚焦式定位：单品突破与便利创新</h1>\n<p class=\"sub\">围绕「该聚焦在哪一层」展开：五层定位阶梯、焦糖布丁追问、单品突破与壁垒节奏、KA 的宽类窄品逻辑，以及眼镜、纸巾、洗衣液三个拆解案例。</p>\n</header>\n<section id=\"p1\">\n<div class=\"part-head\"><span class=\"pt\">PART 1 · 定位层级与方法</span><i></i></div>\n<div class=\"mod\" id=\"s04b01\">\n<div class=\"mod-head\"><span class=\"idx\">01</span><h2>定位五层阶梯</h2></div>\n<p>任何商品都能在最基础的元素上做区隔——用一个成分说出「我和别人有什么不同」，这就是<strong>成分即品类</strong>。点击每一层，看该层的聚焦选项与边界。</p>\n<figure class=\"fig\" data-visual-id=\"ladder-levels\" data-visual-relation=\"成分最易区隔但难成壁垒，向上依次为功能场景、任务、情绪、追求；成长型企业从下往上打，本阶段聚焦技术与功能场景层\" data-visual-source=\"它最基础的那个元素……往上叫功能或者场景……最上面叫追求……成长型企业一般都是从下往上打\" data-visual-title=\"定位层级阶梯（交互）\" data-visual-type=\"交互层级阶梯图\">\n<div class=\"ladder\">\n<button aria-pressed=\"false\" class=\"lstep\" data-i=\"0\" style=\"--h:58px\"><span>成分 / 材质</span></button>\n<button aria-pressed=\"true\" class=\"lstep sel\" data-i=\"1\" style=\"--h:88px\"><span class=\"sflag\">本阶段</span><span>功能 / 场景</span></button>\n<button aria-pressed=\"false\" class=\"lstep\" data-i=\"2\" style=\"--h:118px\"><span>任务 / 目的</span></button>\n<button aria-pressed=\"false\" class=\"lstep\" data-i=\"3\" style=\"--h:148px\"><span>情绪</span></button>\n<button aria-pressed=\"false\" class=\"lstep\" data-i=\"4\" style=\"--h:178px\"><span>追求 / 价值观</span></button>\n</div>\n<div class=\"lvbox\" id=\"lvBox\">\n<div class=\"t\"><b>功能 / 场景</b><span class=\"pos\">第 2 层</span><span class=\"fz focus\">本阶段聚焦落点</span></div>\n<p>功能与场景相互匹配：客户在具体场景里，用产品完成某个任务。</p>\n<div class=\"flag gain\">本次讨论的聚焦点：某项技术＋功能场景。</div>\n</div>\n<div class=\"ladder-note\">除按层聚焦外，还可聚焦<strong>某类人群</strong>——滑雪是一个场景，高端运动是一类人群。</div>\n<figcaption class=\"figcap\">每一层的区隔难度与壁垒强度不同：越往上越依赖下层先立住。</figcaption>\n</figure>\n<div class=\"insight\"><span class=\"il\">洞察</span>定位不是定死、非黑即白：基本盘之上，主动做<strong>尝试性聚焦</strong>，这本身就是战略思维。成长型企业一般<strong>从下往上打</strong>——先聚焦场景与核心技术，再一层层向上。</div>\n</div>\n<div class=\"mod\" id=\"s04b02\">\n<div class=\"mod-head\"><span class=\"idx\">02</span><h2>焦糖布丁：一层层追问</h2></div>\n<p>功能与场景这一层，很大程度上就是<strong>焦糖布丁理论</strong>（Jobs to be Done）：客户买的不是产品。沿用途一路追问：</p>\n<figure class=\"fig\" data-visual-id=\"jtbd-question-chain\" data-visual-relation=\"客户买的不是产品本身，沿打洞、挂画、装饰、情绪逐层追问，指向对生活的追求\" data-visual-source=\"客户买的不是一个橙子……他打那个洞……挂画……装饰空间……情绪……对生活的追求\" data-visual-title=\"焦糖布丁追问链\" data-visual-type=\"追问链流程图\">\n<div class=\"qchain\">\n<div class=\"qrow\"><span class=\"q\">起点</span><span class=\"a\">「客户买的不是一个橙子」</span></div>\n<div class=\"qrow\"><span class=\"q\">买来做什么？</span><span class=\"a\">打一个洞</span></div>\n<div class=\"qrow\"><span class=\"q\">打洞为什么？</span><span class=\"a\">挂一幅画、装修房间</span></div>\n<div class=\"qrow\"><span class=\"q\">挂画为什么？</span><span class=\"a\">软装装饰、家居环境</span></div>\n<div class=\"qrow\"><span class=\"q\">装饰不行吗？</span><span class=\"a\">为了情绪</span></div>\n<div class=\"qrow end\"><span class=\"q\">情绪背后是？</span><span class=\"a\">对生活的追求</span></div>\n</div>\n<figcaption class=\"figcap\">每追问一层，就上到阶梯的上一层。</figcaption>\n</figure>\n<p><strong>定位到哪个层次、哪个环节，决定你在哪一层竞争。</strong></p>\n</div>\n<div class=\"mod\" id=\"s04b03\">\n<div class=\"mod-head\"><span class=\"idx\">03</span><h2>从订单导向到聚焦路径</h2></div>\n<p>当前销售成果主要来自<strong>核心区域的核心客户</strong>：一个区域内需求相对一致，放到更大区域就不太一样——</p>\n<figure class=\"fig\" data-visual-id=\"focus-path\" data-visual-relation=\"核心区域核心客户需求不一致、偏订单导向；聚焦强技术使需求一致并可建立细分优势\" data-visual-source=\"销售成果来自于核心区域的核心客户……需求又不太一样……偏订单导向……建立自己的优势\" data-visual-title=\"订单导向现状与聚焦路径\" data-visual-type=\"对比流程图\">\n<div class=\"fp\" data-grid=\"\">\n<div class=\"fp-col fp-now\">\n<div class=\"fp-t\">现状 · 偏订单导向</div>\n<ul>\n<li>成果集中在核心区域的核心客户</li>\n<li>一个区域内需求相对一致</li>\n<li>放大到更大区域，需求就不一致</li>\n</ul>\n</div>\n<div class=\"fp-arrow\" data-repair-arrow-label=\"al-0\"><i class=\"ar\" data-repair-arrow-glyph=\"al-0\"><repair-arrow-glyph data-repair-arrow-glyph=\"al-0\">→</repair-arrow-glyph></i><em>尝试性聚焦</em></div>\n<div class=\"fp-col fp-goal\">\n<div class=\"fp-t\">聚焦路径</div>\n<ul>\n<li>聚焦一项强技术（如降噪技术）</li>\n<li>需求走向一致</li>\n<li>细分领域建立自己的优势</li>\n<li>品牌力有差距，细分能立住</li>\n</ul>\n</div>\n</div>\n<figcaption class=\"figcap\">拼品牌力与大牌有差距，但把一个领域细分出来，就可能建立自己的优势。</figcaption>\n</figure>\n</div>\n</section>\n<section id=\"p2\">\n<div class=\"part-head\"><span class=\"pt\">PART 2 · 单品突破与壁垒节奏</span><i></i></div>\n<div class=\"mod\" id=\"s04b04\">\n<div class=\"mod-head\"><span class=\"idx\">04</span><h2>单品突破的两个标杆</h2></div>\n<p>宠物食品货架的常规切法是按品类；标杆企业换了一个切法——</p>\n<figure class=\"fig\" data-visual-id=\"focus-examples\" data-visual-relation=\"常规按猫狗主粮、零食、用品分货架；标杆或聚焦猎鸟肉源成分，或只做一两个单品设备做到四五亿规模\" data-visual-source=\"你会看到猫主粮狗主粮……聚焦的是猎鸟……就一两个品……做四五个亿……我们认为有，所以才做下去\" data-visual-title=\"单品突破标杆：货架与两种聚焦\" data-visual-type=\"货架对照示意图\">\n<div class=\"fe\" data-grid=\"\">\n<div>\n<div class=\"fe-t\">常规货架 · 按品类切</div>\n<div class=\"shelf\" data-grid=\"\">\n<div class=\"sh-item\">猫主粮</div><div class=\"sh-item\">狗主粮</div>\n<div class=\"sh-item\">零食</div><div class=\"sh-item\">用品</div>\n</div>\n</div>\n<div>\n<div class=\"fe-t\">标杆的两个聚焦落点</div>\n<div class=\"fe-card\"><b>聚焦肉源（成分层）</b><span>只做猎鸟（乳鸽）类肉源，用一种成分区隔整个品牌——从下往上打是对的。</span></div>\n<div class=\"fe-card\"><b>聚焦单品设备</b><span>猫用自动饮水＋自动喂食，就一两个品；外贸＋跨境电商（to B2C），年规模约四五亿（口述概数）。</span></div>\n</div>\n</div>\n<figcaption class=\"figcap\">设备企业规模不大，但单品足够深——「我们认为有，所以才做下去」。</figcaption>\n</figure>\n<div class=\"quote\">「一定是单品突破」「我们认为有，所以才做下去。」</div>\n<p class=\"note\">单品突破之后，可以越级到更高一层——讨论中的两个问题一并被解决。</p>\n</div>\n<div class=\"mod\" id=\"s04b05\">\n<div class=\"mod-head\"><span class=\"idx\">05</span><h2>壁垒与节奏：先做深再延伸</h2></div>\n<p>两条路径同步想：一是<strong>技术壁垒</strong>——自研投入成本高；二是<strong>爆品路径</strong>——有了一个爆品，就复用它的逻辑继续做深。</p>\n<figure class=\"fig\" data-visual-id=\"deepen-loop\" data-visual-relation=\"单品爆后复用逻辑做深迭代、触达用户与情绪价值，到天花板再横向延伸；品类够跑完但切太细跑不完\" data-visual-source=\"复用这个爆品的逻辑……做更深的迭代……接触到用户……做到天花板之后再去做延伸……专门为风帆开发一款耳机？不可能\" data-visual-title=\"爆品做深与延伸节奏\" data-visual-type=\"流程图\">\n<div class=\"dloop\">\n<span class=\"c\">单品打爆</span><span class=\"ar\">→</span>\n<span class=\"c\">复用爆品逻辑 · 做深迭代</span><span class=\"ar\">→</span>\n<span class=\"c\">触达用户 · 情绪价值</span><span class=\"ar\">→</span>\n<span class=\"c\">到品类天花板</span><span class=\"ar\">→</span>\n<span class=\"c end\">横向延伸</span>\n</div>\n<div class=\"dloop-notes\" data-grid=\"\">\n<div class=\"dn ok\"><b>✓ 够跑完</b>品类容量虽不大，但够一个新品牌跑完（有第三方佐证）；增长第二步再考虑横向切。</div>\n<div class=\"dn bad\"><b>✕ 切太细跑不完</b>为风帆运动单独开发一款耳机不现实——体量太小，最后还是会回到「游泳」这个大场景。</div>\n</div>\n<figcaption class=\"figcap\">过程中的诱惑是横向延伸——收敛：做到品类天花板再延伸，这是战略定力。</figcaption>\n</figure>\n</div>\n</section>\n<section id=\"p3\">\n<div class=\"part-head\"><span class=\"pt\">PART 3 · 品牌演进与 KA 入场</span><i></i></div>\n<div class=\"mod\" id=\"s04b06\">\n<div class=\"mod-head\"><span class=\"idx\">06</span><h2>品牌演进：1 → 10 → 100</h2></div>\n<p>品牌最早期就是商标，后来是「看上去像个牌子」。蕉下的路径是<strong>单品卖爆、单品代表品牌</strong>，再一路向上延伸——</p>\n<figure class=\"fig\" data-visual-id=\"brand-evolution\" data-visual-relation=\"品牌从商标到像牌子，经单品代表、品类、人群/生活方式到价值观品牌，价值量级逐级放大\" data-visual-source=\"最早期所谓的品牌就是商标……蕉下单品卖爆……延伸到品类……袋鼠妈妈……孕产、婴童、青少年\" data-visual-title=\"品牌演进：1到10到100\" data-visual-type=\"演进时间线\">\n<div class=\"tl\">\n<div class=\"tl-row\"><span class=\"tl-dot\"></span><div><b>商标</b><p>品牌最早期就是商标。</p></div></div>\n<div class=\"tl-row\"><span class=\"tl-dot\"></span><div><b>像个牌子</b><p>慢慢做出品牌的样子。</p></div></div>\n<div class=\"tl-row\"><span class=\"tl-dot\"></span><div><b>单品代表品牌</b><span class=\"tl-val\">1</span><p>蕉下横空出世：单品卖爆，单品代表品牌。</p></div></div>\n<div class=\"tl-row\"><span class=\"tl-dot\"></span><div><b>品类品牌</b><span class=\"tl-val\">10</span><p>把单品延伸成一个品类。</p></div></div>\n<div class=\"tl-row\"><span class=\"tl-dot\"></span><div><b>人群 / 生活方式品牌</b><span class=\"tl-val\">100</span><p>蕉下围绕「户外生活」；袋鼠妈妈按人群重组天猫目录，给客户一条选择路径。</p>\n<div class=\"swap\"><span class=\"old\">洗沐 · 面护 · 彩妆</span><span class=\"ar\">→</span><span class=\"new\">孕产</span><span class=\"new\">婴童</span><span class=\"new\">小童（分年龄段）</span><span class=\"new\">青少年</span></div>\n</div></div>\n<div class=\"tl-row\"><span class=\"tl-dot\"></span><div><b>价值观品牌</b><p>把一种精神做成品牌：Just do it、think different。</p></div></div>\n</div>\n<figcaption class=\"figcap\">量级 1→10→100 为讲师的讲法示意；一般品牌都会经历这个历程。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s04b07\">\n<div class=\"mod-head\"><span class=\"idx\">07</span><h2>宽类窄品：KA 凭什么让你上架</h2></div>\n<p>进 KA 渠道（国外、国内逻辑一样），判断权在采购手里。现在的年轻采购<strong>不靠关系、服务、维护</strong>——上网就搜数据。</p>\n<figure class=\"fig\" data-visual-id=\"ka-shelf\" data-visual-relation=\"宽类提升辨识度，窄品要求每类最强单品；采购不靠销售介绍，凭竞对、平台数据、声量与内容判断\" data-visual-source=\"宽类窄品……辨识度就高……单品不够强根本不会让你上架……看竞对分析、亚马逊品类表现、品牌声量、内容规模\" data-visual-title=\"宽类窄品与KA采购判断\" data-visual-type=\"渠道逻辑示意图\">\n<div class=\"ka-row1\" data-grid=\"\">\n<div class=\"ka-def\">\n<b>宽类 · 辨识度</b>\n<div class=\"aisle\"><i class=\"hl\">厨具</i><i>数码</i><i>服饰</i><i>玩具</i></div>\n<span>走进沃尔玛想买厨具，最多问一个人就走到那一片——类别够宽，辨识度才高。</span>\n</div>\n<div class=\"ka-def\">\n<b>窄品 · 单品强度</b>\n<div class=\"skus\"><i class=\"on\">SKU ★ 最强</i><i>SKU</i><i>SKU</i></div>\n<span>每个品类里都要最强的单品——单品不够强，根本不会让你上架。</span>\n</div>\n</div>\n<div class=\"ka-q\">你是采购（沃尔玛、山姆这类 KA），明天一家 SKU 很少的企业——公司A——要来拜访。不靠销售现场介绍，销售发来的资料也不百分百信任，你会先看什么？</div>\n<div class=\"ka-grid\" data-grid=\"\">\n<div class=\"ka-sig\"><b>① 竞对分析</b><span>竞品卖什么、卖多少量——主要看这个</span></div>\n<div class=\"ka-sig\"><b>② 大平台品类表现</b><span>亚马逊等平台的品类数据</span></div>\n<div class=\"ka-sig\"><b>③ 品牌声量 · 销售记录</b><span>声量、销售规模</span></div>\n<div class=\"ka-sig\"><b>④ 内容规模 · 红人</b><span>出了多少内容、有没有红人带货</span></div>\n</div>\n<div class=\"ka-case\">推荐 10 个 SKU：A 品没声量、B 品有声量 → 放弃 A，只让 B 上架测 3 个月。</div>\n<figcaption class=\"figcap\">宽类带来选择路径，窄品决定能不能进——采购用公开数据替你投票。</figcaption>\n</figure>\n<p>眼下正处在「半年后报货要有爆品」、单品走向品类品牌的中间段。团队的困惑是「有了定位，怎么营销」——其实<strong>清晰定位本身就给出营销指向</strong>：线上去卖、内容往里铺、找红人，所有动作围绕聚焦点；<strong>动作是散的，就始终站不住</strong>。</p>\n</div>\n</section>\n<section id=\"p4\">\n<div class=\"part-head\"><span class=\"pt\">PART 4 · 案例拆解：把定位安到场景</span><i></i></div>\n<div class=\"mod\" id=\"s04b08\">\n<div class=\"mod-head\"><span class=\"idx\">08</span><h2>眼镜公司：三大业务落点</h2></div>\n<p>一个做眼镜的企业，三条业务各落一个特性——</p>\n<figure class=\"fig\" data-visual-id=\"glasses-case\" data-visual-relation=\"光学镜落宽轮廓大码特性，男太阳镜落电车场景，皮尔卡丹只做老花镜\" data-visual-source=\"做光学镜……买下了意大利皮尔卡丹……改了叫宽轮廓……主打电车的太阳镜……我只做老花镜\" data-visual-title=\"眼镜公司三大业务定位\" data-visual-type=\"业务结构定位图\">\n<div class=\"g-grid\" data-grid=\"\">\n<div class=\"g-card\">\n<div class=\"g-from\">自有品牌 · 光学镜（近视镜）</div>\n<div class=\"g-to\">宽轮廓光学镜<span>最初想叫「大码」，因不好听改名</span></div>\n<ul>\n<li>亚洲人脸型普遍偏大</li>\n<li>「大码女装」心智已被占领，可借势</li>\n<li>查过，没人叫「大码眼镜」</li>\n<li>暴龙有此细分但从不宣传</li>\n<li>无硬核技术壁垒，靠特性立住：「专注大码眼镜 20 年」（过去只说专注眼镜 20 年）</li>\n<li>以女款为主；男士大码款有，但占比少</li>\n</ul>\n</div>\n<div class=\"g-card\">\n<div class=\"g-from\">男太阳镜</div>\n<div class=\"g-to\">电车太阳镜<span>主打电车司机人群</span></div>\n<ul>\n<li>市场足够大；内部竞争有缺口、内部能实现</li>\n<li>电车保有率走高（开电车已占六七成，口述概数），电车车窗与油车不同</li>\n<li>司机中需要买太阳镜的不到 30%——30% 也足够大</li>\n<li>不聚焦户外工作人群：自己的价值段不匹配</li>\n</ul>\n</div>\n<div class=\"g-card\">\n<div class=\"g-from\">皮尔卡丹 · 中国眼镜代理（今年刚拿下）</div>\n<div class=\"g-to\">只做老花镜<span>从自身优势出发</span></div>\n<ul>\n<li>意大利品牌；70 / 80 后非常熟悉</li>\n<li>90 后大多不熟，00 后更不知道</li>\n<li>品牌认知与老花镜人群正好对上</li>\n</ul>\n</div>\n</div>\n<figcaption class=\"figcap\">不靠硬核技术壁垒，靠「特性＋人群」立住定位。</figcaption>\n</figure>\n<p class=\"note\">其他镜款照常配货，但每个业务只保一个最聚焦的主打。</p>\n</div>\n<div class=\"mod\" id=\"s04b09\">\n<div class=\"mod-head\"><span class=\"idx\">09</span><h2>纸巾：从一个场景长出业务线</h2></div>\n<p>植护是功能特性品牌。它的起点是一个具体场景——</p>\n<figure class=\"fig\" data-visual-id=\"tissue-flow\" data-visual-relation=\"从高铁换纸巾的场景洞察做长条纸巾首品即爆，经主题化运营，品类到头后延伸遇水即溶\" data-visual-source=\"一抽用完一包……爱马仕橙的那个长长的……做完之后就爆了……遇水即溶的那个厕所里用的纸巾\" data-visual-title=\"纸巾场景化演进路径\" data-visual-type=\"演进流程图\">\n<div class=\"tf\" data-grid=\"\">\n<div class=\"tf-card\"><span class=\"tf-n\">STEP 1 · 场景洞察</span><b>高铁上的小包纸巾</b><p>一抽就用完，乘务员不停换新包；网上有类似品，但长度不合用。</p></div>\n<div class=\"tf-card\"><span class=\"tf-n\">STEP 2 · 首品打爆</span><b>「爱马仕橙」长条纸巾</b><p>自己有天猫店，找供应商做出第一款——一上就爆。</p></div>\n<div class=\"tf-card\"><span class=\"tf-n\">STEP 3 · 主题化运营</span><b>跟着节点做主题</b><p>春节「平安是福」印上下联、挂床头；世界杯来了全部换成世界杯主题——持续卖得好。</p></div>\n<div class=\"tf-card\"><span class=\"tf-n\">STEP 4 · 天花板后延伸</span><b>遇水即溶卷纸</b><p>厕所里用、可直接丢马桶、不堵马桶；不是湿厕纸——纸遇水都会溶，差在快慢，就把快做成卖点。</p></div>\n</div>\n<figcaption class=\"figcap\">品类到头，就横向长出新业务。</figcaption>\n</figure>\n<p>别人的做法是按场景<strong>分品牌</strong>（如安踏收购迪桑特等）；植护是<strong>一个公司、多条独立业务线</strong>。共同点：把定位安到具体场景，专门去打。</p>\n</div>\n</section>\n<section id=\"p5\">\n<div class=\"part-head\"><span class=\"pt\">PART 5 · 便利任务与卖点设计</span><i></i></div>\n<div class=\"mod\" id=\"s04b10\">\n<div class=\"mod-head\"><span class=\"idx\">10</span><h2>洗衣液：拆到动作级找痛点</h2></div>\n<p>洗衣液已经卷到头：粉 → 洗衣液 → 凝珠，看似没有创新空间。方法是把任务<strong>拆到动作级</strong>，在 7 个环节里找痛点——</p>\n<figure class=\"fig\" data-visual-id=\"laundry-actions\" data-visual-relation=\"七步任务链中「提罐倒入」最痛：罐重、口沿大易倒多倒少；改进为放倒立住、按压均匀出液，全程不提起\" data-visual-source=\"打开洗衣机……拿开洗衣液往里倒……把这个弧度削平变成有4个小凸起……按一下流出来，流速非常均匀\" data-visual-title=\"洗衣液七步动作拆解与改进（交互）\" data-visual-type=\"交互动作拆解图\">\n<div class=\"la-steps\">\n<i>① 打开洗衣机</i><i>② 塞入衣服</i><i>③ 合上舱门</i><i>④ 打开洗涤剂盒</i><i class=\"pain\">⑤ 提罐倒入 · 痛点</i><i>⑥ 合上盒盖</i><i>⑦ 启动</i>\n</div>\n<div aria-label=\"瓶身状态切换\" class=\"tgl\" role=\"group\">\n<button aria-pressed=\"true\" class=\"la-btn on\" data-mode=\"old\">现有大罐</button>\n<button aria-pressed=\"false\" class=\"la-btn\" data-mode=\"new\">改进设计</button>\n</div>\n<svg aria-label=\"洗衣液瓶改进前后对比示意\" role=\"img\" viewbox=\"0 0 640 330\">\n<line class=\"s-line\" x1=\"26\" x2=\"614\" y1=\"280\" y2=\"280\"></line>\n<text class=\"s-mut\" x=\"26\" y=\"300\">台面</text>\n<g id=\"laOld\">\n<path class=\"s-bottle\" d=\"M310,279 L310,152 Q310,126 340,124 L400,124 Q430,126 430,152 L430,279 Z\"></path>\n<rect class=\"s-cap\" height=\"32\" rx=\"7\" width=\"56\" x=\"342\" y=\"92\"></rect>\n<line class=\"s-capline\" x1=\"342\" x2=\"398\" y1=\"103\" y2=\"103\"></line>\n<line class=\"s-capline\" x1=\"342\" x2=\"398\" y1=\"113\" y2=\"113\"></line>\n<line class=\"s-dash\" x1=\"370\" x2=\"370\" y1=\"84\" y2=\"42\"></line>\n<path class=\"s-warnf\" d=\"M370,34 l-7,12 h14 z\"></path>\n<text class=\"s-warn\" x=\"384\" y=\"50\">重</text>\n<text class=\"s-txt\" x=\"56\" y=\"196\">要提起来倒——罐重</text>\n<line class=\"s-thin\" x1=\"200\" x2=\"306\" y1=\"192\" y2=\"192\"></line>\n<text class=\"s-txt\" x=\"56\" y=\"104\">大口沿：易倒多、倒少</text>\n<line class=\"s-thin\" x1=\"216\" x2=\"338\" y1=\"100\" y2=\"104\"></line>\n<text class=\"s-txt\" x=\"470\" y=\"178\">瓶身圆弧</text>\n<text class=\"s-mut\" x=\"470\" y=\"196\">放倒会滚</text>\n<line class=\"s-thin\" x1=\"466\" x2=\"432\" y1=\"186\" y2=\"186\"></line>\n</g>\n<g id=\"laNew\" style=\"display:none\">\n<ellipse class=\"s-puddle\" cx=\"368\" cy=\"279\" rx=\"24\" ry=\"4.5\"></ellipse>\n<circle class=\"s-bump\" cx=\"238\" cy=\"274\" r=\"6\"></circle>\n<circle class=\"s-bump\" cx=\"292\" cy=\"274\" r=\"6\"></circle>\n<circle class=\"s-bump\" cx=\"346\" cy=\"274\" r=\"6\"></circle>\n<circle class=\"s-bump\" cx=\"396\" cy=\"274\" r=\"6\"></circle>\n<rect class=\"s-bottle2\" height=\"72\" rx=\"20\" width=\"230\" x=\"180\" y=\"200\"></rect>\n<rect class=\"s-cap\" height=\"48\" rx=\"7\" width=\"32\" x=\"150\" y=\"212\"></rect>\n<path class=\"s-handle\" d=\"M298,203 Q325,166 352,203\"></path>\n<rect class=\"s-slot\" height=\"16\" rx=\"5\" width=\"44\" x=\"350\" y=\"246\"></rect>\n<line class=\"s-drop\" x1=\"372\" x2=\"368\" y1=\"264\" y2=\"277\"></line>\n<text class=\"s-txt\" x=\"56\" y=\"236\">大口保留</text>\n<line class=\"s-thin\" x1=\"118\" x2=\"146\" y1=\"236\" y2=\"236\"></line>\n<text class=\"s-txt\" x=\"446\" y=\"236\">侧面开槽</text>\n<text class=\"s-mut\" x=\"446\" y=\"254\">按一下流出 · 流速均匀</text>\n<line class=\"s-thin\" x1=\"442\" x2=\"398\" y1=\"246\" y2=\"252\"></line>\n<text class=\"s-mut\" text-anchor=\"middle\" x=\"325\" y=\"152\">把手</text>\n<text class=\"s-txt\" text-anchor=\"end\" x=\"610\" y=\"306\">弧度削平＋4 个凸起——放倒就立住</text>\n<line class=\"s-thin\" x1=\"448\" x2=\"404\" y1=\"298\" y2=\"280\"></line>\n</g>\n</svg>\n<div class=\"la-after\"><strong>改进后动作：</strong>挪 → 放倒（凸起立住）→ 按压 → 倒出 → 松手——<strong>全程不用提起来</strong>；大口仍保留。</div>\n<figcaption class=\"figcap\">第⑤步是大罐用户的真实痛点：家用都买大罐，要提着往洗涤剂盒里倒，口沿大、易倒多倒少——从家庭主妇的视角看「重」，不能从男性视角判断「就一下下」。</figcaption>\n</figure>\n<p>打的就是任务上的<strong>便利</strong>。卖点既有硬核壁垒，也有这样的小心思。</p>\n</div>\n<div class=\"mod\" id=\"s04b11\">\n<div class=\"mod-head\"><span class=\"idx\">11</span><h2>好卖点：魅力属性与确定性</h2></div>\n<p>KANO 模型（讲师口中的「K模型」）里，「高铁上有水喝」是<strong>共性</strong>——人人都有，不加分；「你坐我这趟高铁，WiFi 绝对通畅」是<strong>魅力属性</strong>——好卖点要做后者。</p>\n<p>滴滴的例子：早期显示「车距你 10 分钟」，很多人等得焦虑、直接取消；加了<strong>实时位置</strong>之后焦虑消解——<strong>焦虑不来自 10 分钟，来自不确定性</strong>，与距离、时长无关，与确定性、感受有关。后来各家又加「上一单没结束就开始播报」（做得最好的不是滴滴）；高德的实时性更好，Uber 则一开始把贵的便宜的车全摆出来可选。</p>\n<figure class=\"fig\" data-visual-id=\"didi-certainty\" data-visual-relation=\"等车焦虑来自不确定性而非时长；显示实时位置后，车一点点靠近带来确定感\" data-visual-source=\"你的焦虑是来自于不确定性……地图上显示了这辆小汽车的实时位置……你就觉得确定性\" data-visual-title=\"等待焦虑与确定性（交互）\" data-visual-type=\"交互对比示意\" id=\"ddFig\">\n<div aria-label=\"滴滴界面状态切换\" class=\"tgl\" role=\"group\">\n<button aria-pressed=\"true\" class=\"dd-btn on\" data-mode=\"eta\">只显示「预计 10 分钟」</button>\n<button aria-pressed=\"false\" class=\"dd-btn\" data-mode=\"live\">显示实时位置</button>\n</div>\n<svg aria-label=\"等车确定性对比示意\" role=\"img\" viewbox=\"0 0 560 150\">\n<g id=\"ddMode1\">\n<text class=\"s-big\" x=\"150\" y=\"46\">预计 10 分钟</text>\n<text class=\"s-mut\" x=\"150\" y=\"70\">只能干等——很多人直接取消</text>\n</g>\n<g id=\"ddMode2\" style=\"display:none\">\n<text class=\"s-big acc-t\" x=\"150\" y=\"46\">车正在一点点靠近</text>\n<text class=\"s-mut\" x=\"150\" y=\"70\">确定感建立——焦虑消解</text>\n</g>\n<rect class=\"s-road\" height=\"18\" rx=\"9\" width=\"500\" x=\"30\" y=\"92\"></rect>\n<line class=\"s-roadline\" x1=\"44\" x2=\"516\" y1=\"101\" y2=\"101\"></line>\n<path class=\"s-pin\" d=\"M492,56 c-10,0 -16,8 -16,15 c0,10 16,23 16,23 c0,0 16,-13 16,-23 c0,-7 -6,-15 -16,-15 z\"></path>\n<circle class=\"s-pinc\" cx=\"492\" cy=\"71\" r=\"5.5\"></circle>\n<text class=\"s-mut\" text-anchor=\"middle\" x=\"492\" y=\"132\">上车点</text>\n<g id=\"ddCar\">\n<path class=\"s-car\" d=\"M60,72 Q64,58 78,58 L96,58 Q104,58 108,66 L112,72 Z\"></path>\n<rect class=\"s-car\" height=\"20\" rx=\"9\" width=\"76\" x=\"42\" y=\"72\"></rect>\n<circle class=\"s-wheel\" cx=\"60\" cy=\"94\" r=\"7\"></circle>\n<circle class=\"s-wheel\" cx=\"102\" cy=\"94\" r=\"7\"></circle>\n</g>\n</svg>\n<figcaption class=\"figcap\">切换到「实时位置」，小车会一路向前——确定感是设计出来的。</figcaption>\n</figure>\n<div class=\"insight\"><span class=\"il\">洞察</span>回到自身产品：切换本地播放等操作偏繁琐，「快速开关」就是便利任务的一个维度，对讲天线也是。<strong>每个任务区间都有空间</strong>——先想清楚定位落在哪个区间，再在「实现任务的便利性」上找机会。</div>\n</div>\n</section>\n</div>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#f4f6f8\" height=\"512\" width=\"512\"></rect><rect fill=\"#c9d3dc\" height=\"56\" rx=\"6\" width=\"72\" x=\"64\" y=\"392\"></rect><rect fill=\"#0f766e\" height=\"112\" rx=\"6\" width=\"72\" x=\"140\" y=\"336\"></rect><rect fill=\"#c9d3dc\" height=\"168\" rx=\"6\" width=\"72\" x=\"216\" y=\"280\"></rect><rect fill=\"#c9d3dc\" height=\"224\" rx=\"6\" width=\"72\" x=\"292\" y=\"224\"></rect><rect fill=\"#c9d3dc\" height=\"280\" rx=\"6\" width=\"72\" x=\"368\" y=\"168\"></rect><circle cx=\"404\" cy=\"126\" fill=\"#0f766e\" r=\"16\"></circle><circle cx=\"404\" cy=\"126\" fill=\"#f4f6f8\" r=\"6\"></circle></svg></template>\n<script>\n(function(){\n  /* 定位阶梯 */\n  var LV=[\n    {name:\"成分 / 材质\",pos:\"第 1 层\",focus:\"聚焦选项：某种材质\",ft:\"opt\",\n     desc:\"最基础的区隔元素：厨具讲 316 不锈钢，化妆品讲烟酰胺、洋甘菊，保健品讲 DHA、欧米伽3、叶酸——用一个成分区隔出与别人的不同；猎鸟（乳鸽）肉源也在这层。\",\n     flag:\"最好进入、最好区隔，但难形成壁垒——除非材质本身特殊。\",ff:\"warn\"},\n    {name:\"功能 / 场景\",pos:\"第 2 层\",focus:\"本阶段聚焦落点\",ft:\"focus\",\n     desc:\"功能与场景相互匹配：客户在具体场景里，用产品完成某个任务。\",\n     flag:\"本次讨论的聚焦点：某项技术＋功能场景。\",ff:\"gain\"},\n    {name:\"任务 / 目的\",pos:\"第 3 层\",focus:\"聚焦选项：主打品类＋关键痛点任务\",ft:\"opt\",\n     desc:\"客户要完成的任务及其目的。打到这一层，基本已经是品类之争——主打品类里挑可实现的关键痛点任务。\",\n     flag:\"\",ff:\"\"},\n    {name:\"情绪\",pos:\"第 4 层\",focus:\"聚焦选项：情绪价值\",ft:\"opt\",\n     desc:\"任务之上是情绪——用户想通过这个产品获得什么感受。\",\n     flag:\"下层没解决，只谈情绪是不够的——会塌房。\",ff:\"warn\"},\n    {name:\"追求 / 价值观\",pos:\"第 5 层\",focus:\"聚焦选项：价值观品牌\",ft:\"opt\",\n     desc:\"对生活的追求、一种精神——Just do it、think different 属于这一层。\",\n     flag:\"现阶段「还不配谈这个话」——先从下面打上去。\",ff:\"warn\"}\n  ];\n  var lsteps=[].slice.call(document.querySelectorAll('.lstep'));\n  var lvBox=document.getElementById('lvBox');\n  function lvRender(i){\n    var L=LV[i],h='<div class=\"t\"><b>'+L.name+'</b><span class=\"pos\">'+L.pos+'</span><span class=\"fz '+L.ft+'\">'+L.focus+'</span></div><p>'+L.desc+'</p>';\n    if(L.flag)h+='<div class=\"flag '+L.ff+'\">'+L.flag+'</div>';\n    lvBox.innerHTML=h;\n    lsteps.forEach(function(s,j){var on=(j===i);s.classList.toggle('sel',on);s.setAttribute('aria-pressed',on?'true':'false');});\n  }\n  lsteps.forEach(function(s,i){s.addEventListener('click',function(){lvRender(i);});});\n  lvRender(1);\n\n  /* 洗衣液切换 */\n  var laBtns=[].slice.call(document.querySelectorAll('.la-btn'));\n  var laOld=document.getElementById('laOld'),laNew=document.getElementById('laNew');\n  laBtns.forEach(function(b){b.addEventListener('click',function(){\n    var m=b.getAttribute('data-mode');\n    laBtns.forEach(function(x){var on=(x===b);x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});\n    laOld.style.display=(m==='old')?'':'none';\n    laNew.style.display=(m==='new')?'':'none';\n  });});\n\n  /* 滴滴切换 */\n  var ddBtns=[].slice.call(document.querySelectorAll('.dd-btn'));\n  var ddFig=document.getElementById('ddFig');\n  var ddM1=document.getElementById('ddMode1'),ddM2=document.getElementById('ddMode2');\n  ddBtns.forEach(function(b){b.addEventListener('click',function(){\n    var m=b.getAttribute('data-mode');\n    ddBtns.forEach(function(x){var on=(x===b);x.classList.toggle('on',on);x.setAttribute('aria-pressed',on?'true':'false');});\n    ddFig.classList.toggle('live',m==='live');\n    ddM1.style.display=(m==='live')?'none':'';\n    ddM2.style.display=(m==='live')?'':'none';\n  });});\n\n  /* 滚动浮现 */\n  var mods=[].slice.call(document.querySelectorAll('.mod'));\n  if('IntersectionObserver' in window){\n    var io=new IntersectionObserver(function(es){\n      es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});\n    },{threshold:0.05});\n    mods.forEach(function(m){io.observe(m);});\n  }else{\n    mods.forEach(function(m){m.classList.add('in');});\n  }\n})();\n<\/script>\n","blocks":[{"id":"s04b01","type":"mod","heading":"定位五层阶梯","text":"01\n定位五层阶梯\n任何商品都能在最基础的元素上做区隔——用一个成分说出「我和别人有什么不同」，这就是\n成分即品类\n。点击每一层，看该层的聚焦选项与边界。\n成分 / 材质\n本阶段\n功能 / 场景\n任务 / 目的\n情绪\n追求 / 价值观\n功能 / 场景\n第 2 层\n本阶段聚焦落点\n功能与场景相互匹配：客户在具体场景里，用产品完成某个任务。\n本次讨论的聚焦点：某项技术＋功能场景。\n除按层聚焦外，还可聚焦\n某类人群\n——滑雪是一个场景，高端运动是一类人群。\n每一层的区隔难度与壁垒强度不同：越往上越依赖下层先立住。\n洞察\n定位不是定死、非黑即白：基本盘之上，主动做\n尝试性聚焦\n，这本身就是战略思维。成长型企业一般\n从下往上打\n——先聚焦场景与核心技术，再一层层向上。"},{"id":"s04b02","type":"mod","heading":"焦糖布丁：一层层追问","text":"02\n焦糖布丁：一层层追问\n功能与场景这一层，很大程度上就是\n焦糖布丁理论\n（Jobs to be Done）：客户买的不是产品。沿用途一路追问：\n起点\n「客户买的不是一个橙子」\n买来做什么？\n打一个洞\n打洞为什么？\n挂一幅画、装修房间\n挂画为什么？\n软装装饰、家居环境\n装饰不行吗？\n为了情绪\n情绪背后是？\n对生活的追求\n每追问一层，就上到阶梯的上一层。\n定位到哪个层次、哪个环节，决定你在哪一层竞争。"},{"id":"s04b03","type":"mod","heading":"从订单导向到聚焦路径","text":"03\n从订单导向到聚焦路径\n当前销售成果主要来自\n核心区域的核心客户\n：一个区域内需求相对一致，放到更大区域就不太一样——\n现状 · 偏订单导向\n成果集中在核心区域的核心客户\n一个区域内需求相对一致\n放大到更大区域，需求就不一致\n→\n尝试性聚焦\n聚焦路径\n聚焦一项强技术（如降噪技术）\n需求走向一致\n细分领域建立自己的优势\n品牌力有差距，细分能立住\n拼品牌力与大牌有差距，但把一个领域细分出来，就可能建立自己的优势。"},{"id":"s04b04","type":"mod","heading":"单品突破的两个标杆","text":"04\n单品突破的两个标杆\n宠物食品货架的常规切法是按品类；标杆企业换了一个切法——\n常规货架 · 按品类切\n猫主粮\n狗主粮\n零食\n用品\n标杆的两个聚焦落点\n聚焦肉源（成分层）\n只做猎鸟（乳鸽）类肉源，用一种成分区隔整个品牌——从下往上打是对的。\n聚焦单品设备\n猫用自动饮水＋自动喂食，就一两个品；外贸＋跨境电商（to B2C），年规模约四五亿（口述概数）。\n设备企业规模不大，但单品足够深——「我们认为有，所以才做下去」。\n「一定是单品突破」「我们认为有，所以才做下去。」\n单品突破之后，可以越级到更高一层——讨论中的两个问题一并被解决。"},{"id":"s04b05","type":"mod","heading":"壁垒与节奏：先做深再延伸","text":"05\n壁垒与节奏：先做深再延伸\n两条路径同步想：一是\n技术壁垒\n——自研投入成本高；二是\n爆品路径\n——有了一个爆品，就复用它的逻辑继续做深。\n单品打爆\n→\n复用爆品逻辑 · 做深迭代\n→\n触达用户 · 情绪价值\n→\n到品类天花板\n→\n横向延伸\n✓ 够跑完\n品类容量虽不大，但够一个新品牌跑完（有第三方佐证）；增长第二步再考虑横向切。\n✕ 切太细跑不完\n为风帆运动单独开发一款耳机不现实——体量太小，最后还是会回到「游泳」这个大场景。\n过程中的诱惑是横向延伸——收敛：做到品类天花板再延伸，这是战略定力。"},{"id":"s04b06","type":"mod","heading":"品牌演进：1 → 10 → 100","text":"06\n品牌演进：1 → 10 → 100\n品牌最早期就是商标，后来是「看上去像个牌子」。蕉下的路径是\n单品卖爆、单品代表品牌\n，再一路向上延伸——\n商标\n品牌最早期就是商标。\n像个牌子\n慢慢做出品牌的样子。\n单品代表品牌\n1\n蕉下横空出世：单品卖爆，单品代表品牌。\n品类品牌\n10\n把单品延伸成一个品类。\n人群 / 生活方式品牌\n100\n蕉下围绕「户外生活」；袋鼠妈妈按人群重组天猫目录，给客户一条选择路径。\n洗沐 · 面护 · 彩妆\n→\n孕产\n婴童\n小童（分年龄段）\n青少年\n价值观品牌\n把一种精神做成品牌：Just do it、think different。\n量级 1→10→100 为讲师的讲法示意；一般品牌都会经历这个历程。"},{"id":"s04b07","type":"mod","heading":"宽类窄品：KA 凭什么让你上架","text":"07\n宽类窄品：KA 凭什么让你上架\n进 KA 渠道（国外、国内逻辑一样），判断权在采购手里。现在的年轻采购\n不靠关系、服务、维护\n——上网就搜数据。\n宽类 · 辨识度\n厨具\n数码\n服饰\n玩具\n走进沃尔玛想买厨具，最多问一个人就走到那一片——类别够宽，辨识度才高。\n窄品 · 单品强度\nSKU ★ 最强\nSKU\nSKU\n每个品类里都要最强的单品——单品不够强，根本不会让你上架。\n你是采购（沃尔玛、山姆这类 KA），明天一家 SKU 很少的企业——公司A——要来拜访。不靠销售现场介绍，销售发来的资料也不百分百信任，你会先看什么？\n① 竞对分析\n竞品卖什么、卖多少量——主要看这个\n② 大平台品类表现\n亚马逊等平台的品类数据\n③ 品牌声量 · 销售记录\n声量、销售规模\n④ 内容规模 · 红人\n出了多少内容、有没有红人带货\n推荐 10 个 SKU：A 品没声量、B 品有声量 → 放弃 A，只让 B 上架测 3 个月。\n宽类带来选择路径，窄品决定能不能进——采购用公开数据替你投票。\n眼下正处在「半年后报货要有爆品」、单品走向品类品牌的中间段。团队的困惑是「有了定位，怎么营销」——其实\n清晰定位本身就给出营销指向\n：线上去卖、内容往里铺、找红人，所有动作围绕聚焦点；\n动作是散的，就始终站不住\n。"},{"id":"s04b08","type":"mod","heading":"眼镜公司：三大业务落点","text":"08\n眼镜公司：三大业务落点\n一个做眼镜的企业，三条业务各落一个特性——\n自有品牌 · 光学镜（近视镜）\n宽轮廓光学镜\n最初想叫「大码」，因不好听改名\n亚洲人脸型普遍偏大\n「大码女装」心智已被占领，可借势\n查过，没人叫「大码眼镜」\n暴龙有此细分但从不宣传\n无硬核技术壁垒，靠特性立住：「专注大码眼镜 20 年」（过去只说专注眼镜 20 年）\n以女款为主；男士大码款有，但占比少\n男太阳镜\n电车太阳镜\n主打电车司机人群\n市场足够大；内部竞争有缺口、内部能实现\n电车保有率走高（开电车已占六七成，口述概数），电车车窗与油车不同\n司机中需要买太阳镜的不到 30%——30% 也足够大\n不聚焦户外工作人群：自己的价值段不匹配\n皮尔卡丹 · 中国眼镜代理（今年刚拿下）\n只做老花镜\n从自身优势出发\n意大利品牌；70 / 80 后非常熟悉\n90 后大多不熟，00 后更不知道\n品牌认知与老花镜人群正好对上\n不靠硬核技术壁垒，靠「特性＋人群」立住定位。\n其他镜款照常配货，但每个业务只保一个最聚焦的主打。"},{"id":"s04b09","type":"mod","heading":"纸巾：从一个场景长出业务线","text":"09\n纸巾：从一个场景长出业务线\n植护是功能特性品牌。它的起点是一个具体场景——\nSTEP 1 · 场景洞察\n高铁上的小包纸巾\n一抽就用完，乘务员不停换新包；网上有类似品，但长度不合用。\nSTEP 2 · 首品打爆\n「爱马仕橙」长条纸巾\n自己有天猫店，找供应商做出第一款——一上就爆。\nSTEP 3 · 主题化运营\n跟着节点做主题\n春节「平安是福」印上下联、挂床头；世界杯来了全部换成世界杯主题——持续卖得好。\nSTEP 4 · 天花板后延伸\n遇水即溶卷纸\n厕所里用、可直接丢马桶、不堵马桶；不是湿厕纸——纸遇水都会溶，差在快慢，就把快做成卖点。\n品类到头，就横向长出新业务。\n别人的做法是按场景\n分品牌\n（如安踏收购迪桑特等）；植护是\n一个公司、多条独立业务线\n。共同点：把定位安到具体场景，专门去打。"},{"id":"s04b10","type":"mod","heading":"洗衣液：拆到动作级找痛点","text":"10\n洗衣液：拆到动作级找痛点\n洗衣液已经卷到头：粉 → 洗衣液 → 凝珠，看似没有创新空间。方法是把任务\n拆到动作级\n，在 7 个环节里找痛点——\n① 打开洗衣机\n② 塞入衣服\n③ 合上舱门\n④ 打开洗涤剂盒\n⑤ 提罐倒入 · 痛点\n⑥ 合上盒盖\n⑦ 启动\n现有大罐\n改进设计\n台面\n重\n要提起来倒——罐重\n大口沿：易倒多、倒少\n瓶身圆弧\n放倒会滚\n大口保留\n侧面开槽\n按一下流出 · 流速均匀\n把手\n弧度削平＋4 个凸起——放倒就立住\n改进后动作：\n挪 → 放倒（凸起立住）→ 按压 → 倒出 → 松手——\n全程不用提起来\n；大口仍保留。\n第⑤步是大罐用户的真实痛点：家用都买大罐，要提着往洗涤剂盒里倒，口沿大、易倒多倒少——从家庭主妇的视角看「重」，不能从男性视角判断「就一下下」。\n打的就是任务上的\n便利\n。卖点既有硬核壁垒，也有这样的小心思。"},{"id":"s04b11","type":"mod","heading":"好卖点：魅力属性与确定性","text":"11\n好卖点：魅力属性与确定性\nKANO 模型（讲师口中的「K模型」）里，「高铁上有水喝」是\n共性\n——人人都有，不加分；「你坐我这趟高铁，WiFi 绝对通畅」是\n魅力属性\n——好卖点要做后者。\n滴滴的例子：早期显示「车距你 10 分钟」，很多人等得焦虑、直接取消；加了\n实时位置\n之后焦虑消解——\n焦虑不来自 10 分钟，来自不确定性\n，与距离、时长无关，与确定性、感受有关。后来各家又加「上一单没结束就开始播报」（做得最好的不是滴滴）；高德的实时性更好，Uber 则一开始把贵的便宜的车全摆出来可选。\n只显示「预计 10 分钟」\n显示实时位置\n预计 10 分钟\n只能干等——很多人直接取消\n车正在一点点靠近\n确定感建立——焦虑消解\n上车点\n切换到「实时位置」，小车会一路向前——确定感是设计出来的。\n洞察\n回到自身产品：切换本地播放等操作偏繁琐，「快速开关」就是便利任务的一个维度，对讲天线也是。\n每个任务区间都有空间\n——先想清楚定位落在哪个区间，再在「实现任务的便利性」上找机会。"}]},{"num":5,"id":"s05","title":"向外求收官，向内解码增长","date":"2026年11月10日","css":"#sv{\n  --page-bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F8;\n  --text:#1C2333; --muted:#5A6478;\n  --accent:#2B4ACB; --accent-soft:#E4EAFB;\n  --secondary:#0E7A6F; --secondary-soft:#DFEFEA;\n  --risk:#B42318 ntainer\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}","body":"\n<div class=\"wrap\">\n<header class=\"hero\">\n<span class=\"kicker\">战略共创会 · 第二天 · 纪要</span>\n<h1>向外求收官，向内解码增长</h1>\n<p class=\"lede\">上午完善并共识昨天的方向结论，<b>中午前后\"向外求\"截止</b>；之后进入第二个环节——<b>解码业务，解码增长的驱动力</b>，把已收敛的方向再下沉一步、再落一步。</p>\n</header>\n<section class=\"part\" id=\"s05b01\">\n<div class=\"part-head\"><span class=\"part-no\">PART 1</span><span class=\"part-title\">会程与讨论方式</span></div>\n<div class=\"mod\" id=\"s05b02\">\n<h2>今天的推进线</h2>\n<p class=\"lead\">昨天完成\"向外求\"的发散与收敛，今天落锤共识，随后转向向内解码。</p>\n<figure class=\"fig\" data-visual-id=\"workshop-day-plan\" data-visual-relation=\"昨日三看发散收敛输出方向，今晨迭代共识，向外求止于今日中午，随后解码业务\" data-visual-source=\"昨天…发散…收敛…向外求…截止到今天中午或下午的上半场…解码业务，解码增长的驱动力\" data-visual-title=\"共创会从发散到解码的推进线\" data-visual-type=\"时间线\">\n<ol class=\"tl\">\n<li><span class=\"tt\">昨日 · 写作业与发散</span>基于\"三看\"收集信息、形成观点，完成作业——这个过程是发散。</li>\n<li><span class=\"tt\">昨日 · 收敛输出</span>最终收敛出 1—5 号方向，各组在结束前输出结果。</li>\n<li><span class=\"tt\">今晨 · 迭代一轮</span>睡一觉大脑重启，会有新想法；组长带组再归纳一轮（初步排 20 分钟），发言人直接讲结论。</li>\n<li><span class=\"tt\">上午 · 完善与分工</span>继续完善方向内容：渠道销售已基本改完；品牌营销整合中，稍后与成员B、成员C对一遍；产品品类改了一轮，待组内复核。</li>\n<li><span class=\"tt\">中午前后</span><b>\"向外求\"截止</b>——今天中午或下午的上半场。</li>\n<li class=\"next\"><span class=\"tt\">之后 · 解码业务</span><b>解码增长的驱动力</b>：把 1—5 号方向再往下沉一步、再落一步。</li>\n</ol>\n<figcaption>时间点为现场口述安排。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s05b03\">\n<h2>螺旋上升，不必完美</h2>\n<p class=\"lead\">战略讨论不是瀑布，而是<b>螺旋上升</b>；原点问题允许慢慢变准。</p>\n<figure class=\"fig\" data-visual-id=\"origin-spiral-vs-waterfall\" data-visual-relation=\"瀑布式走完一步回不去，战略讨论螺旋上升，可回到原点问题并更新\" data-visual-source=\"战略的讨论不是一个瀑布…水不可能再流上去…是一个螺旋上升的过程，原点问题也会更新\" data-visual-title=\"战略讨论：螺旋上升而非瀑布\" data-visual-type=\"对比示意图\">\n<div class=\"svgbox\">\n<svg aria-label=\"左：瀑布式步步下行不可逆；右：螺旋式可回访原点问题\" role=\"img\" viewbox=\"0 0 640 250\">\n<g>\n<rect fill=\"var(--accent-soft)\" height=\"12\" rx=\"6\" stroke=\"var(--accent)\" width=\"176\" x=\"40\" y=\"60\"></rect>\n<rect fill=\"var(--accent-soft)\" height=\"12\" rx=\"6\" stroke=\"var(--accent)\" width=\"160\" x=\"58\" y=\"122\"></rect>\n<rect fill=\"var(--accent-soft)\" height=\"12\" rx=\"6\" stroke=\"var(--accent)\" width=\"144\" x=\"76\" y=\"184\"></rect>\n<path d=\"M128 76 V 112 M138 138 V 174 M148 200 V 222\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"3\"></path>\n<path d=\"M128 120 l-6 -10 h12 Z M138 182 l-6 -10 h12 Z M148 230 l-6 -10 h12 Z\" fill=\"var(--accent)\"></path>\n<ellipse cx=\"148\" cy=\"236\" fill=\"var(--accent-soft)\" rx=\"30\" ry=\"6\" stroke=\"var(--accent)\"></ellipse>\n<path d=\"M16 214 V 88\" fill=\"none\" stroke=\"var(--risk)\" stroke-dasharray=\"4 6\" stroke-width=\"2.2\"></path>\n<path d=\"M16 80 l-6 10 h12 Z\" fill=\"var(--risk)\"></path>\n<path d=\"M7 66 l18 16 M25 66 l-18 16\" stroke=\"var(--risk)\" stroke-linecap=\"round\" stroke-width=\"2.6\"></path>\n</g>\n<g fill=\"none\" stroke=\"var(--secondary)\" stroke-width=\"2.6\">\n<ellipse cx=\"472\" cy=\"196\" rx=\"80\" ry=\"20\"></ellipse>\n<ellipse cx=\"472\" cy=\"150\" rx=\"66\" ry=\"17\"></ellipse>\n<ellipse cx=\"472\" cy=\"106\" rx=\"52\" ry=\"14\"></ellipse>\n<path d=\"M472 188 V 86\" stroke-dasharray=\"3 6\" stroke-width=\"2\"></path>\n</g>\n<path d=\"M466 74 h12 l-6 -12 Z\" fill=\"var(--secondary)\"></path>\n<circle cx=\"472\" cy=\"58\" fill=\"var(--secondary)\" r=\"9\"></circle>\n<path d=\"M462 56 C 396 42 366 94 402 142\" fill=\"none\" stroke=\"var(--secondary)\" stroke-dasharray=\"5 6\" stroke-width=\"2.2\"></path>\n<path d=\"M409 152 l-13 -3 l8 -10 Z\" fill=\"var(--secondary)\"></path>\n</svg>\n</div>\n<div class=\"spiral-cap\" data-grid=\"\">\n<div class=\"scap\"><b><span class=\"x\">✕</span> 瀑布式</b>像水从高处流下——走完这一步，就回不去了。</div>\n<div class=\"scap\"><b><span class=\"ok\">↻</span> 螺旋式</b>可以回到原点问题再讨论；原点也会更新，越聊越笃定。</div>\n</div>\n</figure>\n<ul class=\"pts\">\n<li><b>原点问题</b>＝聚焦哪类客户的哪类价值；定了，后面所有动作更一致、更高效。</li>\n<li>但它不是一个晚上想得出来的——需要规划，也需要涌现；<b>成长型企业不必过度执着</b>。</li>\n<li>现场标尺：<b>不必完美，但要共识</b>——阶段性共识即可。</li>\n<li>哪怕到 2027 年底才更笃定\"聚焦什么\"，也非常值得。</li>\n</ul>\n</div>\n<div class=\"mod\" id=\"s05b04\">\n<h2>领导力：因人成事</h2>\n<p class=\"lead\">领导力不是个人多能打，而是<b>靠团队打胜仗，并让组织变强</b>。</p>\n<figure class=\"fig\" data-visual-id=\"leadership-four-characters\" data-visual-relation=\"领导力因团队打胜仗而非个人能力，并让组织能力得到提高\" data-visual-source=\"领导力…四个字叫因人成事…因为团队所以打胜仗…还有后半句叫做组织向前…组织的能力能够得到提高\" data-visual-title=\"领导力：因人成事、组织向前\" data-visual-type=\"结构图\">\n<div class=\"nopes\">\n<div class=\"nope\">领导力＝打胜仗——不靠领导力也能打胜仗，不成立。</div>\n<div class=\"nope\">领导力＝领航、凝聚人心——在靠近，但没点透。</div>\n</div>\n<div class=\"def\" data-grid=\"\">\n<div class=\"defcard\"><span class=\"dz\">前半句</span><b>因人成事</b><span>因为团队，所以打胜仗。个人能力强，那叫专业强、业务强、技术强。</span></div>\n<div class=\"defcard\"><span class=\"dz\">后半句</span><b>组织向前</b><span>让组织的能力得到提高——这是带团队的人真正的产出。</span></div>\n</div>\n<div class=\"exstrip\">组织能力示例（不是某个人的能力）：<b>用户洞察 7 问</b> · <b>战略大单品七步法</b>——7 个问题答完，用户洞察才算完成（指用户洞察 7 问；战略大单品七步法为另一套方法）。</div>\n</figure>\n<div class=\"note\">现场落点：组长、副组长、书记发挥领导力，带组归纳，<b>不让任何一个人单打独斗</b>。昨天没有大面积游离，个别小游离正常、也能很快回来；今天保持。</div>\n<div class=\"note\">一个人最重要的能力是<b>活在当下</b>：紧急事务快速处理完就回到战略——紧急级与战略级（三年、一年的业务），心里要有把尺。</div>\n</div>\n</section>\n<section class=\"part\" id=\"s05b05\">\n<div class=\"part-head\"><span class=\"part-no\">PART 2</span><span class=\"part-title\">方法论：向外求</span></div>\n<div class=\"mod\" id=\"s05b06\">\n<h2>持续洞察，无止境</h2>\n<p class=\"lead\"><b>洞察的深度决定战略的高度。</b>洞察不完全依赖共创会现场——会前就在持续\"写作业\"，一轮、两轮。</p>\n<figure class=\"fig\" data-visual-id=\"insight-cycle-flow\" data-visual-relation=\"月度季度洞察循环迭代，年底素材与预判支撑共创会定战略\" data-visual-source=\"月度季度持续的洞察积累到年底…参与定战略的人素材就足够多了，判断平时就已经做过\" data-visual-title=\"持续洞察到定战略的积累流程\" data-visual-type=\"流程图\">\n<div class=\"flow\">\n<div class=\"fstep\"><span class=\"fk\">日常</span><b>月度 · 季度持续洞察</b><span>会前持续\"写作业\"，一轮两轮不间断</span></div>\n<div class=\"farrow\"><span>→</span></div>\n<div class=\"fstep\"><span class=\"fk\">积累</span><b>到年底素材足够</b><span>不少判断平时就已经做过了</span></div>\n<div class=\"farrow\"><span>→</span></div>\n<div class=\"fstep\"><span class=\"fk\">落地</span><b>定战略更高效</b><span>参与共创的人不靠现场从零想</span></div>\n</div>\n<div class=\"loopback\">洞察无止境：每次进步一点点，不断迭代更新——这就是最好的洞察状态。</div>\n</figure>\n</div>\n<div class=\"mod\" id=\"s05b07\">\n<h2>站在月球看地球</h2>\n<p class=\"lead\">微信开机页那张图十多年没换过——不是缺平面设计师，是<b>张小龙钦定的产品理念</b>。</p>\n<figure class=\"fig\" data-visual-id=\"wechat-moon-metaphor\" data-visual-relation=\"小人站在月球看地球，对应跳出产品看产品、站在用户角度看产品\" data-visual-source=\"人在月球…在看他的家乡…凝望这个世界…站在用户的角度看产品\" data-visual-title=\"微信开机页隐喻：月球上的人凝望地球\" data-visual-type=\"比喻图\">\n<div class=\"moon-scene\">\n<svg aria-label=\"示意：小人站在月球表面，凝望远处的地球\" role=\"img\" viewbox=\"0 0 640 280\">\n<rect fill=\"var(--scene-bg)\" height=\"280\" width=\"640\"></rect>\n<g fill=\"var(--scene-star)\">\n<circle cx=\"70\" cy=\"42\" r=\"1.8\"></circle><circle cx=\"150\" cy=\"26\" r=\"1.4\"></circle><circle cx=\"260\" cy=\"52\" r=\"1.6\"></circle>\n<circle cx=\"330\" cy=\"24\" r=\"1.3\"></circle><circle cx=\"560\" cy=\"40\" r=\"1.7\"></circle><circle cx=\"600\" cy=\"126\" r=\"1.4\"></circle>\n<circle cx=\"90\" cy=\"120\" r=\"1.3\"></circle><circle cx=\"380\" cy=\"150\" r=\"1.4\"></circle><circle cx=\"500\" cy=\"204\" r=\"1.3\"></circle>\n</g>\n<circle cx=\"472\" cy=\"88\" fill=\"var(--scene-earth)\" r=\"54\"></circle>\n<path d=\"M438 66 q20 -14 38 -2 q16 12 -2 24 q-22 10 -38 -2 q-10 -10 2 -20Z\" fill=\"var(--scene-land)\" opacity=\".85\"></path>\n<path d=\"M482 112 q18 -6 28 2 q8 9 -8 13 q-18 3 -23 -5 q-3 -6 3 -10Z\" fill=\"var(--scene-land)\" opacity=\".7\"></path>\n<text fill=\"var(--lab-on-dark)\" font-size=\"15\" text-anchor=\"middle\" x=\"472\" y=\"20\">地球</text>\n<circle cx=\"140\" cy=\"470\" fill=\"var(--scene-moon)\" r=\"335\"></circle>\n<circle cx=\"236\" cy=\"182\" fill=\"var(--scene-crater)\" r=\"8\"></circle>\n<circle cx=\"118\" cy=\"170\" fill=\"var(--scene-crater)\" r=\"5.5\"></circle>\n<circle cx=\"322\" cy=\"224\" fill=\"var(--scene-crater)\" r=\"5\"></circle>\n<text fill=\"var(--lab-on-moon)\" font-size=\"15\" x=\"84\" y=\"224\">月球</text>\n<circle cx=\"208\" cy=\"112\" fill=\"var(--scene-fig)\" r=\"8.5\"></circle>\n<path d=\"M208 122 v20 M208 128 l-10 8 M208 128 l10 8 M208 142 l-8 13 M208 142 l8 13\" fill=\"none\" stroke=\"var(--scene-fig)\" stroke-linecap=\"round\" stroke-width=\"4.5\"></path>\n<path d=\"M226 106 Q 330 82 408 86\" fill=\"none\" stroke=\"var(--scene-gaze)\" stroke-dasharray=\"6 7\" stroke-width=\"2.4\"></path>\n<path d=\"M416 87 l-12 -5 l0 10 Z\" fill=\"var(--scene-gaze)\"></path>\n</svg>\n</div>\n<div class=\"map\">\n<div class=\"map-row\" data-grid=\"\"><span class=\"m-from\">小人站在月球上</span><span class=\"m-arrow\">→</span><span class=\"m-to\">跳出自我，站到外部看</span></div>\n<div class=\"map-row\" data-grid=\"\"><span class=\"m-from\">凝望地球（家乡）</span><span class=\"m-arrow\">→</span><span class=\"m-to\">站在用户的角度看产品</span></div>\n<div class=\"map-row\" data-grid=\"\"><span class=\"m-from\">2011 年至今未换图</span><span class=\"m-arrow\">→</span><span class=\"m-to\">理念立住后，长期不动摇</span></div>\n</div>\n<figcaption>微信开机页十余年不变，承载的是\"站在外部看内部\"；跳出\"我\"来看待\"我\"，并不容易。</figcaption>\n</figure>\n</div>\n<div class=\"mod\" id=\"s05b08\">\n<h2>由外而内，三看落动作</h2>\n<p class=\"lead\">先由外而内思考与设计，再由内而外行动与改变——<b>两步缺一不可</b>。</p>\n<figure class=\"fig\" data-visual-id=\"three-looks-matrix\" data-visual-relation=\"先由外而内思考设计再由内而外行动；看趋势做品类、看客户做爆品、看竞争调渠道\" data-visual-source=\"先outside in再inside out…看外部趋势做品类规划，看客户需求做爆品策划，看竞争对手调整自身的渠道打法\" data-visual-title=\"由外而内两步与三看对照矩阵\" data-visual-type=\"对照矩阵\">\n<div class=\"steps2\" data-grid=\"\">\n<div class=\"pill\">① 由外而内 · 思考与设计</div>\n<div class=\"sarrow\">→</div>\n<div class=\"pill alt\">② 由内而外 · 行动与改变</div>\n</div>\n<div class=\"mx\">\n<div class=\"mx-row\" data-grid=\"\"><div class=\"mx-l\">看外部趋势</div><div class=\"mx-a\">→</div><div class=\"mx-r\">做品类规划</div></div>\n<div class=\"mx-row\" data-grid=\"\"><div class=\"mx-l\">看客户需求</div><div class=\"mx-a\">→</div><div class=\"mx-r\">做爆品策划</div></div>\n<div class=\"mx-row\" data-grid=\"\"><div class=\"mx-l\">看竞争对手</div><div class=\"mx-a\">→</div><div class=\"mx-r\">调整自身渠道打法</div></div>\n</div>\n<figcaption>\"三看\"是向外求的三个切口，足够覆盖；看外部，是为了回到自身做动作。</figcaption>\n</figure>\n<div class=\"note\"><b>存量竞争时代的首要使命：</b>今天管理者（含创始人）最重要的使命，严格说还不是定战略，而是<b>洞察变化</b>——C 端变化快、平台打法等趋势频出，对\"看外部\"的要求比以往任何时候都高。</div>\n</div>\n</section>\n<section class=\"part\" id=\"s05b09\">\n<div class=\"part-head\"><span class=\"part-no\">PART 3</span><span class=\"part-title\">案例镜鉴：DR 与消费拐点</span></div>\n<div class=\"mod\" id=\"s05b10\">\n<h2>2026：送礼消费的拐点</h2>\n<p class=\"lead\">资本推动的\"男生送女生礼物\"叙事正在退潮——<b>2026 年是关键拐点</b>，如果这个趋势持续的话。</p>\n<figure class=\"fig\" data-visual-id=\"dr-market-shift\" data-visual-relation=\"鲜花销量砍半、奢侈品饰品剩三分之一、DR 营收 50 亿跌至 15 亿、I Do 关闭\" data-visual-source=\"214情人节、七夕情人节、520情人节这些鲜花的销量砍半…手链项链销售额砍2/3…从50亿跌到了15亿，IDO已经关闭了\" data-visual-title=\"2026 送礼消费拐点数据\" data-visual-type=\"条形对比图\">\n<div class=\"bars\">\n<div class=\"bgroup\">\n<div class=\"bg-label\"><span>情人节鲜花销量（214 · 七夕 · 520）</span><span class=\"bg-tag\">≈ 砍半</span></div>\n<div class=\"brow\" data-grid=\"\"><span class=\"bphase\">此前</span><div class=\"btrack\"><div class=\"bfill before\" style=\"width:100%\"></div></div><span class=\"bval\">基准 100</span></div>\n<div class=\"brow\" data-grid=\"\"><span class=\"bphase\">2026</span><div class=\"btrack\"><div class=\"bfill after\" style=\"width:50%\"></div></div><span class=\"bval\">≈ 50</span></div>\n</div>\n<div class=\"bgroup\">\n<div class=\"bg-label\"><span>奢侈品牌手链 · 项链销售额</span><span class=\"bg-tag\">≈ 砍 2/3</span></div>\n<div class=\"brow\" data-grid=\"\"><span class=\"bphase\">此前</span><div class=\"btrack\"><div class=\"bfill before\" style=\"width:100%\"></div></div><span class=\"bval\">基准 100</span></div>\n<div class=\"brow\" data-grid=\"\"><span class=\"bphase\">2026</span><div class=\"btrack\"><div class=\"bfill after\" style=\"width:33%\"></div></div><span class=\"bval\">≈ 33 · 剩 1/3</span></div>\n</div>\n<div class=\"bgroup\">\n<div class=\"bg-label\"><span>DR 营收（实打实的数字，亿元）</span><span class=\"bg-tag\">剩约三成（推算）</span></div>\n<div class=\"brow\" data-grid=\"\"><span class=\"bphase\">此前</span><div class=\"btrack\"><div class=\"bfill before\" style=\"width:100%\"></div></div><span class=\"bval\">50 亿</span></div>\n<div class=\"brow\" data-grid=\"\"><span class=\"bphase\">2026</span><div class=\"btrack\"><div class=\"bfill after\" style=\"width:30%\"></div></div><span class=\"bval\">15 亿</span></div>\n</div>\n</div>\n<figcaption>比例为讲话人口径的概数，非精确统计；\"基准\"＝此前水平。</figcaption>\n</figure>\n<p>各类情人节、520、\"秋天的第一杯奶茶\"式的节日营销剧变，所谓\"舔狗经济结束\"。男生不追了——心态转向<b>\"只筛选、不追求\"，追太累</b>。与此同时，悦己消费正从女性快速转向男性，<b>男性现在非常悦己</b>；\"大家都只爱自己了\"。</p>\n<span class=\"chip-risk\">I Do 品牌已关闭</span>\n</div>\n<div class=\"mod\" id=\"s05b11\">\n<h2>DR：从卖钻戒到表达爱</h2>\n<p class=\"lead\">面对人工钻冲击与消费转向，DR 把定位从\"求婚钻戒\"延展到<b>整个爱情生命周期</b>。</p>\n<p>压力来自两头：人工钻的冲击，加上钻戒\"去魅\"、黄金当道——单靠求婚一个场景，撑不住原来的盘子。无法跟奢侈品比贵、比几百年的品牌历史，就要换一种承载方式。</p>\n<figure class=\"fig\" data-visual-id=\"dr-love-lifecycle\" data-visual-relation=\"从求婚单一定位延伸到结婚、纪念日等节点，伴随整个爱情生命周期\" data-visual-source=\"不仅是求婚，还有结婚，还有纪念日，它要伴随整个爱情生命周期…好多节点都可以用我们的产品\" data-visual-title=\"DR 场景延伸：伴随爱情生命周期\" data-visual-type=\"节点示意图\">\n<div class=\"chain\">\n<div class=\"cnode hot\"><b>求婚</b><span>原点定位：一生仅一枚，送唯一的人</span></div>\n<div class=\"carrow\"><span>→</span></div>\n<div class=\"cnode\"><b>结婚</b></div>\n<div class=\"carrow\"><span>→</span></div>\n<div class=\"cnode\"><b>纪念日</b></div>\n<div class=\"carrow\"><span>→</span></div>\n<div class=\"cnode\"><b>更多节点…</b><span>伴随整个爱情生命周期</span></div>\n</div>\n<figcaption>场景延伸后，爱情生命周期里好多节点都能用上产品。</figcaption>\n</figure>\n<div class=\"keycard\">\n<div class=\"kk\">回到原点问题：我们到底在做什么</div>\n<b class=\"big\">帮助更多人表达爱</b>\n<p>产品的本质不是那枚钻戒、不是黄金首饰，而是<b>表达爱</b>——所以除了产品，还要有殿堂级装修、求婚策划等周边场景来承载。</p>\n</div>\n<div class=\"note\">这版答案现场仍在完善——原点问题本就允许继续迭代（见\"螺旋上升\"）。</div>\n</div>\n</section>\n<section class=\"part\" id=\"s05b12\">\n<div class=\"part-head\"><span class=\"part-no\">PART 4</span><span class=\"part-title\">共识输出：一年打底</span></div>\n<div class=\"mod\" id=\"s05b13\">\n<h2>一年打底，三年校准</h2>\n<p class=\"lead\">三年看方向，一年管落地；两处内容对应，<b>改一处要同步另一处</b>。</p>\n<figure class=\"fig\" data-visual-id=\"yr1-yr3-linkage\" data-visual-relation=\"三年Y1验证期与一年总结内容对应、双向同步，真正的解码对象是一年\" data-visual-source=\"3年方向里面的验证期要对应我们旁边一年的总结…要同步改…最终我们还是要回归到1年的东西\" data-visual-title=\"三年 Y1 验证期与一年总结对应\" data-visual-type=\"对应关系图\">\n<div class=\"duo\" data-grid=\"\">\n<div class=\"dpanel\">\n<h3>三年方向</h3>\n<ul>\n<li>偏方向性，<b>边走边调</b>，现阶段可调</li>\n<li>其中 <b>Y1（第一年）＝验证期</b></li>\n<li>女性市场等新命题，先放进相应位置</li>\n</ul>\n</div>\n<div class=\"dlink\">⇄<small>内容对应<br/>双向同步</small></div>\n<div class=\"dpanel hot\">\n<h3>一年总结</h3>\n<ul>\n<li>具体、<b>可往下拆</b></li>\n<li><b>真正的解码对象</b>，可落地性比三年强</li>\n</ul>\n</div>\n</div>\n<figcaption>改三年里的 Y1 验证期时，要同步改左边一年的总结——两列内容是一一对应的。</figcaption>\n</figure>\n<span class=\"chip-todo\">现场提醒：营销同时打\"硬核\"\"高效\"两个人群，容易不聚焦——验证阶段收敛到一年的总结</span>\n</div>\n<div class=\"mod\" id=\"s05b14\">\n<h2>四个任务：先共识，再验证</h2>\n<p class=\"lead\">4 个验证问题代表目前验证的 <b>4 条产品线方向</b>；先共识\"做不做\"，再小步验证。</p>\n<figure class=\"fig\" data-visual-id=\"four-task-validation-loop\" data-visual-relation=\"4任务先达成共识，再重跑VOC、倾斜产品力、小范围验证，最终看付费意愿\" data-visual-source=\"这4个问题能不能达成一致…按照这4个分类重新再跑一次…是不是足够让他去做那个付费的动作\" data-visual-title=\"四个用户任务的共识与验证闭环\" data-visual-type=\"流程图\">\n<div class=\"sgrid\">\n<div class=\"snum\"><i>1</i><div><b>明确 4 个验证问题</b><span>对应 4 条产品线方向，只做这 4 个</span></div></div>\n<div class=\"snum gate\"><i>2</i><div><b>达成共识</b><span>\"这件事做不做\"一致，才进验证</span></div></div>\n<div class=\"snum\"><i>3</i><div><b>重跑 VOC</b><span>按 4 分类看市场与竞品的满足度，找可依靠的机会点</span></div></div>\n<div class=\"snum\"><i>4</i><div><b>倾斜产品力</b><span>重构产品力，压向机会点</span></div></div>\n<div class=\"snum\"><i>5</i><div><b>小范围验证</b><span>上代产品 / demo / B 端 / 新一轮用户测试</span></div></div>\n<div class=\"snum\"><i>6</i><div><b>看付费意愿</b><span>是否足以让用户付费，而不只是\"卖没卖动\"</span></div></div>\n</div>\n<figcaption>用一年时间，无论现有产品还是接下来的新品，都用来验证这 4 个问题——它们就是用户的任务。</figcaption>\n</figure>\n<ul class=\"pts\">\n<li>27 年投放市场前后都要有动作：投放前用 demo、上一代产品先做小范围验证；投放后跟进销售与用户反馈，才拿得到验证结果。</li>\n<li>当前基数为 0（没有基础规模的销售与反馈）——要靠<b>许多小动作抓落地与转化</b>，才有下一步爆发。</li>\n</ul>\n<div class=\"note\">比总结文本更重要的，是\"这 4 件事做不做\"达成一致——能写清楚的结论，AI 也总结得出来。</div>\n</div>\n</section>\n<section class=\"part\" id=\"s05b15\">\n<div class=\"part-head\"><span class=\"part-no\">PART 5</span><span class=\"part-title\">解码前的校准</span></div>\n<div class=\"mod\" id=\"s05b16\">\n<h2>交互与场景的产品路线</h2>\n<p class=\"lead\">免手交互走 <b>自研拾音降噪路线</b>；游泳与夜间跑步两个拐点，<b>分开做</b>。</p>\n<figure class=\"fig\" data-visual-id=\"voice-interaction-vpu\" data-visual-relation=\"加自研拾音降噪模块可同时解决听音通话与语音识别，前提是先做好拍摄听音通话基础\" data-visual-source=\"听音通话跟识别就都解决掉了…加了vpu语音识别原则来讲也解决掉了…前提是先做好前面那两个\" data-visual-title=\"免手交互的 自研拾音降噪路线\" data-visual-type=\"结构图\">\n<div class=\"stack\">\n<div class=\"lay\"><span class=\"lay-k\">前提</span><b>拍摄 · 听音 · 通话</b><span>基础体验先做好</span></div>\n<div class=\"layarrow\">方案：一条路线解两个问题</div>\n<div class=\"lay mid\"><span class=\"lay-k\">加装</span><b>自研拾音降噪模块</b><span>听音通话的质量同步解决，语音识别原则上也一并解决</span></div>\n<div class=\"layarrow\">收益</div>\n<div class=\"lay\"><span class=\"lay-k\">落到任务</span><b>免手交互</b><span>在第 4 个任务中加入语音识别</span></div>\n</div>\n<figcaption>交互是锦上添花：拍摄、听音、通话这些基础不行，识别再好也难用。</figcaption>\n</figure>\n<figure class=\"fig\" data-visual-id=\"scenario-split-swim-open\" data-visual-relation=\"游泳与夜间跑步分开做，两者可靠性方案倾向不同，各有技术路线\" data-visual-source=\"L3或者说夜间跑题…还是接着分开做…可靠性的解决方案以及倾向应该也是不一样的\" data-visual-title=\"游泳与夜间跑步拐点分开做\" data-visual-type=\"分支示意图\">\n<div class=\"bwrap\">\n<div class=\"bhead\"><span>两个体验拐点：分开做</span></div>\n<div class=\"bcols\" data-grid=\"\">\n<div class=\"bcard\">\n<h4>游泳</h4>\n<ul>\n<li>建立<b>\"不入水 / 防腐蚀\"的证据链</b>——结构上整体密封防水</li>\n<li>通话未列入需求（<b>骑行的通话才是刚需</b>）</li>\n</ul>\n</div>\n<div class=\"bcard alt\">\n<h4>夜间跑步（型号A）</h4>\n<ul>\n<li>用正在做的自研声学单元，<b>追上 top 品牌的听音音质</b></li>\n<li>探索把自研拾音降噪方案引入该品类，解决这一系列产品的通话</li>\n</ul>\n</div>\n</div>\n</div>\n<figcaption>依据 VOC 与竞品客退数据，两条线的可靠性方案倾向不同——不同场景解决不同问题。</figcaption>\n</figure>\n<p>场景洞察还要继续深入：还有哪些需求没被满足好？免手交互就是其一——现在所有产品都依赖手机操作；同类产品（如韶音）用很稳妥的硬按键，是为了保证指令一致、操作反馈直接。这恰是可切入的地方。</p>\n</div>\n<div class=\"mod\" id=\"s05b17\">\n<h2>创新边界与渠道表达</h2>\n<p class=\"lead\">对内只做应用层创新，对外<b>别把话说满</b>。</p>\n<div class=\"bcols\" data-grid=\"\">\n<div class=\"bcard\">\n<h4>对内 · 技术策略</h4>\n<ul>\n<li>\"应用层创新\"里的\"微\"可以去掉——<b>应用层创新完全没问题</b>；3 年内不挑战芯片级的大突破，那个规划不了。</li>\n<li>跟着技术与产业链成熟走：第一时间洞察新技术能不能用上、对用户价值多大；效率提上来，<b>足以把生意做好</b>。</li>\n<li>产业分工协作，不养方案公司；产业成熟了就用——<b>早走一步，就领先很多</b>。</li>\n</ul>\n</div>\n<div class=\"bcard alt\">\n<h4>对外 · 渠道表达</h4>\n<ul>\n<li>slogan 不写\"颠覆性创新\"——会让代理商误解、给客户过高期待。敢说 innovation，是因为当年形态级的创新；这个词很重，很多公司多年都不敢说。</li>\n<li>挑资质好的代理商，帮他把 <b>ROS 账算清楚</b>；操盘头部品牌的代理商，会用那套标准反过来要求你。</li>\n<li>品牌不能只有内容建设，要用更多营销手段<b>赋能代理商转化</b>；品牌动作是锦上添花，不是雪中送炭。</li>\n<li>两个国家只做核心试点，先保可落地。</li>\n</ul>\n</div>\n</div>\n<span class=\"chip-todo\">品牌方向目前有两个口径——与成员D确认一个，再往下推进</span>\n</div>\n<div class=\"mod\" id=\"s05b18\">\n<h2>解码前，先立一版标准</h2>\n<p class=\"lead\">进入解码，先回答两个标准问题：<b>怎么算\"有突破\"，怎么算\"有爆品\"</b>。</p>\n<ul class=\"pts\">\n<li>现行口径（如一律要求 3 倍利润）太死板——照此<b>每个项目都得砍</b>；如今东西越做越贵，不可能什么都 3 倍。</li>\n<li>创业初期需要另一套标准；标准可以先拍一版，边走边校。</li>\n</ul>\n<div class=\"note\">没有标准就没法解码；<b>先有一版可用的，比争论完美更重要</b>。</div>\n</div>\n</section>\n</div>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\">\n<rect fill=\"#F5F7FA\" height=\"512\" width=\"512\"></rect>\n<circle cx=\"372\" cy=\"150\" fill=\"#2B4ACB\" r=\"80\"></circle>\n<path d=\"M340 120 q24 -16 44 -2 q18 13 -2 26 q-24 11 -42 -2 q-11 -11 0 -22Z\" fill=\"#8FA5FF\" opacity=\".9\"></path>\n<path d=\"M380 186 q20 -7 30 2 q8 9 -9 13 q-19 3 -24 -5 q-3 -6 3 -10Z\" fill=\"#8FA5FF\" opacity=\".75\"></path>\n<circle cx=\"128\" cy=\"660\" fill=\"#DCE2EF\" r=\"410\"></circle>\n<ellipse cx=\"205\" cy=\"282\" fill=\"#C4CEE2\" rx=\"16\" ry=\"6\"></ellipse>\n<ellipse cx=\"330\" cy=\"318\" fill=\"#C4CEE2\" rx=\"11\" ry=\"4.5\"></ellipse>\n<circle cx=\"256\" cy=\"236\" fill=\"#1C2333\" r=\"10\"></circle>\n<path d=\"M256 248 v16 M256 253 l-12 9 M256 253 l12 9 M256 264 l-8 11 M256 264 l8 11\" fill=\"none\" stroke=\"#1C2333\" stroke-linecap=\"round\" stroke-width=\"5.5\"></path>\n<path d=\"M272 228 Q 292 214 304 204\" fill=\"none\" stroke=\"#0E7A6F\" stroke-dasharray=\"7 8\" stroke-width=\"3\"></path>\n<path d=\"M311 199 l-14 -3 l5 12 Z\" fill=\"#0E7A6F\"></path>\n<g fill=\"#AAB6D3\">\n<circle cx=\"90\" cy=\"120\" r=\"4\"></circle><circle cx=\"470\" cy=\"300\" r=\"4\"></circle><circle cx=\"180\" cy=\"70\" r=\"3\"></circle><circle cx=\"440\" cy=\"360\" r=\"3\"></circle>\n</g>\n</svg></template>\n","blocks":[{"id":"s05b01","type":"part","heading":"会程与讨论方式","text":"PART 1\n会程与讨论方式"},{"id":"s05b02","type":"mod","heading":"今天的推进线","text":"今天的推进线\n昨天完成\"向外求\"的发散与收敛，今天落锤共识，随后转向向内解码。\n昨日 · 写作业与发散\n基于\"三看\"收集信息、形成观点，完成作业——这个过程是发散。\n昨日 · 收敛输出\n最终收敛出 1—5 号方向，各组在结束前输出结果。\n今晨 · 迭代一轮\n睡一觉大脑重启，会有新想法；组长带组再归纳一轮（初步排 20 分钟），发言人直接讲结论。\n上午 · 完善与分工\n继续完善方向内容：渠道销售已基本改完；品牌营销整合中，稍后与成员B、成员C对一遍；产品品类改了一轮，待组内复核。\n中午前后\n\"向外求\"截止\n——今天中午或下午的上半场。\n之后 · 解码业务\n解码增长的驱动力\n：把 1—5 号方向再往下沉一步、再落一步。\n时间点为现场口述安排。"},{"id":"s05b03","type":"mod","heading":"螺旋上升，不必完美","text":"螺旋上升，不必完美\n战略讨论不是瀑布，而是\n螺旋上升\n；原点问题允许慢慢变准。\n✕\n瀑布式\n像水从高处流下——走完这一步，就回不去了。\n↻\n螺旋式\n可以回到原点问题再讨论；原点也会更新，越聊越笃定。\n原点问题\n＝聚焦哪类客户的哪类价值；定了，后面所有动作更一致、更高效。\n但它不是一个晚上想得出来的——需要规划，也需要涌现；\n成长型企业不必过度执着\n。\n现场标尺：\n不必完美，但要共识\n——阶段性共识即可。\n哪怕到 2027 年底才更笃定\"聚焦什么\"，也非常值得。"},{"id":"s05b04","type":"mod","heading":"领导力：因人成事","text":"领导力：因人成事\n领导力不是个人多能打，而是\n靠团队打胜仗，并让组织变强\n。\n领导力＝打胜仗——不靠领导力也能打胜仗，不成立。\n领导力＝领航、凝聚人心——在靠近，但没点透。\n前半句\n因人成事\n因为团队，所以打胜仗。个人能力强，那叫专业强、业务强、技术强。\n后半句\n组织向前\n让组织的能力得到提高——这是带团队的人真正的产出。\n组织能力示例（不是某个人的能力）：\n用户洞察 7 问\n·\n战略大单品七步法\n——7 个问题答完，用户洞察才算完成（指用户洞察 7 问；战略大单品七步法为另一套方法）。\n现场落点：组长、副组长、书记发挥领导力，带组归纳，\n不让任何一个人单打独斗\n。昨天没有大面积游离，个别小游离正常、也能很快回来；今天保持。\n一个人最重要的能力是\n活在当下\n：紧急事务快速处理完就回到战略——紧急级与战略级（三年、一年的业务），心里要有把尺。"},{"id":"s05b05","type":"part","heading":"方法论：向外求","text":"PART 2\n方法论：向外求"},{"id":"s05b06","type":"mod","heading":"持续洞察，无止境","text":"持续洞察，无止境\n洞察的深度决定战略的高度。\n洞察不完全依赖共创会现场——会前就在持续\"写作业\"，一轮、两轮。\n日常\n月度 · 季度持续洞察\n会前持续\"写作业\"，一轮两轮不间断\n→\n积累\n到年底素材足够\n不少判断平时就已经做过了\n→\n落地\n定战略更高效\n参与共创的人不靠现场从零想\n洞察无止境：每次进步一点点，不断迭代更新——这就是最好的洞察状态。"},{"id":"s05b07","type":"mod","heading":"站在月球看地球","text":"站在月球看地球\n微信开机页那张图十多年没换过——不是缺平面设计师，是\n张小龙钦定的产品理念\n。\n地球\n月球\n小人站在月球上\n→\n跳出自我，站到外部看\n凝望地球（家乡）\n→\n站在用户的角度看产品\n2011 年至今未换图\n→\n理念立住后，长期不动摇\n微信开机页十余年不变，承载的是\"站在外部看内部\"；跳出\"我\"来看待\"我\"，并不容易。"},{"id":"s05b08","type":"mod","heading":"由外而内，三看落动作","text":"由外而内，三看落动作\n先由外而内思考与设计，再由内而外行动与改变——\n两步缺一不可\n。\n① 由外而内 · 思考与设计\n→\n② 由内而外 · 行动与改变\n看外部趋势\n→\n做品类规划\n看客户需求\n→\n做爆品策划\n看竞争对手\n→\n调整自身渠道打法\n\"三看\"是向外求的三个切口，足够覆盖；看外部，是为了回到自身做动作。\n存量竞争时代的首要使命：\n今天管理者（含创始人）最重要的使命，严格说还不是定战略，而是\n洞察变化\n——C 端变化快、平台打法等趋势频出，对\"看外部\"的要求比以往任何时候都高。"},{"id":"s05b09","type":"part","heading":"案例镜鉴：DR 与消费拐点","text":"PART 3\n案例镜鉴：DR 与消费拐点"},{"id":"s05b10","type":"mod","heading":"2026：送礼消费的拐点","text":"2026：送礼消费的拐点\n资本推动的\"男生送女生礼物\"叙事正在退潮——\n2026 年是关键拐点\n，如果这个趋势持续的话。\n情人节鲜花销量（214 · 七夕 · 520）\n≈ 砍半\n此前\n基准 100\n2026\n≈ 50\n奢侈品牌手链 · 项链销售额\n≈ 砍 2/3\n此前\n基准 100\n2026\n≈ 33 · 剩 1/3\nDR 营收（实打实的数字，亿元）\n剩约三成（推算）\n此前\n50 亿\n2026\n15 亿\n比例为讲话人口径的概数，非精确统计；\"基准\"＝此前水平。\n各类情人节、520、\"秋天的第一杯奶茶\"式的节日营销剧变，所谓\"舔狗经济结束\"。男生不追了——心态转向\n\"只筛选、不追求\"，追太累\n。与此同时，悦己消费正从女性快速转向男性，\n男性现在非常悦己\n；\"大家都只爱自己了\"。\nI Do 品牌已关闭"},{"id":"s05b11","type":"mod","heading":"DR：从卖钻戒到表达爱","text":"DR：从卖钻戒到表达爱\n面对人工钻冲击与消费转向，DR 把定位从\"求婚钻戒\"延展到\n整个爱情生命周期\n。\n压力来自两头：人工钻的冲击，加上钻戒\"去魅\"、黄金当道——单靠求婚一个场景，撑不住原来的盘子。无法跟奢侈品比贵、比几百年的品牌历史，就要换一种承载方式。\n求婚\n原点定位：一生仅一枚，送唯一的人\n→\n结婚\n→\n纪念日\n→\n更多节点…\n伴随整个爱情生命周期\n场景延伸后，爱情生命周期里好多节点都能用上产品。\n回到原点问题：我们到底在做什么\n帮助更多人表达爱\n产品的本质不是那枚钻戒、不是黄金首饰，而是\n表达爱\n——所以除了产品，还要有殿堂级装修、求婚策划等周边场景来承载。\n这版答案现场仍在完善——原点问题本就允许继续迭代（见\"螺旋上升\"）。"},{"id":"s05b12","type":"part","heading":"共识输出：一年打底","text":"PART 4\n共识输出：一年打底"},{"id":"s05b13","type":"mod","heading":"一年打底，三年校准","text":"一年打底，三年校准\n三年看方向，一年管落地；两处内容对应，\n改一处要同步另一处\n。\n三年方向\n偏方向性，\n边走边调\n，现阶段可调\n其中\nY1（第一年）＝验证期\n女性市场等新命题，先放进相应位置\n⇄\n内容对应\n双向同步\n一年总结\n具体、\n可往下拆\n真正的解码对象\n，可落地性比三年强\n改三年里的 Y1 验证期时，要同步改左边一年的总结——两列内容是一一对应的。\n现场提醒：营销同时打\"硬核\"\"高效\"两个人群，容易不聚焦——验证阶段收敛到一年的总结"},{"id":"s05b14","type":"mod","heading":"四个任务：先共识，再验证","text":"四个任务：先共识，再验证\n4 个验证问题代表目前验证的\n4 条产品线方向\n；先共识\"做不做\"，再小步验证。\n1\n明确 4 个验证问题\n对应 4 条产品线方向，只做这 4 个\n2\n达成共识\n\"这件事做不做\"一致，才进验证\n3\n重跑 VOC\n按 4 分类看市场与竞品的满足度，找可依靠的机会点\n4\n倾斜产品力\n重构产品力，压向机会点\n5\n小范围验证\n上代产品 / demo / B 端 / 新一轮用户测试\n6\n看付费意愿\n是否足以让用户付费，而不只是\"卖没卖动\"\n用一年时间，无论现有产品还是接下来的新品，都用来验证这 4 个问题——它们就是用户的任务。\n27 年投放市场前后都要有动作：投放前用 demo、上一代产品先做小范围验证；投放后跟进销售与用户反馈，才拿得到验证结果。\n当前基数为 0（没有基础规模的销售与反馈）——要靠\n许多小动作抓落地与转化\n，才有下一步爆发。\n比总结文本更重要的，是\"这 4 件事做不做\"达成一致——能写清楚的结论，AI 也总结得出来。"},{"id":"s05b15","type":"part","heading":"解码前的校准","text":"PART 5\n解码前的校准"},{"id":"s05b16","type":"mod","heading":"交互与场景的产品路线","text":"交互与场景的产品路线\n免手交互走\n自研拾音降噪路线\n；游泳与夜间跑步两个拐点，\n分开做\n。\n前提\n拍摄 · 听音 · 通话\n基础体验先做好\n方案：一条路线解两个问题\n加装\n自研拾音降噪模块\n听音通话的质量同步解决，语音识别原则上也一并解决\n收益\n落到任务\n免手交互\n在第 4 个任务中加入语音识别\n交互是锦上添花：拍摄、听音、通话这些基础不行，识别再好也难用。\n两个体验拐点：分开做\n游泳\n建立\n\"不入水 / 防腐蚀\"的证据链\n——结构上整体密封防水\n通话未列入需求（\n骑行的通话才是刚需\n）\n夜间跑步（型号A）\n用正在做的自研声学单元，\n追上 top 品牌的听音音质\n探索把自研拾音降噪方案引入该品类，解决这一系列产品的通话\n依据 VOC 与竞品客退数据，两条线的可靠性方案倾向不同——不同场景解决不同问题。\n场景洞察还要继续深入：还有哪些需求没被满足好？免手交互就是其一——现在所有产品都依赖手机操作；同类产品（如韶音）用很稳妥的硬按键，是为了保证指令一致、操作反馈直接。这恰是可切入的地方。"},{"id":"s05b17","type":"mod","heading":"创新边界与渠道表达","text":"创新边界与渠道表达\n对内只做应用层创新，对外\n别把话说满\n。\n对内 · 技术策略\n\"应用层创新\"里的\"微\"可以去掉——\n应用层创新完全没问题\n；3 年内不挑战芯片级的大突破，那个规划不了。\n跟着技术与产业链成熟走：第一时间洞察新技术能不能用上、对用户价值多大；效率提上来，\n足以把生意做好\n。\n产业分工协作，不养方案公司；产业成熟了就用——\n早走一步，就领先很多\n。\n对外 · 渠道表达\nslogan 不写\"颠覆性创新\"——会让代理商误解、给客户过高期待。敢说 innovation，是因为当年形态级的创新；这个词很重，很多公司多年都不敢说。\n挑资质好的代理商，帮他把\nROS 账算清楚\n；操盘头部品牌的代理商，会用那套标准反过来要求你。\n品牌不能只有内容建设，要用更多营销手段\n赋能代理商转化\n；品牌动作是锦上添花，不是雪中送炭。\n两个国家只做核心试点，先保可落地。\n品牌方向目前有两个口径——与成员D确认一个，再往下推进"},{"id":"s05b18","type":"mod","heading":"解码前，先立一版标准","text":"解码前，先立一版标准\n进入解码，先回答两个标准问题：\n怎么算\"有突破\"，怎么算\"有爆品\"\n。\n现行口径（如一律要求 3 倍利润）太死板——照此\n每个项目都得砍\n；如今东西越做越贵，不可能什么都 3 倍。\n创业初期需要另一套标准；标准可以先拍一版，边走边校。\n没有标准就没法解码；\n先有一版可用的，比争论完美更重要\n。"}]},{"num":6,"id":"s06","title":"产品生命周期七步法与模块化开发","date":"2026年11月10日","css":"#sv{\n  color-scheme:light dark;\n  --page-bg:#f5f6f9;\n  --surface:#ffffff;\n  --surface-2:#f7f8fb;\n  --text:#1d1f28;\n  --muted:#6d7386;\n  --faint:#9298ab;\n  --accent:#4f46e5;\n  --on-accent:#ffffff;\n  --accent-soft:#eef0fd;\n  --accent-line:#d9ddf7;\n  --border:#e4e6ec;\n  --font:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n}\n@media (prefers-color-scheme: dark){\n#sv{\n    --page-bg:#0f1015;\n    --surface:#171922;\n    --surface-2:#1d1f2b;\n    --text:#e9eaf1;\n    --muted:#a2a7bb;\n    --faint:#7c8296;\n    --accent:#9aa0ff;\n    --on-accent:#14152b;\n    --accent-soft:#212347;\n    --accent-line:#3b3e70;\n    --border:#2a2c3a;\n  }\n}\n*{box-sizing:border-box;margin:0;padding:0}\n#sv{-webkit-text-size-adjust:100%;scroll-behavior:smooth}\n#sv{font-family:var(--font);background-color:var(--page-bg);color:var(--text);font-size:15px;line-height:1.7}\nsvg{display:block}\n.wrap{max-width:880px;margin:0 auto;padding:36px 18px 80px}\n.kicker{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--accent)}\nh1{font-size:26px;line-height:1.34;margin-top:10px;font-weight:700;letter-spacing:.01em}\n.lede{margin-top:13px;color:var(--muted);font-size:14.5px;max-width:640px}\n@media(min-width:760px){\n.wrap{padding:60px 32px 100px}\nh1{font-size:32px}\n.lede{font-size:15.5px}\n}\n.toc{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}\n.toc a{font-size:12.5px;color:var(--muted);text-decoration:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 13px}\n.toc a:hover{color:var(--accent);border-color:var(--accent-line)}\n.part{margin-top:48px;scroll-margin-top:20px}\n.part + .part{border-top:1px solid var(--border);margin-top: id-column: 1 / -1 !important; }\n[data-span-all],[data-value-kind=\"formula\"],[data-value-kind=\"range\"]{ grid-column: 1 / -1 !important; }\n/* Horizontal flows become vertical. */\n  [class*=\"flow\"],[class*=\"chain\"],[class*=\"timeline\"]{ flex-direction: column !important; }\n[class*=\"arrow\"]{ transform: rotate(90deg); min-height: 16px !important; }\ntable{ font-size: 12.5px; }\nth,td{ padding: 9px 8px !important; }\nnav{ max-width: 100%; }\nnav[data-scrollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}","body":"\n<div class=\"wrap\">\n<header class=\"hero\">\n<p class=\"kicker\">产品开发方法 · 培训要点</p>\n<h1>产品生命周期七步法与模块化开发</h1>\n<p class=\"lede\">产品有生老病死，产品系列有新陈代谢。无论自己开发单品，还是替电商客户开发，都遵循同一套从生到死的开品逻辑——跨境电商尤其有必要学一遍。</p>\n<nav aria-label=\"目录\" class=\"toc\">\n<a href=\"#p1\">① 看准前三步</a>\n<a href=\"#p2\">② 生命周期七环节</a>\n<a href=\"#p3\">③ 角色与资源</a>\n<a href=\"#p4\">④ 模块化开发</a>\n</nav>\n</header>\n<main>\n<section class=\"part\" id=\"s06b01\">\n<div class=\"part-head\">\n<span class=\"part-tag\">Part 1</span>\n<h2>看准：开品前三步</h2>\n<p class=\"part-desc\">对应生命周期的①—③步，核心是「看准能力」。</p>\n</div>\n<article class=\"module\" id=\"s06b02\">\n<h3>前三步：从看市场到看对手</h3>\n<figure class=\"diagram\" data-visual-id=\"product-dev-three-steps\" data-visual-relation=\"市场洞察决定品类规划，用户洞察用七问，竞品分析用六问；前三步共同决定爆款成功率、新品成功率与新品利润率\" data-visual-source=\"市场洞察决定什么品类规划……用户洞察7问……前3步很重要，直接决定爆款成功率、新品成功率、新品利润率\" data-visual-title=\"开品前三步流程与决定项\" data-visual-type=\"流程示意图\">\n<ol class=\"flow3\" data-grid=\"\">\n<li class=\"fstep\">\n<div class=\"fhead\"><span class=\"fnum\">1</span><strong>市场洞察</strong></div>\n<span class=\"fdesc\">决定品类规划——选哪个赛道、如何聚焦</span>\n</li>\n<li aria-hidden=\"true\" class=\"farrow\"><svg class=\"chev\" height=\"17\" style=\"width:17px!important;max-width:17px!important;height:auto!important;flex:0 1 17px!important;min-width:0!important;\" viewbox=\"0 0 24 24\" width=\"17\"><path d=\"M4 12h14M12 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\"></path></svg></li>\n<li class=\"fstep\">\n<div class=\"fhead\"><span class=\"fnum\">2</span><strong>用户洞察</strong></div>\n<span class=\"fdesc\">站在客户角度，用「用户洞察 7 问」盘需求</span>\n</li>\n<li aria-hidden=\"true\" class=\"farrow\"><svg class=\"chev\" height=\"17\" style=\"width:17px!important;max-width:17px!important;height:auto!important;flex:0 1 17px!important;min-width:0!important;\" viewbox=\"0 0 24 24\" width=\"17\"><path d=\"M4 12h14M12 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\"></path></svg></li>\n<li class=\"fstep\">\n<div class=\"fhead\"><span class=\"fnum\">3</span><strong>竞品分析</strong></div>\n<span class=\"fdesc\">更微观一层，用「竞品分析 6 问」拆对手</span>\n</li>\n</ol>\n<div class=\"flow-out\">前三步直接决定：<b>爆款成功率 · 新品成功率 · 新品利润率</b></div>\n</figure>\n</article>\n<article class=\"module\" id=\"s06b03\">\n<h3>竞品分析六问：先收集，再找空白</h3>\n<figure class=\"diagram\" data-visual-id=\"competitor-six-questions\" data-visual-relation=\"前三问收集竞品信息要收集够，后三问从价格带空白、渠道区域空白、对手槽点反攻三个方向找机会\" data-visual-source=\"一和2都是属于信息层面，你得收集够……7倍或价格带的空白……渠道……或者区域空白……槽点反攻\" data-visual-title=\"竞品分析六问：信息层与机会层\" data-visual-type=\"分组清单图\">\n<div class=\"sixq\" data-grid=\"\">\n<div class=\"qg\">\n<div class=\"qghead\"><b>第 1–3 问 · 信息层</b><span>先收集够</span></div>\n<div class=\"qrow\"><span class=\"qnum\">1</span><div><strong>竞品是谁、是什么品</strong><span class=\"qd\">锁定哪个竞争品牌的哪款产品</span></div></div>\n<div class=\"qrow\"><span class=\"qnum\">2</span><div><strong>产品与功能信息</strong><span class=\"qd\">功能特性、参数等产品信息</span></div></div>\n<div class=\"qrow\"><span class=\"qnum\">3</span><div><strong>卖点优势是什么</strong><span class=\"qd\">摸清对手主打的卖点与优势</span></div></div>\n</div>\n<div class=\"qg op\">\n<div class=\"qghead\"><b>第 4–6 问 · 机会层</b><span>找空白、抓反攻</span></div>\n<div class=\"qrow\"><span class=\"qnum\">4</span><div><strong>价格带空白</strong><span class=\"qd\">对手只有高端？如宝马有 7 系、没有 5 系和 3 系——中低价格带可切入</span></div></div>\n<div class=\"qrow\"><span class=\"qnum\">5</span><div><strong>渠道 / 区域空白</strong><span class=\"qd\">天猫卖得好、抖音没上；德国有、英国无——换渠道或换地域</span></div></div>\n<div class=\"qrow\"><span class=\"qnum\">6</span><div><strong>槽点反攻</strong><span class=\"qd\">把对手的槽点反转成我们的卖点</span></div></div>\n</div>\n</div>\n</figure>\n</article>\n<article class=\"module\" id=\"s06b04\">\n<h3>槽点反攻：把对手短板变成你的卖点</h3>\n<figure class=\"diagram\" data-visual-id=\"painpoint-counter\" data-visual-relation=\"共性卖点叠加反转后的对手槽点，形成卖点叠加态，再配合产品对比，让客户在这个点上认为你更好\" data-visual-source=\"对手的槽点就是我们卖点的叠加态……你给他反过来……你甚至做对比产品对比……在这个点上你比他好就够了\" data-visual-title=\"槽点反攻机制\" data-visual-type=\"机制示意图\">\n<div class=\"pc\">\n<div class=\"pc-srcs\" data-grid=\"\">\n<div class=\"dnode\"><strong>共性卖点</strong><em>双方都有的基本盘</em></div>\n<div class=\"dnode\"><strong>对手槽点</strong><em>反过来看、反向要求</em></div>\n</div>\n<div aria-hidden=\"true\" class=\"vlink\"><span class=\"vline\"></span><span class=\"vlabel\">反转后叠加</span><span class=\"vline\"></span></div>\n<div class=\"dnode hl\"><strong>卖点叠加态</strong><em>共性卖点 ＋ 反转后的对手槽点</em></div>\n<div aria-hidden=\"true\" class=\"vlink\"><span class=\"vline\"></span><span class=\"vlabel\">配合产品对比展示</span><span class=\"vline\"></span></div>\n<div class=\"dnode res\"><strong>客户认知：你的品更好</strong><em>在这个点上比他好，就够了</em></div>\n</div>\n</figure>\n</article>\n</section>\n<section class=\"part\" id=\"s06b05\">\n<div class=\"part-head\">\n<span class=\"part-tag\">Part 2</span>\n<h2>管好：生命周期七环节</h2>\n<p class=\"part-desc\">产品力是表面的，背后是产品管理能力，本质是产品生命周期管理。</p>\n</div>\n<article class=\"module\" id=\"s06b06\">\n<h3>七环节：从洞察到退出</h3>\n<p class=\"msub\">这是每个产品都会走的通用流程，与昨天专讲的「战略大单品心法」是两回事。</p>\n<figure class=\"diagram\" data-visual-id=\"lifecycle-seven-stages\" data-visual-relation=\"洞察三步看准，企划收敛打法，立项是决策闸门，之后产品实现、上市迭代退出；退出需预设标准\" data-visual-source=\"产品生命管理1234……叫产品的企划……五叫立项决策……六叫供应链的产品实现……第七……上市迭代和退出……要去设置退出标准\" data-visual-title=\"产品生命周期管理七环节\" data-visual-type=\"流程时间线\">\n<ol class=\"tl\">\n<li class=\"tl-phase\"><span>①—③ 市场洞察 · 用户洞察 · 竞品分析</span><em>看准能力——即前三步，见 Part 1</em></li>\n<li class=\"tl-item\"><span class=\"tl-dot\">4</span><div class=\"tl-body\"><strong>企划</strong><span>包含定义、卖点、营销路线图，还要考虑怎么卖、节奏与品牌市场协同——严格说不只是「产品定义」，只做到产品是不够的</span></div></li>\n<li class=\"tl-item gate\"><span class=\"tl-dot\">5</span><div class=\"tl-body\"><strong>立项决策</strong><span>决策闸门：前四步完成后，品牌、销售、老板坐下来一起拍板开不开这个品</span></div></li>\n<li class=\"tl-item\"><span class=\"tl-dot\">6</span><div class=\"tl-body\"><strong>产品实现（双线）</strong><span>供应链产品实现 ＋ 产品表达实现——标准、专利、常规背书；提前找红人验证、种子用户测试、拍视频。启动不一定是冷启动，不是所有品都一样</span></div></li>\n<li class=\"tl-item\"><span class=\"tl-dot\">7</span><div class=\"tl-body\"><strong>上市 · 迭代 · 退出</strong><span>上市不是终点——持续迭代；退出按预设标准执行</span></div></li>\n</ol>\n</figure>\n<div class=\"note\">\n<span class=\"note-tag\">现场问答 · 退出标准</span>\n<p>退出不是必然：卖得好的产品不用退，有些产品则肯定要退。<b>退出标准要提前设置</b>，并尽量用客观指标量化——过去做 IPD 时偏主观判断。</p>\n</div>\n</article>\n</section>\n<section class=\"part\" id=\"s06b07\">\n<div class=\"part-head\">\n<span class=\"part-tag\">Part 3</span>\n<h2>主打什么：产品角色与资源取舍</h2>\n<p class=\"part-desc\">同一个品可以扮演不同角色；角色定位不同，资源打法不同。</p>\n</div>\n<article class=\"module\" id=\"s06b08\">\n<h3>爆品 · 战略大单品 · 旗舰</h3>\n<p class=\"msub\">单讲「爆品」其实狭隘，更要紧的叫法是战略大单品。</p>\n<p class=\"mtext\">过去多数产品没有外部动作，直接在平台或渠道上架——不是当旗舰，就是当爆品。</p>\n<figure class=\"diagram\" data-visual-id=\"product-role-compare\" data-visual-relation=\"爆品靠低价促销买流量短期成；战略大单品是代表作靠迭代，看市占率与心智占有率；旗舰对大牌即大单品，对成长型企业是实力宣称\" data-visual-source=\"靠低价也能爆，靠促销也能爆……战略大单品叫代表作……旗舰款和战略大单品是同样一件事……是品牌心智占位的一个宣称\" data-visual-title=\"爆品·战略大单品·旗舰对比\" data-visual-type=\"三栏对比图\">\n<div class=\"cmp-grid\" data-grid=\"\">\n<div class=\"cmp-col\">\n<div class=\"cmp-head\">爆品</div>\n<ul>\n<li>靠动作短期能成：低价、促销、短期买流量也能爆</li>\n</ul>\n</div>\n<div class=\"cmp-col focus\">\n<div class=\"cmp-head\">战略大单品<span class=\"cmp-alias\">＝ 代表作</span></div>\n<ul>\n<li>靠<b>迭代</b>打磨出来，不是一次性动作</li>\n<li>每个品类至少一个代表作：不一定最贵，但一提到就想到你</li>\n<li>两个可量化指标：<b>市占率</b>（销售数据）＋ <b>人群心智占有率</b>（品牌端调研）</li>\n</ul>\n</div>\n<div class=\"cmp-col\">\n<div class=\"cmp-head\">旗舰产品</div>\n<ul>\n<li>大牌企业：旗舰与战略大单品是同一件事</li>\n<li>成长型企业：实力宣称——证明开品能力与技术实力，做品牌心智占位</li>\n<li>拉动品类与产品梯队——推高卖低、攒「长坡厚雪」的势能，真正走量的是中低端</li>\n<li>不一定是销售额</li>\n</ul>\n</div>\n</div>\n<figcaption class=\"fig-note\">代表作的分量：有 1 个是小网红，2—3 个是大网红，10 个就是歌星；周杰伦有 50 首代表作，所以是天王。</figcaption>\n</figure>\n</article>\n<article class=\"module\" id=\"s06b09\">\n<h3>资源往哪投：按企业阶段取舍</h3>\n<p class=\"msub\">现场问答要点：三个角色可能是同一个产品，但要有所区隔。</p>\n<div class=\"res-rows\">\n<div class=\"res-row\"><span class=\"res-key\">大牌企业</span><p>旗舰＝战略大单品，是同一件事——品牌与市场的精力全部主打旗舰大单品，机场海报都是大单品（如 vivo）。</p></div>\n<div class=\"res-row\"><span class=\"res-key\">成长型企业</span><p>资源投<b>战略大单品</b>；旗舰作为实力宣称可以带着做，但资源不重投。</p></div>\n<div class=\"res-row\"><span class=\"res-key\">产品分层</span><p>重点产品：核心卖点＋完整产品体验＋记忆符号；防守型产品从简，不必走这么严谨的流程。</p></div>\n<div class=\"res-row\"><span class=\"res-key\">品类差异</span><p>3C 的旗舰大单品，相对更强调技术。</p></div>\n</div>\n<p class=\"mini-h\">大单品的构成</p>\n<figure class=\"soul\" data-visual-id=\"soul-body-single\" data-visual-relation=\"魂来自步骤①—④的洞察与企划，体来自步骤⑥的产品表达与品牌市场协同，两者合成战略大单品\" data-visual-source=\"魂来自于1234步骤，体是来自这个第六步骤……产品表达，还有品牌市场的协同，这个就是大单品\" data-visual-title=\"大单品的构成：魂与体\" data-visual-type=\"合成机制图\">\n<div class=\"soul-pair\" data-grid=\"\">\n<div class=\"dnode\"><strong>魂</strong><em>步骤①—④：洞察与企划</em></div>\n<span aria-hidden=\"true\" class=\"soul-plus\">＋</span>\n<div class=\"dnode\"><strong>体</strong><em>步骤⑥：产品表达＋品牌市场协同</em></div>\n</div>\n<div aria-hidden=\"true\" class=\"soul-link\"><svg class=\"chev\" height=\"17\" viewbox=\"0 0 24 24\" width=\"17\"><path d=\"M4 12h14M12 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\"></path></svg></div>\n<div class=\"dnode res\"><strong>战略大单品</strong><em>魂体合一，这就是大单品</em></div>\n</figure>\n</article>\n</section>\n<section class=\"part\" id=\"s06b10\">\n<div class=\"part-head\">\n<span class=\"part-tag\">Part 4</span>\n<h2>造得快：模块化开发</h2>\n<p class=\"part-desc\">内部标准化、外部个性化——用模块的自由组合，换渠道响应速度和更短的开发周期。</p>\n</div>\n<article class=\"module\" id=\"s06b11\">\n<h3>乐高模式：内标准化，外个性化</h3>\n<figure class=\"diagram\" data-visual-id=\"modular-lego\" data-visual-relation=\"内部把零配件、流程、客户洞察、供应商标准化为通用模块，外部自由组合出个性化场景化产品\" data-visual-source=\"内部是模块化甚至是标准化，外部是个性化场景化的……通用的一些零配件……通用的一些开发流程啊，通用的一些客户洞察结果……供应商\" data-visual-title=\"模块化开发：乐高模式\" data-visual-type=\"结构示意图\">\n<div class=\"lego-grid\" data-grid=\"\">\n<div class=\"dnode\">\n<strong>内部 · 标准化模块</strong>\n<em>沉下去、可复用</em>\n<ul class=\"chips\" style=\"margin-top:9px\"><li style=\"list-style:none;font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:2px 10px\">通用零配件</li><li style=\"list-style:none;font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:2px 10px\">通用开发流程</li><li style=\"list-style:none;font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:2px 10px\">通用客户洞察结果</li><li style=\"list-style:none;font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:2px 10px\">供应商资源</li></ul>\n</div>\n<div aria-hidden=\"true\" class=\"lego-link\">\n<svg class=\"chev\" height=\"17\" viewbox=\"0 0 24 24\" width=\"17\"><path d=\"M4 12h14M12 6l6 6-6 6\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"2.2\"></path></svg>\n<span>模块化清单<br/>自由组合</span>\n</div>\n<div class=\"dnode\">\n<strong>外部 · 个性化产品</strong>\n<em>留出来、随场景变</em>\n<ul style=\"list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin-top:9px\"><li style=\"font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:2px 10px\">个性化外观</li><li style=\"font-size:12px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-line);border-radius:999px;padding:2px 10px\">场景化组合</li></ul>\n</div>\n</div>\n</figure>\n<p class=\"mtext\">前提是战略聚焦、品类聚焦；通用资产的盘点由产品团队牵头。</p>\n</article>\n<article class=\"module\" id=\"s06b12\">\n<h3>模块怎么拆、怎么协同</h3>\n<p class=\"msub\">模块化研发是 3C 硬件与家居产品非常重要的开发能力。</p>\n<div class=\"split2\" data-grid=\"\">\n<div>\n<p class=\"mini-h\" style=\"margin-top:12px\">两级拆解</p>\n<ul class=\"plain\">\n<li><b>基础模块</b>：如床垫的弹簧</li>\n<li><b>功能模块</b>：如内料、外层面料、颜色</li>\n<li>拆成模块化清单后自由组合</li>\n</ul>\n</div>\n<div>\n<p class=\"mini-h\" style=\"margin-top:12px\">协同作战室</p>\n<ul class=\"plain\">\n<li>组建产品开发协同小组，客户需求<b>第一天就对接</b></li>\n<li>不做「开发完→卖不好→再迭代」的返工循环</li>\n<li>延伸到客服与维修维护：可拆洗、可更换模块</li>\n</ul>\n</div>\n</div>\n<div class=\"note\">\n<span class=\"note-tag\">案例</span>\n<p>一家智能睡眠床垫企业，被称作「床垫行业的特斯拉」：以传感器＋大数据打底，对外表达三件事——<b>生态</b>（与智能手表联动）、<b>硬核科技</b>（硬件＋大数据支撑）、<b>功效</b>；产品同样按模块自由组合。</p>\n</div>\n<div class=\"note\">\n<span class=\"note-tag\">现场问答 · 边界</span>\n<p>模块化不只是供应链的事——客户洞察、协同机制这类软性资产，同样可以纳入模块化范围。</p>\n</div>\n</article>\n</section>\n</main>\n</div>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#f5f6f9\" height=\"512\" width=\"512\"></rect><circle cx=\"140\" cy=\"148\" fill=\"#4f46e5\" r=\"34\"></circle><circle cx=\"256\" cy=\"148\" fill=\"#4f46e5\" opacity=\"0.72\" r=\"34\"></circle><circle cx=\"372\" cy=\"148\" fill=\"#4f46e5\" opacity=\"0.45\" r=\"34\"></circle><path d=\"M186 148h22\" stroke=\"#b6baf0\" stroke-linecap=\"round\" stroke-width=\"6\"></path><path d=\"M304 148h22\" stroke=\"#b6baf0\" stroke-linecap=\"round\" stroke-width=\"6\"></path><path d=\"M256 190v28\" stroke=\"#b6baf0\" stroke-linecap=\"round\" stroke-width=\"6\"></path><path d=\"M256 242l-14-20h28z\" fill=\"#b6baf0\"></path><rect fill=\"#e3e6fa\" height=\"132\" rx=\"20\" width=\"288\" x=\"112\" y=\"258\"></rect><rect fill=\"#aab1f2\" height=\"46\" rx=\"10\" width=\"124\" x=\"128\" y=\"274\"></rect><rect fill=\"#4f46e5\" height=\"46\" rx=\"10\" width=\"124\" x=\"260\" y=\"274\"></rect><rect fill=\"#cdd2f7\" height=\"46\" rx=\"10\" width=\"124\" x=\"128\" y=\"328\"></rect><rect fill=\"#8f97ef\" height=\"46\" rx=\"10\" width=\"124\" x=\"260\" y=\"328\"></rect><polygon fill=\"#ffffff\" points=\"322,282 325.8,291.8 336.3,292.4 328.1,299 330.8,309.1 322,303.4 313.2,309.1 315.9,299 307.7,292.4 318.2,291.8\"></polygon></svg></template>\n","blocks":[{"id":"s06b01","type":"part","heading":"Part 1 看准：开品前三步 对应生命周期的①—③步，核心是「看准能力」。","text":"Part 1\n看准：开品前三步\n对应生命周期的①—③步，核心是「看准能力」。"},{"id":"s06b02","type":"mod","heading":"前三步：从看市场到看对手","text":"前三步：从看市场到看对手\n1\n市场洞察\n决定品类规划——选哪个赛道、如何聚焦\n2\n用户洞察\n站在客户角度，用「用户洞察 7 问」盘需求\n3\n竞品分析\n更微观一层，用「竞品分析 6 问」拆对手\n前三步直接决定：\n爆款成功率 · 新品成功率 · 新品利润率"},{"id":"s06b03","type":"mod","heading":"竞品分析六问：先收集，再找空白","text":"竞品分析六问：先收集，再找空白\n第 1–3 问 · 信息层\n先收集够\n1\n竞品是谁、是什么品\n锁定哪个竞争品牌的哪款产品\n2\n产品与功能信息\n功能特性、参数等产品信息\n3\n卖点优势是什么\n摸清对手主打的卖点与优势\n第 4–6 问 · 机会层\n找空白、抓反攻\n4\n价格带空白\n对手只有高端？如宝马有 7 系、没有 5 系和 3 系——中低价格带可切入\n5\n渠道 / 区域空白\n天猫卖得好、抖音没上；德国有、英国无——换渠道或换地域\n6\n槽点反攻\n把对手的槽点反转成我们的卖点"},{"id":"s06b04","type":"mod","heading":"槽点反攻：把对手短板变成你的卖点","text":"槽点反攻：把对手短板变成你的卖点\n共性卖点\n双方都有的基本盘\n对手槽点\n反过来看、反向要求\n反转后叠加\n卖点叠加态\n共性卖点 ＋ 反转后的对手槽点\n配合产品对比展示\n客户认知：你的品更好\n在这个点上比他好，就够了"},{"id":"s06b05","type":"part","heading":"Part 2 管好：生命周期七环节 产品力是表面的，背后是产品管理能力，本质是产品生命周期管理。","text":"Part 2\n管好：生命周期七环节\n产品力是表面的，背后是产品管理能力，本质是产品生命周期管理。"},{"id":"s06b06","type":"mod","heading":"七环节：从洞察到退出","text":"七环节：从洞察到退出\n这是每个产品都会走的通用流程，与昨天专讲的「战略大单品心法」是两回事。\n①—③ 市场洞察 · 用户洞察 · 竞品分析\n看准能力——即前三步，见 Part 1\n4\n企划\n包含定义、卖点、营销路线图，还要考虑怎么卖、节奏与品牌市场协同——严格说不只是「产品定义」，只做到产品是不够的\n5\n立项决策\n决策闸门：前四步完成后，品牌、销售、老板坐下来一起拍板开不开这个品\n6\n产品实现（双线）\n供应链产品实现 ＋ 产品表达实现——标准、专利、常规背书；提前找红人验证、种子用户测试、拍视频。启动不一定是冷启动，不是所有品都一样\n7\n上市 · 迭代 · 退出\n上市不是终点——持续迭代；退出按预设标准执行\n现场问答 · 退出标准\n退出不是必然：卖得好的产品不用退，有些产品则肯定要退。\n退出标准要提前设置\n，并尽量用客观指标量化——过去做 IPD 时偏主观判断。"},{"id":"s06b07","type":"part","heading":"Part 3 主打什么：产品角色与资源取舍 同一个品可以扮演不同角色；角色定位不同，资源打法不同。","text":"Part 3\n主打什么：产品角色与资源取舍\n同一个品可以扮演不同角色；角色定位不同，资源打法不同。"},{"id":"s06b08","type":"mod","heading":"爆品 · 战略大单品 · 旗舰","text":"爆品 · 战略大单品 · 旗舰\n单讲「爆品」其实狭隘，更要紧的叫法是战略大单品。\n过去多数产品没有外部动作，直接在平台或渠道上架——不是当旗舰，就是当爆品。\n爆品\n靠动作短期能成：低价、促销、短期买流量也能爆\n战略大单品\n＝ 代表作\n靠\n迭代\n打磨出来，不是一次性动作\n每个品类至少一个代表作：不一定最贵，但一提到就想到你\n两个可量化指标：\n市占率\n（销售数据）＋\n人群心智占有率\n（品牌端调研）\n旗舰产品\n大牌企业：旗舰与战略大单品是同一件事\n成长型企业：实力宣称——证明开品能力与技术实力，做品牌心智占位\n拉动品类与产品梯队——推高卖低、攒「长坡厚雪」的势能，真正走量的是中低端\n不一定是销售额\n代表作的分量：有 1 个是小网红，2—3 个是大网红，10 个就是歌星；周杰伦有 50 首代表作，所以是天王。"},{"id":"s06b09","type":"mod","heading":"资源往哪投：按企业阶段取舍","text":"资源往哪投：按企业阶段取舍\n现场问答要点：三个角色可能是同一个产品，但要有所区隔。\n大牌企业\n旗舰＝战略大单品，是同一件事——品牌与市场的精力全部主打旗舰大单品，机场海报都是大单品（如 vivo）。\n成长型企业\n资源投\n战略大单品\n；旗舰作为实力宣称可以带着做，但资源不重投。\n产品分层\n重点产品：核心卖点＋完整产品体验＋记忆符号；防守型产品从简，不必走这么严谨的流程。\n品类差异\n3C 的旗舰大单品，相对更强调技术。\n大单品的构成\n魂\n步骤①—④：洞察与企划\n＋\n体\n步骤⑥：产品表达＋品牌市场协同\n战略大单品\n魂体合一，这就是大单品"},{"id":"s06b10","type":"part","heading":"Part 4 造得快：模块化开发 内部标准化、外部个性化——用模块的自由组合，换渠道响应速度和更短的开发周期。","text":"Part 4\n造得快：模块化开发\n内部标准化、外部个性化——用模块的自由组合，换渠道响应速度和更短的开发周期。"},{"id":"s06b11","type":"mod","heading":"乐高模式：内标准化，外个性化","text":"乐高模式：内标准化，外个性化\n内部 · 标准化模块\n沉下去、可复用\n通用零配件\n通用开发流程\n通用客户洞察结果\n供应商资源\n模块化清单\n自由组合\n外部 · 个性化产品\n留出来、随场景变\n个性化外观\n场景化组合\n前提是战略聚焦、品类聚焦；通用资产的盘点由产品团队牵头。"},{"id":"s06b12","type":"mod","heading":"模块怎么拆、怎么协同","text":"模块怎么拆、怎么协同\n模块化研发是 3C 硬件与家居产品非常重要的开发能力。\n两级拆解\n基础模块\n：如床垫的弹簧\n功能模块\n：如内料、外层面料、颜色\n拆成模块化清单后自由组合\n协同作战室\n组建产品开发协同小组，客户需求\n第一天就对接\n不做「开发完→卖不好→再迭代」的返工循环\n延伸到客服与维修维护：可拆洗、可更换模块\n案例\n一家智能睡眠床垫企业，被称作「床垫行业的特斯拉」：以传感器＋大数据打底，对外表达三件事——\n生态\n（与智能手表联动）、\n硬核科技\n（硬件＋大数据支撑）、\n功效\n；产品同样按模块自由组合。\n现场问答 · 边界\n模块化不只是供应链的事——客户洞察、协同机制这类软性资产，同样可以纳入模块化范围。"}]},{"num":7,"id":"s07","title":"先跑通 2027，再谈三年战略","date":"2026年11月10日","css":"#sv{\n    color-scheme: light dark;\n    --page-bg:#F4F5F7;\n    --surface:#FFFFFF;\n    --surface-2:#F7F8FA;\n    --ink:#171A21;\n    --ink-2:#3F4654;\n    --muted:#69707F;\n    --border:#E4E7EC;\n    --border-strong:#C9CFDA;\n    --accent:#2547C8;\n    --accent-soft:#EAEEFB;\n    --accent-contrast:#FFFFFF;\n    --warm:#D9482B;\n    --warm-soft:#FBEBE6;\n    --warm-contrast:#FFFFFF;\n    --ring-a:#E3E9FA;\n    --ring-b:#F2F4F9;\n    --shadow:0 1px 2px rgba(16,24,40,.05);\n    --font-sans:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",\"Segoe UI\",Roboto,sans-serif;\n    --font-serif:\"Songti SC\",\"Noto Serif SC\",\"Source Han Serif SC\",\"STSong\",\"SimSun\",serif;\n  }\n@media (prefers-color-scheme: dark){\n#sv{\n      --page-bg:#0E1015;\n      --surface:#161A23;\n      --surface-2:#1B202C;\n      --ink:#E9ECF3;\n      --ink-2:#C6CCDA;\n      --muted:#939CB0;\n      --border:#272E3C;\n      --border-strong:#3A4356;\n      --accent:#93A8FF;\n      --accent-soft:#1D2745;\n      --accent-contrast:#10131C;\n      --warm:#FF7A59;\n      --warm-soft:#33201B;\n      --warm-contrast:#2A120B;\n      --ring-a:#1B2340;\n      --ring-b:#151B2C;\n      --shadow:none;\n    }\n}\n*{box-sizing:border-box}\n#sv{scroll-behavior:smooth}\n#sv,#sv{background-color:var(--page-bg)}\n#sv{\n    margin:0;\n    font-family:var(--font-sans);\n    color:var(--ink);\n    font-size:15.5px;\n    line-height:1.75;\n    -webkit-font-smoothing:antialiased;\n  }\n.wrap{max-width:880px;margin:0 auto;padding:0 18px 70px}\n/* ---------- Hero ---------- */\n  .hero{position:relative;overflow:hidden;padding:42px 0 26px;border-bottom:1px solid var(--border)}\n.hero-rings{position:absolute;right:-70px;top:-46px;width:250px;height:250px;color:var(--border-strong);opacity:.55;pointer-events:none}\n.hero-rings .hdot{fill:var(--warm)}\n.kicker{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--accent)}\n.kicker::before{content:\"\";width:18px;height:2px;background:var(--accent)}\nh1{font-family:var(--font-serif);font-weight:700;font-size:clamp(27px,5.4vw,40px);line-height:1.3;letter-spacing:.01em;margin:14px 0 18px}\n.chips{display:flex;flex-wrap:wrap;gap:8px}\n.chips a{\n    font-size:12.5px;color:var(--ink-2);text-decoration:none;\n    padding:5px 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);\n    transition:color .15s,border-color .15s;\n  }\n.chips a:hover{color:var(--accent);border-color:var(--accent)}\n/* ---------- Part ---------- */\n  .part-head{display:flex;align-items:center;gap:12px;margin:38px 0 14px}\n.part-num{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--accent)}\n.part-title{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted)}\n.part-rule{flex:1;height:1px;background:var(--border)}\n/* ---------- Module ---------- */\n  .module{\n    background:var(--surface);border:1px solid var(--border);border-radius:16px;\n    padding:clamp(18px,3.4vw,30px);box-shadow:var(--shadow);margin-bottom:18px;\n  }\n.m-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}\n.m-index{\n    font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em;
