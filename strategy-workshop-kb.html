ed;\n  --border:#e1e5f0;\n  --bad:#b3452e;\n  --bad-soft:#f9e9e4;\n  --muted-block:#c6cde5;\n  --c-red:#d64541;\n  --c-yel:#d0930f;\n  --c-blu:#4a7bd8;\n  --radius:14px;\n  --font:-apple-system,\"PingFang SC\",\"Segoe UI\",\"Microsoft YaHei\",sans-serif;\n}\n@media (prefers-color-scheme: dark){\n#sv{\n    --page-bg:#0e1017;\n    --surface:#161a26;\n    --surface-2:#1d2331;\n    --text:#e9ebf4;\n    --text-2:#9aa3bd;\n    --accent:#93a2f7;\n    --accent-deep:#c3ccfa;\n    --accent-soft:#242b4a;\n    --secondary:#5cc9b8;\n    --secondary-soft:#153530;\n    --border:#2b3043;\n    --bad:#e58a70;\n    --bad-soft:#3a2620;\n    --muted-block:#394056;\n    --c-red:#e05a4f;\n    --c-yel:#e0b23e;\n    --c-blu:#6d97e8;\n  }\n}\n*{box-sizing:border-box;margin:0;padding:0}\n#sv{color-scheme:light dark}\n#sv,#sv{background-color:var(--page-bg)}\n#sv{font-family:var(--font);color:var(--text);line-height:1.75;font-size:15.5px;-webkit-font-smoothing:antialiased}\n.wrap{max-width:820px;margin:0 auto;padding:30px 18px 70px}\n/* 头部 */\n.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--accent);font-weight:700}\nh1{font-size:29px;line-height:1.32;font-weight:800;margin:10px 0 14px;letter-spacing:.01em}\n.lede{color:var(--text-2);font-size:16px}\n.lede b{color:var(--text)}\n.aud{margin-top:14px;font-size:12.5px;color:var(--text-2);border-top:1px solid var(--border);padding-top:10px}\n/* Part 分区 */\n.part{margin-top:46px}\n.part-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--border);padding-bottom:10px;margin-bottom:18px}\n.part-no{font-size:12px;font-weight:800;color:var(--secondary);letter-spacing:.14em;white-space:nowrap}\n.part-head h2{font-size:20px;font-weight:800}\n/* 模块 */\n.mod{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 20px 18px;margin-bottom:16px}\n.mod h3{font-size:17px;font-weight:800;margin-bottom:8px;line-height:1.45}\n.mod p{margin:7px 0}\n.mod p.muted{color:var(--text-2);font-size:13.5px}\n.note{font-size:13px;color:var(--text-2);background:var(--surface-2);border-left:3px solid var(--secondary);padding:9px 13px;border-radius:0 9px 9px 0;margin-top:12px;line-height:1.7}\n.note b{color:var(--text)}\n.hot{display:inline-block;font-size:11px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);padding:2px 9px;border-radius:999px;vertical-align:2px;margin-left:6px;white-space:nowrap}\nb{font-weight:700}\n.kw{color:var(--accent-deep);font-weight:700}\n@media (prefers-color-scheme: dark){\n.kw{color:var(--accent-deep)}\n}\n/* figure 通用 */\nfigure{margin:14px 0 4px}\nfigure svg{display:block;width:100%;height:auto}\nfigcaption{font-size:12.5px;color:var(--text-2);margin-top:8px}\n.svgwrap{width:100%}\n/* 级联条 */\n.cascade{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-bottom:13px}\n.cascade .step{background:var(--accent-soft);color:var(--accent-deep);font-weight:700;padding:4px 12px;border-radius:999px}\n.cascade .arr{color:var(--text-2);font-weight:700}\n/* A1 四列卡 */\n.cols4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}\n@media(max-width:640px){\n.cols4{grid-template-columns:1fr 1fr}\n}\n.colcard{border:1px solid var(--border);border-radius:10px;padding:12px 12px 11px;background:var(--surface-2)}\n.colcard .ogsm{font-size:11px;font-weight:800;color:var(--secondary);letter-spacing:.06em}\n.colcard .q{font-weight:800;font-size:14.5px;margin:4px 0 3px}\n.colcard .d{font-size:12.5px;color:var(--text-2);line-height:1.6}\n/* A2 企业架构 */\n.arch{display:flex;flex-direction:column;gap:7px}\n.arch .layer{border:1px solid var(--border);border-radius:10px;padding:9px 14px;display:flex;gap:12px;align-items:baseline}\n.arch .lab{font-size:12px;font-weight:800;color:var(--secondary);min-width:62px;white-space:nowrap}\n.arch .val{font-size:13.5px;line-height:1.65}\n.arch .layer.goal{background:var(--accent-soft);border-color:transparent}\n.arch .layer.goal .lab{color:var(--accent-deep)}\n.arch .layer.base{background:var(--surface-2)}\n.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--border);padding:1px 7px;border-radius:6px;font-size:12.5px;white-space:nowrap}\n.arch .layer.goal .formula{background:rgba(255,255,255,.55)}\n@media (prefers-color-scheme: dark){\n.arch .layer.goal .formula{background:rgba(0,0,0,.25)}\n}\n@media(max-width:560px){\n.arch .layer{flex-direction:column;gap:3px;padding:9px 12px}\n}\n/* A3 四力链 */\n.chain{display:flex;flex-direction:column;max-width:560px}\n.cl{padding:10px 15px;border-radius:10px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;border-left:4px solid var(--accent)}\n.cl span{font-weight:500;font-size:13px;color:var(--text-2)}\n.cl.l4{background:var(--accent-soft);border-color:var(--accent)}\n.cl.l3,.cl.l2{background:var(--surface-2);border-color:var(--border)}\n.cl.l1{background:var(--secondary-soft);border-color:var(--secondary)}\n.bec{font-size:12.5px;color:var(--text-2);padding:4px 0 4px 20px;line-height:1.5}\n.bec b{color:var(--accent-deep)}\n.goose{margin-top:14px;border:1.5px dashed var(--secondary);border-radius:10px;padding:11px 14px;font-size:13.5px;color:var(--text-2);line-height:1.7;max-width:560px}\n.goose b{color:var(--text)}\n/* B1 矩阵 */\n.mx-head{font-size:12.5px;color:var(--text-2);margin-bottom:10px}\n.mx-head b{color:var(--text)}\n.mx-causal{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-2);margin-bottom:10px;flex-wrap:wrap}\n.mx-causal .pillc{font-weight:800;padding:2px 10px;border-radius:999px;font-size:12px}\n.mx-causal .pc1{background:var(--accent-soft);color:var(--accent-deep)}\n.mx-causal .pc2{background:var(--secondary-soft);color:var(--secondary)}\n.mxr{display:grid;grid-template-columns:72px 56px 78px 1fr;gap:9px;align-items:center;padding:10px 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);margin-bottom:7px}\n.mxr .f{font-weight:800;font-size:14.5px}\n.b{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);white-space:nowrap}\n.b.chem{background:var(--secondary-soft);color:var(--secondary)}\n.mxr .md{font-size:13px;color:var(--text-2);line-height:1.6}\n@media(max-width:600px){\n.mxr{display:flex;flex-wrap:wrap}\n.mxr .md{width:100%;padding-left:2px}\n}\n/* B2 经营力 */\n.twolines{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n@media(max-width:560px){\n.twolines{grid-template-columns:1fr}\n}\n.tl{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface-2)}\n.tl .no{font-size:11.5px;font-weight:800;color:var(--secondary);letter-spacing:.08em}\n.tl .t{font-weight:800;font-size:14.5px;margin:3px 0 2px}\n.tl .d{font-size:12.5px;color:var(--text-2);line-height:1.6}\n.metric{margin-top:10px;font-size:13px;color:var(--text-2);line-height:1.7}\n.metric b{color:var(--text)}\n/* B3 双卡 */\n.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n@media(max-width:560px){\n.duo{grid-template-columns:1fr}\n}\n.duo-card{border:1px solid var(--border);border-radius:10px;padding:13px 15px;background:var(--surface-2)}\n.duo-card .h{font-size:12px;font-weight:800;letter-spacing:.06em}\n.duo-card .big{font-size:17px;font-weight:800;margin:5px 0 3px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}\n.duo-card .d{font-size:12.5px;color:var(--text-2)}\n.duo-card.phys{border-left:4px solid var(--accent)}\n.duo-card.phys .h{color:var(--accent-deep)}\n.duo-card.chem{border-left:4px solid var(--secondary)}\n.duo-card.chem .h{color:var(--secondary)}\n/* B4 5+5 */\n.flowline{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}\n.fl-src{font-weight:800;font-size:13px;padding:5px 13px;border-radius:999px}\n.fl-src.out{background:var(--accent-soft);color:var(--accent-deep)}\n.fl-src.in{background:var(--secondary-soft);color:var(--secondary)}\n.fl-arr{color:var(--text-2);font-weight:800}\n.fl-t{border:1px solid var(--border);border-radius:8px;padding:3px 12px;font-size:13.5px;font-weight:700;background:var(--surface)}\n.ovl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 4px;font-size:13px;color:var(--text-2)}\n.ovl .pill{font-weight:800;font-size:13px;padding:5px 13px;border-radius:999px;background:linear-gradient(90deg,var(--accent-soft) 50%,var(--secondary-soft) 50%);color:var(--text)}\n.ovl b{color:var(--accent-deep)}\n.anta{margin-top:14px;border-top:1px dashed var(--border);padding-top:11px}\n.anta .ah{font-size:13px;font-weight:800;margin-bottom:5px}\n.anta ul{list-style:none}\n.anta li{font-size:13.5px;padding:3px 0 3px 18px;position:relative;color:var(--text-2);line-height:1.65}\n.anta li::before{content:\"→\";position:absolute;left:0;color:var(--accent);font-weight:800}\n.anta li b{color:var(--text)}\ntable.cmp{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:12px}\n.cmp th{text-align:left;font-size:12px;color:var(--text-2);font-weight:700;padding:6px 8px;border-bottom:2px solid var(--border)}\n.cmp td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.6}\n.cmp td.lab{font-weight:600;width:52%}\n.cmp td.bad{color:var(--bad);font-weight:700;width:38%}\n.cmp tr:last-child td{border-bottom:none}\n.cmp .go{color:var(--secondary);font-weight:800}\n/* B5 三力卡 */\n.forcecards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}\n@media(max-width:640px){\n.forcecards{grid-template-columns:1fr}\n}\n.fc{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface-2)}\n.fc-h{font-weight:800;font-size:14.5px;margin-bottom:6px;display:flex;align-items:center;gap:8px}\n.fc ol{padding-left:20px;font-size:13px;color:var(--text-2);line-height:1.65}\n.fc ol li{margin:3px 0}\n.fc ol li b{color:var(--text)}\n.fc-n{font-size:12.5px;color:var(--text-2);margin-top:7px;line-height:1.6}\n.org41{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:10px}\n.o41{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface)}\n.o41.tool{border-style:dashed;color:var(--text-2)}\n.pick{font-size:12px;font-weight:800;color:var(--secondary);white-space:nowrap}\n/* C1 写法对比 */\n.w-bad .wb{border:1px solid var(--bad);background:var(--bad-soft);border-radius:10px;padding:9px 13px;margin-bottom:8px}\n.wb s{text-decoration:line-through;font-weight:700;color:var(--bad)}\n.wb span{display:block;font-size:12.5px;color:var(--text-2);margin-top:1px}\n.w-good{border:1px solid var(--secondary);background:var(--secondary-soft);border-radius:10px;padding:12px 15px;margin-top:12px}\n.wg-h{font-size:13px;font-weight:800;color:var(--secondary);margin-bottom:5px}\n.w-good ul{list-style:none}\n.w-good li{font-size:13.5px;padding:3px 0 3px 16px;position:relative;line-height:1.65}\n.w-good li::before{content:\"✓\";position:absolute;left:0;color:var(--secondary);font-weight:800}\n/* C2 成事四要素 */\n.fe-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}\n@media(max-width:640px){\n.fe-grid{grid-template-columns:1fr 1fr}\n}\n.fe{border:1px solid var(--border);border-radius:10px;padding:15px 12px 11px;background:var(--surface-2);position:relative}\n.fe .n{position:absolute;top:-11px;left:11px;background:var(--accent);color:var(--page-bg);width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}\n.fe .t{font-weight:800;font-size:14px;margin-bottom:3px}\n.fe .d{font-size:12.5px;color:var(--text-2);line-height:1.6}\n/* C3 对照表 + C4 案例 */\n.inst td.bad{color:var(--bad)}\n.blame{display:flex;flex-direction:column;gap:6px;margin:12px 0}\n.blame .bm{font-size:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:8px 12px;color:var(--text-2);line-height:1.6}\n.blame .bm b{color:var(--text)}\n.case-fix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}\n@media(max-width:560px){\n.case-fix{grid-template-columns:1fr}\n}\n.cf{border:1px solid var(--border);border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.65;background:var(--surface-2)}\n.cf .b{margin-right:6px}\n.gold{margin-top:12px;border:1.5px dashed var(--accent);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--text-2);line-height:1.7}\n.gold b{color:var(--accent-deep)}\n/* D1 */\n.colorrule{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}\n.cr{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2)}\n.cr i{width:10px;height:10px;border-radius:50%;display:inline-block}\n.cr.red i{background:var(--c-red)}\n.cr.yel i{background:var(--c-yel)}\n.cr.blu i{background:var(--c-blu)}\n.next{margin-top:14px;padding:11px 14px;border-radius:10px;background:var(--accent-soft);font-size:13.5px}\n.next b{color:var(--accent-deep)}\n/* Component-name-agnostic mobile safety net.\n   Structural guarantees are expressed against CSS Grid/Flex behaviour and\n   generic attribute hooks rather than a fixed class vocabulary,so generating\n   models may invent component names freely for any recording type. */\n*,*::before,*::after{ box-sizing: border-box; }\n#sv{ width: 100%; min-width: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n#sv{ width: 100%; min-width: 0; margin: 0; overflow-wrap: break-word; }\nmain,header,footer,nav,section,article,aside,figure,div,ul,ol,li,dl,dd,details{ min-width: 0; }\nimg,picture,video,canvas,svg{ display: block; max-width: 100%; height: auto; }\npre,code,kbd,samp{ max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }\nh1,h2,h3,h4,h5,h6,p,li,td,th,dt,dd,blockquote,figcaption{ overflow-wrap: anywhere; }\ninput,textarea,select,button{ max-width: 100%; font: inherit; }\n/* Any table gets a scroll container by intent or by generic hook. */\n.table-scroll,.table-wrap,.matrix-wrap,[data-table-scroll],[data-scroll-x]{\n  max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;\n}\n.table-scroll > table,.table-wrap > table,.matrix-wrap > table,[data-table-scroll] > table,[data-scroll-x] > table{ margin: 0; }\n/* Numbered step rows: keep #sv copy out of the counter track. */\n.step-item,[data-step-item]{ grid-template-columns: 32px minmax(0, 1fr) !important; }\n.step-item::before,[data-step-item]::before{ grid-column: 1 !important; grid-row: 1 !important; }\n.step-item > :empty,[data-step-item] > :empty{ display: none !important; }\n.step-item > *,[data-step-item] > *{ grid-column: 2 !important; min-width: 0 !important; }\n.data-value,.metric-value,[data-value]{ max-width: 100%; font-variant-numeric: tabular-nums; }\n/* A single surviving child of ANY grid spans the full row. Applied to every\n   element that declares a grid,so unknown component names are covered too. */\n[class*=\"grid\"] > :only-child,[class*=\"board\"] > :only-child,[class*=\"cluster\"] > :only-child,[class*=\"row\"] > :only-child,[class*=\"split\"] > :only-child,[class*=\"cols\"] > :only-child,[class*=\"columns\"] > :only-child,[class*=\"layout\"] > :only-child,[class*=\"panel\"] > :only-child,[data-grid] > :only-child,[data-cols] > :only-child{\n  grid-column: 1 / -1 !important;\n  width: 100% !important;\n}\n@media (max-width: 600px){\n#sv{ font-size: 14.5px !important; line-height: 1.62 !important; }\n:where(#sv > main,#sv > .report-shell,#sv > .report,#sv > .container,#sv > [data-shell]){\n    width: calc(100% - 40px) !important;\n    max-width: 100% !important;\n    margin-inline: auto !important;\n  }\nh1{ font-size: 29px !important; line-height: 1.22 !important; letter-spacing: 0 !important; }\nh2{ font-size: 22px !important; line-height: 1.3 !important; letter-spacing: 0 !important; }\nh3{ font-size: 16px !important; line-height: 1.42 !important; letter-spacing: 0 !important; }\n/* Generic collapse: every multi-column grid becomes single column unless it\n     explicitly opts into staying paired (data-keep-columns) or is a table. */\n  [class*=\"grid\"]:not([data-keep-columns]),[class*=\"board\"]:not([data-keep-columns]),[class*=\"split\"]:not([data-keep-columns]),[class*=\"cols\"]:not([data-keep-columns]),[class*=\"columns\"]:not([data-keep-columns]),[class*=\"layout\"]:not([data-keep-columns]),[data-grid]:not([data-keep-columns]){\n    grid-template-columns: minmax(0, 1fr) !important;\n  }\n/* Compact numeric clusters may stay two-up,but a trailing odd card must\n     span both columns so no empty half-row is left on narrow screens. */\n  [data-keep-columns]{ grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }\n[data-keep-columns] > :last-child:nth-child(odd){ grid-column: 1 / -1 !important; }\n[data-span-all],[data-value-kind=\"formula\"],[data-value-kind=\"range\"]{ grid-column: 1 / -1 !important; }\n/* Horizontal flows become vertical. */\n  [class*=\"flow\"],[class*=\"chain\"],[class*=\"timeline\"]{ flex-direction: column !important; }\n[class*=\"arrow\"]{ transform: rotate(90deg); min-height: 16px !important; }\ntable{ font-size: 12.5px; }\nth,td{ padding: 9px 8px !important; }\nnav{ max-width: 100%; }\nnav[data-scrollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}","body":"\n<div class=\"wrap\">\n<header class=\"masthead\">\n<div class=\"eyebrow\">战略解码工作坊 · 第三天</div>\n<h1>4×4战略地图：四力解码与关键任务写法</h1>\n<p class=\"lede\">战略的目的在于<b>装载</b>：菜在厨房已经做好，战略地图把它端上餐桌。<b>战略不是结果导向，而是因果导向</b>——自下而上，从因到果。工具只是载体：有想法，什么工具都好用；没想法，什么工具都不好用。</p>\n<p class=\"aud\">本页为组长、书记向组内转达使用的方法汇总。</p>\n</header>\n<\u0021-- ================= PART 1 ================= -->\n<section class=\"part\" id=\"s10b01\">\n<div class=\"part-head\"><span class=\"part-no\">PART 1</span><h2>地图骨架：先看懂整体逻辑</h2></div>\n<div class=\"mod\" id=\"s10b02\">\n<h3>四要素：把 OGSM 收进一页</h3>\n<p>OGSM 完整表共 8 列；先收成 4 列快速表达，再由部门承载战略输出。一个事要描述清楚：打什么仗、怎么打、怎样才算打赢、谁来打。</p>\n<figure data-visual-id=\"strategy-four-columns-map\" data-visual-relation=\"OGSM 8列收成4列：打什么仗(O+S)、怎么打(S)、怎样算赢(G+M含日期)、谁来打(责任人)\" data-visual-source=\"第一要打什么仗相当于OSM的OS……怎样才算打赢相当于G+M……谁来打就是责任人\" data-visual-title=\"战略地图四要素与OGSM对应\" data-visual-type=\"映射图\">\n<div class=\"cascade\">\n<span class=\"step\">OGSM 完整表 · 8列</span><span class=\"arr\">→</span>\n<span class=\"step\">战略地图 · 4列</span><span class=\"arr\">→</span>\n<span class=\"step\">部门承载战略输出</span>\n</div>\n<div class=\"cols4\" data-grid=\"\">\n<div class=\"colcard\"><div class=\"ogsm\">O + S</div><div class=\"q\">① 打什么仗</div><div class=\"d\">战略举措，动词 + 宾语</div></div>\n<div class=\"colcard\"><div class=\"ogsm\">S · 策略</div><div class=\"q\">② 怎么打</div><div class=\"d\">战法战术：要素（如数据）＋ 关键任务（如洞察出机会结论）</div></div>\n<div class=\"colcard\"><div class=\"ogsm\">G + M</div><div class=\"q\">③ 怎样才算打赢</div><div class=\"d\">衡量全在这一列，完成日期也在这里</div></div>\n<div class=\"colcard\"><div class=\"ogsm\">责任人</div><div class=\"q\">④ 谁来打</div><div class=\"d\">能征善战的人：谁正面进攻、谁侧翼协同</div></div>\n</div>\n</figure>\n</div>\n<div class=\"mod\" id=\"s10b03\">\n<h3>企业经营全景：先看懂生意</h3>\n<p>无论 to B 还是 to C，企业的完整逻辑就这一张图。</p>\n<figure data-visual-id=\"enterprise-architecture-map\" data-visual-relation=\"利润=收入−成本；收入=流量×转化×客单×复购漏斗；多组渠道+双洞察驱动销售与开品；底座是组织机制人才文化数字化\" data-visual-source=\"利润等于什么？收入减成本……流量乘以转化率乘以客单价乘以复购率……组织机制、人才、文化、数字化\" data-visual-title=\"企业经营全景架构\" data-visual-type=\"架构图\">\n<div class=\"arch\">\n<div class=\"layer goal\"><span class=\"lab\">经营目标</span><span class=\"val\">规模与利润 ＝ <span class=\"formula\">收入 − 成本</span>（开源节流、降本增效）</span></div>\n<div class=\"layer\"><span class=\"lab\">收入引擎</span><span class=\"val\">收入 ＝ <span class=\"formula\">流量 × 转化率 × 客单价 × 复购率</span>，从线索到成交的漏斗，规模 × 效率决定产出</span></div>\n<div class=\"layer\"><span class=\"lab\">销售渠道</span><span class=\"val\">站内 · 站外品牌市场（空中力量，加持地面销售）· 线下 · to B / 外贸——公司A按 4–5 组渠道支撑总目标</span></div>\n<div class=\"layer\"><span class=\"lab\">双洞察</span><span class=\"val\">用户洞察 → 爆品策划；市场洞察 → 品类规划与赛道。聚焦人群贯穿语料、话术、产品、内容与达人；最终落点是<b>产品定义 ＋ 产品实现</b></span></div>\n<div class=\"layer\"><span class=\"lab\">两大成本</span><span class=\"val\">产品成本 · 营销成本 · 人力成本</span></div>\n<div class=\"layer base\"><span class=\"lab\">底座</span><span class=\"val\">组织机制 · 人才 · 文化 · 数字化</span></div>\n</div>\n</figure>\n<p class=\"note\">这张图<b>与组织架构无关</b>，是企业整体逻辑。品质在哪、产品开发在哪、各渠道在哪——每个人都能对号入座。图不为某家公司定制，理解逻辑即可。</p>\n</div>\n<div class=\"mod\" id=\"s10b04\">\n<h3>四力因果链：持续挣钱从哪来</h3>\n<p>张一鸣受访时说：<span class=\"kw\">挣钱并不难，持续挣钱才难</span>。要持续挣钱，就得有人持续买单；买单是因为产品好；产品是团队做出来的。</p>\n<figure data-visual-id=\"four-forces-chain\" data-visual-relation=\"组织力→产品力→营销力→经营力，自下而上从因到果；鹅蛋比喻：养鹅人决定一切\" data-visual-source=\"挣钱并不难持续挣钱才难……因为产品好……产品是谁做出来的？团队做出来的……养鹅人决定的\" data-visual-title=\"四力支撑链：从养鹅人到持续挣钱\" data-visual-type=\"关系图\">\n<div class=\"chain\">\n<div class=\"cl l4\">经营力<span>规模与利润，持续挣钱</span></div>\n<div class=\"bec\">↑ 持续有人买单——靠 <b>营销力</b></div>\n<div class=\"cl l3\">营销力<span>有人买、持续买</span></div>\n<div class=\"bec\">↑ 为什么买单？产品好——靠 <b>产品力</b></div>\n<div class=\"cl l2\">产品力<span>产品好</span></div>\n<div class=\"bec\">↑ 产品是谁做的？团队——靠 <b>组织力</b></div>\n<div class=\"cl l1\">组织力<span>团队、协同机制（养鹅人）</span></div>\n</div>\n<div class=\"goose\"><b>鹅蛋比喻：</b>鹅蛋好卖，是因为买的人多；买的人多，是因为鹅蛋好。但鹅蛋不只是产品——<b>鹅、生活环境、喂养方法，整个才是产品</b>；决定这一切的是养鹅人。产品本身、生产过程、组织，都是产品。</div>\n</figure>\n<p class=\"muted\">两个衔接：A 类大客户打法叫「攻略」，不必叫 SOP；抖音年框交 ×× 亿，平台按流量 × 转化率测算出约 ×× 亿销售额——营销力直接变成经营数字。</p>\n</div>\n</section>\n<\u0021-- ================= PART 2 ================= -->\n<section class=\"part\" id=\"s10b05\">\n<div class=\"part-head\"><span class=\"part-no\">PART 2</span><h2>纵向四层面：每层写几条、写什么</h2></div>\n<div class=\"mod\" id=\"s10b06\">\n<h3>4×4 矩阵总览与条数配额</h3>\n<p>横向四要素 × 纵向四层面，就是 4×4 战略矩阵，也叫战略地图。记住每层的条数配额，别写成目标清单。</p>\n<figure data-visual-id=\"matrix-4x4-causal\" data-visual-relation=\"横向四要素×纵向四层面；经营力2条物理拆解，其余三力化学分解；合计七八条、不超10条\" data-visual-source=\"这个表叫4×4的战略矩阵……经营力肯定是占两条……最多不超过10条\" data-visual-title=\"4×4战略矩阵与条数配额\" data-visual-type=\"矩阵图\">\n<div class=\"mx-head\">横向四要素：<b>战略举措 · 关键任务 · 衡量标准 · 责任人</b></div>\n<div class=\"mx-causal\"><span class=\"pillc pc1\">果 · 顶部</span><span>自下而上，从因到果</span><span class=\"pillc pc2\">因 · 底部</span></div>\n<div class=\"mxr\" data-grid=\"\"><div class=\"f\">经营力</div><span class=\"b\">2 条</span><span class=\"b chem\">物理拆解</span><div class=\"md\">销售额＋毛利，必须写出结构；衡量百分百达成</div></div>\n<div class=\"mxr\" data-grid=\"\"><div class=\"f\">营销力</div><span class=\"b\">≤3 条</span><span class=\"b chem\">化学分解</span><div class=\"md\">人群品牌市场＋区域/品类打法，支撑销售结构</div></div>\n<div class=\"mxr\" data-grid=\"\"><div class=\"f\">产品力</div><span class=\"b\">2 条</span><span class=\"b chem\">化学分解</span><div class=\"md\">货盘大单品＋供应链</div></div>\n<div class=\"mxr\" data-grid=\"\"><div class=\"f\">组织力</div><span class=\"b\">≤2 条</span><span class=\"b chem\">化学分解</span><div class=\"md\">协同、机制、人才、文化、工具，5 选 2</div></div>\n</figure>\n<p class=\"note\">合计<b>七八条合理，最多不超过 10 条</b>（已按业态分页）。国家「十五五」规划的战略地图也只有 7 条——条数偏多，说明归纳能力不够。</p>\n</div>\n<div class=\"mod\" id=\"s10b07\">\n<h3>经营力：只有两条，先拆结构</h3>\n<p>备注先写「物理拆解」——<b>先不考虑如何实现</b>，先把销售和毛利目标的数字与结构拆清楚。</p>\n<figure data-visual-id=\"operating-force-two-lines\" data-visual-relation=\"只写两条：销售额+结构，毛利或成本控制；衡量百分百达成，争取市占率排名；不允许第三条\" data-visual-source=\"尽力的第二条写毛利……不允许出现第三条……衡量标准是叫做百分百达成\" data-visual-title=\"经营力两条：开源与节流\" data-visual-type=\"结构图\">\n<div class=\"twolines\" data-grid=\"\">\n<div class=\"tl\"><div class=\"no\">① 开源</div><div class=\"t\">27 年实现销售额 __ 亿</div><div class=\"d\">必须写出结构：国家/区域、品类、客户或业态——不能只写「3 个亿」</div></div>\n<div class=\"tl\"><div class=\"no\">② 节流</div><div class=\"t\">毛利 / 毛利率，或成本控制</div><div class=\"d\">右侧注明要优化管理的成本结构</div></div>\n</div>\n<div class=\"metric\"><b>衡量标准：</b>百分百达成（或结构性百分百达成）；争取加上市占率或排名，to C 大单品尤其要关注；「我就超过某某某」也是合格写法，几个人一起判断即可。<b>不允许第三条</b>——除非有一天为配合上市。</div>\n</figure>\n<figure data-visual-id=\"market-share-pie-bar\" data-visual-relation=\"逐年总额是柱状图；市场份额占比才是饼状图，是战略思维\" data-visual-source=\"战略不是柱状图而是饼状图……我吃多少的比例才是战略思维\" data-visual-title=\"柱状图不是战略，饼状图才是\" data-visual-type=\"对比图\">\n<svg aria-label=\"柱状图与饼状图对比\" role=\"img\" viewbox=\"0 0 520 244\">\n<text fill=\"var(--text)\" font-size=\"14\" font-weight=\"700\" x=\"30\" y=\"28\">柱状图 · 总额在涨</text>\n<text fill=\"var(--text)\" font-size=\"14\" font-weight=\"700\" x=\"308\" y=\"28\">饼状图 · 我占多少</text>\n<line stroke=\"var(--border)\" stroke-dasharray=\"4 5\" stroke-width=\"1.5\" x1=\"262\" x2=\"262\" y1=\"44\" y2=\"228\"></line>\n<g>\n<rect fill=\"var(--muted-block)\" height=\"19\" rx=\"3\" width=\"34\" x=\"46\" y=\"177\"></rect>\n<rect fill=\"var(--muted-block)\" height=\"56\" rx=\"3\" width=\"34\" x=\"96\" y=\"140\"></rect>\n<rect fill=\"var(--muted-block)\" height=\"93\" rx=\"3\" width=\"34\" x=\"146\" y=\"103\"></rect>\n<rect fill=\"var(--accent)\" height=\"130\" rx=\"3\" width=\"34\" x=\"196\" y=\"66\"></rect>\n<text fill=\"var(--text-2)\" font-size=\"12\" text-anchor=\"middle\" x=\"63\" y=\"171\">1亿</text>\n<text fill=\"var(--text-2)\" font-size=\"12\" text-anchor=\"middle\" x=\"113\" y=\"134\">3亿</text>\n<text fill=\"var(--text-2)\" font-size=\"12\" text-anchor=\"middle\" x=\"163\" y=\"97\">5亿</text>\n<text fill=\"var(--accent-deep)\" font-size=\"12\" font-weight=\"700\" text-anchor=\"middle\" x=\"213\" y=\"60\">7亿</text>\n<text fill=\"var(--text-2)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"63\" y=\"215\">三年前</text>\n<text fill=\"var(--text-2)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"113\" y=\"215\">两年前</text>\n<text fill=\"var(--text-2)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"163\" y=\"215\">一年前</text>\n<text fill=\"var(--text-2)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"213\" y=\"215\">今年</text>\n<text fill=\"var(--text-2)\" font-size=\"11.5\" text-anchor=\"middle\" x=\"138\" y=\"238\">数额逐年涨，不等于有竞争力</text>\n</g>\n<g>\n<circle cx=\"392\" cy=\"128\" fill=\"var(--surface-2)\" r=\"70\" stroke=\"var(--border)\" stroke-width=\"1.5\"></circle>\n<path d=\"M392,128 L392,58 A70,70 0 0 1 448.6,169.1 Z\" fill=\"var(--accent)\"></path>\n<text fill=\"var(--accent-deep)\" font-size=\"12.5\" font-weight=\"700\" text-anchor=\"start\" x=\"462\" y=\"112\">我的份额</text>\n<line stroke=\"var(--text-2)\" stroke-width=\"1.2\" x1=\"440\" x2=\"458\" y1=\"118\" y2=\"114\"></line>\n<text fill=\"var(--text-2)\" font-size=\"12.5\" x=\"330\" y=\"222\">市场是一块饼，比例够大就有竞争力</text>\n</g>\n</svg>\n<figcaption>左为讲师示意数字。西欧、北美各是一块饼，吃下多少比例，才是战略思维。</figcaption>\n</figure>\n<p class=\"note\"><b>战略思维要结构，生意思维要总额。</b>今年总额达成但结构乱，明年问题就会爆发。战略的「战」是占有的占——市占率和排名，比销售额做多少重要得多。</p>\n</div>\n<div class=\"mod\" id=\"s10b08\">\n<h3>物理拆解与化学分解</h3>\n<p>四个力只有两种拆法，混用就错了。</p>\n<figure data-visual-id=\"physical-chemical-decomposition\" data-visual-relation=\"10亿拆6+4是物理拆解（经营力）；水拆成2H+O是化学分解（营销/产品/组织力）；只有目标值没有任务是欲望\" data-visual-source=\"把10个亿拆成6个亿加4个亿，这叫物理分解……把水拆成两个氢和一个氧……后面三个力叫化学分解\" data-visual-title=\"物理分解与化学分解\" data-visual-type=\"对比图\">\n<div class=\"duo\" data-grid=\"\">\n<div class=\"duo-card phys\"><div class=\"h\">物理分解 · 经营力</div><div class=\"big\">10亿 → 6亿 + 4亿</div><div class=\"d\">拆数字和结构，把总额说清</div></div>\n<div class=\"duo-card chem\"><div class=\"h\">化学分解 · 营销/产品/组织力</div><div class=\"big\">H₂O → 2H + O</div><div class=\"d\">拆出本质要素，拆出「怎么实现」</div></div>\n</div>\n</figure>\n<p class=\"note\">很多企业的战略定的全是目标值：「明年增长 40%」，大家拼拼凑凑凑够 40%，反手给老板画回一张饼——全程没有「如何实现的任务」。<b>这不是战略，是欲望。</b></p>\n</div>\n<div class=\"mod\" id=\"s10b09\">\n<h3>5+5 推导：三力内容的来源</h3>\n<p>营销力、产品力、组织力写什么，从前两天的 5+5 推导：<b>向外求 5 个增长点，向内求 5 个卡点</b>。向外求是大鱼大肉（业务增长），向内求是素菜（内部管理）——荤素搭配，挣钱与健康都重要。</p>\n<figure data-visual-id=\"five-plus-five-overlap\" data-visual-relation=\"外5主进营销力产品力，内5主进产品力组织力，供应链两侧重叠，5+5可能=10/9/8/7\" data-visual-source=\"营销力和产品力主要来自于第一个5……5+5≠10等于9，也有可能等于8、7\" data-visual-title=\"5+5推导与三力落点\" data-visual-type=\"关系图\">\n<div class=\"flowline\"><span class=\"fl-src out\">外 5 · 增长点</span><span class=\"fl-arr\">→</span><span class=\"fl-t\">营销力 · 产品力</span></div>\n<div class=\"flowline\"><span class=\"fl-src in\">内 5 · 卡点</span><span class=\"fl-arr\">→</span><span class=\"fl-t\">产品力 · 组织力</span></div>\n<div class=\"ovl\"><span class=\"pill\">供应链效率升级</span><span>两个 5 里都有 → <b>5+5 ≠ 10</b>，可能等于 9、8、7</span></div>\n<div class=\"anta\">\n<div class=\"ah\">安踏样例：5+5 怎么落进矩阵</div>\n<ul>\n<li><b>国家队科技普惠化</b>（减阻系统、热力洋流转大众产品）→ 产品力第 1 条</li>\n<li><b>下沉市场县域门店</b> → 营销力·线下</li>\n<li><b>即时零售</b>（美团即时仓、名创优品合作）与二手 → 并入线上渠道细节，归纳合并不占举措</li>\n<li><b>供应链效率升级</b> → 产品力</li>\n</ul>\n</div>\n</figure>\n<p class=\"muted\">5+5 不一定逐条推进举措列，有些会归纳合并；对 号入座时不必逐字对应。</p>\n<figure data-visual-id=\"force-classification-guide\" data-visual-relation=\"渠道与区域归营销力，单品归产品力，供应链效率归产品力，架构与协同归组织力\" data-visual-source=\"聚焦线上渠道它属于营销力……跨部门协同能力弱——组织力\" data-visual-title=\"常见表述的四力归属指引\" data-visual-type=\"对照表\">\n<div class=\"table-wrap\"><table class=\"cmp\">\n<thead><tr><th>听到的表述</th><th>归入</th></tr></thead>\n<tbody>\n<tr><td class=\"lab\">某渠道、某区域、某国别打法</td><td class=\"go\">营销力</td></tr>\n<tr><td class=\"lab\">某单品/爆品（如 701BT 进耳机 top3）</td><td class=\"go\">产品力——与渠道可拆成两条</td></tr>\n<tr><td class=\"lab\">面向人群的品牌、内容、营销大事件</td><td class=\"go\">营销力第 1 条</td></tr>\n<tr><td class=\"lab\">供应链效率问题</td><td class=\"go\">产品力</td></tr>\n<tr><td class=\"lab\">组织架构、流程导致的低效</td><td class=\"go\">组织力</td></tr>\n<tr><td class=\"lab\">跨部门协同弱</td><td class=\"go\">组织力</td></tr>\n<tr><td class=\"lab\">市场/用户洞察</td><td class=\"go\">指向品牌营销 → 营销力；指向开品 → 产品力</td></tr>\n<tr><td class=\"lab\">产品生命周期管控</td><td class=\"go\">组织力或产品力皆可</td></tr>\n</tbody>\n</table></div>\n</figure>\n<p class=\"note\">归属偶有争议时<b>不必纠结</b>，怎么放也差不到哪去；目标设定本身才体现战略意图。</p>\n</div>\n<div class=\"mod\" id=\"s10b10\">\n<h3>营销力、产品力、组织力写什么</h3>\n<figure data-visual-id=\"force-line-quota-detail\" data-visual-relation=\"营销力首条面向人群或强化洞察、二三条留销售端；产品力写货盘大单品加供应链；组织力5选2\" data-visual-source=\"营销力的第一条很有可能是面向某类人群……产品力主要是两个……组织力最多两个\" data-visual-title=\"三力各条的具体写法\" data-visual-type=\"结构图\">\n<div class=\"forcecards\" data-grid=\"\">\n<div class=\"fc\">\n<div class=\"fc-h\">营销力 <span class=\"b\">≤3 条</span></div>\n<ol>\n<li><b>面向某类人群</b>的品牌与市场打法；或强化持续洞察（市场 / 用户 / 竞对）</li>\n<li><b>销售端</b>：按国家 / 区域</li>\n<li><b>销售端</b>：按品类或客户类型</li>\n</ol>\n<p class=\"fc-n\">第 2、3 条是留给销售端的空档；营销力存在的意义，是支撑经营力的销售结构。</p>\n</div>\n<div class=\"fc\">\n<div class=\"fc-h\">产品力 <span class=\"b\">2 条</span></div>\n<ol>\n<li><b>货盘 / 产品组合 / 大单品</b>——已明确就直接写型号，如「打造热力科技爆品 P70」</li>\n<li><b>供应链</b></li>\n</ol>\n</div>\n</div>\n<div class=\"fc\" style=\"margin-top:9px\">\n<div class=\"fc-h\">组织力 <span class=\"b\">≤2 条 · 5 选 2</span></div>\n<p class=\"fc-n\" style=\"margin-top:0\">成长型企业五项都要提高，但对一个业态要<b>系统思考、点状冲击</b>，抓住主要矛盾。</p>\n</div>\n<figure data-visual-id=\"organization-force-4plus1\" data-visual-relation=\"协同力、机制驱动力、人才胜任力、文化影响力+生产力工具，按业态5选2\" data-visual-source=\"组织的协同力……机制的驱动力……人才的胜任力……文化的影响力……5选2\" data-visual-title=\"组织力4+1构成\" data-visual-type=\"结构图\">\n<div class=\"org41\">\n<span class=\"o41\">组织协同力</span>\n<span class=\"o41\">机制驱动力（激励）</span>\n<span class=\"o41\">人才胜任力（数量·结构·能力）</span>\n<span class=\"o41\">文化影响力</span>\n<span class=\"o41 tool\">＋ 生产力工具</span>\n<span class=\"pick\">← 5 选 2</span>\n</div>\n</figure>\n<p class=\"fc-n\">示例：第一组优先解决<b>跨部门协同</b>，再从关键人才数量/结构/能力或激励机制中选一项。</p>\n</figure>\n</div>\n</section>\n<\u0021-- ================= PART 3 ================= -->\n<section class=\"part\" id=\"s10b11\">\n<div class=\"part-head\"><span class=\"part-no\">PART 3</span><h2>横向关键任务：三天灵魂知识点</h2></div>\n<div class=\"mod\" id=\"s10b12\">\n<h3>正确的废话与合格写法<span class=\"hot\">敲黑板</span></h3>\n<p>举措列用<b>动词＋宾语</b>（与 O 衔接）。第二列「怎么打才能打赢」是重中之重，先看不合格写法：</p>\n<figure data-visual-id=\"correct-vs-empty-wording\" data-visual-relation=\"提升品牌力太大、加大宣传是同义反复、制定计划什么都没写；合格写法短而实、动词加宾语\" data-visual-source=\"提升品牌力这个词就太大了……制定一个提升产品力的计划……又什么都没写\" data-visual-title=\"正确的废话与合格写法\" data-visual-type=\"对比图\">\n<div class=\"w-bad\">\n<div class=\"wb\"><s>提升品牌力</s><span>词太大——除了老板，谁都不配说这句</span></div>\n<div class=\"wb\"><s>加大品牌宣传力度 / 提升品牌美誉度</s><span>几句一个意思，正确的废话</span></div>\n<div class=\"wb\"><s>2 月底前制定提升产品力的计划</s><span>感觉什么都写了，又什么都没写</span></div>\n</div>\n<div class=\"w-good\">\n<div class=\"wg-h\">合格写法：字少，但每条都实（安踏样例）</div>\n<ul>\n<li>与核心供应商签长期协议，保证关键环节稳定</li>\n<li>合作马拉松赛事 20 场，提供定制装备并现场转化</li>\n<li>热力洋流系列用于大众羽绒服，并下放跑步鞋</li>\n<li>清理滞销品，设季度库存预警线，缩短周转天数</li>\n</ul>\n</div>\n</figure>\n<p class=\"muted\">每条战略对应的关键任务<b>不超过 3 条</b>：找突破性、有价值的动作，不堆常规动作。例外：有大致方向但不笃定时（如洞察出了经线、没出纬线），只能先排迭代计划。</p>\n</div>\n<div class=\"mod\" id=\"s10b13\">\n<h3>成事四要素：从目标到任务<span class=\"hot\">方法论</span></h3>\n<p>拿下 A 类客户、提高市场敏锐度、产品差异化落地、提高开发效率——这些都是目标。要成事，每个目标都要拆出「两个氢一个氧」：</p>\n<figure data-visual-id=\"success-four-elements\" data-visual-relation=\"条件→短期破局方法→长效保障机制→里程碑，相当于从O/G到S的分解\" data-visual-source=\"要想成事背后四要素：第一个叫条件……破局方法……如何保障它长长久久解决……里程碑\" data-visual-title=\"成事四要素\" data-visual-type=\"结构图\">\n<div class=\"fe-grid\" data-grid=\"\">\n<div class=\"fe\"><span class=\"n\">1</span><div class=\"t\">条件</div><div class=\"d\">没有它就干不成、被死死卡住的，必须先突破</div></div>\n<div class=\"fe\"><span class=\"n\">2</span><div class=\"t\">破局方法</div><div class=\"d\">短期破局：规则没说的可以尝试，看似无解处找方案</div></div>\n<div class=\"fe\"><span class=\"n\">3</span><div class=\"t\">保障机制</div><div class=\"d\">靠流程制度，让它长长久久地解决</div></div>\n<div class=\"fe\"><span class=\"n\">4</span><div class=\"t\">目标结构（里程碑）</div><div class=\"d\">分解细分目标，标注阶段性结果节点</div></div>\n</div>\n</figure>\n<p class=\"note\">这套分解相当于<b>从 O/G 走到 S</b>，面向内外贸、跨境电商、科技类业务，仍在迭代。破局是企业的常态——堵车时修路来不及，先挪车疏流；要耐烦，境界才会提高。</p>\n</div>\n<div class=\"mod\" id=\"s10b14\">\n<h3>警惕本能式解题</h3>\n<p>「人手不够→招人、能力不行→培训、动力不行→发钱」——这些本能解释<b>几乎全是错的</b>，只会暴露管理手段贫乏。</p>\n<figure data-visual-id=\"instinct-vs-management\" data-visual-relation=\"招人培训发钱是本能反应；替代为调人才结构、挑战任务带教、表扬批评与外包\" data-visual-source=\"人手不够必须招人……动力不行必须得多发钱……只能暴露管理能力非常贫乏\" data-visual-title=\"本能式解法与更本质选项\" data-visual-type=\"对照表\">\n<div class=\"table-wrap\"><table class=\"cmp inst\">\n<thead><tr><th>本能式反应</th><th>更本质的选项</th></tr></thead>\n<tbody>\n<tr><td class=\"bad\">人手不够 → 只能招人</td><td>买资源、买数据；外包（一次性花钱，带动内部能力）；调整人才结构</td></tr>\n<tr><td class=\"bad\">能力不行 → 只能上课</td><td>挑战性任务＋过程带教；组建跨部门攻坚小组、作战室；SOP/攻略让 60 分的人干出 80 分的活——定攻略的最高维者去上课，中基层复制粘贴</td></tr>\n<tr><td class=\"bad\">动力不行 → 只能发钱</td><td>表扬与批评也是激励（多少人不会真正表扬下属？）；领导力、机制设计</td></tr>\n</tbody>\n</table></div>\n</figure>\n<p>人手问题先想好<b>人才结构</b>：10 个人按大牛 / 小牛 / 小白配比，结构没想好，盲目招人数不合理。</p>\n<figure data-visual-id=\"talent-structure-shapes\" data-visual-relation=\"127金字塔、244火箭、262菱形、253钻石；结构没想好盲目招人不合理\" data-visual-source=\"127叫金字塔型人才结构……244叫火箭型……262叫菱形……253叫钻石型\" data-visual-title=\"十人团队人才结构配比\" data-visual-type=\"图示\">\n<svg aria-label=\"四种人才结构配比\" role=\"img\" viewbox=\"0 0 480 152\">\n<rect fill=\"var(--accent)\" height=\"11\" rx=\"2\" width=\"11\" x=\"18\" y=\"10\"></rect>\n<text fill=\"var(--text-2)\" font-size=\"12\" x=\"34\" y=\"20\">大牛</text>\n<rect fill=\"var(--secondary)\" height=\"11\" rx=\"2\" width=\"11\" x=\"78\" y=\"10\"></rect>\n<text fill=\"var(--text-2)\" font-size=\"12\" x=\"94\" y=\"20\">小牛</text>\n<rect fill=\"var(--muted-block)\" height=\"11\" rx=\"2\" width=\"11\" x=\"138\" y=\"10\"></rect>\n<text fill=\"var(--text-2)\" font-size=\"12\" x=\"154\" y=\"20\">小白</text>\n<g fill=\"var(--accent)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"66\" y=\"42\"></rect>\n</g>\n<g fill=\"var(--secondary)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"58\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"74\" y=\"56\"></rect>\n</g>\n<g fill=\"var(--muted-block)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"18\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"34\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"50\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"66\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"82\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"98\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"114\" y=\"70\"></rect>\n</g>\n<text fill=\"var(--text)\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" x=\"73\" y=\"106\">1-2-7 金字塔</text>\n<g fill=\"var(--accent)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"188\" y=\"42\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"204\" y=\"42\"></rect>\n</g>\n<g fill=\"var(--secondary)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"172\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"188\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"204\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"220\" y=\"56\"></rect>\n</g>\n<g fill=\"var(--muted-block)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"172\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"188\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"204\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"220\" y=\"70\"></rect>\n</g>\n<text fill=\"var(--text)\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" x=\"203\" y=\"106\">2-4-4 火箭</text>\n<g fill=\"var(--accent)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"310\" y=\"42\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"326\" y=\"42\"></rect>\n</g>\n<g fill=\"var(--secondary)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"278\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"294\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"310\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"326\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"342\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"358\" y=\"56\"></rect>\n</g>\n<g fill=\"var(--muted-block)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"310\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"326\" y=\"70\"></rect>\n</g>\n<text fill=\"var(--text)\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" x=\"325\" y=\"106\">2-6-2 菱形</text>\n<g fill=\"var(--accent)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"432\" y=\"42\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"448\" y=\"42\"></rect>\n</g>\n<g fill=\"var(--secondary)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"408\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"424\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"440\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"456\" y=\"56\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"472\" y=\"56\"></rect>\n</g>\n<g fill=\"var(--muted-block)\">\n<rect height=\"11\" rx=\"2\" width=\"14\" x=\"424\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"440\" y=\"70\"></rect><rect height=\"11\" rx=\"2\" width=\"14\" x=\"456\" y=\"70\"></rect>\n</g>\n<text fill=\"var(--text)\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" x=\"447\" y=\"106\">2-5-3 钻石</text>\n<text fill=\"var(--text-2)\" font-size=\"12\" text-anchor=\"middle\" x=\"240\" y=\"138\">10 人团队示例 · 自上而下：大牛 / 小牛 / 小白</text>\n</svg>\n</figure>\n<p class=\"note\">有企业按 2-6-2 全开重招，只保留一个大牛。能力不是听一堂课涨的——<b>能力是靠一件件事做出来、一场场仗打出来的</b>（从行到知；先知后行者不足 1%）。</p>\n</div>\n<div class=\"mod\" id=\"s10b15\">\n<h3>案例：开品效率低怎么破</h3>\n<p>广州白云一家中高端服装企业（家居服三四百元，大牌平替），开发节奏落后——现在还在定下个季度的品，老板自嘲「全地球开发效率最低」。</p>\n<div class=\"blame\">\n<div class=\"bm\"><b>产品</b> →「效率低？你得问采购。」</div>\n<div class=\"bm\"><b>采购</b> →「供应商打样 6–7 次，够给力了。是产品需求不清、决策老变。」</div>\n<div class=\"bm\">两人说完，齐刷刷看向老板——老板也要参与决策。</div>\n</div>\n<p><b>本质：</b>企划与需求对齐能力弱。产品、销售、品牌、市场、供应链要基于数据或洞察先对齐——销售要开中高端、技术说撑不住，就在一开始出妥协结果。</p>\n<figure data-visual-id=\"apparel-case-four-elements\" data-visual-relation=\"需求先对齐是条件，无法撼动的时间节点是破局，IPD与决策节点≤6是保障，里程碑收尾\" data-visual-source=\"制定一个无法撼动的时间节点……决策节点不能超过6个……IPD项目式管理\" data-visual-title=\"开品效率案例的四要素解法\" data-visual-type=\"案例图\">\n<div class=\"case-fix\" data-grid=\"\">\n<div class=\"cf\"><span class=\"b\">条件</span>需求一开始就对齐、拍板</div>\n<div class=\"cf\"><span class=\"b\">破局</span>制定一个无法撼动的时间节点（已成该公司金句）</div>\n<div class=\"cf\"><span class=\"b\">保障</span>IPD 项目式管理；决策节点 ≤ 6 个（2+2+2，各决什么）；模块化研发；数据打通</div>\n<div class=\"cf\"><span class=\"b\">里程碑</span>标注阶段性结果</div>\n</div>\n<div class=\"gold\"><b>什么叫无法撼动？</b>苹果发布会每年固定 9 月第二周的周二/周三——研发不出来，公司也会派人帮、换人、找外包，不管怎样发布保住。大年初一初二是华人的无法撼动：晚两周回家，「年」就没了。</div>\n</figure>\n</div>\n</section>\n<\u0021-- ================= PART 4 ================= -->\n<section class=\"part\" id=\"s10b16\">\n<div class=\"part-head\"><span class=\"part-no\">PART 4</span><h2>一页纸整合：从矩阵到分工</h2></div>\n<div class=\"mod\" id=\"s10b17\">\n<h3>协作规则与一页纸</h3>\n<p>矩阵填完后，靠分工颜色跑起来：</p>\n<div class=\"colorrule\">\n<span class=\"cr red\"><i></i>红 ＝ 主责（不用写字，每行仅一个红）</span>\n<span class=\"cr yel\"><i></i>橙/黄 ＝ 协同（要写协同任务）</span>\n<span class=\"cr blu\"><i></i>蓝 ＝ 知情知会（不用写字）</span>\n</div>\n<p class=\"muted\">例：「数字化新形态门店」一行，红色是牵头部门；门店货品与区域场景配置、门店管理系统，由协同部门用黄字认领。</p>\n<p class=\"note\">单打独斗的时代结束了，<b>凡不需要协同的，大概率是没有价值的事</b>。开发效率只靠产品部、品质只靠质量部、缺人只怪 HR——都是狭隘观点；中后台要向前台走，前台也要向中后台走。</p>\n<p>一页纸样例只供参考：<b>逻辑参考、形式参考，内容不照抄</b>——管理能照抄的话，买份课件就够了。</p>\n<p class=\"next\"><b>接下来</b>：各业态小组用 1–1.5 小时，磨出自己的一页纸。</p>\n</div>\n</section>\n</div>\n<template id=\"share-cover\"><svg height=\"512\" viewbox=\"0 0 512 512\" width=\"512\" xmlns=\"http://www.w3.org/2000/svg\"><rect fill=\"#f4f6fb\" height=\"512\" width=\"512\"></rect><g fill=\"#c7cfe8\"><circle cx=\"150\" cy=\"150\" r=\"15\"></circle><circle cx=\"226\" cy=\"150\" r=\"15\"></circle><circle cx=\"302\" cy=\"150\" r=\"15\"></circle><circle cx=\"378\" cy=\"150\" r=\"15\"></circle><circle cx=\"150\" cy=\"226\" r=\"15\"></circle><circle cx=\"226\" cy=\"226\" r=\"15\"></circle><circle cx=\"302\" cy=\"226\" r=\"15\"></circle><circle cx=\"378\" cy=\"226\" r=\"15\"></circle><circle cx=\"150\" cy=\"302\" r=\"15\"></circle><circle cx=\"226\" cy=\"302\" r=\"15\"></circle><circle cx=\"302\" cy=\"302\" r=\"15\"></circle><circle cx=\"378\" cy=\"302\" r=\"15\"></circle><circle cx=\"150\" cy=\"378\" r=\"15\"></circle><circle cx=\"226\" cy=\"378\" r=\"15\"></circle><circle cx=\"302\" cy=\"378\" r=\"15\"></circle><circle cx=\"378\" cy=\"378\" r=\"15\"></circle></g><line stroke=\"#3b4fd8\" stroke-linecap=\"round\" stroke-width=\"28\" x1=\"140\" x2=\"360\" y1=\"372\" y2=\"152\"></line><polygon fill=\"#3b4fd8\" points=\"404,108 394,177 335,118\"></polygon></svg></template>\n","blocks":[{"id":"s10b01","type":"part","heading":"PART 1 地图骨架：先看懂整体逻辑","text":"PART 1\n地图骨架：先看懂整体逻辑"},{"id":"s10b02","type":"mod","heading":"四要素：把 OGSM 收进一页","text":"四要素：把 OGSM 收进一页\nOGSM 完整表共 8 列；先收成 4 列快速表达，再由部门承载战略输出。一个事要描述清楚：打什么仗、怎么打、怎样才算打赢、谁来打。\nOGSM 完整表 · 8列\n→\n战略地图 · 4列\n→\n部门承载战略输出\nO + S\n① 打什么仗\n战略举措，动词 + 宾语\nS · 策略\n② 怎么打\n战法战术：要素（如数据）＋ 关键任务（如洞察出机会结论）\nG + M\n③ 怎样才算打赢\n衡量全在这一列，完成日期也在这里\n责任人\n④ 谁来打\n能征善战的人：谁正面进攻、谁侧翼协同"},{"id":"s10b03","type":"mod","heading":"企业经营全景：先看懂生意","text":"企业经营全景：先看懂生意\n无论 to B 还是 to C，企业的完整逻辑就这一张图。\n经营目标\n规模与利润 ＝\n收入 − 成本\n（开源节流、降本增效）\n收入引擎\n收入 ＝\n流量 × 转化率 × 客单价 × 复购率\n，从线索到成交的漏斗，规模 × 效率决定产出\n销售渠道\n站内 · 站外品牌市场（空中力量，加持地面销售）· 线下 · to B / 外贸——公司A按 4–5 组渠道支撑总目标\n双洞察\n用户洞察 → 爆品策划；市场洞察 → 品类规划与赛道。聚焦人群贯穿语料、话术、产品、内容与达人；最终落点是\n产品定义 ＋ 产品实现\n两大成本\n产品成本 · 营销成本 · 人力成本\n底座\n组织机制 · 人才 · 文化 · 数字化\n这张图\n与组织架构无关\n，是企业整体逻辑。品质在哪、产品开发在哪、各渠道在哪——每个人都能对号入座。图不为某家公司定制，理解逻辑即可。"},{"id":"s10b04","type":"mod","heading":"四力因果链：持续挣钱从哪来","text":"四力因果链：持续挣钱从哪来\n张一鸣受访时说：\n挣钱并不难，持续挣钱才难\n。要持续挣钱，就得有人持续买单；买单是因为产品好；产品是团队做出来的。\n经营力\n规模与利润，持续挣钱\n↑ 持续有人买单——靠\n营销力\n营销力\n有人买、持续买\n↑ 为什么买单？产品好——靠\n产品力\n产品力\n产品好\n↑ 产品是谁做的？团队——靠\n组织力\n组织力\n团队、协同机制（养鹅人）\n鹅蛋比喻：\n鹅蛋好卖，是因为买的人多；买的人多，是因为鹅蛋好。但鹅蛋不只是产品——\n鹅、生活环境、喂养方法，整个才是产品\n；决定这一切的是养鹅人。产品本身、生产过程、组织，都是产品。\n两个衔接：A 类大客户打法叫「攻略」，不必叫 SOP；抖音年框交 ×× 亿，平台按流量 × 转化率测算出约 ×× 亿销售额——营销力直接变成经营数字。"},{"id":"s10b05","type":"part","heading":"PART 2 纵向四层面：每层写几条、写什么","text":"PART 2\n纵向四层面：每层写几条、写什么"},{"id":"s10b06","type":"mod","heading":"4×4 矩阵总览与条数配额","text":"4×4 矩阵总览与条数配额\n横向四要素 × 纵向四层面，就是 4×4 战略矩阵，也叫战略地图。记住每层的条数配额，别写成目标清单。\n横向四要素：\n战略举措 · 关键任务 · 衡量标准 · 责任人\n果 · 顶部\n自下而上，从因到果\n因 · 底部\n经营力\n2 条\n物理拆解\n销售额＋毛利，必须写出结构；衡量百分百达成\n营销力\n≤3 条\n化学分解\n人群品牌市场＋区域/品类打法，支撑销售结构\n产品力\n2 条\n化学分解\n货盘大单品＋供应链\n组织力\n≤2 条\n化学分解\n协同、机制、人才、文化、工具，5 选 2\n合计\n七八条合理，最多不超过 10 条\n（已按业态分页）。国家「十五五」规划的战略地图也只有 7 条——条数偏多，说明归纳能力不够。"},{"id":"s10b07","type":"mod","heading":"经营力：只有两条，先拆结构","text":"经营力：只有两条，先拆结构\n备注先写「物理拆解」——\n先不考虑如何实现\n，先把销售和毛利目标的数字与结构拆清楚。\n① 开源\n27 年实现销售额 __ 亿\n必须写出结构：国家/区域、品类、客户或业态——不能只写「3 个亿」\n② 节流\n毛利 / 毛利率，或成本控制\n右侧注明要优化管理的成本结构\n衡量标准：\n百分百达成（或结构性百分百达成）；争取加上市占率或排名，to C 大单品尤其要关注；「我就超过某某某」也是合格写法，几个人一起判断即可。\n不允许第三条\n——除非有一天为配合上市。\n柱状图 · 总额在涨\n饼状图 · 我占多少\n1亿\n3亿\n5亿\n7亿\n三年前\n两年前\n一年前\n今年\n数额逐年涨，不等于有竞争力\n我的份额\n市场是一块饼，比例够大就有竞争力\n左为讲师示意数字。西欧、北美各是一块饼，吃下多少比例，才是战略思维。\n战略思维要结构，生意思维要总额。\n今年总额达成但结构乱，明年问题就会爆发。战略的「战」是占有的占——市占率和排名，比销售额做多少重要得多。"},{"id":"s10b08","type":"mod","heading":"物理拆解与化学分解","text":"物理拆解与化学分解\n四个力只有两种拆法，混用就错了。\n物理分解 · 经营力\n10亿 → 6亿 + 4亿\n拆数字和结构，把总额说清\n化学分解 · 营销/产品/组织力\nH₂O → 2H + O\n拆出本质要素，拆出「怎么实现」\n很多企业的战略定的全是目标值：「明年增长 40%」，大家拼拼凑凑凑够 40%，反手给老板画回一张饼——全程没有「如何实现的任务」。\n这不是战略，是欲望。"},{"id":"s10b09","type":"mod","heading":"5+5 推导：三力内容的来源","text":"5+5 推导：三力内容的来源\n营销力、产品力、组织力写什么，从前两天的 5+5 推导：\n向外求 5 个增长点，向内求 5 个卡点\n。向外求是大鱼大肉（业务增长），向内求是素菜（内部管理）——荤素搭配，挣钱与健康都重要。\n外 5 · 增长点\n→\n营销力 · 产品力\n内 5 · 卡点\n→\n产品力 · 组织力\n供应链效率升级\n两个 5 里都有 →\n5+5 ≠ 10\n，可能等于 9、8、7\n安踏样例：5+5 怎么落进矩阵\n国家队科技普惠化\n（减阻系统、热力洋流转大众产品）→ 产品力第 1 条\n下沉市场县域门店\n→ 营销力·线下\n即时零售\n（美团即时仓、名创优品合作）与二手 → 并入线上渠道细节，归纳合并不占举措\n供应链效率升级\n→ 产品力\n5+5 不一定逐条推进举措列，有些会归纳合并；对 号入座时不必逐字对应。\n听到的表述\n归入\n某渠道、某区域、某国别打法\n营销力\n某单品/爆品（如 701BT 进耳机 top3）\n产品力——与渠道可拆成两条\n面向人群的品牌、内容、营销大事件\n营销力第 1 条\n供应链效率问题\n产品力\n组织架构、流程导致的低效\n组织力\n跨部门协同弱\n组织力\n市场/用户洞察\n指向品牌营销 → 营销力；指向开品 → 产品力\n产品生命周期管控\n组织力或产品力皆可\n归属偶有争议时\n不必纠结\n，怎么放也差不到哪去；目标设定本身才体现战略意图。"},{"id":"s10b10","type":"mod","heading":"营销力、产品力、组织力写什么","text":"营销力、产品力、组织力写什么\n营销力\n≤3 条\n面向某类人群\n的品牌与市场打法；或强化持续洞察（市场 / 用户 / 竞对）\n销售端\n：按国家 / 区域\n销售端\n：按品类或客户类型\n第 2、3 条是留给销售端的空档；营销力存在的意义，是支撑经营力的销售结构。\n产品力\n2 条\n货盘 / 产品组合 / 大单品\n——已明确就直接写型号，如「打造热力科技爆品 P70」\n供应链\n组织力\n≤2 条 · 5 选 2\n成长型企业五项都要提高，但对一个业态要\n系统思考、点状冲击\n，抓住主要矛盾。\n组织协同力\n机制驱动力（激励）\n人才胜任力（数量·结构·能力）\n文化影响力\n＋ 生产力工具\n← 5 选 2\n示例：第一组优先解决\n跨部门协同\n，再从关键人才数量/结构/能力或激励机制中选一项。"},{"id":"s10b11","type":"part","heading":"PART 3 横向关键任务：三天灵魂知识点","text":"PART 3\n横向关键任务：三天灵魂知识点"},{"id":"s10b12","type":"mod","heading":"正确的废话与合格写法 敲黑板","text":"正确的废话与合格写法\n敲黑板\n举措列用\n动词＋宾语\n（与 O 衔接）。第二列「怎么打才能打赢」是重中之重，先看不合格写法：\n提升品牌力\n词太大——除了老板，谁都不配说这句\n加大品牌宣传力度 / 提升品牌美誉度\n几句一个意思，正确的废话\n2 月底前制定提升产品力的计划\n感觉什么都写了，又什么都没写\n合格写法：字少，但每条都实（安踏样例）\n与核心供应商签长期协议，保证关键环节稳定\n合作马拉松赛事 20 场，提供定制装备并现场转化\n热力洋流系列用于大众羽绒服，并下放跑步鞋\n清理滞销品，设季度库存预警线，缩短周转天数\n每条战略对应的关键任务\n不超过 3 条\n：找突破性、有价值的动作，不堆常规动作。例外：有大致方向但不笃定时（如洞察出了经线、没出纬线），只能先排迭代计划。"},{"id":"s10b13","type":"mod","heading":"成事四要素：从目标到任务 方法论","text":"成事四要素：从目标到任务\n方法论\n拿下 A 类客户、提高市场敏锐度、产品差异化落地、提高开发效率——这些都是目标。要成事，每个目标都要拆出「两个氢一个氧」：\n1\n条件\n没有它就干不成、被死死卡住的，必须先突破\n2\n破局方法\n短期破局：规则没说的可以尝试，看似无解处找方案\n3\n保障机制\n靠流程制度，让它长长久久地解决\n4\n目标结构（里程碑）\n分解细分目标，标注阶段性结果节点\n这套分解相当于\n从 O/G 走到 S\n，面向内外贸、跨境电商、科技类业务，仍在迭代。破局是企业的常态——堵车时修路来不及，先挪车疏流；要耐烦，境界才会提高。"},{"id":"s10b14","type":"mod","heading":"警惕本能式解题","text":"警惕本能式解题\n「人手不够→招人、能力不行→培训、动力不行→发钱」——这些本能解释\n几乎全是错的\n，只会暴露管理手段贫乏。\n本能式反应\n更本质的选项\n人手不够 → 只能招人\n买资源、买数据；外包（一次性花钱，带动内部能力）；调整人才结构\n能力不行 → 只能上课\n挑战性任务＋过程带教；组建跨部门攻坚小组、作战室；SOP/攻略让 60 分的人干出 80 分的活——定攻略的最高维者去上课，中基层复制粘贴\n动力不行 → 只能发钱\n表扬与批评也是激励（多少人不会真正表扬下属？）；领导力、机制设计\n人手问题先想好\n人才结构\n：10 个人按大牛 / 小牛 / 小白配比，结构没想好，盲目招人数不合理。\n大牛\n小牛\n小白\n1-2-7 金字塔\n2-4-4 火箭\n2-6-2 菱形\n2-5-3 钻石\n10 人团队示例 · 自上而下：大牛 / 小牛 / 小白\n有企业按 2-6-2 全开重招，只保留一个大牛。能力不是听一堂课涨的——\n能力是靠一件件事做出来、一场场仗打出来的\n（从行到知；先知后行者不足 1%）。"},{"id":"s10b15","type":"mod","heading":"案例：开品效率低怎么破","text":"案例：开品效率低怎么破\n广州白云一家中高端服装企业（家居服三四百元，大牌平替），开发节奏落后——现在还在定下个季度的品，老板自嘲「全地球开发效率最低」。\n产品\n→「效率低？你得问采购。」\n采购\n→「供应商打样 6–7 次，够给力了。是产品需求不清、决策老变。」\n两人说完，齐刷刷看向老板——老板也要参与决策。\n本质：\n企划与需求对齐能力弱。产品、销售、品牌、市场、供应链要基于数据或洞察先对齐——销售要开中高端、技术说撑不住，就在一开始出妥协结果。\n条件\n需求一开始就对齐、拍板\n破局\n制定一个无法撼动的时间节点（已成该公司金句）\n保障\nIPD 项目式管理；决策节点 ≤ 6 个（2+2+2，各决什么）；模块化研发；数据打通\n里程碑\n标注阶段性结果\n什么叫无法撼动？\n苹果发布会每年固定 9 月第二周的周二/周三——研发不出来，公司也会派人帮、换人、找外包，不管怎样发布保住。大年初一初二是华人的无法撼动：晚两周回家，「年」就没了。"},{"id":"s10b16","type":"part","heading":"PART 4 一页纸整合：从矩阵到分工","text":"PART 4\n一页纸整合：从矩阵到分工"},{"id":"s10b17","type":"mod","heading":"协作规则与一页纸","text":"协作规则与一页纸\n矩阵填完后，靠分工颜色跑起来：\n红 ＝ 主责（不用写字，每行仅一个红）\n橙/黄 ＝ 协同（要写协同任务）\n蓝 ＝ 知情知会（不用写字）\n例：「数字化新形态门店」一行，红色是牵头部门；门店货品与区域场景配置、门店管理系统，由协同部门用黄字认领。\n单打独斗的时代结束了，\n凡不需要协同的，大概率是没有价值的事\n。开发效率只靠产品部、品质只靠质量部、缺人只怪 HR——都是狭隘观点；中后台要向前台走，前台也要向中后台走。\n一页纸样例只供参考：\n逻辑参考、形式参考，内容不照抄\n——管理能照抄的话，买份课件就够了。\n接下来\n：各业态小组用 1–1.5 小时，磨出自己的一页纸。"}]},{"num":11,"id":"s11","title":"洞察怎么写，中台怎么建","date":"2026年11月11日","css":"#sv{\n  color-scheme: light dark;\n  --page-bg:#f4f5f8;\n  --surface:#ffffff;\n  --panel:#f7f8fc;\n  --panel-2:#e9ecf4;\n  --text:#1d2230;\n  --muted:#5c6375;\n  --accent:#3f56d6;\n  --accent-deep:#3245b8;\n  --accent-soft:#e9ecfb;\n  --on-accent:#ffffff;\n  --border:#e2e4eb;\n  --border-strong:#c8cdd9;\n  --ok:#178a5f;\n  --ok-soft:#e3f3ec;\n  --warn:#a35a00;\n  --warn-soft:#faf0dd;\n  --step1:#dfe4f9;\n  --step2:#c3cdf3;\n  --step3:#93a4e8;\n  --step4:#3f56d6;\n  --font:-apple-system,BlinkMacSystemFont,\"Segoe UI\",\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",sans-serif;\n}\n@media (prefers-color-scheme: dark){\n#sv{\n    --page-bg:#13151b;\n    --surface:#1b1e27;\n    --panel:#20242f;\n    --panel-2:#2a2f3e;\n    --text:#e7e9f0;\n    --muted:#99a0b1;\n    --accent:#8b98ee;\n    --accent-deep:#aab4f4;\n    --accent-soft:#282f4d;\n    --on-accent:#101324;\n    --border:#2c3040;\n    --border-strong:#3d4356;\n    --ok:#5ccfa2;\n    --ok-soft:#1e3529;\n    --warn:#e0a45c;\n    --warn-soft:#39301d;\n    --step1:#242a45;\n    --step2:#2e3560;\n    --step3:#3a4278;\n    --step4:#8b98ee;\n  }\n}\n*{box-sizing:border-box}\n#sv,#sv{background-color:var(--page-bg)}\n#sv{margin:0;font-family:var(--font);color:var(--text);font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased}\n.page{max-width:880px;margin:0 auto;padding:26px 16px 56px}\n@media(min-width:760px){\n.page{padding:44px 32px 84px}\n}\nb{font-weight:700}\n/* hero */\n.hero{padding-bottom:22px;border-bottom:1px solid var(--border)}\n.kicker{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--accent)}\nh1{margin:0 0 12px;font-size:clamp(25px,5.6vw,36px);line-height:1.25;font-weight:800}\n.lede{margin:0;color:var(--muted);font-size:14.5px;max-width:38em}\n.lede b{color:var(--text)}\n/* parts */\n.part{margin-top:36px}\n.part-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}\n.ptag{background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:800;letter-spacing:.12em;padding:3px 9px;border-radius:7px;white-space:nowrap}\n.part-head h2{margin:0;font-size:19px;font-weight:800;white-space:nowrap}\n.part-head::after{content:\"\";flex:1;height:1px;background:var(--border)}\n/* cards */\n.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 16px;box-shadow:0 1px 2px rgba(20,24,40,.04)}\n.card+.card{margin-top:14px}\n@media(min-width:760px){\n.card{padding:24px 28px}\n}\n.m-kick{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--accent);margin-bottom:4px}\n.m-title{margin:0 0 8px;font-size:18.5px;font-weight:800;line-height:1.4}\n.m-lede{margin:0;font-size:14px}\n.hi{color:var(--accent-deep)}\n.note{margin:14px 0 0;font-size:13px;color:var(--muted);border-left:3px solid var(--border-strong);padding-left:10px}\n/* insight / takeaway */\n.insight,.takeaway{background:var(--panel);border:1px dashed var(--border-strong);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted)}\n.insight{margin-top:16px}\n.takeaway{margin-top:14px;padding:14px 16px;font-size:13.5px}\n.insight p,.takeaway p{margin:4px 0 0;line-height:1.65}\n.insight b,.takeaway b{color:var(--text)}\n.tk-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent)}\n/* figures */\n.fig{margin:14px 0 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 12px}\n@media(min-width:760px){\n.fig{padding:18px}\n}\n.fig-head{font-size:13.5px;font-weight:800;margin:0 0 10px;display:flex;align-items:center;gap:8px}\n.fig-head::before{content:\"\";width:8px;height:8px;border-radius:2px;background:var(--accent);flex:none}\n.fig figcaption{margin-top:12px;font-size:12.3px;color:var(--muted);line-height:1.6}\n.down{display:flex;justify-content:center;color:var(--accent);margin:8px 0}\n.chip{display:inline-flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;white-space:nowrap}\n.chip.acc{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-deep)}\n.fig-lead{margin:0 0 10px;font-size:12.5px;color:var(--muted)}\n/* V1 框架 */\n.lane{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}\n.lane+.lane{margin-top:10px}\n.lane-tag{font-size:12.5px;font-weight:800;color:var(--accent-deep);margin-bottom:10px;display:flex;align-items:center;gap:8px}\n.lane-tag::before{content:\"\";width:4px;height:14px;border-radius:2px;background:var(--accent)}\n.cond-grid{display:grid;gap:8px;grid-template-columns:1fr}\n@media(min-width:620px){\n.cond-grid{grid-template-columns:1fr 1fr}\n}\n.cond{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:9px 10px}\n.cond i{font-style:normal;flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent-deep);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}\n.cond b{font-size:13px;display:block;line-height:1.4}\n.cond span{font-size:11.8px;color:var(--muted);line-height:1.5;display:block}\n.landnote{margin-top:10px;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:12.3px;line-height:1.6}\n.landnote b{color:var(--accent-deep)}\n.tl-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}\n.tl-line .lab{font-size:12px;font-weight:700;color:var(--muted);width:34px;flex:none}\n.tl-line .dim{font-size:11.5px;color:var(--muted)}\n.warn-line{margin-top:10px;color:var(--warn);font-size:12.3px;font-weight:600;background:var(--warn-soft);padding:6px 10px;border-radius:8px}\n/* V2 声音来源 */\n.vs-grid{display:grid;gap:10px;grid-template-columns:1fr;align-items:center}\n@media(min-width:620px){\n.vs-grid{grid-template-columns:1fr auto 1fr}\n}\n.vs-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.vs-chips .chip{justify-content:center}\n.mid-ar{display:flex;justify-content:center;color:var(--accent)}\n.mid-ar svg{transform:rotate(90deg)}\n@media(min-width:620px){\n.mid-ar svg{transform:none}\n}\n.mv{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:14px 12px;text-align:center}\n.mv b{display:block;font-size:15px}\n.mv span{font-size:11.5px;opacity:.85;display:block;margin-top:2px}\n/* V3 管道 vs 漏斗 */\n.pf-grid{display:grid;gap:12px;grid-template-columns:1fr}\n@media(min-width:600px){\n.pf-grid{grid-template-columns:1fr 1fr}\n}\n.pf-col{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 12px}\n.pf-cap{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;gap:6px;align-items:center}\n.pf-cap span{font-weight:800}\n.pf-cap.bad span{color:var(--warn)}\n.pf-cap.good span{color:var(--ok)}\n.fnb{height:34px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;font-size:12.3px;white-space:nowrap;overflow:hidden}\n.pf-sub{margin-top:10px;font-size:11.8px;color:var(--muted);text-align:center}\n.pipe{display:flex;gap:6px;align-items:stretch}\n.pseg2{flex:1;background:var(--accent-soft);border-radius:10px;padding:9px 4px;text-align:center;min-width:0}\n.pseg2 b{display:block;font-size:12.5px;line-height:1.45}\n.pseg2 span{font-size:11.3px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}\n.pseg2.out{background:var(--accent)}\n.pseg2.out b{color:var(--on-accent)}\n.pseg2.out span{color:var(--on-accent);opacity:.82}\n.par{align-self:center;flex:none;color:var(--muted)}\n@media(max-width:599px){\n.pipe{flex-direction:column}\n.par{transform:rotate(90deg);margin:0 auto}\n}\n/* V4 铁三角 */\n.tri-grid{display:grid;gap:10px;grid-template-columns:1fr}\n@media(min-width:640px){\n.tri-grid{grid-template-columns:1fr 1fr}\n}\n.tri-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}\n.tri-cap{font-size:13px;font-weight:800;margin-bottom:8px}\n.tri-row{display:flex;flex-wrap:wrap;gap:6px}\n.tri-row .chip i{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:5px;font-weight:600}\n.hbt{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px}\n.hbt-title{font-size:13px;font-weight:800;color:var(--accent-deep);margin-bottom:10px}\n.hbt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n.hbt-grid b{display:block;font-size:17px;color:var(--accent-deep);line-height:1.3}\n.hbt-grid span{font-size:11.3px;color:var(--muted);line-height:1.5;display:block}\n/* V5 四层境界 */\n.ladder{display:grid;gap:10px;grid-template-columns:1fr}\n@media(min-width:720px){\n.ladder{grid-template-columns:repeat(4,1fr);align-items:end}\n.r1{min-height:150px}\n.r2{min-height:198px}\n.r3{min-height:256px}\n.r4{min-height:302px}\n}\n.rung{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}\n.lv{align-self:flex-start;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.06em}\n.r1 .lv{background:var(--step1);color:var(--accent-deep)}\n.r2 .lv{background:var(--step2);color:var(--accent-deep)}\n.r3 .lv{background:var(--step3);color:var(--accent-deep)}\n.r4 .lv{background:var(--step4);color:var(--on-accent)}\n.rung>b{display:block;font-size:14px;margin:7px 0 3px}\n.rung p{margin:0;font-size:12.3px;color:var(--muted);line-height:1.58}\n.rung p b{color:var(--text)}\n.chase{margin-top:12px;background:var(--ok-soft);border-radius:10px;padding:10px 12px;font-size:12.8px;line-height:1.65}\n.chase b{color:var(--ok)}\n/* V6 研发阶梯 */\n.rd-steps{display:flex;align-items:flex-end;gap:8px}\n.rs{flex:1;text-align:center;font-weight:800;font-size:13px;border-radius:10px;padding:10px 4px;color:var(--accent-deep);display:flex;align-items:center;justify-content:center}\n.rs1{background:var(--step1);min-height:40px}\n.rs2{background:var(--step2);min-height:54px}\n.rs3{background:var(--step3);min-height:68px}\n.rs-ar{align-self:flex-end;margin-bottom:14px;color:var(--muted);flex:none}\n.ripple{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.rsrc{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:5px 14px;font-weight:800;font-size:13px}\n.ripple .ar{color:var(--muted)}\n/* V7 采购 */\n.pbar{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}\n.pseg{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;letter-spacing:.05em}\n.pseg.f{background:var(--accent);color:var(--on-accent)}\n.pseg.m{background:var(--step2);color:var(--text)}\n.pseg.b{background:var(--panel-2);color:var(--muted)}\n.pscale{margin-top:6px;font-size:11px;color:var(--muted);text-align:right}\n.pdesc{display:grid;gap:10px;margin-top:12px;grid-template-columns:1fr}\n@media(min-width:680px){\n.pdesc{grid-template-columns:1fr 1fr 1fr}\n}\n.pd b{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}\n.pd em{font-style:normal;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-deep);border-radius:999px;padding:1px 8px}\n.pd p{margin:4px 0 0;font-size:12.3px;color:var(--muted);line-height:1.6}\n/* V8 时间线 */\n.tline{list-style:none;margin:0;padding:0;position:relative}\n.tline::before{content:\"\";position:absolute;left:7px;top:8px;bottom:10px;width:2px;background:var(--border-strong)}\n.tline li{position:relative;padding:0 0 14px 26px}\n.tline li:last-child{padding-bottom:2px}\n.tline li::before{content:\"\";position:absolute;left:2px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}\n.tline b{display:block;font-size:13.5px}\n.tline p{margin:2px 0 0;font-size:12.3px;color:var(--muted)}\n.principle{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}\n/* V9 案例看板 */\n.cb-grid{display:grid;gap:10px;grid-template-columns:1fr}\n@media(min-width:720px){\n.cb-grid{grid-template-columns:1fr 20px 1fr 20px 1fr;align-items:stretch}\n}\n.cb-col{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}\n.cb-h{font-size:13px;font-weight:800;margin-bottom:8px;color:var(--accent-deep)}\n.cb-col ul{margin:0;padding-left:16px;font-size:12.3px;line-height:1.55}\n.cb-col li+li{margin-top:5px}\n.cb-col li::marker{color:var(--accent)}\n.cb-out{background:var(--accent-soft)}\n.cb-ar{display:flex;align-items:center;justify-content:center;color:var(--accent)}\n@media(max-width:719px){\n.cb-ar svg{transform:rotate(90deg)}\n}\n.cb-ref{margin-top:12px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:10px;padding:8px 12px;font-size:12.3px;color:var(--muted)}\n.cb-ref b{color:var(--text)}\n/* 日程 */\n.sched{margin-top:30px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border:1px dashed var(--border-strong);border-radius:12px;padding:12px 14px;font-size:12.8px;color:var(--muted)}\n/* Component-name-agnostic mobile safety net.\n   Structural guarantees are expressed against CSS Grid/Flex behaviour and\n   generic attribute hooks rather than a fixed class vocabulary,so generating\n   models may invent component names freely for any recording type. */\n*,*::before,*::after{ box-sizing: border-box; }\n#sv{ width: 100%; min-width: 0; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }\n#sv{ width: 100%; min-width: 0; margin: 0; overflow-wrap: break-word; }\nmain,header,footer,nav,section,article,aside,figure,div,ul,ol,li,dl,dd,details{ min-width: 0; }\nimg,picture,video,canvas,svg{ display: block; max-width: 100%; height: auto; }\npre,code,kbd,samp{ max-width: 100%; overflow-wrap: anywhere; word-break: break-word; }\nh1,h2,h3,h4,h5,h6,p,li,td,th,dt,dd,blockquote,figcaption{ overflow-wrap: anywhere; }\ninput,textarea,select,button{ max-width: 100%; font: inherit; }\n/* Any table gets a scroll container by intent or by generic hook. */\n.table-scroll,.table-wrap,.matrix-wrap,[data-table-scroll],[data-scroll-x]{\n  max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;\n}\n.table-scroll > table,.table-wrap > table,.matrix-wrap > table,[data-table-scroll] > table,[data-scroll-x] > table{ margin: 0; }\n/* Numbered step rows: keep #sv copy out of the counter track. */\n.step-item,[data-step-item]{ grid-template-columns: 32px minmax(0, 1fr) !important; }\n.step-item::before,[data-step-item]::before{ grid-column: 1 !important; grid-row: 1 !important; }\n.step-item > :empty,[data-step-item] > :empty{ display: none !important; }\n.step-item > *,[data-step-item] > *{ grid-column: 2 !important; min-width: 0 !important; }\n.data-value,.metric-value,[data-value]{ max-width: 100%; font-variant-numeric: tabular-nums; }\n/* A single surviving child of ANY grid spans the full row. Applied to every\n   element that declares a grid,so unknown component names are covered too. */\n[class*=\"grid\"] > :only-child,[class*=\"board\"] > :only-child,[class*=\"cluster\"] > :only-child,[class*=\"row\"] > :only-child,[class*=\"split\"] > :only-child,[class*=\"cols\"] > :only-child,[class*=\"columns\"] > :only-child,[class*=\"layout\"] > :only-child,[class*=\"panel\"] > :only-child,[data-grid] > :only-child,[data-cols] > :only-child{\n  grid-column: 1 / -1 !important;\n  width: 100% !important;\n}\n@media (max-width: 600px){\n#sv{ font-size: 14.5px !important; line-height: 1.62 !important; }\n:where(#sv > main,#sv > .report-shell,#sv > .report,#sv > .container,#sv > [data-shell]){\n    width: calc(100% - 40px) !important;\n    max-width: 100% !important;\n    margin-inline: auto !important;\n  }\nh1{ font-size: 29px !important; line-height: 1.22 !important; letter-spacing: 0 !important; }\nh2{ font-size: 22px !important; line-height: 1.3 !important; letter-spacing: 0 !important; }\nh3{ font-size: 16px !important; line-height: 1.42 !important; letter-spacing: 0 !important; }\n/* Generic collapse: every multi-column grid becomes single column unless it\n     explicitly opts into staying paired (data-keep-columns) or is a table. */\n  [class*=\"grid\"]:not([data-keep-columns]),[class*=\"board\"]:not([data-keep-columns]),[class*=\"split\"]:not([data-keep-columns]),[class*=\"cols\"]:not([data-keep-columns]),[class*=\"columns\"]:not([data-keep-columns]),[class*=\"layout\"]:not([data-keep-columns]),[data-grid]:not([data-keep-columns]){\n    grid-template-columns: minmax(0, 1fr) !important;\n  }\n/* Compact numeric clusters may stay two-up,but a trailing odd card must\n     span both columns so no empty half-row is left on narrow screens. */\n  [data-keep-columns]{ grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }\n[data-keep-columns] > :last-child:nth-child(odd){ grid-column: 1 / -1 !important; }\n[data-span-all],[data-value-kind=\"formula\"],[data-value-kind=\"range\"]{ grid-column: 1 / -1 !important; }\n/* Horizontal flows become vertical. */\n  [class*=\"flow\"],[class*=\"chain\"],[class*=\"timeline\"]{ flex-direction: column !important; }\n[class*=\"arrow\"]{ transform: rotate(90deg); min-height: 16px !important; }\ntable{ font-size: 12.5px; }\nth,td{ padding: 9px 8px !important; }\nnav{ max-width: 100%; }\nnav[data-scrollable]{ overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: thin; }\nbutton,summary,[role=\"button\"]{ min-width: 44px; min-height: 44px; }\nnav a{ display: inline-flex; min-width: 44px; min-height: 44px; padding: 6px 10px !important; align-items: center; justify-content: center; font-size: 12.5px !important; }\n}\n@media (prefers-reduced-motion: reduce){\n*,*::before,*::after{ scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }\n}\n#sv > :first-child{ margin-top: 0 !important; }\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n  [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n):first-child{\n  min-height: auto !important;\n  max-height: none !important;\n  margin-top: 0 !important;\n  padding-top: min(40px, 8vw) !important;\n}\n@media (max-width: 600px){\n:where(#sv,#sv > main,[class*=\"shell\"],[class*=\"container\"]) > :where(\n    [class*=\"hero\"],[class*=\"cover\"],[data-hero]\n  ):first-child{ padding-top: 20px !important; }\n}\n@media (max-width:767px){\n#sv > div:nth-child(1) > section:nth-child(3) > div:nth-child(1) > h2:nth-child(2){white-space:normal!important;flex-shrink:1!important;min-width:0!important;overflow-wrap:anywhere!important}\n#sv > div:nth-child(1) > section:nth-child(3) > div:nth-child(1)::after{margin-left:-12px!important;clip-path:inset(0 0 0 12px)!important}\n}","body":"\n<div class=\"page\">\n<header class=\"hero\">\n<p class=\"kicker\">跨部门协同 · 培训纪要</p>\n<h1>洞察怎么写，中台怎么建</h1>\n<p class=\"lede\">现场的出发点：<b>“跨部门协同”这一条，其实可以写得更到位。</b>主线三段——先把「洞察」写成可执行的关键任务；再讲中台两个铁三角与产品、研发、供应链的价值定位；最后用一份季度洞察实例收束。</p>\n</header>\n<\u0021-- ============ Part 1 ============ -->\n<section class=\"part\" id=\"s11b01\">\n<div class=\"part-head\"><span class=\"ptag\">PART 1</span><h2>洞察怎么落地</h2></div>\n<article class=\"card\" id=\"s11b02\">\n<span class=\"m-kick\">01 · 理念</span>\n<h3 class=\"m-title\">洞察是管道，不是漏斗</h3>\n<p class=\"m-lede\">洞察的起点，是<b class=\"hi\">带着一个目的来</b>——这一点在现场被特别强调。</p>\n<figure class=\"fig\" data-visual-id=\"insight-pipeline-funnel\" data-visual-relation=\"漏斗＝无预设目的，海量数据漏出多少算多少；管道＝以终为始，先定目的再选数据、出对应结论；目的扩展，数据集随之不同\" data-visual-source=\"洞察不是一个漏斗…洞察是管道，你得有一个目的…以终为始，带着目的，进去什么数据，出去什么数据…如果同时你包含了销售端营销打法…收集数据又不一样了\" data-visual-title=\"洞察是管道，不是漏斗\" data-visual-type=\"对比示意图\">\n<div class=\"pf-grid\" data-grid=\"\">\n<div class=\"pf-col\">\n<div class=\"pf-cap bad\"><span>✕</span>漏斗思维</div>\n<div class=\"fnb\" style=\"width:96%\">海量数据进来</div>\n<div class=\"fnb\" style=\"width:64%\">层层过滤</div>\n<div class=\"fnb\" style=\"width:36%\">漏出 1、2、3</div>\n<div class=\"pf-sub\">没有预设目的，漏出什么算什么</div>\n</div>\n<div class=\"pf-col\">\n<div class=\"pf-cap good\"><span>✓</span>管道思维</div>\n<div class=\"pipe\">\n<div class=\"pseg2\"><b>① 先定目的</b><span>如：改品</span></div>\n<svg aria-hidden=\"true\" class=\"par\" height=\"14\" viewbox=\"0 0 16 16\" width=\"14\"><path d=\"M2 8h11M9.2 3.8 13.4 8l-4.2 4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg>\n<div class=\"pseg2\"><b>② 按目的收数据</b><span>功能 · 颜色</span></div>\n<svg aria-hidden=\"true\" class=\"par\" height=\"14\" viewbox=\"0 0 16 16\" width=\"14\"><path d=\"M2 8h11M9.2 3.8 13.4 8l-4.2 4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg>\n<div class=\"pseg2 out\"><b>③ 出对应结论</b><span>产品改良方案</span></div>\n</div>\n<div class=\"pf-sub\">若同时要支撑销售、品牌打法，要收的数据就不同</div>\n</div>\n</div>\n<figcaption>以终为始：先问“要实现的目的是什么”，再定收什么数据、出什么结论。财务的 BI 与内外部数据分析，同理。</figcaption>\n</figure>\n</article>\n<article class=\"card\" id=\"s11b03\">\n<span class=\"m-kick\">02 · 写法</span>\n<h3 class=\"m-title\">写成举措：条件与主题都要落实</h3>\n<p class=\"m-lede\">在任务要素分解里，“洞察”落在关键成功因素／关键任务上。写成举措要同时讲清两件事：<b>支撑条件</b>，与<b>今年聚焦的主题和节奏</b>。</p>\n<figure class=\"fig\" data-visual-id=\"insight-setup-flow\" data-visual-relation=\"写举措「洞察」两条：第一条条件＝分工、数据源、模板、数据结构；第二条主题与排期＝按区域/客户/品类，排进4个季度或12个月\" data-visual-source=\"第一条叫条件。第二条…洞察集中在哪几个主题上…按区域还是按客户还是按品类…排到4个季度或者排到12个月…完善分工…数据源要有合作商…要有模板…数据结构\" data-visual-title=\"洞察举措写法：条件与主题排期\" data-visual-type=\"框架流程图\">\n<div class=\"fig-head\">举措「洞察」的两条写法</div>\n<div class=\"lane\">\n<div class=\"lane-tag\">第 1 条 · 条件齐备</div>\n<div class=\"cond-grid\" data-grid=\"\">\n<div class=\"cond\"><i>1</i><div><b>分工逻辑</b><span>和组织商量好洞察怎么分工</span></div></div>\n<div class=\"cond\"><i>2</i><div><b>数据源</b><span>搜研报，或向渠道定向购买；C 端平台相对易获取</span></div></div>\n<div class=\"cond\"><i>3</i><div><b>洞察模板</b><span>先定分析结构，再进数据</span></div></div>\n<div class=\"cond\"><i>4</i><div><b>数据结构</b><span>明确最终输出什么</span></div></div>\n</div>\n<div class=\"landnote\">结构落点不止产品定义：<b>产品定义 · 配色</b>（配色因重要而单列），也可落在渠道打法、价格带、卖点、文案</div>\n</div>\n<div class=\"lane\">\n<div class=\"lane-tag\">第 2 条 · 主题与排期</div>\n<div class=\"tl-line\"><span class=\"lab\">维度</span><span class=\"chip\">按区域</span><span class=\"chip\">按客户</span><span class=\"chip\">按品类</span><span class=\"dim\">三种不一样，选定要明确</span></div>\n<div class=\"tl-line\"><span class=\"lab\">主题</span><span class=\"chip\">单品</span><span class=\"chip\">竞品</span><span class=\"chip\">区域客户</span></div>\n<div class=\"tl-line\"><span class=\"lab\">排期</span><span class=\"chip acc\">排进 4 个季度 / 12 个月</span></div>\n<div class=\"warn-line\">✗ 反面示例：每月交一份报告，却说不清是什么报告</div>\n</div>\n<figcaption>四项条件可以合并写进同一条关键任务；主题与排期是要一并落实的第二条。</figcaption>\n</figure>\n<figure class=\"fig\" data-visual-id=\"insight-voice-sources\" data-visual-relation=\"VOC（客户之声）与VOS（卖家之声）支撑不足，叠加竞对分析与相关品类分析，整合为市场之声，覆盖整个市场的声音\" data-visual-source=\"VOC是不够的，VOC叫客户之声，vos叫卖家之声。然后呢，同时你需要做竞对分析，相关品类分析等等，整合起来叫市场之声\" data-visual-title=\"市场之声的来源聚合\" data-visual-type=\"归纳关系图\">\n<div class=\"fig-head\">主题聚焦时的声音来源</div>\n<div class=\"vs-grid\" data-grid=\"\">\n<div class=\"vs-chips\" data-grid=\"\">\n<span class=\"chip\">VOC · 客户之声</span>\n<span class=\"chip\">VOS · 卖家之声</span>\n<span class=\"chip\">竞对分析</span>\n<span class=\"chip\">相关品类分析</span>\n</div>\n<div class=\"mid-ar\"><svg aria-hidden=\"true\" height=\"14\" viewbox=\"0 0 16 16\" width=\"14\"><path d=\"M2 8h11M9.2 3.8 13.4 8l-4.2 4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg></div>\n<div class=\"mv\"><b>市场之声</b><span>分析整个市场的声音</span></div>\n</div>\n<figcaption>只听客户与卖家还不够——补上竞对与相关品类分析，才覆盖整个市场的声音。</figcaption>\n</figure>\n</article>\n</section>\n<\u0021-- ============ Part 2 ============ -->\n<section class=\"part\" id=\"s11b04\">\n<div class=\"part-head\"><span class=\"ptag\">PART 2</span><h2>中台的价值分工</h2></div>\n<article class=\"card\" id=\"s11b05\">\n<span class=\"m-kick\">03 · 结构</span>\n<h3 class=\"m-title\">中台的两个铁三角</h3>\n<p class=\"m-lede\">中台不是一个大部门，而是两条协同线：一条围绕<b>产品输出</b>，一条围绕<b>产品表达</b>。</p>\n<figure class=\"fig\" data-visual-id=\"middle-platform-triangles\" data-visual-relation=\"产品·研发·供应链围绕产品输出；品牌·市场·内容围绕产品表达；输出为魂体表，魂体主要来自产品与供应链，表由品牌牵头并协同供应链\" data-visual-source=\"中台是两个铁三角，第一个叫产品研发供应链…品牌是天市场是空军飞机，内容是投弹…一个围绕产品，一个围绕产品表达…输出的结果是魂体表…品牌上要协同供应链\" data-visual-title=\"中台两个铁三角与魂体表输出\" data-visual-type=\"结构示意图\">\n<div class=\"tri-grid\" data-grid=\"\">\n<div class=\"tri-box\">\n<div class=\"tri-cap\">铁三角一 · 围绕产品输出</div>\n<div class=\"tri-row\"><span class=\"chip\">产品</span><span class=\"chip\">研发</span><span class=\"chip\">供应链</span></div>\n</div>\n<div class=\"tri-box\">\n<div class=\"tri-cap\">铁三角二 · 围绕产品表达</div>\n<div class=\"tri-row\">\n<span class=\"chip\">品牌<i>天</i></span><span class=\"chip\">市场<i>空军飞机</i></span><span class=\"chip\">内容<i>投弹</i></span>\n</div>\n</div>\n</div>\n<div class=\"down\"><svg aria-hidden=\"true\" height=\"16\" viewbox=\"0 0 16 16\" width=\"16\"><path d=\"M8 2.5v10M3.8 8.7 8 12.9l4.2-4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg></div>\n<div class=\"hbt\">\n<div class=\"hbt-title\">两个输出的结果：魂 · 体 · 表（三者都重要）</div>\n<div class=\"hbt-grid\" data-grid=\"\">\n<div><b>魂</b><span>主要来自产品与供应链</span></div>\n<div><b>体</b><span>主要来自产品与供应链</span></div>\n<div><b>表</b><span>品牌牵头，需协同供应链</span></div>\n</div>\n</div>\n<figcaption>比喻：市场是空军飞机，内容是投弹——表达这条线最终也要落回与供应链的协同。</figcaption>\n</figure>\n<p class=\"note\">品牌这条线今天只点到为止，展开讲还需要另外半天。</p>\n</article>\n<article class=\"card\" id=\"s11b06\">\n<span class=\"m-kick\">04 · 产品</span>\n<h3 class=\"m-title\">产品团队的四层境界</h3>\n<p class=\"m-lede\">先讲通用、终局的版本：从选品起步，最终用产品驱动公司战略。</p>\n<figure class=\"fig\" data-visual-id=\"product-team-four-levels\" data-visual-relation=\"L1选品开发→L2开品效率→L3前置规划与生命周期（出现品类负责人与产品矩阵）→L4产品创新战略，做什么不做什么成为战略级取舍\" data-visual-source=\"第一层叫选品开发…第二个…开品效率…能够做产品的规划或者是生命周期的…品类负责人…生命周期七步法…L4叫产品创新战略，用产品驱动一家公司建立核心竞争力\" data-visual-title=\"产品团队价值四层境界 L1–L4\" data-visual-type=\"层级进阶图\">\n<div class=\"ladder\" data-grid=\"\">\n<div class=\"rung r1\"><span class=\"lv\">L1</span><b>选品开发</b><p>起点形态：一两个人即可运转，关键是找对品。</p></div>\n<div class=\"rung r2\"><span class=\"lv\">L2</span><b>产品开发</b><p>本质是<b>开品效率</b>：销售、运营提需求，产品高效满足——能满足就不错；范畴已扩到资源。</p></div>\n<div class=\"rung r3\"><span class=\"lv\">L3</span><b>规划 · 生命周期</b><p>出现<b>品类负责人</b>与生命周期七步法；把立项决策放到前面：洞察 → 企划定义 → 指导实践；<b>产品矩阵</b>在此出现（L2 尚无）。</p></div>\n<div class=\"rung r4\"><span class=\"lv\">L4</span><b>产品创新战略</b><p>用产品驱动公司核心竞争力，如与研发协同打造技术优势；本质是战略级取舍：<b>做什么、不做什么</b>。</p></div>\n</div>\n<div class=\"chase\"><b>L3–L4 的追求</b>：产品竞争力——爆品、排名绝对优势，好到“销售闭着眼睛卖”（类比：马斯克的飞行汽车）。</div>\n<figcaption>所谓“技术路线”不能只交给研发：要回到“场景—产品—技术表达”整条链条。到 L4，看市场、看客户、看竞争所做的品类布局，已近乎公司战略。</figcaption>\n</figure>\n<div class=\"insight\"><span class=\"tk-tag\">提示</span><p>当“我要聚焦、做什么不做什么”还讲不清论据时，往往意味着需要更多数据与洞察来支撑——战略的清晰度背后是洞察储备。</p></div>\n</article>\n<article class=\"card\" id=\"s11b07\">\n<span class=\"m-kick\">05 · 研发</span>\n<h3 class=\"m-title\">研发：技术壁垒三级递进</h3>\n<p class=\"m-lede\">研发的价值是逐步实现技术：从追平，到领先，再到独有。</p>\n<figure class=\"fig\" data-visual-id=\"rd-capability-ladder\" data-visual-relation=\"自研能力一般自L3介入，沿人有我有→人有我优→人无我有逐级递进；技术壁垒向品牌、市场、产品表达传导\" data-visual-source=\"在哪里开始接入研发的话，一般到L3…自研研发能力介入…一开始是人有我有…后来是人有我优，再后来是人无我有…技术壁垒会传导到品牌、市场、产品科学表达、产品表达\" data-visual-title=\"研发能力三步演进与技术传导\" data-visual-type=\"阶梯演进图\">\n<p class=\"fig-lead\">自研能力一般到 L3 才介入；技术实现只能逐步推进。</p>\n<div class=\"rd-steps\">\n<div class=\"rs rs1\">人有我有</div>\n<svg aria-hidden=\"true\" class=\"rs-ar\" height=\"14\" viewbox=\"0 0 16 16\" width=\"14\"><path d=\"M2 8h11M9.2 3.8 13.4 8l-4.2 4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg>\n<div class=\"rs rs2\">人有我优</div>\n<svg aria-hidden=\"true\" class=\"rs-ar\" height=\"14\" viewbox=\"0 0 16 16\" width=\"14\"><path d=\"M2 8h11M9.2 3.8 13.4 8l-4.2 4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg>\n<div class=\"rs rs3\">人无我有</div>\n</div>\n<div class=\"down\"><svg aria-hidden=\"true\" height=\"16\" viewbox=\"0 0 16 16\" width=\"16\"><path d=\"M8 2.5v10M3.8 8.7 8 12.9l4.2-4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg></div>\n<div class=\"ripple\">\n<span class=\"rsrc\">技术壁垒</span>\n<svg aria-hidden=\"true\" class=\"ar\" height=\"14\" viewbox=\"0 0 16 16\" width=\"14\"><path d=\"M2 8h11M9.2 3.8 13.4 8l-4.2 4.2\" fill=\"none\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.7\"></path></svg>\n<span class=\"chip\">品牌</span>\n<span class=\"chip\">市场</span>\n<span class=\"chip\">产品表达（科学表达）</span>\n</div>\n</figure>\n</article>\n<article class=\"card\" id=\"s11b08\">\n<span class=\"m-kick\">06 · 供应链</span>\n<h3 class=\"m-title\">供应链聚焦效率，采购分三段</h3>\n<p class=\"m-lede\">供应链围绕<b class=\"hi\">实现效率</b>——时效、成本、质量等维度贯穿全程；采购天然属于供应链范畴。</p>\n<figure class=\"fig\" data-visual-id=\"procurement-front-mid-back\" data-visual-relation=\"前台寻源支持产品开发与创新（第一客户是产品部），中台保护为执行主体，后台管流程系统建标准与供应商评价；10人参考配置约2–3、6–7、1–2人\" data-visual-source=\"采购的前台要想办法支持寻源采购寻源支持产品的开发与创新…采购的第一客户是产品部…中台是叫保护…后台…流程…建标准…供应商评价…如果采购有10个人的话，有两到三个…6~7个…一到两个\" data-visual-title=\"采购前中后台与人力参考配置\" data-visual-type=\"结构比例图\">\n<div class=\"pbar\">\n<div class=\"pseg f\" style=\"flex:2.5\">前台</div>\n<div class=\"pseg m\" style=\"flex:6.5\">中台</div>\n<div class=\"pseg b\" style=\"flex:1.5\">后台</div>\n</div>\n<div class=\"pscale\">整条 ＝ 10 人（参考口径）</div>\n<div class=\"pdesc\" data-grid=\"\">\n<div class=\"pd\"><b>前台 · 寻源支持<em>2–3 人</em></b><p>支持产品的开发与创新；<b class=\"hi\">第一客户是产品部</b>——产品部下指令，即承接寻源。</p></div>\n<div class=\"pd\"><b>中台 · 保护<em>6–7 人</em></b><p>承担大量执行性工作，是人力主体。</p></div>\n<div class=\"pd\"><b>后台 · 建标准<em>1–2 人</em></b><p>流程、系统、建标准、供应商评价，帮采购／供应链负责人提升内部效率。</p></div>\n</div>\n<figcaption>一旦摆脱选品开发，选品就归供应链，供应商开发与管理也归供应链。</figcaption>\n</figure>\n</article>\n</section>\n<\u0021-- ============ Part 3 ============ -->\n<section class=\"part\" id=\"s11b09\">\n<div class=\"part-head\"><span class=\"ptag\">PART 3</span><h2>实例与心法</h2></div>\n<article class=\"card\" id=\"s11b10\">\n<span class=\"m-kick\">07 · 节奏</span>\n<h3 class=\"m-title\">洞察的本质是持续</h3>\n<p class=\"m-lede\">案例企业的洞察不是年底一次做完——按季度滚动，每次进步一点点。</p>\n<figure class=\"fig\" data-visual-id=\"insight-quarterly-rhythm\" data-visual-relation=\"洞察按季度滚动：五六月份启动，七八月起持续滚动，季度会呈现当期版本；本质是持续，每次进步一点点，而非年底一次做完\" data-visual-source=\"洞察的本质是什么？是持续…他是五六月份，那一年五六月份七八月份慢慢滚…有一次开季度会…持续的本质就是每次进步一点点\" data-visual-title=\"季度滚动洞察节奏\" data-visual-type=\"节奏示意图\">\n<ol class=\"tline\">\n<li><b>5–6 月 · 启动</b><p
